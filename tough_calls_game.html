<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tough Calls — Six Everyday Dilemmas</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif; color:#26262c;
  background:radial-gradient(ellipse at 50% -10%, #ffffff 0%, #f5f1e8 45%, #efe9db 100%) fixed; min-height:100vh; line-height:1.55; }
.wrap { max-width:840px; margin:0 auto; padding:16px 18px 60px; }

.hud { position:sticky; top:0; z-index:10; display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between;
  background:rgba(255,255,255,0.94); backdrop-filter:blur(4px); border-bottom:2px solid #1e3a5e; padding:10px 14px; margin:0 -18px 18px; }
.hud .stat { font-weight:700; font-size:0.98rem; color:#1e3a5e; }
.hud .stat b { color:#b5892f; }
.hud .prog { font-size:0.82rem; opacity:0.7; letter-spacing:0.04em; }
.meter { display:inline-block; width:74px; height:8px; border-radius:5px; background:#e2dccb; vertical-align:middle; margin-left:4px; overflow:hidden; }
.meter i { display:block; height:100%; background:linear-gradient(90deg,#1e3a5e,#3f6ea5); transition:width .3s; }
.meter.g i { background:linear-gradient(90deg,#8a6d1f,#c99a2e); }

h1 { font-size:1.7rem; color:#1e3a5e; margin-bottom:6px; text-align:center; }
.sub { text-align:center; color:#4a4a52; margin-bottom:18px; font-size:0.98rem; }
.sub b { color:#1e3a5e; }

.card { background:#fff; border:1px solid #e0d9c8; border-radius:16px; padding:22px 26px; margin-bottom:16px; box-shadow:0 8px 26px rgba(30,58,94,0.10); }
.emoji { font-size:2.2rem; text-align:center; display:block; margin-bottom:4px; }
.card h2 { color:#1e3a5e; font-size:1.35rem; text-align:center; margin-bottom:12px; }
.scene { font-size:1.06rem; margin-bottom:16px; color:#333; }

.speak { background:#fbf5e4; border:1px dashed #b5892f; border-radius:10px; padding:12px 16px; margin-bottom:14px; color:#5a4410; }
.speak b { color:#8a6d1f; }
.frames { background:#eef3f8; border-radius:10px; padding:10px 16px; margin-bottom:16px; font-size:0.9rem; color:#3a4a5e; }
.frames b { color:#1e3a5e; }
.frames span { display:inline-block; margin:2px 8px 2px 0; }

.choice { display:block; width:100%; text-align:left; background:#f7f4ec; color:#26262c; border:1px solid #d8cfb8;
  border-radius:12px; padding:14px 18px; margin:10px 0; font-size:1.02rem; font-family:inherit; cursor:pointer; transition:all .15s; }
.choice:hover:not(:disabled) { background:#eef3f8; border-color:#1e3a5e; transform:translateY(-2px); }
.choice:disabled { opacity:0.5; cursor:default; }
.choice .k { color:#b5892f; font-weight:800; margin-right:8px; }

.reveal { display:none; margin-top:6px; }
.reveal.show { display:block; animation:fade .3s ease; }
@keyframes fade { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.outcome { background:#eef5f0; border-left:4px solid #2f8f66; border-radius:0 10px 10px 0; padding:14px 18px; margin-bottom:12px; }
.outcome .tag { font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:#2f8f66; font-weight:800; display:block; margin-bottom:4px; }
.best { background:#eef1f8; border-left:4px solid #3f6ea5; border-radius:0 10px 10px 0; padding:14px 18px; margin-bottom:12px; }
.best .tag { font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:#3f6ea5; font-weight:800; display:block; margin-bottom:4px; }
.delta { font-weight:700; margin-top:8px; }
.delta .up { color:#2f8f66; } .delta .down { color:#c1553c; }

.btn { display:inline-block; background:#1e3a5e; color:#fff; font-weight:800; border:none; border-radius:10px; padding:13px 26px; font-size:1.05rem; font-family:inherit; cursor:pointer; transition:all .15s; }
.btn:hover { background:#2a4f7c; transform:translateY(-2px); }
.center { text-align:center; }

.end h2 { font-size:2rem; color:#1e3a5e; }
.end .score { font-size:1.15rem; margin:12px 0; color:#1e3a5e; }
.debrief { text-align:left; background:#f7f4ec; border:1px solid #e0d9c8; border-radius:12px; padding:18px 22px; margin-top:16px; }
.debrief h3 { color:#1e3a5e; margin-bottom:8px; }
.debrief li { margin-bottom:9px; }
.footnote { text-align:center; opacity:0.55; font-size:0.82rem; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="stat">🧭 Integrity: <b id="repN">5</b><span class="meter"><i id="repBar" style="width:50%"></i></span></div>
    <div class="stat">🤝 Goodwill: <b id="goodN">5</b><span class="meter g"><i id="goodBar" style="width:50%"></i></span></div>
    <div class="prog" id="prog">Dilemma 1 of 6</div>
  </div>

  <h1>🧭 Tough Calls</h1>
  <div class="sub">Six ordinary moments, six hard choices. There are no perfect answers — only trade-offs. At each one: <b>say your decision out loud, and your reasoning</b> — then choose.</div>

  <div id="stage"></div>
  <div class="footnote">Character is built in the small, unwatched moments. Choose well.</div>
</div>

<script>
const FRAMES = '<div class="frames"><b>Think aloud before you decide:</b> ' +
  '<span>"The tension here is between … and …"</span>' +
  '<span>"On balance, I\'d… because…"</span>' +
  '<span>"While I accept that…, I\'m not persuaded that…"</span>' +
  '<span>"It would set a troubling precedent to…"</span>' +
  '<span>"I\'d be inclined to… provided that…"</span></div>';

const SCENES = [
  {
    emoji:"🤐", title:"A Small Lie",
    scene:"A close friend asks you to back up a story that is not quite true — nothing serious, just something to save face in front of other people. Going along with it is easy and keeps the mood light. Refusing might sting.",
    speak:"A friend asks you to go along with a harmless untruth. Do you?",
    best:"Small lies rarely stay small — but blunt honesty can be its own kind of unkindness. The middle path is usually to protect the friendship without endorsing the untruth: quietly decline to confirm it, rather than expose them.",
    choices:[
      {k:"A", label:"Back the story up — it is harmless, and they are your friend.", out:"The evening goes smoothly, but you have tied your word to something false, and it quietly nags at you afterwards.", rep:-1, good:1},
      {k:"B", label:"Gently stay out of it — neither confirm nor deny.", out:"A brief, small awkwardness passes. Your friend reads the signal, and you keep both your honesty and the friendship.", rep:2, good:0},
      {k:"C", label:"Correct them in front of everyone.", out:"You told the truth — but publicly, and it lands as a betrayal rather than honesty.", rep:0, good:-2}
    ]
  },
  {
    emoji:"💰", title:"The Extra Change",
    scene:"A busy cashier hands you back far too much change — enough to matter. They have not noticed, the queue behind you is long, and no one would ever know.",
    speak:"You are given too much change by mistake. What do you do?",
    best:"The real question is not whether keeping it is “allowed” — it is what the small, unwitnessed choice does to how you see yourself. For most people, the quiet decisions shape character more than the public ones.",
    choices:[
      {k:"A", label:"Keep it — their mistake, your good luck.", out:"A free windfall — but a faint discomfort follows you out of the shop and lingers longer than the money will.", rep:-2, good:0},
      {k:"B", label:"Point it out and hand it straight back.", out:"The cashier is genuinely relieved — a till shortfall often comes out of their own pocket — and you leave feeling lighter.", rep:2, good:1},
      {k:"C", label:"Say nothing, but leave the extra as a tip.", out:"A soft compromise: you do not profit, yet the till is still short and the mistake still unfixed.", rep:0, good:0}
    ]
  },
  {
    emoji:"💡", title:"Whose Idea Was It?",
    scene:"In a meeting, someone confidently presents an idea as their own — an idea you know was yours. People are impressed. Speaking up now risks looking petty; staying silent means letting it go.",
    speak:"Someone takes public credit for your idea. Do you claim it back?",
    best:"There is rarely a graceful way to reclaim credit in the heat of the moment without seeming to compete. Many people find the stronger move is a calm, private word afterwards — setting the record straight without a public fight.",
    choices:[
      {k:"A", label:"Correct them on the spot.", out:"You reclaim the idea, but the room feels the friction, and you are quietly cast as the difficult one.", rep:1, good:-2},
      {k:"B", label:"Let it slide entirely — it is not worth it.", out:"The peace holds, but a small resentment settles in, and the pattern may well repeat next time.", rep:-1, good:1},
      {k:"C", label:"Raise it with them privately afterwards.", out:"An honest, low-drama conversation. They are a little embarrassed — and noticeably more careful with your name next time.", rep:2, good:0}
    ]
  },
  {
    emoji:"⏳", title:"The Favour You Don't Have Time For",
    scene:"You are already stretched thin when someone you like asks for a big favour — one that would swallow your last free evening. They would not ask if they were not stuck. Saying yes will cost you; saying no feels unkind.",
    speak:"You are overstretched, and someone you care about asks for more. How do you answer?",
    best:"Saying yes to everything is often a slow way of letting people down — yourself included. A warm, honest “no,” or a smaller “yes,” usually protects the relationship better than an exhausted, resentful favour.",
    choices:[
      {k:"A", label:"Say yes, and quietly absorb the cost.", out:"You help — and pay for it in exhaustion, arriving at everything else depleted and a little resentful.", rep:0, good:1},
      {k:"B", label:"Say no — warmly and honestly.", out:"A moment of guilt, then relief. They understand, and they respect that when you do say yes, it means something.", rep:2, good:0},
      {k:"C", label:"Offer a smaller version of the help.", out:"You give what you actually can. They are grateful, and nobody is stretched to breaking point.", rep:1, good:2}
    ]
  },
  {
    emoji:"🚪", title:"The Awkward Moment",
    scene:"In a shop, you watch a member of staff being spoken to rudely and unfairly by a customer. It is not your business, and stepping in could turn the anger on you — but the staff member looks cornered.",
    speak:"You see someone being treated unfairly in public. Do you step in?",
    best:"Stepping in need not mean confrontation. Often a small, calm gesture of support to the person on the receiving end does more good — and far less harm — than taking on the aggressor directly.",
    choices:[
      {k:"A", label:"Stay out of it — not your place.", out:"The moment passes and the staff member handles it alone, but you are left slightly uneasy with yourself.", rep:-1, good:0},
      {k:"B", label:"Challenge the rude customer directly.", out:"You defend the underdog — but it escalates, and the whole situation gets louder before it gets better.", rep:1, good:-1},
      {k:"C", label:"Quietly show the staff member support afterwards.", out:"A few kind words land more than you would expect. The tension eases, and the person feels seen rather than alone.", rep:2, good:1}
    ]
  },
  {
    emoji:"🔒", title:"The Secret",
    scene:"Someone tells you something in confidence. Later, another friend — hungry for the news — asks you about it directly. A half-answer would satisfy them; a lie feels wrong; the plain truth would betray a trust.",
    speak:"You are asked directly about something told to you in confidence. What do you say?",
    best:"A confidence is easy to keep until it becomes inconvenient — which is exactly when it counts. You can refuse to share without lying: “that is not mine to tell” protects both the secret and your own honesty.",
    choices:[
      {k:"A", label:"Share it — they will keep it to themselves.", out:"The secret slips one link further along a chain you no longer control. It rarely stops there.", rep:-2, good:1},
      {k:"B", label:"Deny knowing anything at all.", out:"You protect the secret — but with a lie that could unravel later and cost you either way.", rep:-1, good:0},
      {k:"C", label:"Say plainly that it is not yours to share.", out:"A little awkward, and wholly respected. In the end, both friends trust you more, not less.", rep:2, good:0}
    ]
  }
];

let idx=0, rep=5, good=5;
const stage = document.getElementById('stage');
const clamp = v => Math.max(0, Math.min(10, v));

function updateHUD(){
  document.getElementById('repN').textContent = rep;
  document.getElementById('goodN').textContent = good;
  document.getElementById('repBar').style.width = clamp(rep)*10 + '%';
  document.getElementById('goodBar').style.width = clamp(good)*10 + '%';
  document.getElementById('prog').textContent = (idx < SCENES.length) ? ('Dilemma ' + (idx+1) + ' of ' + SCENES.length) : 'Done';
}
function deltaText(r,g){
  const p=[];
  if(r) p.push('<span class="'+(r>0?'up':'down')+'">Integrity '+(r>0?'+':'')+r+'</span>');
  if(g) p.push('<span class="'+(g>0?'up':'down')+'">Goodwill '+(g>0?'+':'')+g+'</span>');
  return p.length ? '<div class="delta">'+p.join(' &nbsp; ')+'</div>' : '';
}
function render(){
  updateHUD();
  if(idx >= SCENES.length){ renderEnd(); return; }
  const s = SCENES[idx];
  let h = '<div class="card"><span class="emoji">'+s.emoji+'</span><h2>'+s.title+'</h2>';
  h += '<div class="scene">'+s.scene+'</div>';
  h += '<div class="speak">🗣️ <b>Decide aloud:</b> '+s.speak+'</div>';
  h += FRAMES;
  s.choices.forEach((c,i)=>{ h += '<button class="choice" onclick="choose('+i+')"><span class="k">'+c.k+'</span>'+c.label+'</button>'; });
  h += '<div class="reveal" id="reveal"></div></div>';
  stage.innerHTML = h;
  window.scrollTo({top:0, behavior:'smooth'});
}
function choose(i){
  const s=SCENES[idx], c=s.choices[i];
  rep=clamp(rep+c.rep); good=clamp(good+c.good);
  updateHUD();
  document.querySelectorAll('.choice').forEach((b,j)=>{ b.disabled=true; if(j===i) b.style.borderColor='#1e3a5e'; });
  const rev=document.getElementById('reveal');
  rev.innerHTML =
    '<div class="outcome"><span class="tag">What happens</span>'+c.out+deltaText(c.rep,c.good)+'</div>' +
    '<div class="best"><span class="tag">💭 Worth considering</span>'+s.best+'</div>' +
    '<div class="center"><button class="btn" onclick="next()">'+(idx < SCENES.length-1 ? 'Next dilemma →' : 'See how you did →')+'</button></div>';
  rev.classList.add('show');
  rev.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function next(){ idx++; render(); }
function renderEnd(){
  const t = rep+good;
  const verdict = t>=16 ? "Principled and warm. You hold your line without trampling anyone to do it — a rare balance." :
                  t>=11 ? "A steady hand. You keep your integrity intact and most bridges standing." :
                  t>=6  ? "You came through it — a little bruised, and wiser for the trade-offs you made." :
                          "A hard run. The easy choice and the right one kept parting ways, and it showed.";
  stage.innerHTML =
    '<div class="card end center"><span class="emoji">🪞</span><h2>The Measure of You.</h2>' +
    '<div class="score">🧭 Integrity: <b>'+rep+'/10</b> &nbsp;·&nbsp; 🤝 Goodwill: <b>'+good+'/10</b></div>' +
    '<p style="margin:10px 0 4px;color:#4a4a52;">'+verdict+'</p>' +
    '<div class="debrief"><h3>Talk it through</h3><ol>' +
      '<li>Which dilemma was the hardest — and would you decide the same way tomorrow?</li>' +
      '<li>Where did doing the principled thing and keeping people happy pull in opposite directions? Can you ever fully have both?</li>' +
      '<li>Do the small, unwatched choices — the extra change, the secret — really shape character more than the big, public ones?</li>' +
      '<li>Is a warm, honest “no” kinder in the long run than an exhausted “yes”? When has that been true for you?</li>' +
      '<li>If you had to name one principle you would never compromise, whatever the cost, what would it be?</li>' +
    '</ol></div>' +
    '<div class="center" style="margin-top:18px;"><button class="btn" onclick="reset()">↺ Face them again</button></div></div>';
  window.scrollTo({top:0, behavior:'smooth'});
}
function reset(){ idx=0; rep=5; good=5; render(); }
render();
</script>
</body>
</html>
