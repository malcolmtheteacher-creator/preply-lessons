<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My Life</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Lucida Grande',Arial,sans-serif;font-size:11px;background:#f0f0f0;color:#333}
.window{background:linear-gradient(to bottom,#e8e8e8 0%,#d0d0d0 100%);border:1px solid #999;border-radius:8px 8px 0 0;box-shadow:0 4px 20px rgba(0,0,0,.3);margin:20px;overflow:hidden}
.title-bar{background:linear-gradient(to bottom,#e8e8e8 0%,#d0d0d0 100%);border-bottom:1px solid #999;height:22px;display:flex;align-items:center;padding:0 8px}
.traffic-lights{display:flex;gap:6px;margin-right:10px}
.traffic-light{width:12px;height:12px;border-radius:50%;border:1px solid #666}
.close{background:#ff5f57}.minimize{background:#ffbd2e}.maximize{background:#28ca42}
.window-title{flex:1;text-align:center;font-weight:bold;font-size:13px}
.toolbar{background:linear-gradient(to bottom,#f5f5f5 0%,#e8e8e8 100%);border-bottom:1px solid #ccc;padding:6px 8px;display:flex;gap:6px;align-items:center}
.tab{background:linear-gradient(to bottom,#e8e8e8 0%,#d0d0d0 100%);border:1px solid #999;border-radius:4px;padding:4px 12px;cursor:pointer;user-select:none}
.tab.active{background:linear-gradient(to bottom,#4a90e2 0%,#357abd 100%);color:#fff}
.button{background:linear-gradient(to bottom,#f5f5f5 0%,#e8e8e8 100%);border:1px solid #999;border-radius:4px;padding:4px 12px;cursor:pointer}
.button:hover{background:linear-gradient(to bottom,#e8e8e8 0%,#d0d0d0 100%)}
.content{display:flex;height:640px;background:#f8f8f8}
.left-panel{width:420px;padding:12px;border-right:1px solid #ccc;background:#fff;display:flex;flex-direction:column}
.right-panel{flex:1;padding:12px;background:#f0f0f0;display:flex;flex-direction:column;gap:8px}
.panel-card{background:#fff;border:1px solid #ccc;border-radius:4px}
.inline-controls{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.small{font-size:10px;color:#666}
.task-list{background:#fff;border:1px solid #ccc;border-radius:4px;overflow:auto;flex:1}
.task-row{display:flex;align-items:center;gap:6px;padding:3px 6px;border-bottom:1px solid #eee}
.task-row:hover{background:#e6f3ff}
.task-row .twisty{width:12px;text-align:center;user-select:none}
.task-row .title{flex:1;cursor:pointer}
.task-row .date{font-size:10px;color:#666;cursor:pointer}
.task-row.overdue{background:#ffe6e6;color:#c00}
.checkbox{margin-right:4px}
.calendar{background:#fff;border:1px solid #ccc;border-radius:4px;padding:8px}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:bold}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#ccc;border:1px solid #ccc}
.calendar-day{background:#fff;min-height:28px;padding:4px;position:relative;font-size:10px}
.calendar-day.today{background:#e6f3ff}
.task-dot{position:absolute;bottom:2px;right:2px;width:4px;height:4px;background:#4a90e2;border-radius:50%}
.row{display:flex;gap:8px}
.editor{background:#fff;border:1px solid #ccc;border-radius:4px;flex:1;display:flex;flex-direction:column}
.editor .header{padding:8px;border-bottom:1px solid #eee}
.tabs{display:flex;gap:6px;padding:6px;border-bottom:1px solid #eee}
.tabs .t{padding:4px 8px;border:1px solid #bbb;border-radius:4px;background:#f7f7f7;cursor:pointer}
.tabs .t.active{background:#4a90e2;color:#fff;border-color:#357abd}
.tabpage{display:none;padding:8px;gap:8px}
.tabpage.active{display:grid;grid-template-columns:140px 1fr;align-items:center}
input[type="text"],input[type="date"],input[type="time"],select,textarea, input[type="number"]{border:1px solid #bbb;border-radius:4px;padding:4px;font-size:11px}
textarea{min-height:70px}
.badge{font-size:10px;background:#eee;border:1px solid #ccc;border-radius:3px;padding:2px 6px}
.view{display:none;width:100%}
.view.active{display:flex}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px;align-items:center}
.hr{border-top:1px solid #eee;margin:6px 0}
</style>
</head>
<body>
<div class="window">
  <div class="title-bar">
    <div class="traffic-lights"><div class="traffic-light close"></div><div class="traffic-light minimize"></div><div class="traffic-light maximize"></div></div>
    <div class="window-title">My Life</div>
  </div>

  <div class="toolbar" id="topbar">
    <div class="tab active" data-view="outline">📋 Outline</div>
    <div class="tab" data-view="todo">✓ To Do List</div>
    <div class="tab" data-view="places">📍 Places</div>
    <div class="tab" data-view="balance">⚖️ Balance</div>
    <div style="margin-left:auto;display:flex;gap:6px">
      <button class="button" id="exportBtn">Export</button>
      <button class="button" id="importBtn">Import</button>
      <button class="button" id="nextBtn">Next</button>
    </div>
  </div>

  <div class="content">

    <!-- OUTLINE -->
    <div id="view-outline" class="view active">
      <div class="left-panel">
        <div class="inline-controls">
          <button class="button" id="newRootBtn">New Project</button>
          <button class="button" id="newSubBtn">New Subtask</button>
        </div>
        <div class="inline-controls">
          <select id="outlinePlace"><option value="">All places</option></select>
          <label class="small"><input id="outlineIncludeClosed" type="checkbox" checked/> include closed places</label>
          <label class="small"><input id="outlineAvailable" type="checkbox"/> show available now</label>
        </div>
        <div class="task-list" id="outlineList"></div>
      </div>

      <div class="right-panel">
        <div class="editor" id="taskEditor">
          <div class="header"><span class="badge">Task Inspector</span></div>
          <div class="tabs" id="taskTabs">
            <div class="t active" data-tab="gen">General</div>
            <div class="t" data-tab="time">Time</div>
            <div class="t" data-tab="eff">Effort</div>
            <div class="t" data-tab="note">Note</div>
          </div>

          <!-- General -->
          <div class="tabpage active" id="tab-gen">
            <label>Title</label><input id="t_title" type="text"/>
            <label>Place</label><select id="t_place"></select>
            <label>Due date</label><input id="t_due" type="date"/>
            <label>Starred</label><input id="t_star" type="checkbox"/>
            <label>Done</label><input id="t_done" type="checkbox"/>
          </div>

          <!-- Time (NEW: recurrence) -->
          <div class="tabpage" id="tab-time">
            <label>Start date</label><input id="r_startDate" type="date"/>
            <label>Start time</label><input id="r_startTime" type="time"/>
            <label>Duration (min)</label><input id="r_duration" type="number" min="0" step="5" placeholder="e.g. 60"/>

            <div class="hr" style="grid-column:1/-1"></div>

            <label>Repeat</label>
            <select id="r_freq">
              <option value="none">None</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="yearly">Yearly</option>
            </select>

            <label>Every</label>
            <input id="r_interval" type="number" min="1" value="1"/>

            <!-- Weekly options -->
            <label class="r-opt r-weekly">Days of week</label>
            <div class="r-opt r-weekly" id="r_weekdays" style="display:flex;gap:6px">
              <label><input type="checkbox" value="0"> Sun</label>
              <label><input type="checkbox" value="1"> Mon</label>
              <label><input type="checkbox" value="2"> Tue</label>
              <label><input type="checkbox" value="3"> Wed</label>
              <label><input type="checkbox" value="4"> Thu</label>
              <label><input type="checkbox" value="5"> Fri</label>
              <label><input type="checkbox" value="6"> Sat</label>
            </div>

            <!-- Monthly options -->
            <label class="r-opt r-monthly">Monthly mode</label>
            <div class="r-opt r-monthly">
              <select id="r_monthlyMode">
                <option value="day">On day (1–31)</option>
                <option value="nth">On Nth weekday</option>
              </select>
            </div>
            <label class="r-opt r-monthly r-monthly-day">Day of month</label>
            <input class="r-opt r-monthly r-monthly-day" id="r_dayOfMonth" type="number" min="1" max="31" value="1"/>
            <label class="r-opt r-monthly r-monthly-nth">Nth</label>
            <select class="r-opt r-monthly r-monthly-nth" id="r_nth">
              <option value="1">1st</option><option value="2">2nd</option>
              <option value="3">3rd</option><option value="4">4th</option>
              <option value="5">5th</option>
            </select>
            <label class="r-opt r-monthly r-monthly-nth">Weekday</label>
            <select class="r-opt r-monthly r-monthly-nth" id="r_nthWeekday">
              <option value="1">Mon</option><option value="2">Tue</option><option value="3">Wed</option>
              <option value="4">Thu</option><option value="5">Fri</option><option value="6">Sat</option><option value="0">Sun</option>
            </select>

            <!-- Yearly options -->
            <label class="r-opt r-yearly">Month</label>
            <select class="r-opt r-yearly" id="r_yearMonth">
              <script>/* populated later */</script>
            </select>
            <label class="r-opt r-yearly">Day</label>
            <input class="r-opt r-yearly" id="r_yearDay" type="number" min="1" max="31" value="1"/>

            <div class="hr" style="grid-column:1/-1"></div>

            <label>Ends</label>
            <select id="r_ends">
              <option value="never">Never</option>
              <option value="until">On date</option>
              <option value="count">After N times</option>
            </select>
            <label class="r-opt r-until">Until date</label>
            <input class="r-opt r-until" id="r_until" type="date"/>
            <label class="r-opt r-count">Count</label>
            <input class="r-opt r-count" id="r_count" type="number" min="1" value="10"/>

            <div class="hr" style="grid-column:1/-1"></div>

            <label>Preview</label>
            <div id="r_preview" class="small" style="white-space:pre-line"></div>
          </div>

          <!-- Effort -->
          <div class="tabpage" id="tab-eff">
            <label>Importance</label><input id="t_imp" type="range" min="0" max="10"/>
            <label>Effort</label><input id="t_eff" type="range" min="0" max="10"/>
          </div>

          <!-- Note -->
          <div class="tabpage" id="tab-note">
            <label>Notes</label><textarea id="t_notes"></textarea>
          </div>

          <div style="display:flex;gap:6px;justify-content:flex-end;padding:8px;border-top:1px solid #eee">
            <button class="button" id="deleteTaskBtn">Delete</button>
            <button class="button" id="saveTaskBtn">Save</button>
          </div>
        </div>

        <div class="calendar">
          <div class="calendar-header">
            <button class="button cal-prev" data-target="cal-outline">◀</button>
            <span id="lab-cal-outline">March 2011</span>
            <button class="button cal-next" data-target="cal-outline">▶</button>
          </div>
          <div id="cal-outline" class="calendar-grid"></div>
        </div>
      </div>
    </div>

    <!-- TODO (unchanged, minimal for this step) -->
    <div id="view-todo" class="view">
      <div class="left-panel">
        <div class="inline-controls">
          <label class="small"><input id="includeClosed" type="checkbox" checked/> include closed places</label>
        </div>
        <div class="task-list" id="todoList"></div>
      </div>
      <div class="right-panel">
        <div class="calendar">
          <div class="calendar-header">
            <button class="button cal-prev" data-target="cal-todo">◀</button>
            <span id="lab-cal-todo">2/28/11 - 3/6/11</span>
            <button class="button cal-next" data-target="cal-todo">▶</button>
          </div>
          <div id="cal-todo" class="calendar-grid"></div>
        </div>
      </div>
    </div>

    <!-- PLACES (hours editor kept simple for this step) -->
    <div id="view-places" class="view">
      <div class="left-panel">
        <div class="inline-controls"><button class="button" id="newPlaceBtn">New Place</button></div>
        <div class="task-list" id="placeList"></div>
      </div>
      <div class="right-panel">
        <div class="editor" id="placeEditor">
          <div class="header"><span class="badge">Place Inspector</span></div>
          <div class="tabpage active" style="display:grid;grid-template-columns:140px 1fr;gap:8px;padding:8px">
            <label>Name</label><input id="p_name" type="text"/>
            <label>Note</label><textarea id="p_note"></textarea>
          </div>
          <div style="display:flex;gap:6px;justify-content:flex-end;padding:8px;border-top:1px solid #eee">
            <button class="button" id="deletePlaceBtn">Delete</button>
            <button class="button" id="savePlaceBtn">Save</button>
          </div>
        </div>

        <div class="calendar">
          <div class="calendar-header">
            <button class="button cal-prev" data-target="cal-places">◀</button>
            <span id="lab-cal-places">2/28/11 - 3/6/11</span>
            <button class="button cal-next" data-target="cal-places">▶</button>
          </div>
          <div id="cal-places" class="calendar-grid"></div>
        </div>
      </div>
    </div>

    <!-- BALANCE (unchanged for this step) -->
    <div id="view-balance" class="view">
      <div class="left-panel">
        <div class="panel-card" style="padding:8px">
          <div class="small" style="margin-bottom:6px">Desired vs Actual — (Balance logic unchanged in this step)</div>
        </div>
      </div>
      <div class="right-panel">
        <div class="calendar">
          <div class="calendar-header">
            <button class="button cal-prev" data-target="cal-balance">◀</button>
            <span id="lab-cal-balance">March 2011</span>
            <button class="button cal-next" data-target="cal-balance">▶</button>
          </div>
          <div id="cal-balance" class="calendar-grid"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // ---------- utils ----------
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const uuid=()=> (crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2));
  const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const todayISO=()=> new Date().toISOString().slice(0,10);

  // ---------- state ----------
  const KEY='lb_time_recur_v1';
  const defaults = {
    places:[{id:uuid(),name:'Home',note:''},{id:uuid(),name:'Office',note:''}],
    tasks:[
      {id:uuid(),title:'Have a dinner party once a month',parent:null,placeId:null,due:'',star:false,done:false,importance:6,effort:5,notes:'',
       time:{startDate:todayISO(),startTime:'19:00',duration:180,repeat:'monthly',interval:1,monthlyMode:'day',dayOfMonth:1,ends:'never'}},
      {id:uuid(),title:'Finish big project',parent:null,placeId:null,due:'',star:false,done:false,importance:8,effort:6,notes:'',
       time:{repeat:'none'}}
    ]
  };
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||defaults; }catch{ return defaults; } }
  let state = load();
  const save = ()=> localStorage.setItem(KEY, JSON.stringify(state));

  // ---------- tabs ----------
  $$('#topbar .tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      $$('#topbar .tab').forEach(t=>t.classList.remove('active'));
      $$('.view').forEach(v=>v.classList.remove('active'));
      tab.classList.add('active'); $('#view-'+tab.dataset.view).classList.add('active');
    });
  });

  // ---------- outline rendering ----------
  let selectedTaskId = state.tasks[0]?.id || null;

  function renderOutline(){
    // place dropdown
    $('#outlinePlace').innerHTML = `<option value="">All places</option>` + state.places.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');

    const box = $('#outlineList'); box.innerHTML='';
    const kids = new Map(state.tasks.map(t=>[t.id,[]]));
    state.tasks.forEach(t=>{ if(t.parent && kids.has(t.parent)) kids.get(t.parent).push(t); });
    const roots = state.tasks.filter(t=>!t.parent);

    function addRow(t,depth){
      const row=document.createElement('div'); row.className='task-row'+(isOverdue(t)?' overdue':''); row.dataset.id=t.id;
      row.style.paddingLeft=(depth?depth*14:0)+'px';
      row.innerHTML = `<div class="twisty">${kids.get(t.id)?.length?'▾':''}</div>
                       <input class="checkbox" type="checkbox" ${t.done?'checked':''}/>
                       <div class="title">${t.title}</div>
                       ${t.due?`<div class="date">${t.due}</div>`:''}`;
      box.appendChild(row);
      (kids.get(t.id)||[]).forEach(ch=>addRow(ch, depth+1));
    }
    roots.forEach(r=>addRow(r,0));

    // events
    $$('#outlineList .checkbox').forEach(cb=>cb.addEventListener('change',()=>{
      const id = cb.closest('.task-row').dataset.id; const t = state.tasks.find(x=>x.id===id); t.done=cb.checked; save(); renderAll();
    }));
    $$('#outlineList .title, #outlineList .date').forEach(el=>el.addEventListener('click',()=>{
      selectedTaskId = el.closest('.task-row').dataset.id; openTaskInspector();
    }));
  }

  function isOverdue(t){ return t.due && !t.done && t.due < todayISO(); }

  // ---------- inspector (General/Effort/Note) ----------
  function fillPlaceOptions(selId, val){
    const sel=$(selId); sel.innerHTML=`<option value="">(No place)</option>`+state.places.map(p=>`<option value="${p.id}">${p.name}</option>`).join(''); sel.value=val||'';
  }
  function openTaskInspector(){
    const t = state.tasks.find(x=>x.id===selectedTaskId); if(!t) return;
    // general
    $('#t_title').value=t.title; fillPlaceOptions('#t_place', t.placeId); $('#t_due').value=t.due; $('#t_star').checked=t.star; $('#t_done').checked=t.done;
    $('#t_imp').value=t.importance||5; $('#t_eff').value=t.effort||5; $('#t_notes').value=t.notes||'';
    // time (recurrence)
    const R = t.time || {repeat:'none'};
    $('#r_startDate').value = R.startDate || '';
    $('#r_startTime').value = R.startTime || '';
    $('#r_duration').value  = R.duration ?? '';
    $('#r_freq').value      = R.repeat || 'none';
    $('#r_interval').value  = R.interval || 1;
    // weekly
    $$('#r_weekdays input[type=checkbox]').forEach(c=>c.checked = (R.byWeekdays||[]).includes(+c.value));
    // monthly
    $('#r_monthlyMode').value = R.monthlyMode || 'day';
    $('#r_dayOfMonth').value  = R.dayOfMonth || 1;
    $('#r_nth').value = R.nth || 1;
    $('#r_nthWeekday').value = (R.nthWeekday ?? 1);
    // yearly
    buildYearMonthOptions(); $('#r_yearMonth').value = (R.yearMonth ?? 1); $('#r_yearDay').value = (R.yearDay ?? 1);
    // ends
    $('#r_ends').value = R.ends || 'never';
    $('#r_until').value = R.until || '';
    $('#r_count').value = R.count || 10;

    showRecurrenceOptions();
    updatePreview();
  }
  $$('#taskTabs .t').forEach(t=>t.addEventListener('click',()=>{
    $$('#taskTabs .t').forEach(x=>x.classList.remove('active')); t.classList.add('active');
    $$('.tabpage', $('#taskEditor')).forEach(p=>p.classList.remove('active')); $('#tab-'+t.dataset.tab).classList.add('active');
  }));
  $('#saveTaskBtn').addEventListener('click',()=>{
    const t = state.tasks.find(x=>x.id===selectedTaskId); if(!t) return;
    t.title=$('#t_title').value.trim()||'Untitled';
    t.placeId=$('#t_place').value||null;
    t.due=$('#t_due').value||'';
    t.star=$('#t_star').checked; t.done=$('#t_done').checked;
    t.importance=+$('#t_imp').value||0; t.effort=+$('#t_eff').value||0;
    t.notes=$('#t_notes').value||'';
    // save recurrence
    t.time = readRecurrenceForm();
    save(); renderAll();
  });
  $('#deleteTaskBtn').addEventListener('click',()=>{
    if(!selectedTaskId) return;
    state.tasks = state.tasks.filter(t=>t.id!==selectedTaskId);
    save(); selectedTaskId=null; renderAll();
  });

  // ---------- Time tab helpers ----------
  function buildYearMonthOptions(){
    const m=$('#r_yearMonth'); if(!m.options.length){
      const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      m.innerHTML = months.map((nm,i)=>`<option value="${i+1}">${nm}</option>`).join('');
    }
  }
  function showRecurrenceOptions(){
    const freq=$('#r_freq').value, mode=$('#r_monthlyMode').value, ends=$('#r_ends').value;
    $$('.r-opt').forEach(e=>e.style.display='none');
    if(freq==='weekly') $$('.r-weekly').forEach(e=>e.style.display='block');
    if(freq==='monthly'){ $$('.r-monthly').forEach(e=>e.style.display='block'); 
      $$('.r-monthly-day').forEach(e=>e.style.display = (mode==='day')?'block':'none');
      $$('.r-monthly-nth').forEach(e=>e.style.display = (mode==='nth')?'block':'none');
    }
    if(freq==='yearly') $$('.r-yearly').forEach(e=>e.style.display='block');
    if(ends==='until') $$('.r-until').forEach(e=>e.style.display='block');
    if(ends==='count') $$('.r-count').forEach(e=>e.style.display='block');
  }
  ['r_freq','r_monthlyMode','r_ends'].forEach(id=>$('#'+id).addEventListener('change',()=>{showRecurrenceOptions();updatePreview();}));
  ['r_startDate','r_startTime','r_duration','r_interval','r_dayOfMonth','r_nth','r_nthWeekday','r_yearMonth','r_yearDay','r_until','r_count']
    .forEach(id=>$('#'+id).addEventListener('input',updatePreview));
  $$('#r_weekdays input').forEach(c=>c.addEventListener('change',updatePreview));

  function readRecurrenceForm(){
    const byWeekdays = $$('#r_weekdays input:checked').map(c=>+c.value);
    return {
      startDate: $('#r_startDate').value||'',
      startTime: $('#r_startTime').value||'',
      duration:  +($('#r_duration').value||0) || null,
      repeat:    $('#r_freq').value,
      interval:  +($('#r_interval').value||1),
      byWeekdays,
      monthlyMode: $('#r_monthlyMode').value,
      dayOfMonth: +($('#r_dayOfMonth').value||1),
      nth:       +($('#r_nth').value||1),
      nthWeekday:+($('#r_nthWeekday').value||1),
      yearMonth: +($('#r_yearMonth').value||1),
      yearDay:   +($('#r_yearDay').value||1),
      ends:      $('#r_ends').value,
      until:     $('#r_until').value||'',
      count:     +($('#r_count').value||10)
    };
  }

  // Generate next N occurrence dates (YYYY-MM-DD) from recurrence settings
  function nextOccurrences(R, N=10, fromDateStr=todayISO()){
    const out=[]; if(!R || R.repeat==='none'){ if(R.startDate) out.push(R.startDate); return out.slice(0,N); }
    const from = new Date(fromDateStr+'T00:00:00');
    const start = R.startDate ? new Date(R.startDate+'T00:00:00') : from;
    let cur = new Date(Math.max(start, from));

    const pushIfOk = (d)=>{
      const ds = d.toISOString().slice(0,10);
      if(R.ends==='until' && R.until && ds > R.until) return;
      out.push(ds);
    };

    while(out.length < N){
      if(R.repeat==='daily'){
        pushIfOk(cur);
        cur.setDate(cur.getDate() + (R.interval||1));
      } else if(R.repeat==='weekly'){
        const interval = R.interval||1;
        // move to start of week
        const base = new Date(cur);
        base.setDate(base.getDate() - base.getDay()); // Sunday
        for(const wd of (R.byWeekdays?.length?R.byWeekdays:[cur.getDay()])){
          const d=new Date(base); d.setDate(base.getDate()+wd);
          if(d >= cur) pushIfOk(d);
          if(out.length>=N) break;
        }
        base.setDate(base.getDate()+7*interval);
        cur = base;
      } else if(R.repeat==='monthly'){
        const interval=R.interval||1;
        const d=new Date(cur);
        if(R.monthlyMode==='day'){
          d.setDate(R.dayOfMonth||1);
          if(d<cur) d.setMonth(d.getMonth()+interval);
          pushIfOk(d);
          d.setMonth(d.getMonth()+interval);
          cur=d;
        } else {
          // nth weekday
          const nth=R.nth||1, wk=R.nthWeekday??1;
          const temp = nthWeekdayOfMonth(d.getFullYear(), d.getMonth(), wk, nth);
          let dd=temp;
          if(dd<cur) { const m=d.getMonth()+interval, y=d.getFullYear()+Math.floor(m/12); dd=nthWeekdayOfMonth(y, (m%12+12)%12, wk, nth); }
          pushIfOk(dd);
          const m2=dd.getMonth()+interval, y2=dd.getFullYear()+Math.floor(m2/12);
          cur = nthWeekdayOfMonth(y2, (m2%12+12)%12, wk, nth);
        }
      } else if(R.repeat==='yearly'){
        const interval=R.interval||1;
        const d=new Date(cur);
        d.setMonth((R.yearMonth||1)-1, R.yearDay||1);
        if(d<cur) d.setFullYear(d.getFullYear()+interval);
        pushIfOk(d);
        d.setFullYear(d.getFullYear()+interval);
        cur=d;
      }
      if(R.ends==='count' && out.length >= (R.count||N)) break;
      if(R.ends==='until' && R.until && out.length && out[out.length-1] > R.until) break;
      // guardrail: don't loop forever
      if(out.length > 200) break;
    }
    return out.slice(0,N);
  }
  function nthWeekdayOfMonth(year, month, weekday, nth){
    const first = new Date(year, month, 1);
    const firstW = first.getDay();
    const offset = ( (weekday - firstW + 7) % 7 ) + (nth-1)*7;
    return new Date(year, month, 1+offset);
  }

  function updatePreview(){
    const R = readRecurrenceForm();
    const list = nextOccurrences(R, 8);
    $('#r_preview').textContent = list.length ? list.join('\n') : '—';
  }

  // ---------- ToDo (kept minimal; shows open tasks) ----------
  function renderTodo(){
    const box=$('#todoList'); box.innerHTML='';
    state.tasks.filter(t=>!t.done).forEach(t=>{
      const row=document.createElement('div'); row.className='task-row'; row.dataset.id=t.id;
      row.innerHTML=`<input class="checkbox" type="checkbox"/> <div class="title">${t.title}</div>`;
      box.appendChild(row);
    });
  }

  // ---------- Places (simple name editor) ----------
  let selectedPlaceId = state.places[0]?.id || null;
  function renderPlaces(){
    const list = $('#placeList'); list.innerHTML='';
    state.places.forEach(p=>{
      const row=document.createElement('div'); row.className='task-row'; row.dataset.id=p.id;
      row.innerHTML = `<div class="title">${p.name}</div>`;
      if(p.id===selectedPlaceId) row.style.background='#e6f3ff';
      row.addEventListener('click',()=>{ selectedPlaceId=p.id; openPlace(); renderPlaces(); });
      list.appendChild(row);
    });
    openPlace();
  }
  function openPlace(){
    const p=state.places.find(x=>x.id===selectedPlaceId); if(!p) return;
    $('#p_name').value=p.name; $('#p_note').value=p.note||'';
  }
  $('#savePlaceBtn').addEventListener('click',()=>{
    const p=state.places.find(x=>x.id===selectedPlaceId); if(!p) return;
    p.name=$('#p_name').value.trim()||'Untitled'; p.note=$('#p_note').value||''; save(); renderPlaces();
  });
  $('#deletePlaceBtn').addEventListener('click',()=>{
    state.places=state.places.filter(p=>p.id!==selectedPlaceId);
    if(!state.places.length) state.places=[{id:uuid(),name:'Home',note:''}];
    selectedPlaceId=state.places[0].id; save(); renderPlaces();
  });
  $('#newPlaceBtn').addEventListener('click',()=>{
    const p={id:uuid(),name:'New Place',note:''}; state.places.push(p); selectedPlaceId=p.id; save(); renderPlaces();
  });

  // ---------- Calendars (now show due dates + recurrence) ----------
  const calIds = {'cal-outline':'lab-cal-outline','cal-todo':'lab-cal-todo','cal-places':'lab-cal-places','cal-balance':'lab-cal-balance'};
  const calOffset={'cal-outline':0,'cal-todo':0,'cal-places':0,'cal-balance':0};
  function renderCalendar(id){
    const c=$('#'+id), lab=$('#'+calIds[id]); c.innerHTML='';
    const ref=new Date(); ref.setMonth(ref.getMonth()+calOffset[id]);
    lab.textContent = ref.toLocaleString('default',{month:'long'})+' '+ref.getFullYear();
    const first=new Date(ref.getFullYear(),ref.getMonth(),1);
    const startOffset=first.getDay();
    const daysInMonth=new Date(ref.getFullYear(),ref.getMonth()+1,0).getDate();
    // header
    DAYS.forEach(d=>{ const h=document.createElement('div'); h.className='calendar-day'; h.style.background='#f0f0f0'; h.textContent=d; c.appendChild(h); });
    for(let i=0;i<42;i++){
      const cell=document.createElement('div'); cell.className='calendar-day';
      const day=i-startOffset+1;
      if(day>0&&day<=daysInMonth){
        const ds=`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        cell.textContent=day;
        // mark due dates
        if(state.tasks.some(t=>t.due===ds && !t.done)){ const dot=document.createElement('div'); dot.className='task-dot'; cell.appendChild(dot); }
        // mark recurrence occurrences
        if(state.tasks.some(t=> (t.time && nextOccurrences(t.time, 200, ds).includes(ds)) )){ const dot=document.createElement('div'); dot.className='task-dot'; dot.style.left='2px'; cell.appendChild(dot); }
        if(ds===todayISO()) cell.classList.add('today');
      }
      c.appendChild(cell);
    }
  }
  $$('.cal-prev').forEach(b=>b.addEventListener('click',()=>{ const id=b.dataset.target; calOffset[id]--; renderCalendar(id); }));
  $$('.cal-next').forEach(b=>b.addEventListener('click',()=>{ const id=b.dataset.target; calOffset[id]++; renderCalendar(id); }));

  // ---------- export/import ----------
  $('#exportBtn').addEventListener('click',()=>{
    const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download='life-balance-data.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),500);
  });
  $('#importBtn').addEventListener('click',()=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ state=JSON.parse(r.result); save(); renderAll(); }catch{ alert('Import failed'); } }; r.readAsText(f); };
    inp.click();
  });

  // ---------- next ----------
  $('#nextBtn').addEventListener('click',()=>{ alert('“Next” logic unchanged in this step.'); });

  // ---------- wire ui ----------
  $('#newRootBtn').addEventListener('click',()=>{
    const t={id:uuid(),title:'New Project',parent:null,placeId:null,due:'',star:false,done:false,importance:5,effort:3,notes:'',time:{repeat:'none'}};
    state.tasks.push(t); save(); renderAll(); selectedTaskId=t.id; openTaskInspector();
  });
  $('#newSubBtn').addEventListener('click',()=>{
    if(!selectedTaskId){ alert('Select a parent task in Outline first.'); return; }
    const t={id:uuid(),title:'New Subtask',parent:selectedTaskId,placeId:null,due:'',star:false,done:false,importance:5,effort:3,notes:'',time:{repeat:'none'}};
    state.tasks.push(t); save(); renderAll(); selectedTaskId=t.id; openTaskInspector();
  });

  // availability filter UI (wired visually; full filtering can follow later)
  ['outlinePlace','outlineIncludeClosed','outlineAvailable'].forEach(id=> $('#'+id).addEventListener('change', ()=>renderOutline() ));

  // ---------- render all ----------
  function renderAll(){
    renderOutline(); renderTodo(); renderPlaces();
    Object.keys(calIds).forEach(renderCalendar);
    if(selectedTaskId) openTaskInspector();
  }
  renderAll();
});
</script>
</body>
</html>
