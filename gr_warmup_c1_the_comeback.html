<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Comeback</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background-color: #0f0c29;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #54a0ff 100%);
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px 12px 0 0;
            margin-bottom: 0;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.95;
            font-weight: 300;
        }

        .game-box {
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 0 0 12px 12px;
            padding: 30px 25px;
            border: 1px solid rgba(84, 160, 255, 0.2);
        }

        .round-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #a0aec0;
        }

        .round-counter {
            font-weight: 600;
            color: #54a0ff;
        }

        .situation-card {
            background-color: rgba(84, 160, 255, 0.1);
            border: 2px solid rgba(84, 160, 255, 0.3);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .situation-text {
            font-size: 1.3rem;
            line-height: 1.6;
            text-align: center;
            font-weight: 500;
        }

        .hidden-situation {
            opacity: 0.5;
            color: #a0aec0;
            font-style: italic;
        }

        .timer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .timer {
            font-size: 3rem;
            font-weight: 700;
            color: #54a0ff;
            min-width: 100px;
            text-align: center;
        }

        .timer.warning {
            color: #f56565;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background-color: #54a0ff;
            color: #ffffff;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #3d7fd9;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(84, 160, 255, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .rating-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn-rating {
            padding: 12px 16px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(84, 160, 255, 0.3);
            font-size: 0.9rem;
        }

        .btn-rating:hover {
            background-color: rgba(84, 160, 255, 0.2);
            border-color: #54a0ff;
        }

        .score-board {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .score-title {
            font-size: 0.85rem;
            color: #a0aec0;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(84, 160, 255, 0.1);
        }

        .score-row:last-child {
            border-bottom: none;
        }

        .score-label {
            color: #cbd5e0;
            font-size: 0.95rem;
        }

        .score-count {
            color: #54a0ff;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .hidden {
            display: none;
        }

        .state-setup {
            text-align: center;
        }

        .state-timer {
            text-align: center;
        }

        .state-rating {
            text-align: center;
        }

        .game-over-message {
            text-align: center;
            padding: 30px;
            font-size: 1.2rem;
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .situation-text {
                font-size: 1.1rem;
            }

            .timer {
                font-size: 2.5rem;
            }

            .rating-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>The Comeback</h1>
            <p>15 seconds. One perfect response.</p>
        </div>

        <div class="game-box">
            <div class="round-info">
                <span class="round-counter" id="roundCounter">Situation 0 of 15</span>
            </div>

            <div class="situation-card">
                <div class="situation-text" id="situationText">
                    <span class="hidden-situation">Click "Next Situation" to begin</span>
                </div>
            </div>

            <div class="state-setup" id="stateSetup">
                <div class="button-group">
                    <button class="btn btn-primary" id="nextBtn">Next Situation</button>
                </div>
            </div>

            <div class="state-timer hidden" id="stateTimer">
                <div class="timer" id="timer">15</div>
                <div class="button-group">
                    <button class="btn btn-primary" id="startBtn">Start Timer</button>
                </div>
            </div>

            <div class="state-rating hidden" id="stateRating">
                <p style="margin-bottom: 20px; color: #cbd5e0; font-size: 0.95rem;">How was that?</p>
                <div class="rating-buttons">
                    <button class="btn btn-rating" data-rating="Mic Drop">Mic Drop</button>
                    <button class="btn btn-rating" data-rating="Solid">Solid</button>
                    <button class="btn btn-rating" data-rating="Needs Work">Needs Work</button>
                    <button class="btn btn-rating" data-rating="Awkward Silence">Awkward Silence</button>
                </div>
            </div>

            <div class="score-board">
                <div class="score-title">Score</div>
                <div class="score-row">
                    <span class="score-label">Mic Drop</span>
                    <span class="score-count" id="scoreMicDrop">0</span>
                </div>
                <div class="score-row">
                    <span class="score-label">Solid</span>
                    <span class="score-count" id="scoreSolid">0</span>
                </div>
                <div class="score-row">
                    <span class="score-label">Needs Work</span>
                    <span class="score-count" id="scoreNeedsWork">0</span>
                </div>
                <div class="score-row">
                    <span class="score-label">Awkward Silence</span>
                    <span class="score-count" id="scoreAwkwardSilence">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const situations = [
            "Your boss publicly takes credit for your idea in a meeting.",
            "A stranger on the train says your music is too loud — but you\'re wearing headphones.",
            "Someone at a dinner party says your country is boring and has no culture.",
            "Your friend cancels plans for the fifth time in a row with the same excuse.",
            "A colleague says: \'Must be nice to leave at 5 while the rest of us actually work.\'",
            "Someone you just met says: \'You don\'t LOOK like you speak English.\'",
            "A waiter brings you the wrong dish for the third time and sighs when you mention it.",
            "Your landlord raises the rent by 30% and says \'it\'s the market.\'",
            "Someone at work replies-all to correct a tiny grammar mistake in your email.",
            "A family member says: \'When are you going to get a REAL job?\'",
            "Your neighbour\'s dog barks all night and they say: \'He only barks when he senses bad energy.\'",
            "Someone in a meeting says: \'With all due respect, I think you\'re completely wrong.\'",
            "A shop assistant follows you around the store and keeps asking if you need help.",
            "Someone says: \'I could never live in your city — it\'s so ugly.\'",
            "Your flatmate eats your clearly labelled food and says: \'I thought we were sharing.\'"
        ];

        let currentIndex = 0;
        let shuffledSituations = [];
        let scores = {
            "Mic Drop": 0,
            "Solid": 0,
            "Needs Work": 0,
            "Awkward Silence": 0
        };
        let timerInterval = null;
        let timeRemaining = 0;

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            shuffledSituations = shuffle(situations);
            currentIndex = 0;
            scores = {
                "Mic Drop": 0,
                "Solid": 0,
                "Needs Work": 0,
                "Awkward Silence": 0
            };
            updateScoreBoard();
            showSetup();
        }

        function updateRoundCounter() {
            document.getElementById("roundCounter").textContent = `Situation ${currentIndex} of 15`;
        }

        function updateScoreBoard() {
            document.getElementById("scoreMicDrop").textContent = scores["Mic Drop"];
            document.getElementById("scoreSolid").textContent = scores["Solid"];
            document.getElementById("scoreNeedsWork").textContent = scores["Needs Work"];
            document.getElementById("scoreAwkwardSilence").textContent = scores["Awkward Silence"];
        }

        function showSetup() {
            document.getElementById("stateSetup").classList.remove("hidden");
            document.getElementById("stateTimer").classList.add("hidden");
            document.getElementById("stateRating").classList.add("hidden");
            document.getElementById("situationText").innerHTML = '<span class="hidden-situation">Click "Next Situation" to reveal</span>';
        }

        function showSituation() {
            if (currentIndex >= 15) {
                showGameOver();
                return;
            }

            currentIndex++;
            updateRoundCounter();
            document.getElementById("situationText").textContent = shuffledSituations[currentIndex - 1];

            document.getElementById("stateSetup").classList.add("hidden");
            document.getElementById("stateTimer").classList.remove("hidden");
            document.getElementById("stateRating").classList.add("hidden");
            document.getElementById("timer").textContent = "15";
            document.getElementById("timer").classList.remove("warning");
            timeRemaining = 15;
        }

        function startTimer() {
            document.getElementById("startBtn").disabled = true;

            timerInterval = setInterval(() => {
                timeRemaining--;
                document.getElementById("timer").textContent = timeRemaining;

                if (timeRemaining <= 5) {
                    document.getElementById("timer").classList.add("warning");
                }

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    endTimer();
                }
            }, 1000);
        }

        function endTimer() {
            document.getElementById("stateTimer").classList.add("hidden");
            document.getElementById("stateRating").classList.remove("hidden");
            document.getElementById("startBtn").disabled = false;
        }

        function submitRating(rating) {
            scores[rating]++;
            updateScoreBoard();
            showSetup();
        }

        function showGameOver() {
            document.getElementById("situationText").innerHTML = "";
            document.getElementById("stateSetup").classList.add("hidden");
            document.getElementById("stateTimer").classList.add("hidden");
            document.getElementById("stateRating").classList.add("hidden");

            const total = Object.values(scores).reduce((a, b) => a + b, 0);
            const situationText = document.getElementById("situationText");
            situationText.innerHTML = `
                <div class="game-over-message">
                    <p>Game Over!</p>
                    <p style="font-size: 1rem; margin-top: 15px; color: #a0aec0;">You completed all 15 situations.</p>
                    <button class="btn btn-primary" style="margin-top: 20px; display: inline-block; width: auto;" onclick="location.reload()">Play Again</button>
                </div>
            `;
        }

        // Event listeners
        document.getElementById("nextBtn").addEventListener("click", showSituation);
        document.getElementById("startBtn").addEventListener("click", startTimer);

        document.querySelectorAll(".btn-rating").forEach(btn => {
            btn.addEventListener("click", () => {
                submitRating(btn.getAttribute("data-rating"));
            });
        });

        // Initialize
        initGame();
    </script>
</body>
</html>
