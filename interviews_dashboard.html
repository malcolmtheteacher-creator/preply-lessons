<style>
:root{--g:#1f3a30;--gold:#d4a437;--cream:#f8f5ee;--ink:#1d2a24;--mute:#5d6b63;--line:#e4dfd2;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.5}a{color:inherit}
.top{background:var(--g);padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
.top a{color:#e9efe9;text-decoration:none;font-size:.9rem;font-weight:600;padding:6px 14px;border-radius:999px}.top a:hover{background:rgba(255,255,255,.12)}
.hero{color:#fff;padding:70px 20px 60px;background:linear-gradient(90deg,rgba(23,48,42,.9) 0%,rgba(23,48,42,.55) 55%,rgba(23,48,42,.12) 100%),url(journey/routes/route_professional_interviews.jpg) center/cover,#1f3a30}
.wrap{max-width:1040px;margin:0 auto}.kicker{color:var(--gold);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
h1{font-family:var(--serif);font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;margin:.3em 0 .35em;font-weight:400}.hero p{max-width:560px;font-size:1.15rem;margin:0}
.prog{max-width:420px;margin-top:22px;background:rgba(255,255,255,.2);height:10px;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}.hero small{display:block;margin-top:8px;opacity:.9}
.stage{padding:34px 20px 0}.sh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.sh h2{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin:0}
.sh span{background:var(--g);color:#fff;border-radius:999px;font-size:.78rem;font-weight:700;padding:3px 12px}.sub{color:var(--mute);margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.c{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-decoration:none;transition:transform .12s,box-shadow .12s;border-top:6px solid var(--gold)}
.c:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(31,58,48,.14)}.c.done{border-top-color:#3d8a6a;background:#f3faf6}
.c b{font-family:var(--serif);font-weight:400;font-size:1.2rem;line-height:1.2}.c small{color:var(--mute)}.c .go{margin-top:auto;font-weight:800;color:var(--g);font-size:.9rem}
.foot{background:var(--g);color:#d7e0da;padding:34px 20px;text-align:center;margin-top:50px}.foot a{color:var(--gold);font-weight:700;text-decoration:none;margin:0 10px}
</style>

<script>
var S=[{"name": "Getting ready", "level": "A2–B1", "line": "First questions, first answers: the habits every good interview shares.", "items": [{"id": "rp_11_a_job_interview_a2b1", "t": "A Job Interview", "l": "A2/B1"}, {"id": "b1_42_star_interview_technique", "t": "STAR Interview Technique", "l": "B1"}, {"id": "interview_essentials", "t": "Interview Essentials", "l": "B1/B2"}]}, {"name": "Answering well", "level": "B2", "line": "Handle full interviews with clear, confident answers.", "items": [{"id": "b2_31_job_interview", "t": "A Job Interview", "l": "B2"}, {"id": "rp_11_a_job_interview", "t": "A Job Interview: Role Play", "l": "B2/C1"}, {"id": "wk_06_the_interview", "t": "The Interview", "l": "B2/C1"}, {"id": "professional_interview_prep_interactive", "t": "Professional Interview Mastery", "l": ""}, {"id": "ml_24_the_frozen_interview", "t": "The Frozen Interview", "l": "B2/C1"}, {"id": "production_sme_interview_guide", "t": "Production & Publishing Interview Preparation", "l": ""}]}, {"name": "Senior interviews", "level": "C1", "line": "Tell your story, show leadership, discuss clients and think out loud.", "items": [{"id": "skills_c1_senior_interview_1_your_story", "t": "The Two-Minute Headline", "l": "C1"}, {"id": "skills_c1_senior_interview_2_leadership", "t": "Leading Without the Org Chart", "l": "C1"}, {"id": "skills_c1_senior_interview_3_clients", "t": "Seven Figures and a Handshake", "l": "C1"}, {"id": "skills_c1_senior_interview_4_thinking", "t": "Thinking Out Loud", "l": "C1"}, {"id": "skills_c1_senior_interview_5_closing", "t": "The Last Ten Minutes", "l": "C1"}, {"id": "Business-Bootcamp-Lesson8-The-Final-Interview", "t": "The Final Interview", "l": "C1"}]}, {"name": "The other side, and the spotlight", "level": "C1–C2", "line": "Run great interviews, pitch yourself in a minute, and face the media.", "items": [{"id": "c1_pro_17_recruitment", "t": "Running Great Interviews", "l": "C1"}, {"id": "gr_warmup_c1_the_elevator", "t": "The Elevator Pitch", "l": "C1"}, {"id": "making_the_leap", "t": "Making the Leap: Career Reinvention", "l": "B2/C1"}, {"id": "c2_pro_06_media_interviews", "t": "Handling Media Interviews", "l": "C2"}]}];
(function(){
var done={};try{done=(JSON.parse(localStorage.getItem('wb_v1')||'{}').done)||{};}catch(e){}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var all=0,n=0,h='';
S.forEach(function(s){
  h+='<section class="stage"><div class="wrap"><div class="sh"><h2>'+esc(s.name)+'</h2><span>'+esc(s.level)+'</span></div><p class="sub">'+esc(s.line)+'</p><div class="grid">';
  s.items.forEach(function(i){all++;var d=!!done[i.id];if(d)n++;h+='<a class="c'+(d?' done':'')+'" href="'+esc(i.id)+'.html"><b>'+esc(i.t)+'</b><small>'+(i.l?esc(i.l)+' · ':'')+(d?'Done ✓':'Not yet opened')+'</small><span class="go">'+(d?'Open again':'Start')+' →</span></a>';});
  h+='</div></div></section>';
});
document.getElementById('st').innerHTML=h;
document.getElementById('pb').style.width=Math.round(n/all*100)+'%';
document.getElementById('pt').textContent=n+' of '+all+' lessons opened';
})();
</script>
