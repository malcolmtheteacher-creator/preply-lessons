const results = document.getElementById('results');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
let activeLevel = 'ALL';

// strip tags/entities to a plain lowercase string for matching
function plain(s){ const d=document.createElement('div'); d.innerHTML=s; return (d.textContent||'').toLowerCase(); }
LESSONS.forEach(x => { x._s = plain(x.t + ' ' + x.d + ' ' + x.l + ' ' + (x.k||'')); });

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const terms = q.split(/\s+/).filter(Boolean);
  let shown = 0;
  let html = '';
  for(const lv of Object.keys(LEVELS)){
    if(activeLevel !== 'ALL' && activeLevel !== lv) continue;
    const items = LESSONS.filter(x => x.l === lv && terms.every(t => x._s.includes(t)));
    if(!items.length) continue;
    shown += items.length;
    html += '<div class="level-block"><div class="level-head">' +
      '<span class="level-tag '+lv+'">'+lv+'</span>' +
      '<span class="level-name">'+LEVELS[lv]+'</span><span class="level-line"></span></div><div class="grid">';
    for(const x of items){
      html += '<a class="card '+x.l+'" href="'+x.f+'"><div class="card-title">'+x.t+'</div><div class="card-desc">'+x.d+'</div></a>';
    }
    html += '</div></div>';
  }
  if(!shown){
    results.innerHTML = '<div class="empty">No grammar point matches <strong>&ldquo;'+
      (searchEl.value.replace(/</g,'&lt;')||'')+'&rdquo;</strong>.<br>Try a simpler word — &ldquo;passive&rdquo;, &ldquo;future&rdquo;, &ldquo;articles&rdquo; — or clear the search.</div>';
  } else {
    results.innerHTML = html;
  }
  countEl.textContent = shown + ' lesson' + (shown===1?'':'s') +
    (activeLevel==='ALL'?'':' at '+activeLevel) + (q?' matching your search':'');
}

searchEl.addEventListener('input', render);
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  activeLevel = b.dataset.level;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c===b));
  render();
});
render();
</script>
</body>
</html>
