g a Gym", "desc": "Membership, goals, the hard sell.", "skill": "echoes Sparta", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I'm just looking into my options at the moment.", "…get a feel for the place before I decide.", "Could you give me a rough idea of the monthly cost?", "What kind of commitment am I looking at?", "Is there any wiggle room on that?", "I'm mainly looking to get back into some kind of routine.", "I'm not sure I'd use everything a premium membership throws in.", "I'd rather not rush into anything.", "Is that offer really only available today?", "Let me take the details away and have a think, and I'll come back to you."]}, {"file": "rp_18_joining_a_gym_a2b1.html", "title": "Joining a Gym", "desc": "Membership, goals, the hard sell.", "skill": "echoes Sparta", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["I would like some information, please.", "I am just looking today, thank you.", "How much is it a month?", "Is there a cheaper plan?", "What classes do you have?", "Do I have to sign for a year?", "I need to think about it.", "Can I take the prices home?\" / \"Can I take this paper with me?"]}, {"file": "rp_28_at_the_hairdressers.html", "title": "At the Hairdresser's", "desc": "Say what you want; fix it going wrong.", "skill": "echoes the Samurai", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Nothing dramatic — just a tidy-up.", "…take some weight out of it.", "I know it won't look exactly like this, but something along these lines.", "…if possible.", "Ha, I wish — nothing booked yet. What about you?", "Sorry to stop you — could we go easy on the length at the back?", "I think that might be a touch shorter than I had in mind.", "Could we leave it a little longer, if it's not too late?", "Would you mind taking a little more off this side, to even it up?", "That's exactly what I wanted — you've read my mind. Thank you so much."]}, {"file": "rp_28_at_the_hairdressers_a2b1.html", "title": "At the Hairdresser's", "desc": "Say what you want; fix it going wrong.", "skill": "echoes the Samurai", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Just a small cut, please.", "I want to keep the length.", "Please don't cut it too short.", "Just out of my eyes, please.", "Sorry, can you stop for a moment?", "That is a little too short.", "Can you make it the same, please?", "It's perfect! Thank you so much. I love it."]}, {"file": "rp_07_at_the_bank.html", "title": "At the Bank", "desc": "Open an account; sort a problem.", "skill": "echoes the Medici", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I wonder if you could help me with something.", "I'm hoping you can shed some light on it.", "There seems to be a charge I don't recognise.", "My card's been blocked, and I've not been given any explanation.", "I noticed I've been charged twice for the same transaction.", "I appreciate these things happen, but I'd still like to get to the bottom of it.", "I'd like to get this resolved today, if at all possible.", "With respect, I've already explained this twice.", "Is there someone I could speak to who'd be able to authorise that?", "Could I get a reference number for this — and the key points in writing, just for my records?"]}, {"file": "rp_07_at_the_bank_a2b1.html", "title": "At the Bank", "desc": "Open an account; sort a problem.", "skill": "echoes the Medici", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Hello. Can you help me, please?", "Can I ask you something?", "There is a problem with my card.", "My card doesn't work.", "Can you tell me why?", "Can I have a new card, please?", "How long does it take?", "Thank you so much! You are very kind."]}, {"file": "rp_09_making_a_complaint.html", "title": "Making a Complaint", "desc": "Complain politely but firmly.", "skill": "echoes the Boston Tea Party", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I'm afraid I've got a bit of a problem with something I bought here.", "I'm sure this is nothing you've done personally, but…", "This isn't quite what I was led to expect.", "It's faulty.", "I'd hate to have to take this further, but…", "I'm sure you can appreciate how frustrating this is.", "What I'd really like is a full refund — or a replacement, if that's simpler.", "Is this something you'd be able to sort out for me today?", "Could we meet halfway on this?", "That's genuinely kind of you — you've turned a rotten morning right around."]}, {"file": "rp_09_making_a_complaint_a2b1.html", "title": "Making a Complaint", "desc": "Complain politely but firmly.", "skill": "echoes the Boston Tea Party", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Excuse me, I have a problem with this coffee machine.", "I know it is not your fault, but…", "It doesn't work.", "Here is my receipt.", "I would like a new one, please.", "Can I have my money back, please?", "Is it possible to have that one instead?", "Thank you very much! That is very kind."]}, {"file": "rp_16_reporting_something_lost.html", "title": "Reporting Something Lost", "desc": "Describe it; stay hopeful.", "skill": "echoes the Mary Celeste", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I think I may have left my rucksack on the train.", "I don't suppose anyone's handed in a green rucksack…?", "Oh, about the size of a large shoebox, I suppose.", "There's a mountain patch on the front, you really can't miss it.", "It's of no real value to anyone but me — more sentimental than anything.", "I couldn't say for certain, but the last time I definitely had it was boarding at Edinburgh.", "Take your time — no rush at all.", "Would you mind taking my number, so you can let me know the moment anything surfaces?", "I'll keep my fingers crossed.", "I'll pop back tomorrow to check, if that's alright — thank you ever so much for looking."]}, {"file": "rp_16_reporting_something_lost_a2b1.html", "title": "Reporting Something Lost", "desc": "Describe it; stay hopeful.", "skill": "echoes the Mary Celeste", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["I think I left my bag on the train.", "Excuse me, did someone bring in a green bag?", "It is a green bag, and there is a picture of a mountain on it.", "It is about the size of a big box.", "The camera is important to me. It has my photos.", "I'm not sure, but I think I had it on the train.", "Take your time, no problem.", "Can you call me if you find it? Thank you so much for looking."]}, {"file": "rp_27_car_trouble.html", "title": "Car Trouble", "desc": "Explain the fault; question the quote.", "skill": "echoes the Wright Brothers", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I don't suppose you could take a look at it today, could you?", "It's been playing up for the last few days.", "There's a grinding sort of noise when I brake.", "It only does it when the engine's cold.", "Roughly how much am I looking at?", "Any idea how long it'll be off the road?", "That's a fair bit steeper than I was expecting, to be honest.", "Is there any way of bringing that down at all?", "Do I actually need that doing now, or could it wait?", "You've been really straight with me — I appreciate it."]}, {"file": "rp_27_car_trouble_a2b1.html", "title": "Car Trouble", "desc": "Explain the fault; question the quote.", "skill": "echoes the Wright Brothers", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Can you look at my car today?", "There is a problem with my car.", "There is a noise when I brake.", "The engine light is on.", "How much is it?", "Is there a cheaper way?", "That is very kind. Thank you.", "Thank you very much! Here are the keys."]}, {"file": "rp_04_checking_into_a_hotel.html", "title": "Checking into a Hotel", "desc": "Check in — and fix a room problem.", "skill": "echoes the Titanic", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I've got a reservation under the name of Okafor, checking in for three nights.", "And while you've got my details up…", "I don't suppose there's any chance of a higher floor, is there?", "…if it's not too much trouble.", "Would it be at all possible to have a late checkout?", "There seems to be a bit of a problem with the room.", "The heating doesn't seem to be working.", "Sorry to trouble you again, but I'm afraid there's a problem with the room.", "I don't mean to be difficult, but…", "You've handled it so graciously — I've half a mind to book a fourth night."]}, {"file": "rp_04_checking_into_a_hotel_a2b1.html", "title": "Checking into a Hotel", "desc": "Check in — and fix a room problem.", "skill": "echoes the Titanic", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["I have a booking. My name is Okafor.", "Can I ask for something, please?", "I would like a room on a higher floor, please.", "Is a late checkout possible?", "Excuse me, there is a problem with my room.", "The heating doesn't work.", "That's very kind. Thank you.", "Thank you so much!\" / \"Thank you very much!"]}, {"file": "rp_20_at_the_library.html", "title": "At the Library", "desc": "Join, find a book, sort a fine.", "skill": "echoes the Library of Alexandria", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I was hoping to sign up for a card, if now's a good moment?", "…if you wouldn't mind.", "I'm trying to track down a book — I wonder if you could point me in the right direction?", "Is there any chance I could put a hold on it?", "There must be some sort of mix-up…", "You know what — that's entirely my fault, I'm afraid.", "I don't suppose there's any way you could waive it, just this once?", "Am I right in thinking you've got a quiet study room upstairs?", "Would it be possible to renew these for another couple of weeks?", "You've been incredibly helpful — I really appreciate you sorting all that out."]}, {"file": "rp_20_at_the_library_a2b1.html", "title": "At the Library", "desc": "Join, find a book, sort a fine.", "skill": "echoes the Library of Alexandria", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["I would like to join the library, please.", "Here is my ID, and a letter with my address on it.", "Can you help me find a book, please?", "Can I reserve it, please?", "Sorry, I don't remember this fine. Can you check, please?", "Oh yes — that's my mistake. Sorry!", "Can I pay it now, please?", "Thank you so much for your help!"]}, {"file": "rp_15_renting_a_flat.html", "title": "Renting a Flat", "desc": "View, question, and negotiate.", "skill": "echoes the Great Fire of London", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I'll be honest, I've got a couple of other viewings lined up today — but this one caught my eye.", "Thanks for fitting me in at such short notice.", "Could you give me a rough idea of what the bills come to on top of the rent?", "What's the notice period if I ever need to leave?", "I did notice a bit of damp by the window — is that something that's been looked at, or…?", "I love the flat, but it's a touch more than I was hoping to pay.", "Is there any movement on the rent at all?", "If I were to sign for two years rather than one, is that something you could reflect in the monthly rent?", "Could you meet me halfway?", "I'm really keen — could I take your number and come back to you first thing tomorrow, once I've slept on it?"]}, {"file": "rp_15_renting_a_flat_a2b1.html", "title": "Renting a Flat", "desc": "View, question, and negotiate.", "skill": "echoes the Great Fire of London", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Can I look around, please?", "It's nice! I like it.", "How much are the bills?", "Is the internet included?", "There is a problem with the window.", "Can you fix it before I move in?", "I like the flat, but the rent is a little high for me.", "Can the rent be a little lower?"]}, {"file": "rp_13_talking_about_the_weather.html", "title": "Talking About the Weather", "desc": "Small talk that opens doors.", "skill": "echoes Krakatoa", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Doesn't look like it's going to hold, does it?", "Typical, isn't it?", "Mind you, we can't really complain after the summer we've had.", "You've just moved into number 3, haven't you?", "Oh, whereabouts?", "It must be a lot of work.", "Funnily enough, I've been meaning to do the same.", "Small world, isn't it?", "You'll have to pop round for a cup of tea sometime.", "Anyway — I'd better let you get on. Lovely to finally put a name to a face."]}, {"file": "rp_13_talking_about_the_weather_a2b1.html", "title": "Talking About the Weather", "desc": "Small talk that opens doors.", "skill": "echoes Krakatoa", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["It's cold today, isn't it?", "Typical! I forgot my coat.", "Do you live here too?", "I'm new here.", "It must be a lot of work.", "Me too!", "Come and see the garden sometime.", "It was nice to meet you! See you soon!"]}, {"file": "rp_22_talking_about_sport.html", "title": "Talking About Sport", "desc": "Share opinions; agree and disagree.", "skill": "echoes the World Cup", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["…, if you ask me.", "…, no question.", "I couldn't agree more.", "You took the words right out of my mouth.", "I'm not so sure about that.", "You've got a point there, but…", "I see where you're coming from, but…", "Each to their own.", "To be fair, they thoroughly deserved it.", "I still can't believe that went in!"]}, {"file": "rp_22_talking_about_sport_a2b1.html", "title": "Talking About Sport", "desc": "Share opinions; agree and disagree.", "skill": "echoes the World Cup", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["I think it was a great game.", "For me, the best player is number ten.", "Yes, I agree with you.", "You're so right!", "Hmm, I'm not sure.", "Really? I don't think so. I like the other team.", "Maybe you're right.", "That's OK! It's only a game."]}, {"file": "rp_26_a_wedding_invitation.html", "title": "A Wedding Invitation", "desc": "Accept, congratulate, or decline.", "skill": "echoes Queen Victoria", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Stop it — that's the best news I've heard all year! I'm absolutely thrilled for you both.", "I couldn't be happier for the two of you.", "I wouldn't miss it for the world.", "Consider me there — front row, tissues at the ready.", "Would it be alright if I brought someone?", "Is there a dress code I should know about?", "Is there anything in particular you're hoping for, gift-wise?", "I'm so sorry — I don't think we're going to be able to make it, much as we'd love to.", "As luck would have it, we're already away that weekend.", "We'll be raising a glass to you from afar — and we want every single photo."]}, {"file": "rp_26_a_wedding_invitation_a2b1.html", "title": "A Wedding Invitation", "desc": "Accept, congratulate, or decline.", "skill": "echoes Queen Victoria", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Congratulations! I am so happy for you!", "That is wonderful news!", "Yes! I would love to come.", "I will be there.", "Can I bring my partner?", "What should I wear?", "I am so sorry, but I can't come. I am busy that day.", "I will be thinking of you! Send me lots of photos!"]}, {"file": "rp_24_a_noisy_neighbour.html", "title": "A Noisy Neighbour", "desc": "Raise it without starting a war.", "skill": "echoes Emperor Nero", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Sorry to land on your doorstep out of the blue — I'm from number 12, just next door.", "I don't want to make a big thing of it, but…", "The music carries straight through the wall, more than you'd think.", "It's not really the daytime, it's more the late nights.", "I'm sure you've no idea how much it travels.", "The trouble is, we're both up at six, so it really knocks us out the next day.", "I'm not asking you to sit in silence, but could we…?", "Could we maybe find some middle ground?", "If we're ever the noisy ones, just bang on the wall.", "No harm done — I'd far rather have a quick word than let it fester. Thanks for being so decent about it."]}, {"file": "rp_24_a_noisy_neighbour_a2b1.html", "title": "A Noisy Neighbour", "desc": "Raise it without starting a war.", "skill": "echoes Emperor Nero", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Hi, I'm your neighbour. I live next door.", "Sorry to knock so late.", "I can hear the music through the wall.", "The wall is very thin, so I can hear everything.", "I get up early, so at night I need to sleep.", "Can you turn it down a little?", "If we are ever too loud, please tell us.", "Thank you, that's very kind. Good night!"]}, {"file": "rp_29_a_leaving_party.html", "title": "A Leaving Party", "desc": "Toasts, thanks, and goodbyes.", "skill": "echoes Shackleton", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Sorry to interrupt — could I grab you all just for a moment?", "I won't keep you long…", "Honestly, I don't know what we're going to do without you.", "I'll never forget…", "It just won't be the same around here without you.", "Our loss is their gain.", "Don't be a stranger.", "Let's actually keep in touch — and I mean properly, not just the thing people say.", "…not leave it too long.", "So if you'd all raise your glasses… to Sam!"]}, {"file": "rp_29_a_leaving_party_a2b1.html", "title": "A Leaving Party", "desc": "Toasts, thanks, and goodbyes.", "skill": "echoes Shackleton", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["We will miss you.", "Take care of yourself!", "Thank you for everything.", "It was great to work with you.", "Good luck in your new job!", "I hope you are very happy there.", "Keep in touch!", "Please raise your glass. To Sam!"]}, {"file": "rp_11_a_job_interview.html", "title": "A Job Interview", "desc": "Sell yourself; own a weakness.", "skill": "echoes the Manhattan Project", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Thanks so much for making the time today — it's lovely to be here.", "By way of background…", "Colleagues tend to say I'm the person they want in the room on a bad day.", "I'd rather show you than just tell you.", "If I had to pick one, it's…", "If I'm honest…", "I used to struggle with delegating, but I've since learned to…", "I'd be curious to know…", "What would a successful first six months look like in this role?", "I've enjoyed this enormously — I'd genuinely welcome the chance to be part of it."]}, {"file": "rp_11_a_job_interview_a2b1.html", "title": "A Job Interview", "desc": "Sell yourself; own a weakness.", "skill": "echoes the Manhattan Project", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Hello. Nice to meet you. Thank you for your time.", "My name is Sara, and I am a teacher.", "I work in a hospital.", "I like working with people.", "I am good at helping people.", "I am friendly. For example, I help new people at work.", "Can I ask a question?", "Thank you very much for your time. I hope to hear from you."]}, {"file": "rp_30_first_day_at_work.html", "title": "First Day at Work", "desc": "Introduce yourself; ask for help.", "skill": "echoes the Terracotta Army", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I don't think we've met. I'm Sam, I've just joined the team.", "I'm still finding my feet.", "I don't suppose you could point me in the right direction?", "Could you talk me through how it works?", "I've had a good look, but I can't for the life of me find the stationery — any idea where it lives?", "So far so good — everyone's been really welcoming, to be honest.", "How long have you been here, then?", "Is there anything I can take off your plate?", "That would be a real lifesaver, if you're sure you don't mind.", "I'll let you get on — thanks so much for taking me under your wing today."]}, {"file": "rp_30_first_day_at_work_a2b1.html", "title": "First Day at Work", "desc": "Introduce yourself; ask for help.", "skill": "echoes the Terracotta Army", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Hi, I'm Sam. I'm new here — today is my first day.", "Nice to meet you.", "Can you show me how it works?", "Where is the kitchen?", "It's good, thank you. Everyone is very friendly.", "How long have you worked here?", "Can I help you with anything?", "Thank you very much for your help today."]}, {"file": "ml_01_the_group_chat.html", "title": "The Group Chat", "desc": "Bow out of a trip you can't afford.", "skill": "saying no, warmly", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Can I be totally honest with you for a sec?", "…before this snowballs any further.", "I'm going to have to sit this one out.", "The truth is, it's a bit out of my budget right now.", "Please don't let me hold anyone back — I'd hate for this to become a thing.", "I'd hate for this to become a thing.", "Here's what I can absolutely do…", "Let me take you out, just the two of us, the weekend you're back — the birthday dinner you actually deserve, my treat.", "Keep me in the loop for everything else, though.", "I'm genuinely made up for you — go and have the best time."]}, {"file": "ml_02_the_screen_time_talk.html", "title": "The Screen-Time Talk", "desc": "Ask someone you love to put the phone down.", "skill": "a gentle boundary", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Can I raise something — and it's honestly not a criticism?", "It's a small thing, but it's been on my mind.", "I'm just as bad, I know.", "I'm not pointing the finger — I do it too.", "It's not about the phone — it's that I miss you.", "I end up feeling a bit invisible.", "What if we tried phones in a basket at dinner?", "What if, just at dinner, we both parked our phones by the door — and after a week we see whether we even like it?", "Shall we give it a week and see how it feels?", "It's not really about the phones — I just like having you to myself."]}, {"file": "ml_05_a_photo_of_you.html", "title": "A Photo of You", "desc": "Ask a friend to take a post down.", "skill": "an online boundary", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Tiny favour — genuinely no big deal.", "Honestly, what a night — best I've laughed in ages.", "Would you mind taking that one down?", "Ah, don't worry about cropping — just the whole thing down whenever you get a sec, no rush at all.", "It's nothing you did — I just keep my face off there.", "It's nothing to do with the photo — it's a lovely one. I just don't do the online thing with my face.", "Please don't feel daft — how would you have known?", "Honestly, no drama at all — I just prefer it that way.", "We're totally fine — thank you for getting it.", "Send it to me though, would you? I'd love to actually have it — just for me, not for the whole internet."]}, {"file": "ml_09_the_comparison_trap.html", "title": "The Comparison Trap", "desc": "Listen to a friend who feels behind.", "skill": "listening well", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Tell me what actually set it off.", "So it's not the car itself — it's that you feel behind.", "That sounds genuinely horrible — and it makes complete sense you'd feel that.", "I'm not going to tell you it's all fake. You know that already.", "For what it's worth, I do this too. More than I'd admit.", "Do you want me to just listen, or do you want me to be useful?", "What would 'on track' even look like for you?", "Whose life are you actually measuring yourself against?", "You're comparing your Tuesday to their wedding day.", "Ring me next time instead of scrolling. Any hour."]}, {"file": "ml_18_the_thing_you_shared.html", "title": "The Thing You Shared", "desc": "Admit your post was wrong and correct it.", "skill": "correcting yourself publicly", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Hang on — let me actually read it properly.", "Where's this from originally? I never checked, did I.", "God, I feel a bit daft now.", "I should have checked before I hit share. That's the bit that bothers me.", "You're right, and I'm not going to argue with it.", "I'll take it down now, while we're talking.", "Deleting it isn't really enough, though, is it — people have seen it.", "I'll put something up saying I got it wrong.", "Would you rather I named you in it, or left you out of it altogether?", "Thanks for telling me rather than letting me carry on."]}, {"file": "ml_19_the_comment_row.html", "title": "The Comment Row", "desc": "Ring someone you argued with in the comments.", "skill": "climbing down", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Look, I'm not ringing for round two.", "I'd rather have this out properly than type at you.", "It got a bit out of hand, didn't it.", "Some of what I put was fair. The last one wasn't.", "Half of it was for the people watching, if I'm honest.", "I don't think either of us was really talking to each other by the end.", "Fair enough — I can see how it read.", "That's not what I meant, but I can see why you took it that way.", "Can we just leave it there and have a beer on Saturday?", "I'll delete mine if you delete yours — or leave them, I don't mind, honestly."]}, {"file": "ml_20_the_group_admin.html", "title": "The Group Admin", "desc": "Tell a group member to stop posting adverts.", "skill": "enforcing a rule", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Can I have a quick word about the group — wearing my admin hat?", "It's not a personal thing, and I'd say the same to anyone.", "The rule's the same for everybody — that's the only reason I'm ringing.", "I've had three people message me about it, which is why it's landed on me.", "You're welcome to post it once, and that's genuinely fine.", "I know it's your livelihood — I'm not trying to make that harder.", "If it carries on I'll have to start taking them down, and I'd rather not.", "I don't want to remove you. That's the honest position.", "Is that something you can live with?", "Right — no hard feelings, I hope. See you Sunday."]}, {"file": "ml_16_the_scam_call.html", "title": "The Scam Call", "desc": "Refuse a caller who says he's your bank.", "skill": "refusing under pressure", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Sorry — before we go any further, who am I actually speaking to?", "I'm not being funny, but I've no way of knowing that, have I.", "How did you get this number, out of interest?", "I'm not going to be reading anything out over the phone, I'm afraid.", "You'll appreciate I can't just take your word for it.", "I'd rather ring you back on the number on the back of my card.", "If it's genuinely that urgent, it'll still be urgent in ten minutes.", "No, I'm alright, thanks — I'll sort it through the app.", "You're welcome to put it in writing.", "Right — I'm going to hang up now. Nothing personal."]}, {"file": "ml_22_the_bad_seller.html", "title": "The Bad Seller", "desc": "Get your money back from a private seller.", "skill": "standing your ground", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Thanks for meeting me — I'll not keep you long.", "It's not what was in the advert, though, is it.", "You said barely used. Have a look at the state of the chain.", "I'm not accusing you of anything, but this didn't happen in three days.", "What I'd like is the ninety back, and you take the bike.", "I'm not after a bit off. I want to undo it.", "I'd rather sort it here than start leaving reviews and messaging you every day.", "Cash is fine, or a transfer — whatever's easiest for you.", "I'm not going to go away on this, I'm afraid.", "Right, that's it done — no hard feelings, honestly."]}, {"file": "ml_21_the_caf_poster.html", "title": "The Café Poster", "desc": "Ask a business to pay for your photo.", "skill": "claiming what's yours", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["I think that might be my photo you've got on the poster.", "I'm fairly sure it's mine — it's the one from that frosty morning in January.", "I'm not cross about it, before you panic.", "I'd have said yes if you'd asked, that's the funny thing.", "It's less about the money and more about being asked.", "Where else has it gone — is it just the poster, or the website as well?", "Two options, really: you credit me and pay something, or it comes down.", "I'd normally charge a hundred for something like that.", "Could we say fifty and my name on the website?", "Next time just send me a message and it's yours."]}, {"file": "ml_25_the_review_they_want_down.html", "title": "The Review They Want Down", "desc": "Stand by a bad review you left.", "skill": "not backing down", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["I wasn't expecting a call about it, I'll be honest.", "I stand by what I put, but I'm happy to talk about it.", "Everything in it happened. I've not exaggerated any of it.", "I did try ringing you twice before I wrote anything.", "I'm not going to take it down, I'm afraid.", "If you refund the callout I'll add that you sorted it — I'm not going to delete it, though.", "I'd rather you didn't ring me at this time of night, actually.", "I've left plenty of good ones. This one just wasn't.", "You're welcome to reply to it publicly — that's what the reply box is for.", "I think we'll have to leave it there. Goodnight."]}, {"file": "ml_08_the_delivery_gone_wrong.html", "title": "The Delivery Gone Wrong", "desc": "Chase a lost parcel without losing your temper.", "skill": "firm & polite", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Let me give you the order number and exactly what's happened.", "None of this is your fault, I know — but I do need it sorted.", "What I'd like is a replacement, here, by Saturday.", "I appreciate that, but that doesn't really work for me.", "I understand. What I need is still a replacement here by Saturday.", "Can you give me a date rather than 'up to ten working days'?", "It says it was left in a safe place. There isn't one. So where is it?", "Is there someone who can authorise that?", "So just so I'm clear — what happens next, and when?", "Thanks for actually helping — can I take a reference for this call?"]}, {"file": "ml_23_the_ai_mistake.html", "title": "The AI Mistake", "desc": "Tell a colleague their AI wrote something false.", "skill": "raising it quietly", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Have you got two minutes before this goes out?", "Where's this figure come from, do you know?", "I've had a look and I can't find it anywhere.", "I think it might have made it up, to be honest.", "It does that, apparently — it fills the gap in rather than saying it doesn't know.", "I'm not going to say anything to anyone. I just don't want it going to the client.", "Can we pull the number out and just say what we actually know?", "I've done exactly the same thing, so I'm not standing here judging you — mine had a court case in it that never happened.", "Do you want me to go through the rest of it with you?", "Nobody else needs to know — it hasn't gone anywhere yet."]}, {"file": "ml_04_back_in_touch.html", "title": "Back in Touch", "desc": "Reconnect, and turn it into a real plan.", "skill": "repair & warmth", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Please tell me I haven't left it so long that you've deleted my number!", "I know I'm calling a bit out of the blue…", "…and that's on me as much as anyone.", "How has it been two years? Life just sort of closed over the gap, didn't it?", "You've genuinely been on my mind.", "I walked past that little Thai place we used to go to last week, and it hit me how long it had been.", "Let's not do the 'we must catch up' thing and then not — are you free on the 20th?", "Let's get an actual date in the diary.", "I mean it this time — properly.", "It's so good to have you back — I've missed this more than I realised."]}, {"file": "ml_14_bad_news.html", "title": "Bad News", "desc": "Turn up for a friend who's grieving.", "skill": "being there", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["I'm not going to say anything useful. I just didn't want you to be on your own.", "I brought food. It's a bit much. I panicked in the shop.", "I don't know what to say.", "I keep starting sentences and they're all rubbish, so I'll stop.", "Do you want to talk about her, or absolutely not?", "Tell me about her. Anything. The annoying stuff, ideally.", "That's just awful. I'm not going to try and make it less awful.", "You don't have to be alright with me.", "I'll sit here. You don't have to entertain me.", "I'm coming back Thursday. You don't have to answer the door."]}, {"file": "ml_13_the_apology.html", "title": "The Apology", "desc": "Say sorry when you were properly wrong.", "skill": "apologising properly", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["I've been trying to find a way to say this that makes me look better. There isn't one.", "I'm not going to explain it, because the explanation is just an excuse with a tie on.", "You told me that in confidence and I repeated it. That's it. That's the whole thing.", "It wasn't a slip. I knew what I was doing while I was doing it.", "I'm not asking you to be alright with it.", "You don't have to say anything now — I'd rather you didn't, actually.", "I know what that costs you. You won't tell me things now, and that's fair enough.", "It's yours. Whatever you want it to be.", "If you want to be angry with me for a while, be angry with me for a while.", "I'm sorry. Properly. That's all I came to say."]}, {"file": "ml_03_the_honest_review.html", "title": "The Honest Review", "desc": "Tell a small-business owner the truth, kindly.", "skill": "kind criticism", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Do you want the polite version or the honest one?", "I'd rather tell you to your face than leave you guessing.", "Most of it was lovely — one thing let it down.", "The welcome, the wine, that pudding — I'd not change a single thing.", "It wasn't the service, it was the risotto — it came out stone cold.", "It was just one plate, on one busy night.", "Everything around it was spot on — it was just that one dish.", "I'd still send people here in a heartbeat — nothing's changed on that.", "I only mention it because I want this place to do brilliantly.", "I'll be back next week regardless — you know that."]}, {"file": "ml_06_the_collab.html", "title": "The Collab", "desc": "Review something together; disagree honestly.", "skill": "the language of reviewing", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["…what did you actually make of it?", "I went in with high hopes, I'll be honest.", "For me, it's a masterpiece, flaws and all.", "The world-building is next-level.", "It's a bit overrated, if I'm honest.", "The combat feels a bit clunky, and honestly it hasn't aged well.", "Yeah, I'm totally with you on that.", "See, that's where we differ — I actually loved the ending.", "Why don't you take the combat, and I'll cover the exploration?", "Let's lead with the hot take and hook them in the first ten seconds."]}, {"file": "ml_10_the_holiday_budget.html", "title": "The Holiday Budget", "desc": "Say what you can actually afford.", "skill": "money, out loud", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Can I be the boring one for a second and talk about money?", "I'm in, definitely — it's just the number I'm stuck on.", "What's everyone's actual ceiling, do you think?", "I can do about three hundred. Anything past that and I'm pretending.", "Would it be mad to look at the week after?", "It's not that it's not worth it — it's just more than I've got.", "What if we split the difference?", "I can't be the only one thinking it, can I?", "Nobody should have to say out loud that they can't afford it.", "Honestly, I'd rather sort the money now than be weird about it all week."]}, {"file": "ml_12_the_money_you_lent.html", "title": "The Money You Lent", "desc": "Ask a friend for your money back.", "skill": "what you're owed", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Don't take this the wrong way — it's not a big thing.", "I've been putting off saying this, which is stupid.", "That two hundred from back in March — where are we with that?", "I'd honestly forgotten about it until I hadn't, if that makes sense.", "'Soon' is fine — I'd just rather have a date.", "Even a bit of it, whenever. I'm not chasing you.", "It's not the money. It's that I've started keeping score, and I hate it.", "I'd rather have this conversation once than think about it every week.", "Are you alright, though? Genuinely.", "Right, that's it done. Never mentioning it again."]}, {"file": "ml_15_the_big_favour.html", "title": "The Big Favour", "desc": "Ask for a lot; mean it when you say no is fine.", "skill": "asking for a lot", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["I'm going to ask you something, and I want you to know the answer can be no.", "Don't answer now. Genuinely — sleep on it.", "Six weeks. From the third. That's the whole ask.", "I'd be out by the middle of August whatever happens.", "Say no and I'll never mention it again — I mean that.", "If it's a maybe, that's a no, and that's completely fine.", "I know what I'm asking. It's your house.", "I'd rather lose the room than have you resent me in it.", "That's honestly fine. I'd have said no too.", "Right — that's that. What are you having?"]}, {"file": "ml_07_working_from_home.html", "title": "Working From Home", "desc": "Two of you, one table. Sort it out.", "skill": "sharing a space", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Can we work out a system for the days we're both here?", "It's nobody's fault — the flat just wasn't built for two offices.", "What does your week actually look like?", "Would it work if…?", "I'm easy either way.", "I'd rather take the bedroom desk and keep the table free for your calls.", "Can we try it for a couple of weeks and see how it feels?", "The only thing I'd really need to protect is Thursday afternoon — that's when I do the work I can't do with a voice in the room.", "If it's not working, say — don't just put up with it.", "Honestly, I'd rather sort it now than let it fester."]}, {"file": "ml_11_the_neighbours_noise.html", "title": "The Neighbour's Noise", "desc": "Ask a stranger to turn the music down.", "skill": "stuck with them", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Sorry to be that neighbour.", "This is probably going to sound worse than I mean it.", "It's just the music, the last few nights — I've not really slept.", "I'm not asking you to stop having people over. Honestly.", "Would midnight be doable, do you think?", "What would work for you?", "If it's a one-off, forget I said anything.", "You'd tell me if I was doing it to you, wouldn't you?", "Right — well, I'm in number four if I'm ever the problem.", "Anyway. Sorry again. It's genuinely fine."]}, {"file": "ml_17_the_first_phone_call.html", "title": "The First Phone Call", "desc": "Ring a match before you agree to meet.", "skill": "testing the water", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Right — this is a bit odd, isn't it, after all that typing.", "I'll be honest, I'm rubbish on the phone.", "Can I ask you something slightly nosy?", "Whereabouts are you, roughly? You don't have to say.", "What made you say yes to this, out of interest?", "I've had a couple of these that went nowhere, if I'm honest.", "You're much easier to talk to than I'd built up in my head.", "Shall we just do a coffee and see how we go?", "Somewhere public, and I'll tell my sister where I am — I hope that's not weird.", "If either of us wants to make an excuse and go after twenty minutes, that's completely fine."]}, {"file": "ml_24_the_frozen_interview.html", "title": "The Frozen Interview", "desc": "Save a job interview when the video freezes.", "skill": "repairing the line", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Sorry — I think I've lost you for a second there.", "Can you still hear me, or is it just me?", "You went a bit robotic — would you mind saying that again?", "I'll turn my camera off and see if that helps.", "I think it's my end, not yours.", "Bear with me two seconds while I move nearer the router.", "Sorry, you go — I'm talking over you.", "Where had we got to? You were asking about the Renner project.", "Shall we just do it on the phone instead? I'm happy either way.", "Sorry about all that — thanks for being patient with it."]}, {"file": "wk_01_speaking_up_in_the_meeting.html", "title": "Speaking Up in the Meeting", "desc": "Get a word in; never freeze.", "skill": "meeting fluency", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Sorry, can I just come in here?", "If I could just finish that thought…", "That's a good question — let me think for a moment.", "How shall I put this…", "I don't know the exact word, but it's the thing that…\"  /  \"You know when…\"  /  \"What I'm trying to say is…", "From where I sit, the bigger risk is waiting.", "I take your point, but I see it slightly differently.", "When you say 'premature', what exactly do you mean?", "Can I come back to you on that?", "So, if I've got this right, the proposal is now a soft launch."]}, {"file": "wk_08_chairing_the_meeting.html", "title": "Chairing the Meeting", "desc": "Run the room; finish on time.", "skill": "running the room", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["…here's how I'd like to use it.", "Marcus, can you take us through the first one — three minutes?", "Marcus — let me jump in there, only because I want Yuki's view before we lose time.", "That's a real issue, but it's a different meeting. Can we park it?", "Yuki, you've been closest to this — what are we missing?", "Let Yuki finish.", "Where are we — is everyone happy, or is anyone uneasy?", "So what I'm hearing is…", "So that's you, Marcus, by Thursday — is that realistic?", "We said half an hour and we're at twenty-eight. Thank you — that was a good one."]}, {"file": "wk_03_the_presentation.html", "title": "The Presentation", "desc": "Survive the questions after your talk.", "skill": "presenting & Q&A", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I'll keep this brief — three things, then I'll take questions.", "So — I'm happy to open it up. What have you got?", "Good question — just so I answer the right thing, do you mean…?", "Let me take that in order.\" / \"Give me a second to do that justice.\" / \"That's worth a proper answer — one moment.", "I hear you, and it's a fair challenge — the way I'd look at it is…", "You're right that we can't run the team hot forever — and that's exactly why…", "I don't have that figure to hand — let me follow up with you after.", "I'd rather not guess at a number in a room like this.\" / \"I'd rather give you something accurate than something quick.\" / \"A wrong figure helps nobody — let me get you the real one.", "If there's nothing else, let me leave you with one thought.", "The headline isn't the number — it's that we now know how to…"]}, {"file": "wk_02_working_the_room.html", "title": "Working the Room", "desc": "Turn a coffee break into real contacts.", "skill": "networking", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Mind if I join you?", "How are you finding it so far?", "I'm Sofia, by the way.", "I help [who] [do what].\" → e.g. \"I help mid-size companies move their products across borders without losing their money.", "Oh, interesting — how did you get into that?", "That's funny you say that, because…", "Shall we swap details?", "I'll drop you a line next week.", "I don't want to monopolise you…", "This has been the best conversation of the morning — talk soon."]}, {"file": "wk_07_asking_to_work_from_home.html", "title": "Asking to Work From Home", "desc": "Ask your manager for two days at home.", "skill": "making a case", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["There's something I'd like to put to you — nothing dramatic.", "I want to talk about how I work best, not about doing less.", "What I'd like to propose is two fixed days at home — Tuesday and Thursday.", "Over the last quarter, almost all the deep work has happened on the days I've been at home.", "I know the worry is the team, so let me get ahead of that.", "Monday and Friday stay office days precisely because that's when we plan and hand over.", "Could we trial it for a month?", "If it slips, we drop it. No argument.", "That's fair — what would need to be true for it to work?", "Can I put a short note together and we look at it properly next time?"]}, {"file": "wk_05_negotiating.html", "title": "Negotiating", "desc": "Trade instead of caving; land a deal.", "skill": "win-win deals", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Let's find something that works for both of us.", "Before we talk price, can I ask…?", "That's a bit further than I can go — help me understand what's driving the number.", "This is the price that lets me do the job properly.\" … then say nothing.  /  \"I've priced this as fairly as I can.\" … then wait.  /  \"That's where I need to be on this.\" … and let it sit.", "Help me understand what's driving the number.", "Rather than just the price, let's look at what's inside the price.", "If you can do X, then I can move on Y.", "If you can supply the photography and give me two more weeks, then I can bring the price down to your ceiling.\"  /  \"I can lower the price, provided you cover the photos and we push the deadline out a little.", "So, just to confirm what we've agreed, the second language stays in and you supply the photos.", "Pleasure doing business — this is exactly the kind of project I enjoy, and I'm glad we sorted it together."]}, {"file": "wk_09_the_performance_review.html", "title": "The Performance Review", "desc": "Take the criticism; ask for what you want.", "skill": "taking it well", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Before you start — I'd rather have the real version than the kind version.", "Can you give me an example? I want to be picturing the same thing you are.", "Let me sit with that for a second.", "The part I recognise is the last-minute thing. That's real, and it's mine.", "Where I'd push back, gently, is…", "It might be worth knowing that…", "What would 'better' look like by the summer?", "There's something I'd like to put on the table for this year.", "What would I need to show you to be in the frame for that?", "Thank you for being straight with me. I'd rather this than a pat on the back."]}, {"file": "wk_14_taking_credit.html", "title": "Taking the Credit", "desc": "Claim work someone else presented as theirs.", "skill": "claiming your work", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Can I say something slightly awkward? It'll take a minute.", "I'm not making a thing of this. I just don't want to say nothing.", "That was my analysis, Ana. The model, the returns idea — that was mine.", "You said 'we' once and 'I' for the rest of it. I counted, which tells you how it felt.", "I don't think you did it on purpose. I do think you did it.", "'Everyone knows it was a team effort' — they don't, though. That's the point.", "I'd like you to say my name to Priyesh. That's all.", "Next time, I'd rather be in the room than in the footnotes.", "That's it. That's the whole thing. We're fine.", "I'd want you to tell me if I'd done it to you."]}, {"file": "wk_04_the_difficult_conversation.html", "title": "The Difficult Conversation", "desc": "Give a colleague hard feedback, kindly.", "skill": "feedback", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Can we talk about something? I'd rather be straight with you than let it sit.", "…something I'd rather talk about properly than let it become an awkward thing.", "In the last three [meetings / reports / weeks], X happened, and the effect was Y.", "The last few times, your part has come in after the deadline\" / \"I've noticed a pattern I wanted to flag\" / \"It's happened three times now, so I don't think it's a one-off.", "Help me understand what's going on for you.", "I'm not questioning your effort — I'm flagging the impact.", "That's fair — and it's still landing on the rest of us, so I'd like to sort it.", "What would help you get there?", "Let's try it for the next report and check in — no drama either way.", "I'm really glad we talked."]}, {"file": "wk_25_the_joke.html", "title": "The Joke", "desc": "Tell a colleague his joke wasn't funny.", "skill": "naming it lightly", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Rob — have you got a sec? It's a small thing.", "I'm not making a formal thing of this. I'd rather just say it.", "That thing you said about Aisha's accent — it didn't land well.", "It's the kind of thing that's funny once and then isn't.", "I'm not calling you anything. I'm telling you how it sounded.", "I know you didn't mean anything by it.", "I laughed at the time, which is my fault as much as yours.", "Put it this way — would you have said it if she'd been standing there?", "That's all I wanted to say. Genuinely.", "Don't be weird with me now, will you?"]}, {"file": "wk_23_the_truce.html", "title": "The Truce", "desc": "Agree to work with someone you dislike.", "skill": "clearing the air", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Can we have an awkward two minutes and then never mention it again?", "We're not each other's favourite, are we?", "I'm not asking us to be friends.", "We've got six months of this — I'd rather it wasn't horrible.", "I'll be honest, I found the thing in the meeting a bit annoying.", "That's fair. I probably do do that.", "Can we agree to say it to each other rather than about each other?", "What do you need from me to make this work?", "If I'm getting on your nerves, just tell me.", "Right — that's that. Shall we get on with it?"]}, {"file": "wk_19_the_reference.html", "title": "The Reference", "desc": "Tell an ex-colleague you can't recommend her.", "skill": "an honest no", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Can I be honest with you before I say yes?", "I'd rather tell you now than write you something lukewarm.", "I could give you one, but I'm not sure it'd be the one you want.", "I'd have to answer honestly if they asked me about deadlines.", "It's not that you were bad — it's that I couldn't say you were strong.", "What I can say, hand on heart, is that you were brilliant with clients.", "I'm not doing this to be difficult.", "Is there someone who saw more of your good stuff than I did?", "Would a factual one do — dates, role, that kind of thing?", "Ask me again for the next one. I mean that."]}, {"file": "wk_20_promoted_over_a_friend.html", "title": "Promoted Over a Friend", "desc": "Tell a friend you got her job.", "skill": "awkward good news", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I wanted you to hear it from me, not from the email.", "I got it.", "I'm not going to pretend I'm not pleased, because I am.", "I'd be lying if I said I hadn't been dreading this.", "You don't have to be nice about it.", "If you need to be off with me for a bit, be off with me.", "I don't know how to be your mate and your manager yet, if I'm honest.", "I'm not going to start managing you today.", "Tell me what you don't want from me.", "Say what you want. I'd rather have it out than tiptoe round each other for a year."]}, {"file": "wk_11_saying_no_to_your_boss.html", "title": "Saying No to Your Boss", "desc": "Say no to more work, without saying no.", "skill": "declining upward", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Can I look at what I've got on and come back to you in ten?", "I don't want to say yes and then let you down quietly.", "I can do it — but something has to give. Which?", "If I take that on, the Renner thing lands late. Is that alright?", "You'd know better than me what matters most this week.", "I'm not saying no. I'm asking you to pick.", "Realistically I've got about a day and a half spare.", "I could do a rough version by Tuesday or a proper one by Friday.", "I promised Alina Thursday, and I'd rather not be the reason that slips.", "That works. Can we say that out loud so we both remember it?"]}, {"file": "wk_12_the_changing_brief.html", "title": "The Changing Brief", "desc": "Charge for the extra work.", "skill": "holding a line", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Yes — easily. Let me just tell you what it costs.", "I'd rather flag it now than surprise you at the end.", "On its own it's nothing. It's the fifth one, though.", "Can I show you where we've drifted from the original?", "That's about another two days, so it'd be an extra six hundred.", "Or we swap it for something we've already agreed — your call.", "This isn't a complaint. The project's better for half of these.", "I should have said this at tweak two, honestly. That's on me.", "Shall we do it this way from now on — you ask, I price it, you decide?", "Nothing changes today. I just wanted it on the table."]}, {"file": "wk_22_the_unpaid_invoice.html", "title": "The Unpaid Invoice", "desc": "Chase a client who hasn't paid you.", "skill": "chasing money", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I hate this bit, so I'll be quick.", "The invoice from March — where are we with it?", "It's ninety days now, which is a bit beyond a slip.", "Has it got stuck somewhere your end?", "Can you give me a date rather than 'soon'?", "Who actually presses the button on payments?", "I'd rather sort this between us than go through anybody else.", "If cash flow's tight, tell me and we'll do it in two payments.", "I can't start the next piece until this one's settled — that's not a threat, it's just where I am.", "Right — the 30th. I'll put that in an email and we'll say no more about it."]}, {"file": "wk_13_the_mistake.html", "title": "The Mistake", "desc": "Tell your boss you've broken something.", "skill": "owning an error", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I've made a mistake and you need to know about it now, not later.", "It's mine. I did it. Nobody else touched it.", "Here's exactly what's happened, and here's what I don't know yet.", "Ninety-one people, outside the company, forty minutes ago.", "I've started the recall, and I've stopped it going any further.", "I haven't rung the clients — that's your call, and I didn't want to make it worse.", "There's a reason it happened but I'm not going to use it as an excuse.", "Tell me off later. Right now, what do you need from me?", "I'd rather be the one who tells you than the one you find out about.", "It won't happen again, and that's not a promise, it's a change to how I do it."]}, {"file": "wk_16_the_client_who_shouts.html", "title": "The Client Who Shouts", "desc": "Stay calm while a client loses his temper.", "skill": "absorbing anger", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I can hear how angry you are, and I'm not going anywhere.", "Shout at me if it helps, but I'd rather we used the time.", "You're right to be annoyed. I'd be exactly the same.", "Can I stop you for a second — not to argue, just so I've got it right.", "Let me tell you what I know and what I don't.", "I'm not going to defend it. It slipped, and that's on us.", "I'd rather tell you something true than something you want to hear.", "What would actually help you today?", "I can't promise Friday. I can promise you a date by five o'clock.", "I'll ring you at five either way, even if there's nothing to say."]}, {"file": "wk_24_not_coping_at_work.html", "title": "Not Coping at Work", "desc": "Tell your manager you're struggling to cope.", "skill": "admitting it", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["There's something I should have said about a month ago.", "I'm not coping, and I'd rather say it now than fall over in front of a client.", "It's not one thing. It's all of it, and I've run out of road.", "I've been getting by, but I'm getting by on fumes.", "I've stopped sleeping properly, if I'm honest with you.", "I'm not asking to be let off. I'm asking for it to change.", "Two weeks would make an enormous difference.", "I don't need an answer today.", "This isn't me handing my notice in.", "Thanks for not making that harder than it was."]}, {"file": "wk_21_the_colleague_who_cries.html", "title": "The Colleague Who Cries", "desc": "Sit with a colleague who's crying.", "skill": "being there", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Come on — let's go and stand outside for a minute.", "Don't apologise. Honestly.", "Take your time. I'm not in a rush.", "Do you want to talk about it, or do you want a coffee and no questions?", "I'm not going to say anything to anyone.", "Is it work, or is it something else?", "That would floor anybody.", "Do you need to go home? Because you can. I'll say you're with a client.", "Is there anything I can take off you today?", "I'll check in tomorrow. You don't have to be fine."]}, {"file": "wk_06_the_interview.html", "title": "The Interview", "desc": "The pitch, the weakness, and the curveball.", "skill": "interviews", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["In a sentence, I'm someone who…", "…this role looks like the same work on a bigger stage, which is why I applied.", "Rather than just say I'm organised, let me give you an example.", "I'd rather show you than tell you — last quarter I presented our results to the board and turned a nervous room into a yes.\"  /  \"A number might say it better: I cut our reply time to clients from two days to two hours.", "Honestly, my weakness is X — and here's what I'm doing about it.", "a real weakness plus the work you're doing on it.", "Let me walk you through a specific example.", "What I did was, I split the order across two suppliers…", "Can I ask what success looks like in this role after a year?", "Thank you for your time — I've come away more interested in the role, not less, and I'd be glad to take it further.\"  /  \"This has only made me keener; I'd really welcome the next step."]}, {"file": "wk_17_your_younger_boss.html", "title": "Your Younger Boss", "desc": "Start well with a manager half your age.", "skill": "setting the tone", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Congratulations, by the way — genuinely.", "You're the boss, that's fine by me — I just want to know how you like to work.", "How do you want this to work, day to day?", "Do you want me to just get on with it, or check in?", "I've done this a long time, which is useful right up until it isn't.", "Tell me if I'm doing the old-timer thing — I won't take it badly.", "I'd rather you told me straight than went round the houses.", "That's not how we've done it, but I'm happy to try it your way.", "If I disagree with you, would you rather hear it in the meeting or before it?", "I'm not after your job, if that ever crosses your mind."]}, {"file": "wk_10_the_handover.html", "title": "The Handover", "desc": "Hand over four years in forty minutes.", "skill": "letting go of it", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I could talk for three hours, so stop me — what do you actually need?", "There are three things that'll bite you. Everything else is in the folder.", "This is the one that looks fine and isn't.", "If it goes wrong, it'll go wrong here, and it'll be a Thursday.", "The thing that isn't in any document is that it all runs on Ferran.", "Officially it's a two-week process. It isn't.", "I never got to this, and I should have.", "Don't inherit my way of doing it just because it's mine.", "It's yours now — you don't need my permission to change it.", "Ring me for a month. After that, honestly, don't."]}, {"file": "wk_15_resigning.html", "title": "Resigning", "desc": "Resign without being talked out of it.", "skill": "leaving well", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["B", "I've accepted a job somewhere else. I'm resigning.", "…that isn't broken.", "B", "It's not about the money, and I'm not saying that to be polite.", "I'd stopped being any use to you. I could feel it before you could.", "You backed me when I hadn't earned it…", "I'm leaving despite you…", "If you'd offered me that a year ago it would have worked. That's on both of us.", "B"]}, {"file": "wk_18_made_redundant.html", "title": "Made Redundant", "desc": "Take the news that you're being let go.", "skill": "asking while winded", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Sorry — can you say that again? I don't think I took it in.", "Give me a second.", "Is this a decision, or a consultation?", "Just so I'm clear — is it the role that's going, or is it me?", "What's the actual timeline here?", "What am I entitled to?", "Would you put that in writing for me?", "Am I allowed to ask who else?", "Would you give me a reference — a proper one?", "I'm not going to make a scene. I would like the details in writing, though."]}, {"file": "lf_01_the_car_keys.html", "title": "The Car Keys", "desc": "Ask your father to stop driving.", "skill": "taking something away", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Can I talk to you about something, and can you not bite my head off?", "I've been putting this off for weeks, if I'm honest.", "Mum mentioned the wing mirror.", "Nobody's taking anything off you.", "I'm not asking you to give it up tomorrow.", "Could we start with no motorways, and nothing after dark?", "What would you be saying to me, if it was the other way round?", "Would you rather a doctor said it than me?", "Where would that leave you, day to day?", "I'd rather have this row now than the other conversation later."]}, {"file": "lf_02_your_mother_s_advice.html", "title": "Your Mother's Advice", "desc": "Ask your mother to stop giving you advice.", "skill": "a gentle boundary", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Can I say something, and you're probably not going to like it?", "I know you only do it because you care.", "You've done it about four times since I got here, and I've counted, which probably tells you something.", "I wasn't asking, I was just telling you what's going on.", "Could you just listen for a bit, without fixing it?", "When I want your opinion, I promise I'll ask for it.", "Honestly, 'that sounds hard' would do. That's all I'm after.", "It makes me tell you less, and I don't want that.", "I'd rather tell you things than start editing what I say.", "Nothing's changed — I'm not having a go at you."]}, {"file": "lf_03_the_sibling_who_never_comes.html", "title": "The Sibling Who Never Comes", "desc": "Ask your brother to share looking after Mum.", "skill": "asking for fairness", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["I'm not ringing for a row, before you start.", "When did you actually last go round?", "It's every weekend, Dan. Every single one.", "I'm not keeping score — well, I am, a bit, and that's the problem.", "I know you're two hours away, I do know that.", "Could you do one weekend in three? That's all I'm after.", "Even taking the appointments off me would help.", "Tell me what you can actually commit to — not what you'd like to do.", "Don't say yes now just to get me off the phone.", "I'd rather sort this out now than resent you in ten years."]}, {"file": "lf_04_telling_mum.html", "title": "Telling Mum", "desc": "Tell your mother your marriage has ended.", "skill": "delivering bad news", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Sit down a minute — nothing's happened to the kids.", "I've got something to tell you and there's no gentle way into it.", "Sam and I have separated. It's done — it's not a wobble.", "It's been coming for about two years, to be honest.", "I didn't tell you because I knew you'd worry, and here we are.", "I know it's not what you wanted for me.", "I'm alright. Not brilliant, but alright.", "Please don't say anything about him — I'll only end up defending him.", "Could you not ring Auntie Jean about it yet?", "You don't have to say anything clever. Just be normal with me."]}, {"file": "lf_05_the_family_group_chat.html", "title": "The Family Group Chat", "desc": "Ask your uncle to stop scaring your mum.", "skill": "raising it privately", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["I thought I'd ring rather than put this in the chat.", "It's mainly the videos, to be honest.", "Mum takes that stuff seriously — she doesn't know it's nonsense.", "She rang me at eleven at night in a right state about it.", "I know you only send it because you're worried about her.", "Would you send them to me instead, and I'll have a look?", "I'm not asking you to leave the group, God, no.", "Could we keep it to the birthdays and the photos?", "You'd hate it if someone frightened your mum like that.", "I'd rather say it to you than quietly mute you, which is what I nearly did."]}, {"file": "lf_06_the_house.html", "title": "The House", "desc": "Divide your father's house with your sister.", "skill": "money and grief", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Shall we try and do this ourselves, before the solicitors get into it?", "Can we get the money bit out of the way first, and then do the rest?", "You did far more for him than I did. I do know that.", "I'm not going to pretend I don't need the money, because I do.", "Neither of us can afford to buy the other out, can we?", "Could we get it valued by someone neither of us knows?", "What would you want if the money wasn't in it at all?", "Nothing goes to the tip until we've both been through it.", "Shall we write down what we've agreed, just so neither of us misremembers?", "Whatever happens, I'm not falling out with you over a kitchen."]}, {"file": "lf_07_dad_s_new_partner.html", "title": "Dad's New Partner", "desc": "Tell your dad you're struggling with his girlfriend.", "skill": "saying the awkward thing", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Have you got five minutes, before she gets back?", "I'd rather say this badly than not say it at all.", "I like her, actually. That's the honest answer.", "It's just a bit quicker than I was expecting, that's all.", "It's got nothing to do with her, honestly. Nothing.", "I keep half expecting Mum to walk in, and that's mine to deal with, not yours.", "You're allowed to be happy. I do know that.", "Could you just not ask me to call her anything yet?", "Give me a bit of time and I'll get there, I promise.", "I don't want you creeping round your own life because of me."]}, {"file": "lf_08_your_brother_s_debt.html", "title": "Your Brother's Debt", "desc": "Tell your brother you won't lend him money.", "skill": "a hard no", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Before you ask — I think I know roughly what this is about.", "Go on then. How much this time?", "I'm going to say no, and I'd like to tell you why.", "I'd rather lend you nothing than lend you something and end up hating you.", "There was the van, there was the deposit, there was last March.", "It's less the money now, it's that I never get a date out of you.", "I'll help you with anything except this.", "I'll sit down and go through the numbers with you, tonight if you want.", "Don't go to Mum. Please don't go to Mum.", "It's a no now and it'll still be a no on Thursday."]}, {"file": "lf_09_christmas_at_ours.html", "title": "Christmas at Ours", "desc": "Tell your mother-in-law you're not coming for Christmas.", "skill": "breaking a tradition", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["I wanted to ring you before it all gets booked and settled.", "We're going to do Christmas at ours this year.", "I know it's a change. It's the first time, isn't it.", "I know how it'll look, me ringing and not Ian.", "It's nothing anybody's done. Nothing at all.", "The kids were in the car for five hours last year.", "We'd love you to come to us — genuinely, not just saying it.", "Would Boxing Day work instead? We'd come to you for the whole day.", "We're not starting a rota, I promise you that.", "Say what you actually think — I'd far rather hear it now than in January."]}, {"file": "lf_10_your_father_s_silence.html", "title": "Your Father's Silence", "desc": "Get your father to talk about his past.", "skill": "opening someone up", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Can I ask you something you'll probably not answer?", "You never talk about that time at all, do you.", "I'm not after anything deep. I'd just like to know, that's all.", "Go on, humour me.", "You don't have to tell me the whole thing.", "What was she like, before we came along?", "Were you frightened? I would've been.", "Take your time. I'm not going anywhere.", "That's more than you've ever said about it, you know.", "Can we do this again? Same chair, same terrible tea."]}, {"file": "lf_11_the_first_date.html", "title": "The First Date", "desc": "Get through a first date and be honest.", "skill": "reading a stranger", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Sorry, I'm a bit early — I always do this.", "Right, shall we get a drink in before we do the whole interview bit?", "How was the journey over — did you have far to come?", "Oh, whereabouts is that?", "I'll be honest, I've not done a lot of this.", "See, that's exactly what I'd have said.", "Sorry, I'm talking far too much — your turn.", "I'd have to think about that one, actually.", "Look, I've really enjoyed this — I'd like to do it again, if you would.", "I've had a lovely evening, honestly — I'm just not sure it's a romantic thing for me."]}, {"file": "lf_12_what_are_we.html", "title": "What Are We?", "desc": "Ask someone where you stand after four months.", "skill": "asking for clarity", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Can I ask you something slightly awkward?", "We've been doing this — what, four months now?", "I'm not trying to pin you down, I just want to know where I am.", "I'd rather have an awkward five minutes than wonder for another month.", "What would you call this, if someone asked you?", "Are you seeing other people? It's fine either way, I'd just rather know.", "I'm not seeing anyone else, and I've not wanted to.", "I don't need a label today, but I'd like to know one's coming.", "You don't have to answer right now — but don't leave it too long, yeah?", "Right. Good. That's all I needed — pudding?"]}, {"file": "lf_13_saying_it_first.html", "title": "Saying It First", "desc": "Say I love you before they do.", "skill": "risking it", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["I'm going to say something and you don't have to do anything with it.", "I've been sitting on it for weeks, if I'm honest.", "I love you. There — it's out.", "I'm not saying it to get it back.", "Don't say it because I've said it. Honestly, I'd hate that.", "Take as long as you want with it.", "Is it too soon? You can say if it is.", "I'd rather have said it and been wrong about the timing.", "So — are we alright?", "Right, we're never speaking of this again. Put the kettle on."]}, {"file": "lf_14_meeting_his_mum.html", "title": "Meeting His Mum", "desc": "Survive Sunday lunch with your partner's mother.", "skill": "polite deflection", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Thank you so much for having me — I've heard a lot about this kitchen.", "Can I give you a hand with anything?", "That's very kind, but I'm honestly fine with the one.", "He's told me that story about six times, so I'm well briefed.", "It's early days, but it's going well.", "I wouldn't like to say, honestly — ask me in a year.", "I'll let him answer that one.", "This is genuinely lovely — is it your recipe?", "I'd better let you get on.", "Thank you, really — you've made it very easy."]}, {"file": "lf_15_a_row_about_nothing.html", "title": "A Row About Nothing", "desc": "Stop a row about the bin getting worse.", "skill": "repairing mid-row", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["Hang on — are we actually arguing about the bin?", "Can we start that again? I came in like a bear.", "That came out worse than I meant it.", "Alright — that's fair. That one's on me.", "I don't think this is about the bin, is it.", "You're doing the thing where you go quiet.", "I'm not having a go. I promise I'm not.", "Say what you actually mean, and I won't get cross.", "Can we not do this at half eleven at night?", "Right. Truce. Come here."]}, {"file": "lf_16_moving_in.html", "
