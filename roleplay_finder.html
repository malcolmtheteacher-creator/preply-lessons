e we talking, roughly?", "Is that something that needs doing now, or could it wait a bit?", "Am I going to feel anything?", "I'd rather have it done today than sit and worry about it for a fortnight."]}, {"file": "lf_23_the_receptionist.html", "title": "The Receptionist", "desc": "Get an appointment when there aren't any left.", "skill": "polite persistence", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["I know you're rushed off your feet, but I could really do with being seen.", "Is there anything at all, even later in the week?", "What are my options here?", "I don't want to make a fuss, but it's got noticeably worse since Friday.", "I'm happy to see anyone — it doesn't have to be my usual doctor.", "Is that something the nurse could do instead?", "I'd take a cancellation if one came up — I'm five minutes away.", "Would it help if I rang back at eight tomorrow?", "Is there a waiting list I could put my name on?", "You've been really good about this — thanks for trying. I know it's not you making the diary."]}, {"file": "lf_39_the_subscription_trap.html", "title": "The Subscription Trap", "desc": "Cancel a subscription that won't let you go.", "skill": "refusing the offer", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["I'd like to cancel, please — and I'm not looking to be talked out of it.", "I've tried doing it online and it just sends me round in circles.", "I know you have to offer me things, so go on — but the answer's going to be no.", "It's not the price, honestly. I'm just not using it.", "Three months free doesn't really help — I'd still be cancelling in three months.", "Can we just get on with cancelling it?", "What's the actual notice period — am I paying for another month?", "So am I right in thinking nothing comes out after the fourteenth?", "Could you send me confirmation by email? I'd rather have it in writing. And can I take a reference number for this, just in case?", "Thanks Dale — I know that's your job, the offers. You were alright about it."]}, {"file": "lf_55_the_car_park_scrape.html", "title": "The Car Park Scrape", "desc": "Own up to scraping a stranger's car.", "skill": "owning up to a stranger", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["That'll be me, I'm afraid.", "I did think about leaving a note, but I'd rather tell you myself.", "It was completely my fault — I misjudged the gap.", "It's only a scuff, but it's a scuff I've put there.", "Shall we do it through the insurance, or would you rather I just paid for it?", "Get a couple of quotes and send them to me.", "Here's my number and my registration — take a photo of my licence too, if you want.", "I'd rather sort it now than have you chasing me for a month.", "Have a proper look before we leave it — is there anything else?", "I'm really sorry. I know it's the last thing you needed today."]}, {"file": "lf_63_at_the_wake.html", "title": "At the Wake", "desc": "Speak to a widow you barely know.", "skill": "condolences in person", "series": "Life in English", "emoji": "🌍", "level": "B2/C1", "phrases": ["I'm so sorry. I don't really know what else to say.", "You won't remember me — I worked with David years ago.", "I only knew him at work, but he was very good to me when I started.", "He talked about you constantly, you know.", "Take your time, honestly, there's no rush.", "I won't ask how you are — it's a daft question today.", "Is there anything at all you need doing today?", "I don't want to keep you, there's a queue behind me.", "Would it be alright if I rang you in a few weeks, when everyone's gone home?", "It was a lovely service. He'd have hated the fuss."]}];
const SERIES = [...new Set(DATA.map(d => d.series))];
const LEVELS = [...new Set(DATA.map(d => d.level))].sort();
let fSeries = null, fLevel = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words = s => (s.toLowerCase().match(/[a-z0-9']+/g) || []);
// A query word matches any word that STARTS with it, so "say" finds "saying"
// and "apolog" finds "apologise". All query words must match somewhere.
const matches = (text, toks) => { const w = words(text); return toks.every(t => w.some(x => x.startsWith(t))); };
const hl = (s, toks) => {
  let out = esc(s);
  if (!toks.length) return out;
  const pat = toks.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  return out.replace(new RegExp('\\b(' + pat + ')[a-z\']*', 'gi'), '<mark>$&</mark>');
};

function chips() {
  const box = document.getElementById('filters');
  box.innerHTML = '';
  const add = (label, on, fn) => {
    const b = document.createElement('button');
    b.className = 'chip' + (on ? ' on' : '');
    b.textContent = label;
    b.onclick = fn;
    box.appendChild(b);
  };
  add('All series', !fSeries, () => { fSeries = null; render(); });
  SERIES.forEach(s => add(s, fSeries === s, () => { fSeries = fSeries === s ? null : s; render(); }));
  LEVELS.forEach(l => add(l, fLevel === l, () => { fLevel = fLevel === l ? null : l; render(); }));
}

function render() {
  const q = document.getElementById('q').value.trim();
  const toks = words(q);
  const out = document.getElementById('results');
  chips();
  let shown = 0;
  out.innerHTML = '';

  DATA.filter(d => (!fSeries || d.series === fSeries) && (!fLevel || d.level === fLevel))
      .map(d => {
        if (!toks.length) return { d, hits: [], score: 0 };
        const inTitle = matches(d.title, toks);
        const inAbout = matches(d.title + ' ' + d.desc + ' ' + d.skill, toks);
                const hits = d.phrases.filter(p => matches(p, toks));
        if (!inAbout && !hits.length) return null;
        return { d, hits, score: (inTitle ? 1000 : 0) + (inAbout ? 100 : 0) + hits.length * 10 };
      })
      .filter(Boolean)
      .sort((a, b) => b.score - a.score)
      .forEach(({ d, hits }) => {
        shown++;
        const el = document.createElement('div');
        el.className = 'lesson';
        el.innerHTML =
          '<div class="lhead"><a href="' + d.file + '">' + d.emoji + ' ' + hl(d.title, toks) + '</a>' +
          '<span class="tag">' + esc(d.skill || d.series) + '</span>' +
          '<span class="tag lvl">' + esc(d.level) + '</span></div>' +
          '<div class="ld">' + hl(d.desc, toks) + '</div>' +
          (hits.length ? '<div class="hits">' + hits.map(p => '<div class="hit">' + hl(p, toks) + '</div>').join('') + '</div>' : '');
        out.appendChild(el);
      });

  document.getElementById('count').textContent =
    shown + (shown === 1 ? ' role play' : ' role plays') + (toks.length ? ' matching “' + q + '”' : '');
  if (!shown) out.innerHTML = '<div class="none">Nothing matches that yet.<br>Try a plainer word — <em>sorry</em>, <em>no</em>, <em>money</em>, <em>late</em>.</div>';
}

document.getElementById('q').addEventListener('input', render);
render();
</script>
