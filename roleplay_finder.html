", "title": "At the Bank", "desc": "Open an account; sort a problem.", "skill": "echoes the Medici", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I wonder if you could help me with something.", "I'm hoping you can shed some light on it.", "There seems to be a charge I don't recognise.", "My card's been blocked, and I've not been given any explanation.", "I noticed I've been charged twice for the same transaction.", "I appreciate these things happen, but I'd still like to get to the bottom of it.", "I'd like to get this resolved today, if at all possible.", "With respect, I've already explained this twice.", "Is there someone I could speak to who'd be able to authorise that?", "Could I get a reference number for this — and the key points in writing, just for my records?"]}, {"file": "rp_07_at_the_bank_a2b1.html", "title": "At the Bank", "desc": "Open an account; sort a problem.", "skill": "echoes the Medici", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Hello. Can you help me, please?", "Can I ask you something?", "There is a problem with my card.", "My card doesn't work.", "Can you tell me why?", "Can I have a new card, please?", "How long does it take?", "Thank you so much! You are very kind."]}, {"file": "rp_31_at_the_post_office.html", "title": "At the Post Office", "desc": "Send a parcel; rescue a missed delivery.", "skill": "counters & forms", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I'd like to send this to Canada, whatever's cheapest, really.", "How long would that take to get there, roughly?", "What would tracked cost me on top?", "What am I supposed to put where it says 'detailed description of contents'?", "Nothing valuable — just clothes and a couple of books.", "I had a card through the door saying you'd tried to deliver.", "Could it still be out with the driver?", "If I miss it again, what happens then?", "Could you redeliver it Thursday instead? I'm home all day Thursday.", "That's saved me a trip — thanks ever so much."]}, {"file": "rp_34_at_the_town_hall.html", "title": "At the Town Hall", "desc": "Register in a new town; find the fallback.", "skill": "bureaucracy", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I was told I need to register here — is this the right desk?", "This is all quite new to me — what happens first?", "Which documents do you actually need from me?", "I've got everything except the landlord confirmation — is that a problem today?", "Could I bring that one in later, or do I have to start again?", "Just so I've understood: you open the file now, I get the signature, then come straight back to you?", "Could you jot that down for me — names and room numbers?", "Who should I ask for when I come back?", "Is there anything else that'll trip me up next time?", "You've made this much less painful than I expected — thank you."]}, {"file": "rp_09_making_a_complaint.html", "title": "Making a Complaint", "desc": "Complain politely but firmly.", "skill": "echoes the Boston Tea Party", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I'm afraid I've got a bit of a problem with something I bought here.", "I'm sure this is nothing you've done personally, but…", "This isn't quite what I was led to expect.", "It's faulty.", "I'd hate to have to take this further, but…", "I'm sure you can appreciate how frustrating this is.", "What I'd really like is a full refund — or a replacement, if that's simpler.", "Is this something you'd be able to sort out for me today?", "Could we meet halfway on this?", "That's genuinely kind of you — you've turned a rotten morning right around."]}, {"file": "rp_09_making_a_complaint_a2b1.html", "title": "Making a Complaint", "desc": "Complain politely but firmly.", "skill": "echoes the Boston Tea Party", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Excuse me, I have a problem with this coffee machine.", "I know it is not your fault, but…", "It doesn't work.", "Here is my receipt.", "I would like a new one, please.", "Can I have my money back, please?", "Is it possible to have that one instead?", "Thank you very much! That is very kind."]}, {"file": "rp_16_reporting_something_lost.html", "title": "Reporting Something Lost", "desc": "Describe it; stay hopeful.", "skill": "echoes the Mary Celeste", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I think I may have left my rucksack on the train.", "I don't suppose anyone's handed in a green rucksack…?", "Oh, about the size of a large shoebox, I suppose.", "There's a mountain patch on the front, you really can't miss it.", "It's of no real value to anyone but me — more sentimental than anything.", "I couldn't say for certain, but the last time I definitely had it was boarding at Edinburgh.", "Take your time — no rush at all.", "Would you mind taking my number, so you can let me know the moment anything surfaces?", "I'll keep my fingers crossed.", "I'll pop back tomorrow to check, if that's alright — thank you ever so much for looking."]}, {"file": "rp_16_reporting_something_lost_a2b1.html", "title": "Reporting Something Lost", "desc": "Describe it; stay hopeful.", "skill": "echoes the Mary Celeste", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["I think I left my bag on the train.", "Excuse me, did someone bring in a green bag?", "It is a green bag, and there is a picture of a mountain on it.", "It is about the size of a big box.", "The camera is important to me. It has my photos.", "I'm not sure, but I think I had it on the train.", "Take your time, no problem.", "Can you call me if you find it? Thank you so much for looking."]}, {"file": "rp_27_car_trouble.html", "title": "Car Trouble", "desc": "Explain the fault; question the quote.", "skill": "echoes the Wright Brothers", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I don't suppose you could take a look at it today, could you?", "It's been playing up for the last few days.", "There's a grinding sort of noise when I brake.", "It only does it when the engine's cold.", "Roughly how much am I looking at?", "Any idea how long it'll be off the road?", "That's a fair bit steeper than I was expecting, to be honest.", "Is there any way of bringing that down at all?", "Do I actually need that doing now, or could it wait?", "You've been really straight with me — I appreciate it."]}, {"file": "rp_27_car_trouble_a2b1.html", "title": "Car Trouble", "desc": "Explain the fault; question the quote.", "skill": "echoes the Wright Brothers", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Can you look at my car today?", "There is a problem with my car.", "There is a noise when I brake.", "The engine light is on.", "How much is it?", "Is there a cheaper way?", "That is very kind. Thank you.", "Thank you very much! Here are the keys."]}, {"file": "rp_04_checking_into_a_hotel.html", "title": "Checking into a Hotel", "desc": "Check in — and fix a room problem.", "skill": "echoes the Titanic", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I've got a reservation under the name of Okafor, checking in for three nights.", "And while you've got my details up…", "I don't suppose there's any chance of a higher floor, is there?", "…if it's not too much trouble.", "Would it be at all possible to have a late checkout?", "There seems to be a bit of a problem with the room.", "The heating doesn't seem to be working.", "Sorry to trouble you again, but I'm afraid there's a problem with the room.", "I don't mean to be difficult, but…", "You've handled it so graciously — I've half a mind to book a fourth night."]}, {"file": "rp_04_checking_into_a_hotel_a2b1.html", "title": "Checking into a Hotel", "desc": "Check in — and fix a room problem.", "skill": "echoes the Titanic", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["I have a booking. My name is Okafor.", "Can I ask for something, please?", "I would like a room on a higher floor, please.", "Is a late checkout possible?", "Excuse me, there is a problem with my room.", "The heating doesn't work.", "That's very kind. Thank you.", "Thank you so much!\" / \"Thank you very much!"]}, {"file": "rp_20_at_the_library.html", "title": "At the Library", "desc": "Join, find a book, sort a fine.", "skill": "echoes the Library of Alexandria", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I was hoping to sign up for a card, if now's a good moment?", "…if you wouldn't mind.", "I'm trying to track down a book — I wonder if you could point me in the right direction?", "Is there any chance I could put a hold on it?", "There must be some sort of mix-up…", "You know what — that's entirely my fault, I'm afraid.", "I don't suppose there's any way you could waive it, just this once?", "Am I right in thinking you've got a quiet study room upstairs?", "Would it be possible to renew these for another couple of weeks?", "You've been incredibly helpful — I really appreciate you sorting all that out."]}, {"file": "rp_20_at_the_library_a2b1.html", "title": "At the Library", "desc": "Join, find a book, sort a fine.", "skill": "echoes the Library of Alexandria", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["I would like to join the library, please.", "Here is my ID, and a letter with my address on it.", "Can you help me find a book, please?", "Can I reserve it, please?", "Sorry, I don't remember this fine. Can you check, please?", "Oh yes — that's my mistake. Sorry!", "Can I pay it now, please?", "Thank you so much for your help!"]}, {"file": "rp_15_renting_a_flat.html", "title": "Renting a Flat", "desc": "View, question, and negotiate.", "skill": "echoes the Great Fire of London", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I'll be honest, I've got a couple of other viewings lined up today — but this one caught my eye.", "Thanks for fitting me in at such short notice.", "Could you give me a rough idea of what the bills come to on top of the rent?", "What's the notice period if I ever need to leave?", "I did notice a bit of damp by the window — is that something that's been looked at, or…?", "I love the flat, but it's a touch more than I was hoping to pay.", "Is there any movement on the rent at all?", "If I were to sign for two years rather than one, is that something you could reflect in the monthly rent?", "Could you meet me halfway?", "I'm really keen — could I take your number and come back to you first thing tomorrow, once I've slept on it?"]}, {"file": "rp_15_renting_a_flat_a2b1.html", "title": "Renting a Flat", "desc": "View, question, and negotiate.", "skill": "echoes the Great Fire of London", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Can I look around, please?", "It's nice! I like it.", "How much are the bills?", "Is the internet included?", "There is a problem with the window.", "Can you fix it before I move in?", "I like the flat, but the rent is a little high for me.", "Can the rent be a little lower?"]}, {"file": "rp_13_talking_about_the_weather.html", "title": "Talking About the Weather", "desc": "Small talk that opens doors.", "skill": "echoes Krakatoa", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Doesn't look like it's going to hold, does it?", "Typical, isn't it?", "Mind you, we can't really complain after the summer we've had.", "You've just moved into number 3, haven't you?", "Oh, whereabouts?", "It must be a lot of work.", "Funnily enough, I've been meaning to do the same.", "Small world, isn't it?", "You'll have to pop round for a cup of tea sometime.", "Anyway — I'd better let you get on. Lovely to finally put a name to a face."]}, {"file": "rp_13_talking_about_the_weather_a2b1.html", "title": "Talking About the Weather", "desc": "Small talk that opens doors.", "skill": "echoes Krakatoa", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["It's cold today, isn't it?", "Typical! I forgot my coat.", "Do you live here too?", "I'm new here.", "It must be a lot of work.", "Me too!", "Come and see the garden sometime.", "It was nice to meet you! See you soon!"]}, {"file": "rp_22_talking_about_sport.html", "title": "Talking About Sport", "desc": "Share opinions; agree and disagree.", "skill": "echoes the World Cup", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["…, if you ask me.", "…, no question.", "I couldn't agree more.", "You took the words right out of my mouth.", "I'm not so sure about that.", "You've got a point there, but…", "I see where you're coming from, but…", "Each to their own.", "To be fair, they thoroughly deserved it.", "I still can't believe that went in!"]}, {"file": "rp_22_talking_about_sport_a2b1.html", "title": "Talking About Sport", "desc": "Share opinions; agree and disagree.", "skill": "echoes the World Cup", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["I think it was a great game.", "For me, the best player is number ten.", "Yes, I agree with you.", "You're so right!", "Hmm, I'm not sure.", "Really? I don't think so. I like the other team.", "Maybe you're right.", "That's OK! It's only a game."]}, {"file": "rp_26_a_wedding_invitation.html", "title": "A Wedding Invitation", "desc": "Accept, congratulate, or decline.", "skill": "echoes Queen Victoria", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Stop it — that's the best news I've heard all year! I'm absolutely thrilled for you both.", "I couldn't be happier for the two of you.", "I wouldn't miss it for the world.", "Consider me there — front row, tissues at the ready.", "Would it be alright if I brought someone?", "Is there a dress code I should know about?", "Is there anything in particular you're hoping for, gift-wise?", "I'm so sorry — I don't think we're going to be able to make it, much as we'd love to.", "As luck would have it, we're already away that weekend.", "We'll be raising a glass to you from afar — and we want every single photo."]}, {"file": "rp_26_a_wedding_invitation_a2b1.html", "title": "A Wedding Invitation", "desc": "Accept, congratulate, or decline.", "skill": "echoes Queen Victoria", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Congratulations! I am so happy for you!", "That is wonderful news!", "Yes! I would love to come.", "I will be there.", "Can I bring my partner?", "What should I wear?", "I am so sorry, but I can't come. I am busy that day.", "I will be thinking of you! Send me lots of photos!"]}, {"file": "rp_24_a_noisy_neighbour.html", "title": "A Noisy Neighbour", "desc": "Raise it without starting a war.", "skill": "echoes Emperor Nero", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Sorry to land on your doorstep out of the blue — I'm from number 12, just next door.", "I don't want to make a big thing of it, but…", "The music carries straight through the wall, more than you'd think.", "It's not really the daytime, it's more the late nights.", "I'm sure you've no idea how much it travels.", "The trouble is, we're both up at six, so it really knocks us out the next day.", "I'm not asking you to sit in silence, but could we…?", "Could we maybe find some middle ground?", "If we're ever the noisy ones, just bang on the wall.", "No harm done — I'd far rather have a quick word than let it fester. Thanks for being so decent about it."]}, {"file": "rp_24_a_noisy_neighbour_a2b1.html", "title": "A Noisy Neighbour", "desc": "Raise it without starting a war.", "skill": "echoes Emperor Nero", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Hi, I'm your neighbour. I live next door.", "Sorry to knock so late.", "I can hear the music through the wall.", "The wall is very thin, so I can hear everything.", "I get up early, so at night I need to sleep.", "Can you turn it down a little?", "If we are ever too loud, please tell us.", "Thank you, that's very kind. Good night!"]}, {"file": "rp_29_a_leaving_party.html", "title": "A Leaving Party", "desc": "Toasts, thanks, and goodbyes.", "skill": "echoes Shackleton", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Sorry to interrupt — could I grab you all just for a moment?", "I won't keep you long…", "Honestly, I don't know what we're going to do without you.", "I'll never forget…", "It just won't be the same around here without you.", "Our loss is their gain.", "Don't be a stranger.", "Let's actually keep in touch — and I mean properly, not just the thing people say.", "…not leave it too long.", "So if you'd all raise your glasses… to Sam!"]}, {"file": "rp_29_a_leaving_party_a2b1.html", "title": "A Leaving Party", "desc": "Toasts, thanks, and goodbyes.", "skill": "echoes Shackleton", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["We will miss you.", "Take care of yourself!", "Thank you for everything.", "It was great to work with you.", "Good luck in your new job!", "I hope you are very happy there.", "Keep in touch!", "Please raise your glass. To Sam!"]}, {"file": "rp_11_a_job_interview.html", "title": "A Job Interview", "desc": "Sell yourself; own a weakness.", "skill": "echoes the Manhattan Project", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["Thanks so much for making the time today — it's lovely to be here.", "By way of background…", "Colleagues tend to say I'm the person they want in the room on a bad day.", "I'd rather show you than just tell you.", "If I had to pick one, it's…", "If I'm honest…", "I used to struggle with delegating, but I've since learned to…", "I'd be curious to know…", "What would a successful first six months look like in this role?", "I've enjoyed this enormously — I'd genuinely welcome the chance to be part of it."]}, {"file": "rp_11_a_job_interview_a2b1.html", "title": "A Job Interview", "desc": "Sell yourself; own a weakness.", "skill": "echoes the Manhattan Project", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Hello. Nice to meet you. Thank you for your time.", "My name is Sara, and I am a teacher.", "I work in a hospital.", "I like working with people.", "I am good at helping people.", "I am friendly. For example, I help new people at work.", "Can I ask a question?", "Thank you very much for your time. I hope to hear from you."]}, {"file": "rp_30_first_day_at_work.html", "title": "First Day at Work", "desc": "Introduce yourself; ask for help.", "skill": "echoes the Terracotta Army", "series": "Everyday Echoes", "emoji": "🎭", "level": "B2/C1", "phrases": ["I don't think we've met. I'm Sam, I've just joined the team.", "I'm still finding my feet.", "I don't suppose you could point me in the right direction?", "Could you talk me through how it works?", "I've had a good look, but I can't for the life of me find the stationery — any idea where it lives?", "So far so good — everyone's been really welcoming, to be honest.", "How long have you been here, then?", "Is there anything I can take off your plate?", "That would be a real lifesaver, if you're sure you don't mind.", "I'll let you get on — thanks so much for taking me under your wing today."]}, {"file": "rp_30_first_day_at_work_a2b1.html", "title": "First Day at Work", "desc": "Introduce yourself; ask for help.", "skill": "echoes the Terracotta Army", "series": "Everyday Echoes", "emoji": "🎭", "level": "A2/B1", "phrases": ["Hi, I'm Sam. I'm new here — today is my first day.", "Nice to meet you.", "Can you show me how it works?", "Where is the kitchen?", "It's good, thank you. Everyone is very friendly.", "How long have you worked here?", "Can I help you with anything?", "Thank you very much for your help today."]}, {"file": "ml_01_the_group_chat.html", "title": "The Group Chat", "desc": "Bow out of a trip you can't afford.", "skill": "saying no, warmly", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Can I be totally honest with you for a sec?", "…before this snowballs any further.", "I'm going to have to sit this one out.", "The truth is, it's a bit out of my budget right now.", "Please don't let me hold anyone back — I'd hate for this to become a thing.", "That is so kind — but please don't.", "Here's what I can absolutely do…", "Let me take you out the weekend you're back — my treat.", "Keep me in the loop for everything else, though.", "I'm genuinely made up for you — go and have the best time."]}, {"file": "ml_02_the_screen_time_talk.html", "title": "The Screen-Time Talk", "desc": "Ask someone you love to put the phone down.", "skill": "a gentle boundary", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Can I raise something — and it's honestly not a criticism?", "It's a small thing, but it's been on my mind.", "I'm as bad as you are, so this isn't me on a high horse.", "I end up feeling a bit invisible.", "It's less about the phones and more that I miss you.", "Can I ask what would work for you?", "If it's just me telling you off it'll last four days.", "Shall we give it a week and see how it feels?", "If I do it, say something — I'd rather that than you sitting there noticing.", "About four months. I know — I should have just said."]}, {"file": "ml_05_a_photo_of_you.html", "title": "A Photo of You", "desc": "Ask a friend to take a post down.", "skill": "an online boundary", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Tiny favour — genuinely no big deal.", "Would you mind taking that one down?", "It's nothing you did — I just keep my face off there.", "Please don't feel daft — how would you have known?", "I've never made a thing of it.", "Just the whole thing down, if that's alright.", "Whenever you get a sec, honestly, there's no rush at all.", "I'll have a look and tell you if there is — that'd be easier than you going back through five years.", "We're totally fine — thank you for getting it.", "Send it to me though, would you? I'd love to actually have it. Just for me."]}, {"file": "ml_26_the_holiday_rental.html", "title": "The Holiday Rental", "desc": "Ring the host; get it put right.", "skill": "promise vs reality", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["We've just got in, and I'm afraid it's not quite what we booked.", "The listing says two bedrooms. What we've actually got is one bedroom and a broken unit.", "Let me send you photos so we're talking about the same thing.", "I'm not trying to make trouble — I just want it put right.", "What can you do for us tonight?", "That would work — if you can guarantee them by ten.", "If it can't be fixed, we'll need to talk about money off.", "I'd rather sort this between us than through the platform.", "So we've agreed: two AC units by ten, and twenty percent through the app tonight.", "Thanks for taking it seriously — it's a lovely place apart from this."]}, {"file": "ml_27_the_better_deal.html", "title": "The Better Deal", "desc": "Ring your provider; pay less.", "skill": "the walk-away", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["I've been with you eight years, and my bill's just gone up again.", "I'm not ringing to complain — I'm ringing to see what you can do.", "Vodafone are offering the same thing for twenty-eight — I've got it in front of me.", "That's better — but it's still more than I'd pay next door.", "I don't need the extras — I'd rather lose them and pay less.", "If that's really the best you can do, then I'd like to cancel.", "Is that the price for good, or does it jump again after a year?", "Could you read that back to me — price, contract, end date?", "And can I get that confirmed by email before we hang up?", "You've made that easy — I appreciate it."]}, {"file": "ml_28_selling_your_sofa.html", "title": "Selling Your Sofa", "desc": "Hold your price against the lowball.", "skill": "the seller's side", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["It's exactly as it was in the photos — have a good look.", "I'll be straight with you: it's got that worn patch, and that's the worst of it.", "I've priced it to sell — that's already the discount.", "I've had a fair bit of interest, so I won't hold it long.", "Fifty is a no — but I could meet you at sixty-five.", "At that price I'd rather keep it, honestly.", "If you take it today, I'll throw in the cushions and the cover.", "Cash on collection, and it's yours.", "No hard feelings if it's not for you — it's a lot to lug home.", "Good decision — it's a great sofa. Mind the doorframe on the way out."]}, {"file": "ml_04_back_in_touch.html", "title": "Back in Touch", "desc": "Reconnect, and turn it into a real plan.", "skill": "repair & warmth", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Please tell me I haven't left it so long that you've deleted my number.", "I know I'm ringing a bit out of the blue.", "That's on me as much as anyone.", "Nothing happened — it just closed over.", "You've genuinely been on my mind.", "Nothing awful, no. Everyone's fine. It's genuinely just this.", "Let's not do the 'we must catch up' thing and then not — are you free on the 20th?", "Put it in now. I mean it this time — properly.", "I'll come to you, it's easier.", "It's so good to have you back — I've missed this more than I realised."]}, {"file": "ml_03_the_honest_review.html", "title": "The Honest Review", "desc": "Tell a small-business owner the truth, kindly.", "skill": "kind criticism", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["Do you want the polite version or the honest one?", "I'd rather tell you to your face than leave you guessing.", "Most of it was lovely — one thing let it down.", "The main course came out cold. Not lukewarm — properly cold in the middle.", "I'm not telling you what went wrong in there — I just thought you'd want to know it happened.", "Because you were slammed and I didn't want to be that person. Which is probably my fault more than yours.", "Just the one. Everything else was exactly why we come here.", "I want this place to do brilliantly — that's the whole point.", "We've been coming for two years and we'll keep coming.", "Noted. Next time I will."]}, {"file": "ml_06_the_collab.html", "title": "The Collab", "desc": "Review something together; disagree honestly.", "skill": "the language of reviewing", "series": "Modern Life", "emoji": "💡", "level": "B2/C1", "phrases": ["What did you actually make of it?", "It's a bit overrated, if I'm honest.", "Good. That's better than us both nodding for twenty minutes. Go on — what didn't work for you?", "See, that's where we differ — I think the slow start is the point.", "I went in with high hopes, I'll be honest.", "For me it's a masterpiece, flaws and all.", "That's fair, actually. I'll give you that. But it doesn't make the point wrong.", "Yeah, I'm totally with you on that, actually.", "So where does that leave us? Because if you're both saying it's ambitious and flawed…", "Don't let me off the pacing thing — push me on it."]}, {"file": "wk_01_speaking_up_in_the_meeting.html", "title": "Speaking Up in the Meeting", "desc": "Get a word in; never freeze.", "skill": "meeting fluency", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Sorry, can I just come in here?", "If I could just finish that thought…", "That's a good question — let me think for a moment.", "How shall I put this…", "I don't know the exact word, but it's the thing that…\"  /  \"You know when…\"  /  \"What I'm trying to say is…", "From where I sit, the bigger risk is waiting.", "I take your point, but I see it slightly differently.", "When you say 'premature', what exactly do you mean?", "Can I come back to you on that?", "So, if I've got this right, the proposal is now a soft launch."]}, {"file": "wk_03_the_presentation.html", "title": "The Presentation", "desc": "Survive the questions after your talk.", "skill": "presenting & Q&A", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I'll keep this brief — three things, then I'll take questions.", "So — I'm happy to open it up. What have you got?", "Good question — just so I answer the right thing, do you mean…?", "Let me take that in order.\" / \"Give me a second to do that justice.\" / \"That's worth a proper answer — one moment.", "I hear you, and it's a fair challenge — the way I'd look at it is…", "You're right that we can't run the team hot forever — and that's exactly why…", "I don't have that figure to hand — let me follow up with you after.", "I'd rather not guess at a number in a room like this.\" / \"I'd rather give you something accurate than something quick.\" / \"A wrong figure helps nobody — let me get you the real one.", "If there's nothing else, let me leave you with one thought.", "The headline isn't the number — it's that we now know how to…"]}, {"file": "wk_02_working_the_room.html", "title": "Working the Room", "desc": "Turn a coffee break into real contacts.", "skill": "networking", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Mind if I join you?", "How are you finding it so far?", "I'm Sofia, by the way.", "I help [who] [do what].\" → e.g. \"I help mid-size companies move their products across borders without losing their money.", "Oh, interesting — how did you get into that?", "That's funny you say that, because…", "Shall we swap details?", "I'll drop you a line next week.", "I don't want to monopolise you…", "This has been the best conversation of the morning — talk soon."]}, {"file": "wk_05_negotiating.html", "title": "Negotiating", "desc": "Trade instead of caving; land a deal.", "skill": "win-win deals", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Let's find something that works for both of us.", "Before we talk price, can I ask…?", "That's a bit further than I can go — help me understand what's driving the number.", "This is the price that lets me do the job properly.\" … then say nothing.  /  \"I've priced this as fairly as I can.\" … then wait.  /  \"That's where I need to be on this.\" … and let it sit.", "What would need to change for that to work for you?", "Rather than just the price, let's look at what's inside the price.", "If you can do X, then I can move on Y.", "If you can supply the photography and give me two more weeks, then I can bring the price down to your ceiling.\"  /  \"I can lower the price, provided you cover the photos and we push the deadline out a little.", "So, just to confirm what we've agreed, the second language stays in and you supply the photos.", "Pleasure doing business — this is exactly the kind of project I enjoy, and I'm glad we sorted it together."]}, {"file": "wk_09_the_performance_review.html", "title": "The Performance Review", "desc": "Take the criticism; ask for what you want.", "skill": "taking it well", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I'd rather have the real version than the kind version.", "Can you give me an example? I want to be picturing the same thing you are.", "Let me sit with that for a second.", "The part I recognise is…", "Where I'd push back, gently, is…", "It might be worth knowing that they rewrote the brief on the Thursday.", "What would 'better' look like by the summer?", "There's something I'd like to put on the table for this year.", "What would I need to show you to be in the frame for that?", "Thank you for being straight with me — I'd rather this than a pat on the back."]}, {"file": "wk_14_taking_credit.html", "title": "Taking the Credit", "desc": "Claim work someone else presented as theirs.", "skill": "claiming your work", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Can I say something slightly awkward? It'll take a minute.", "I'm not making a thing of this. I just don't want to say nothing.", "That was my analysis, Ana. The model, the returns idea — that was mine.", "You said 'we' once and 'I' for the rest of it. I counted, which tells you how it felt.", "'Everyone knows it was a team effort' — they don't, though. That's the point.", "I don't think you did it on purpose. I do think you did it.", "I'd like you to say my name to Priyesh. That's all.", "Next time, I'd rather be in the room than in the footnotes.", "I'd want you to tell me if I'd done it to you.", "That's it. That's the whole thing. We're fine."]}, {"file": "wk_04_the_difficult_conversation.html", "title": "The Difficult Conversation", "desc": "Give a colleague hard feedback, kindly.", "skill": "feedback", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Can we talk about something? I'd rather be straight with you than let it sit.", "…something I'd rather talk about properly than let it become an awkward thing.", "In the last three [meetings / reports / weeks], X happened, and the effect was Y.", "The last few times, your part has come in after the deadline\" / \"I've noticed a pattern I wanted to flag\" / \"It's happened three times now, so I don't think it's a one-off.", "Help me understand what's going on for you.", "I'm not questioning your effort — I'm flagging the impact.", "That's fair — and it's still landing on the rest of us, so I'd like to sort it.", "What would help you get there?", "Let's try it for the next report and check in — no drama either way.", "I'm really glad we talked."]}, {"file": "wk_11_saying_no_to_your_boss.html", "title": "Saying No to Your Boss", "desc": "Say no to more work, without saying no.", "skill": "declining upward", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Can I look at what I've got on and come back to you in ten?", "I don't want to say yes and then let you down quietly.", "Realistically I've got about a day and a half spare.", "I can do it — but something has to give. Which?", "If I take that on, the Renner thing lands late. Is that alright?", "I promised Alina Thursday, and I'd rather not be the reason that slips.", "You'd know better than me what matters most this week.", "I'm not saying no. I'm asking you to pick.", "I could do a rough version by Tuesday or a proper one by Friday.", "Can we say that out loud so we both remember it?"]}, {"file": "wk_22_the_unpaid_invoice.html", "title": "The Unpaid Invoice", "desc": "Chase a client who hasn't paid you.", "skill": "chasing money", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I'm just chasing the invoice from March — I don't think it's come through yet.", "Sorry to be the one chasing money.", "Do you know where in the process it's sat?", "Is there anything you need from me to get it moving?", "Who would actually press the button on it?", "When you say shortly, are we talking this week or next?", "Can I put a date in my diary to stop worrying about it?", "It's ninety days now, which is well past our terms.", "I'm a one-man band — it's a different size of problem for me than it is for you.", "I don't want to stop work on the next piece, but I can't really start it until this one's cleared.", "Sorry, what's a payment run — is that the same as it being paid?"]}, {"file": "wk_26_the_consultation.html", "title": "The Consultation", "desc": "Take a patient's history in English.", "skill": "taking a history", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["What's brought you in today?", "Tell me a bit more about that.", "Can you put a date on it — roughly?", "Is it there all the time, or does it come and go?", "What makes it better? What makes it worse?", "On a scale of one to ten, where is it now — and where's the worst it's been?", "Tell me about that one.", "Sorry — when you say dizzy, do you mean the room spins, or you feel faint?", "Bear with me a second while I get this down.", "That's a very reasonable thing to be worried about."]}, {"file": "wk_27_breaking_the_news.html", "title": "Breaking the News", "desc": "Give a diagnosis and check it's understood.", "skill": "difficult news", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["What are you expecting me to say?", "I'm afraid it's not the news we were hoping for.", "I'm going to give you a moment.", "In plain terms, what that means is…", "What I'd like to do is ___, and the reason is ___.", "Are you happy for me to go ahead?", "Just so I know I've explained it properly — what would you tell your husband when you get home?", "That's the bit I've explained badly, then — let me go again.", "I can't give you a guarantee. What I can tell you is…", "If anything changes before then, I'd rather you rang than waited."]}, {"file": "wk_28_the_first_sales_call.html", "title": "The First Sales Call", "desc": "Earn two minutes from a stranger.", "skill": "cold calling", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Have I caught you at a terrible time, or do you have two minutes?", "The reason I'm calling you specifically is that your plant runs three shifts.", "Before I say anything else — is energy cost something you deal with at all?", "Can I ask what you're using at the moment?", "Compared to what it's costing you now, it usually works out at about a third.", "I'm not asking you to change anything today.", "How about I send one page — and if it's not relevant, you bin it?", "When's a better week to try you?", "Fair enough — it sounds like you're well looked after.", "If anything changes, you've got my number — thanks for hearing me out."]}, {"file": "wk_31_the_sceptical_client.html", "title": "The Sceptical Client", "desc": "Sell the change to a room that's been burned.", "skill": "winning the room", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["You've every right to be sceptical — I would be, in your chair.", "I'm not going to pretend nothing changes.", "But nothing gets decided over your head.", "The last project — where did it fall down?", "In plain terms, what it does is this.", "There are things it won't do, and I'd rather you heard them from me.", "Let's walk before we run.", "You tell me what success looks like, and we'll measure against that.", "I'd want your most sceptical people in from day one.", "If it isn't working, we stop — and you'll hear it from me first."]}, {"file": "wk_29_the_front_desk.html", "title": "The Front Desk", "desc": "Absorb the anger, not the blame.", "skill": "service recovery", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["You're right to be annoyed — let me see what's happened.", "I'm sorry you've had this after a long day.", "So that I get this right: quiet double, the party on your floor, and the desk didn't pick up?", "Bear with me two minutes — I won't leave you standing here.", "That was our mistake, and I'll flag it tonight.", "Here's what I can do for you right now.", "I can't give you the full night, but I can offer this.", "I'll leave the request flagged for the manager, with my note supporting it.", "Thanks for giving me the chance to fix it.", "My name's Dana — I'm on until seven, so if anything else comes up, ask for me."]}, {"file": "wk_30_parents_evening.html", "title": "Parents' Evening", "desc": "Mixed news, delivered honestly.", "skill": "mixed news", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["There's a lot going well, and one thing I want us to work on together.", "I'll start with the good, because it's real.", "What I'm seeing is homework not coming in — most weeks, not just once.", "This isn't about ability — it's about something getting in the way.", "You know her better than I do — does any of this ring true at home?", "It's nothing we can't turn around.", "Here's what I'll do at school — and here's where you can help at home.", "Let's speak again in three weeks and see where we are.", "She's a good kid having a hard patch — those are different things.", "Thanks for coming in — I've been looking forward to this one."]}, {"file": "wk_13_the_mistake.html", "title": "The Mistake", "desc": "Tell your boss you've broken something.", "skill": "owning an error", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I've made a mistake and you need to know about it now, not later.", "It's mine. I did it. Nobody else touched it.", "Here's exactly what's happened, and here's what I don't know yet.", "Ninety-one people, outside the company, forty minutes ago.", "I've started the recall, and I've stopped it going any further.", "I haven't rung the clients — that's your call, and I didn't want to make it worse.", "There's a reason it happened but I'm not going to use it as an excuse.", "Tell me off later. Right now, what do you need from me?", "I'd rather be the one who tells you than the one you find out about.", "It won't happen again, and that's not a promise, it's a change to how I do it."]}, {"file": "wk_16_the_client_who_shouts.html", "title": "The Client Who Shouts", "desc": "Stay calm while a client loses his temper.", "skill": "absorbing anger", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Mm.\" … \"Right.", "I'm not going to defend anything while you're still angry, because that'll just make it worse.", "Can I take the bit that's ours first?", "You should have had a status update in April and you didn't. That's ours, it's mine, and I'm not going to explain it away. I'm sorry.", "Sorry — can you slow down for me a second? I want to make sure I've got the actual problem.", "Just so I've got this right — …", "Is that the real problem, or is there something underneath it?", "That's a different problem, and I'd have been furious too.", "What would you need in your hand on Thursday for it to be survivable?", "…so you can tell me it's wrong before Thursday rather than after."]}, {"file": "wk_06_the_interview.html", "title": "The Interview", "desc": "The pitch, the weakness, and the curveball.", "skill": "interviews", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["In a sentence, I'm someone who…", "…this role looks like the same work on a bigger stage, which is why I applied.", "Rather than just say I'm organised, let me give you an example.", "I'd rather show you than tell you — last quarter I presented our results to the board and turned a nervous room into a yes.\"  /  \"A number might say it better: I cut our reply time to clients from two days to two hours.", "Honestly, my weakness is X — and here's what I'm doing about it.", "a real weakness plus the work you're doing on it.", "Let me walk you through a specific example.", "What I did was, I split the order across two suppliers…", "Can I ask what success looks like in this role after a year?", "Thank you for your time — I've come away more interested in the role, not less, and I'd be glad to take it further.\"  /  \"This has only made me keener; I'd really welcome the next step."]}, {"file": "wk_10_the_handover.html", "title": "The Handover", "desc": "Hand over four years in forty minutes.", "skill": "letting go of it", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I could talk for three hours, so stop me — what do you actually need?", "There are three things that'll bite you. Everything else is in the folder.", "This is the one that looks fine and isn't.", "If it goes wrong, it'll go wrong at the quarter-end upload, and it'll be a Thursday.", "The thing that isn't in any document is that it all runs on Ferran.", "Officially it's a two-week process. It isn't.", "I never got to this, and I should have.", "The tolerance was set back when we were on the old— no. Doesn't matter. Forget that bit.", "Don't inherit my way of doing it just because it's mine.", "Ring me for a month. After that, honestly, don't."]}, {"file": "wk_15_resigning.html", "title": "Resigning", "desc": "Resign without being talked out of it.", "skill": "leaving well", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["I'm going to make this quick, because you deserve that more than a build-up.", "I've accepted a job somewhere else. I'm resigning.", "This isn't a negotiation. I'd hate for you to spend a week trying to fix something that isn't broken.", "It's signed. I've told them yes.", "It's not about the money, and I'm not saying that to be polite.", "I'd stopped being any use to you. I could feel it before you could.", "You backed me when I hadn't earned it, and I've never said thank you properly.", "I'm not leaving because of you. I'm leaving despite you, which is worse for both of us.", "If you'd offered me that a year ago it would have worked. That's on both of us.", "Ask me for anything on the way out. Except staying."]}, {"file": "wk_18_made_redundant.html", "title": "Made Redundant", "desc": "Take the news that you're being let go.", "skill": "asking while winded", "series": "English at Work", "emoji": "💼", "level": "B2/C1", "phrases": ["Can you give me a second before we carry on?", "I'm not going to take much of this in, so can we do the facts?", "Is this a consultation or is it decided?", "What's the actual last day, and what happens between now and then?", "Can I have all that in writing? I'm genuinely not going to remember this conversation.", "Is there any other role in the business I should be looking at — even a sideways one?", "Put me down for a conversation about it either way — I'd rather decide than have it decided.", "Will you give me a reference? A real one, not the two-line dates-and-title thing.", "That's what I needed. I'm going to go and walk round the block, and I'll probably have twenty questions tomorrow.", "This isn't your doing and you've been straight with me. That's not nothing."]}];

const words = s => (s.toLowerCase().match(/[a-z0-9']+/g) || []);
// A query word matches any word that STARTS with it, so "say" finds "saying"
// and "apolog" finds "apologise". All query words must match somewhere.
const matches = (text, toks) => { const w = words(text); return toks.every(t => w.some(x => x.startsWith(t))); };
const hl = (s, toks) => {
  let out = esc(s);
  if (!toks.length) return out;
  const pat = toks.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  return out.replace(new RegExp('\\b(' + pat + ')[a-z\']*', 'gi'), '<mark>$&</mark>');
};

function chips() {
  const box = document.getElementById('filters');
  box.innerHTML = '';
  const add = (label, on, fn) => {
    const b = document.createElement('button');
    b.className = 'chip' + (on ? ' on' : '');
    b.textContent = label;
    b.onclick = fn;
    box.appendChild(b);
  };
  add('All series', !fSeries, () => { fSeries = null; render(); });
  SERIES.forEach(s => add(s, fSeries === s, () => { fSeries = fSeries === s ? null : s; render(); }));
  LEVELS.forEach(l => add(l, fLevel === l, () => { fLevel = fLevel === l ? null : l; render(); }));
}

function render() {
  const q = document.getElementById('q').value.trim();
  const toks = words(q);
  const out = document.getElementById('results');
  chips();
  let shown = 0;
  out.innerHTML = '';

  DATA.filter(d => (!fSeries || d.series === fSeries) && (!fLevel || d.level === fLevel))
      .map(d => {
        if (!toks.length) return { d, hits: [], score: 0 };
        const inTitle = matches(d.title, toks);
        const inAbout = matches(d.title + ' ' + d.desc + ' ' + d.skill, toks);
                const hits = d.phrases.filter(p => matches(p, toks));
        if (!inAbout && !hits.length) return null;
        return { d, hits, score: (inTitle ? 1000 : 0) + (inAbout ? 100 : 0) + hits.length * 10 };
      })
      .filter(Boolean)
      .sort((a, b) => b.score - a.score)
      .forEach(({ d, hits }) => {
        shown++;
        const el = document.createElement('div');
        el.className = 'lesson';
        el.innerHTML =
          '<div class="lhead"><a href="' + d.file + '">' + d.emoji + ' ' + hl(d.title, toks) + '</a>' +
          '<span class="tag">' + esc(d.skill || d.series) + '</span>' +
          '<span class="tag lvl">' + esc(d.level) + '</span></div>' +
          '<div class="ld">' + hl(d.desc, toks) + '</div>' +
          (hits.length ? '<div class="hits">' + hits.map(p => '<div class="hit">' + hl(p, toks) + '</div>').join('') + '</div>' : '');
        out.appendChild(el);
      });

  document.getElementById('count').textContent =
    shown + (shown === 1 ? ' role play' : ' role plays') + (toks.length ? ' matching “' + q + '”' : '');
  if (!shown) out.innerHTML = '<div class="none">Nothing matches that yet.<br>Try a plainer word — <em>sorry</em>, <em>no</em>, <em>money</em>, <em>late</em>.</div>';
}

document.getElementById('q').addEventListener('input', render);
render();
</script>
</body>
