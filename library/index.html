<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Reading House</title>
<style>
:root{--ink:#f6ecd4;--mute:#cdbf9f;--gold:#e2b857;--wood:#2a1a10;--night:#120d17;--panel:rgba(22,15,26,.9);--head:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--body:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#stageWrap{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a1d33,#0d0912 70%)}
#stageWrap::before{content:'';position:absolute;inset:-40px;background:var(--room,none) center/cover no-repeat;filter:blur(22px) brightness(.6);}
#stage{position:absolute;left:50%;top:50%;width:1536px;height:1024px;transform-origin:50% 50%;transition:transform .85s cubic-bezier(.6,.05,.25,1)}
#tilt{position:absolute;inset:0}
#roomGL,#dust,#glow{position:absolute;inset:0;width:1536px;height:1024px;pointer-events:none}
#roomGL{display:none}
#glow{mix-blend-mode:screen;opacity:.8}
#roomImg{position:absolute;inset:0;width:1536px;height:1024px;display:block;user-select:none;-webkit-user-drag:none}
#bays,#hot,#plaques{position:absolute;inset:0;width:1536px;height:1024px;pointer-events:none}
#hot polygon{pointer-events:all}
#bays .bay{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;overflow:hidden}
#bays .row{height:84px;box-sizing:border-box;display:flex;align-items:flex-end;gap:1px;padding:0 6px;border-bottom:8px solid transparent}#bays .row.has{background:linear-gradient(90deg,rgba(20,10,5,.97),rgba(46,25,12,.95) 12%,rgba(46,25,12,.95) 88%,rgba(20,10,5,.97));border-bottom-color:#7a4a22;box-shadow:inset 0 -1px rgba(255,214,140,.45),inset 0 10px 12px -6px rgba(0,0,0,.8)}
#bays .p{flex:none;border-radius:1px 1px 0 0;box-shadow:inset -1px 0 rgba(0,0,0,.35),inset 1px 0 rgba(255,255,255,.12)}
#bays .p.read{box-shadow:0 0 6px 1px rgba(255,214,120,.95)}
#hot polygon,#hot rect{fill:rgba(255,226,150,0);stroke:rgba(255,226,150,0);stroke-width:2;cursor:pointer;transition:fill .25s,stroke .25s}
#hot polygon:hover,#hot rect:hover{fill:rgba(255,226,150,.16);stroke:rgba(255,226,150,.7)}
body.debug #hot polygon,body.debug #hot rect{stroke:#0f0;fill:rgba(0,255,0,.08)}
.plaque{position:absolute;transform:translate(-50%,-50%);padding:2px 10px 3px;border-radius:999px;background:rgba(28,18,10,.55);border:1px solid rgba(226,184,87,.55);color:#f6e7bd;font:600 15px/1.1 var(--head);letter-spacing:.06em;box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none;text-align:center;white-space:nowrap;transition:background .2s,transform .2s}
.peg{position:absolute;transform:translate(-50%,-50%);pointer-events:none;object-fit:contain;filter:drop-shadow(0 5px 5px rgba(0,0,0,.55))}
.pegw{position:absolute;transform:translate(-50%,-50%);font:700 15px/1 var(--head);letter-spacing:.06em;text-transform:lowercase;color:#fff4d6;text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap}
.plaque small{display:none;font:500 11px/1.2 var(--body);letter-spacing:0;opacity:.9;margin-top:1px}
.plaque.hl{background:rgba(28,18,10,.85);transform:translate(-50%,-50%) scale(1.15)}
.plaque.hl small{display:block}
.plaque.door{font-size:13px;padding:2px 9px;background:rgba(28,18,10,.5)}
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:14px;align-items:center;padding:12px 16px;background:linear-gradient(rgba(10,7,14,.5),rgba(10,7,14,0) 70%);z-index:5;flex-wrap:wrap;pointer-events:none}#top>*{pointer-events:auto}#top h1,#top .sub{text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.8)}
#top h1{margin:0;font:400 1.35rem/1.1 var(--head);color:#fff4d6}
#top .sub{font-size:.85rem;color:var(--mute)}
#top .sp{flex:1}
.search{background:rgba(255,255,255,.08);border:1px solid rgba(246,236,212,.3);border-radius:999px;color:var(--ink);padding:9px 16px;font-size:1rem;min-width:220px}
.search::placeholder{color:#b7a98a}
.pill{border:1px solid rgba(246,236,212,.3);background:rgba(255,255,255,.07);border-radius:999px;padding:8px 14px;font-size:.95rem}
.pill:hover{background:rgba(255,255,255,.16)}
.pill.on{background:var(--gold);color:#2b1a05;border-color:var(--gold)}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);border:1px solid rgba(246,236,212,.2);padding:10px 18px;border-radius:14px;font-size:1rem;z-index:5;max-width:calc(100vw - 24px);text-align:center;transition:opacity .4s}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);padding:12px 20px;border-radius:12px;z-index:30;opacity:0;pointer-events:none;transition:opacity .3s;max-width:calc(100vw - 24px)}
#toast.on{opacity:1}
/* shelf view */
#shelfView{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 0%,#4a2f1c,#1c110a 70%);opacity:0;pointer-events:none;transition:opacity .5s ease .35s;display:flex;flex-direction:column}
#shelfView.on{opacity:1;pointer-events:auto}
#sbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 14px;background:rgba(0,0,0,.35);border-bottom:1px solid rgba(226,184,87,.25)}
#sbar h2{margin:0;font:400 1.4rem/1.1 var(--head);color:#fff4d6}
#sbar .sub{color:var(--mute);font-size:.88rem}
#corr{flex:1;overflow-x:auto;overflow-y:hidden;position:relative;scrollbar-color:#b98a2e #1c110a;cursor:grab}
#corr.drag{cursor:grabbing}
#strip>.bayc:first-child{margin-left:auto}#strip>.bayc:last-child{margin-right:auto}
#strip{display:flex;height:100%;align-items:center;padding:0 8px;gap:0;min-width:100%}
.bayc{flex:none;padding:0 14px;border-left:calc(10px*var(--z)) solid #3b2413;border-right:calc(10px*var(--z)) solid #3b2413;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,0) 8%,rgba(0,0,0,0) 92%,rgba(0,0,0,.25)),#2a1810}
.shelf{display:flex;align-items:flex-end;gap:calc(1px*var(--z));height:calc(250px*var(--z));padding:0 4px;border-bottom:calc(14px*var(--z)) solid #6b4423;box-shadow:0 calc(8px*var(--z)) calc(10px*var(--z)) -4px rgba(0,0,0,.6);background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.05) 30%)}
.sp{flex:none;position:relative;display:block;padding:0;border:0;border-radius:2px 2px 0 0;overflow:hidden;width:calc(var(--w)*var(--z)*1px);height:calc(var(--h)*var(--z)*1px);background:var(--bg);color:var(--fg);box-shadow:inset -2px 0 rgba(0,0,0,.35),inset 2px 0 rgba(255,255,255,.14);transition:transform .15s,box-shadow .3s}
.sp:hover{transform:translateY(calc(-8px*var(--z)))}
.sp span{writing-mode:vertical-rl;display:block;font:600 calc(var(--fs)*var(--z)*1px)/1 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;height:calc(100% - 22px*var(--z));padding:calc(7px*var(--z)) 0 0;text-align:left;letter-spacing:.02em}
.sp.star{border-top:calc(6px*var(--z)) solid var(--gold)}
.sp.star::after{content:"\2605";position:absolute;left:0;right:0;bottom:calc(3px*var(--z));text-align:center;color:var(--gold);font-size:calc(11px*var(--z))}
.sp.read{box-shadow:0 0 calc(14px*var(--z)) calc(3px*var(--z)) rgba(255,214,120,.9),inset -2px 0 rgba(0,0,0,.3)}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mute);font-size:1.1rem}
.sp .sn{text-transform:uppercase;letter-spacing:.04em;opacity:.85;font-weight:700;margin-right:.35em}
.avail{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:.95rem}.avail .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.12)}.avail .dot.g{background:#2e9e4f}.avail .dot.r{background:#c8372d}
html.clean #top,html.clean #hint,html.clean #musicBtn,html.clean #toast{display:none!important}
#jump{display:flex;gap:2px;overflow-x:auto;padding:2px 14px;background:rgba(0,0,0,.35);border-top:1px solid rgba(226,184,87,.25);align-items:center}
#jump button{background:none;border:0;color:var(--mute);padding:4px 7px;font-size:.9rem}
#jump button:hover{color:#fff}
#jump input{flex:1;min-width:120px}
/* pull-out label + list view */
#pull{position:fixed;z-index:15;pointer-events:none;max-width:340px;padding:10px 14px;border-radius:10px;background:#fff4d6;color:#2a1810;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;border:1px solid #b98a2e}
#pull.on{opacity:1}
#pull b{display:block;font:700 1.15rem/1.25 var(--head)}
#pull i{display:block;font-style:normal;font-size:.95rem;margin-top:3px;color:#5a4128}
#pull em{display:inline-block;font-style:normal;font-size:.75rem;margin-top:5px;padding:1px 8px;border-radius:10px;background:#2a1810;color:#e2b857}
.sp:hover{transform:translateY(calc(-26px*var(--z))) rotate(-1.5deg);z-index:3;box-shadow:0 0 calc(18px*var(--z)) calc(2px*var(--z)) rgba(255,230,160,.8),inset -2px 0 rgba(0,0,0,.3)}
#listView{flex:1;overflow-y:auto;display:none;padding:8px 0}
#shelfView.list #pull{display:none}#shelfView.list #listView{display:block}#shelfView.list #corr,#shelfView.list #jump,#shelfView.list #zOut,#shelfView.list #zIn{display:none}
.li{display:flex;gap:14px;align-items:baseline;width:100%;max-width:1000px;margin:0 auto;padding:9px 18px;background:none;border:0;border-bottom:1px solid rgba(226,184,87,.15);color:#fff4d6;text-align:left;font-size:1.05rem}
.li:hover{background:rgba(226,184,87,.12)}
.li .lt{flex:1;font-family:var(--head);font-weight:600}.li .la{color:var(--mute);flex:0 0 30%}.li .ll{flex:0 0 40px;color:var(--gold);font-size:.85rem}.li.read .lt::after{content:" \2713";color:#e2b857}
.li.star .lt::before{content:"\2605 ";color:var(--gold)}
/* card */
#cardWrap{position:fixed;inset:0;z-index:20;background:rgba(5,3,8,.6);display:none;align-items:center;justify-content:center;padding:16px}
#cardWrap.on{display:flex}
#card{position:relative;width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#f6ecd4;color:#2a1d10;border-radius:14px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.6);border-top:8px solid var(--c,#5b2a6b)}
#card h3{margin:0 0 4px;font:400 1.7rem/1.15 var(--head)}
#card .by{color:#6a5640;margin:0 0 12px;font-size:1.05rem}
#card .badge{display:inline-block;background:#2a1d10;color:#f6ecd4;border-radius:6px;padding:3px 10px;font-weight:700;margin-right:8px}
#card .tag{color:#6a5640;font-size:.95rem}
#card p{font-size:1.05rem;line-height:1.5;margin:10px 0}
#card .q{background:#ece0c2;border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;font-style:italic}
#card .where{font-size:.92rem;color:#6a5640;margin-top:12px}
#card .x{position:absolute;right:12px;top:8px;background:none;border:0;font-size:1.8rem;color:#6a5640}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:1rem;background:#2a1d10;color:#f6ecd4}
.btn.alt{background:transparent;color:#2a1d10;border:2px solid #2a1d10}
.btn.done{background:var(--gold);color:#2b1a05}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#req{display:none;margin-top:14px}
#req textarea{width:100%;min-height:96px;font:1rem/1.4 var(--body);padding:10px;border-radius:8px;border:1px solid #b9a77f;background:#fff9ea;color:#2a1d10}
#req input{padding:8px 10px;border-radius:8px;border:1px solid #b9a77f;background:#fff9ea;margin-bottom:8px;font-size:1rem;width:100%}
#req .ok{color:#2f6b3a;font-weight:600;margin-top:6px}
@media(max-width:640px){#top h1{font-size:1.1rem}.search{min-width:140px;flex:1}}
</style>
</head>
<body>
<div id="stageWrap">
  <div id="stage" style="transition:none">
    <div id="tilt">
    <img id="roomImg" alt="">
    <canvas id="roomGL" width="1536" height="1024"></canvas>
    <div id="bays"></div>
    <svg id="hot" viewBox="0 0 1536 1024"></svg>
    <div id="glow"></div>
    <canvas id="dust" width="1536" height="1024"></canvas>
    <div id="plaques"></div>
    </div>
  </div>
</div>
<div id="top">
  <div><h1>The Reading House</h1><div class="sub" id="roomSub"></div></div>
  <div class="sp"></div>
  <button class="pill" id="mapBtn" type="button">&#9638; Floor plan</button>
  <input class="search" id="roomSearch" type="search" placeholder="Search this room: title or author">
  <button class="pill" id="starredAll">&#9733; Starred books</button>
  <span class="pill" id="readCount">0 read</span>
</div>
<div id="hint">Tap a bookcase to go closer. Tap a door to go to the next room.</div>
<div id="toast"></div>

<div id="shelfView">
  <div id="sbar">
    <button class="pill" id="back">&larr; Back to the room</button>
    <div><h2 id="sTitle"></h2><div class="sub" id="sSub"></div></div>
    <div style="flex:1"></div>
    <input class="search" id="shelfSearch" type="search" placeholder="Search this shelf">
    <span id="lvls"></span>
    <button class="pill" id="onlyStar">&#9733; Starred only</button>
    <button class="pill" id="listBtn">&#9776; List</button>
    <button class="pill" id="zOut" aria-label="Smaller">A&minus;</button>
    <button class="pill" id="zIn" aria-label="Larger">A+</button>
  </div>
  <div id="corr"><div id="strip"></div><div id="empty">No books match.</div></div>
  <div id="jump"></div>
  <div id="listView"></div>
</div>
<div id="pull"></div>

<div id="cardWrap"><div id="card"></div></div>

<script>
if(/[?&]clean=1/.test(location.search))document.documentElement.classList.add('clean');
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname))fetch('/rh-local/status').then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.ok)window.RH_LOCAL=true}).catch(function(){});
window.ROOMS_OPEN=['000','100','200','300','400','500','600','700','800'];
window.RH_MAIN=function(){
'use strict';
var ROOM=window.ROOM,WING=ROOM.wing,PEGW=ROOM.pegw,BAYS=ROOM.bays,LECTERN=ROOM.lectern,DOORS=ROOM.doors,SUBRULES=ROOM.rules,JUNK=ROOM.junk;
var DEBUG=/debug=1/.test(location.search);
if(DEBUG)document.body.classList.add('debug');

/* ---------- small helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'')}
function hash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function lsg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var state={read:{},name:''};
try{var raw=lsg('rh_v1');if(raw){var o=JSON.parse(raw);if(o&&o.read)state=o}}catch(e){}
function save(){lss('rh_v1',JSON.stringify(state))}

/* ---------- homography (flat rectangle -> any four-corner shape) ---------- */
function solve(A,b){var n=b.length,i,j,k;for(i=0;i<n;i++){var m=i;for(j=i+1;j<n;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;var t=A[i];A[i]=A[m];A[m]=t;var tb=b[i];b[i]=b[m];b[m]=tb;for(j=i+1;j<n;j++){var f=A[j][i]/A[i][i];for(k=i;k<n;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i]}}
 var x=new Array(n);for(i=n-1;i>=0;i--){var s=b[i];for(j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=s/A[i][i]}return x}
function matrix(w,h,q){var src=[[0,0],[w,0],[w,h],[0,h]],A=[],b=[];
 for(var i=0;i<4;i++){var x=src[i][0],y=src[i][1],u=q[i][0],v=q[i][1];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}
 var s=solve(A,b);return 'matrix3d('+[s[0],s[3],0,s[6],s[1],s[4],0,s[7],0,0,1,0,s[2],s[5],0,1].join(',')+')'}

/* ---------- the room: where things are on the picture (1536 x 1024) ---------- */

/* ---------- books ---------- */
var COLS=[['#5b2a6b','#f3e2b0'],['#2f4a3f','#f3e2b0'],['#7a2e2e','#f6e9c8'],['#e8dcc0','#3a2a1c'],['#3b3f66','#f3e2b0'],['#8a6a2f','#fff4d6'],['#24303a','#e9d9a8'],['#a0562d','#fff3dd'],['#6b3a52','#f5e6c8'],['#33523c','#efe0b5']];
function tidy(t){
 if(!/\s/.test(t)&&/\./.test(t)){t=t.replace(/^\d{9,13}[Xx]?\./,'').replace(/\./g,' ');t=t.replace(/^(Oxford University Press USA|Oxford University Press|Cambridge University Press|Routledge|Blackwell|Continuum)\s+/i,'');t=t.replace(/\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{4}$/,'')}
 t=t.replace(/^\d{9,13}[Xx]?\s+/,'').replace(/-Cambridge University Press$/,'').replace(/\s*\{VTS\}/,'').replace(/\s+/g,' ').trim();
 return t}
function sortKey(t){return t.toLowerCase().replace(/^(the|a|an)\s+/,'').replace(/[^a-z0-9 ]/g,'')}
var MORE=ROOM.more||[];/* a shared room can hold a second subject: {wing,rules,defaultSub} */
/* stories are shelved by the writer's surname (ROOM.byAuthor = [[shelf,'LETTERS'],...]) */
var BYA=ROOM.byAuthor||null,BYASUB={};if(BYA)BYA.forEach(function(x){BYASUB[x[0]]=1});
function fold(s){return s.normalize?s.normalize('NFD').replace(/[\u0300-\u036f]/g,''):s}
function surname(a){if(!a)return '';var f=fold(a).split(/\s+(?:&|and|with)\s+|[,;\/]/)[0].replace(/\s+(?:jr|sr|ii|iii|iv)\.?$/i,'').trim().split(/\s+/);return (f[f.length-1]||'').replace(/[^A-Za-z'-]/g,'')}
function authorKey(b){var sn=surname(b.a);return sn?(sn+' '+fold(b.a)+' ').toLowerCase().replace(/[^a-z ]/g,'')+sortKey(b.t):'~'+sortKey(b.t)}
function bookKey(b){return BYA&&BYASUB[b.sub]?authorKey(b):sortKey(b.t)}
function classify(t,a,W){var s=t+' '+a,R=W?W.rules:SUBRULES,i;
 if(BYA&&!W){var L=surname(a).charAt(0).toUpperCase();
  if(/[A-Z]/.test(L)){for(i=0;i<R.length;i++)if(R[i][1].source.charAt(0)!=='^'&&R[i][1].test(s))return R[i][0];
   for(i=0;i<BYA.length;i++)if(BYA[i][1].indexOf(L)>=0)return BYA[i][0]}}
 for(i=0;i<R.length;i++)if(R[i][1].test(s))return R[i][0];return W?W.defaultSub:ROOM.defaultSub}

var cur=(window.CURATED||[]).filter(function(c){return c.w===WING||MORE.some(function(m){return m.wing===c.w})});
var books=[];
cur.forEach(function(c){
 var sub=c.sub||window.SUB_OVERRIDE[c.id]||classify(c.t,c.a);
 books.push({id:c.id,t:c.t,a:c.a,sub:sub,c:c,sz:c.pages?c.pages/40:2,key:norm(c.t)});
});
function isCurated(k,full){
 for(var i=0;i<cur.length;i++){var c=cur[i];if(norm(c.t)===k)return true;
  var al=c.alias||[];for(var j=0;j<al.length;j++)if(k.indexOf(al[j])>=0)return true;
  if(norm(c.t).length>9&&k.indexOf(norm(c.t))>=0)return true}
 return false}
var privateMode=false;
var HAVEC=[];function hasCopy(b){if(!b.c)return !!b.have;var k=norm(b.t);return HAVEC.some(function(x){return x.indexOf(k)>=0||k.indexOf(x)>=0})}
function addCatalogue(){addWing(WING,null);MORE.forEach(function(m){addWing(m.wing,m)})}
function addWing(wing,W){
 var cat=(window.CATALOGUE||{})[wing];if(!cat)return;privateMode=true;
 var seen={};
 cat.forEach(function(r){
  var t=tidy(r[0]),a=(r[1]||'').trim(),k=norm(t+a).slice(0,60);
  if(r[4]||JUNK.test(t+' '+a)||seen[k])return;
  var kt=norm(t);if(isCurated(kt)||isCurated(norm(a+t))||isCurated(norm(t+a))){if(r[6])HAVEC.push(kt);return}
