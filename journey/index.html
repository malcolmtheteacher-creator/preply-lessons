<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Room</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1f2433;--mute:#6b7285;--line:#e1e4ee;--accent:#4f46e5;--accent2:#7c3aed;--bronze:#b9774a;--silver:#8d98a8;--gold:#d4a017;--radius:14px;--font:system-ui,-apple-system,"Segoe UI",sans-serif;--head:Georgia,"Times New Roman",serif}
body.challenge{--bg:#0f172a;--card:#1e293b;--ink:#e8edf5;--mute:#94a3b8;--line:#334155;--accent:#14b8a6;--accent2:#0d9488}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
h1{font:400 1.9rem/1.1 var(--head);margin:0}
.sub{color:var(--mute);font-size:.92rem}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
.stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#14110f}
.stage svg{display:block;width:100%;height:auto}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:1.4rem;cursor:pointer}
.nav:disabled{opacity:.25;cursor:default}
.nav.l{left:10px}.nav.r{right:10px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.on{background:var(--accent)}.dots i.full{outline:2px solid var(--gold)}
.slot{cursor:pointer;outline:none}.slot:focus-visible circle{stroke:#fff}
.bob{animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mote{animation:drift 12s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-22px)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}.tw.d2{animation-delay:-1.2s}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.mote,.tw,.spin{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.88rem}
.chip.r1{border-color:var(--bronze)}.chip.r2{border-color:var(--silver)}.chip.r3{border-color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mute{color:var(--mute);font-size:.9rem}

body.imm{background:#14110f;color:#f3e9d2;overflow:hidden;height:100vh}
body.imm .wrap{max-width:none;padding:0}
.scene{position:fixed;inset:0;overflow:auto;scrollbar-width:none;background:#14110f}
.scene::-webkit-scrollbar{display:none}
.cam{position:relative;transform-origin:0 0;will-change:transform}
.cam.go{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.par{width:100%;height:100%;transition:transform .35s ease-out}
.par svg{display:block;width:100%;height:100%;animation:breathe 26s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1.015)}to{transform:scale(1.045)}}
.fadein{animation:fadein .9s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 20px;background:linear-gradient(rgba(10,8,6,.78),transparent);pointer-events:none}
.hud>*{pointer-events:auto}
.hud h1{color:#f6ecd4;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hud .sub{color:#d9c9a3}
.hud .btn{white-space:nowrap;background:rgba(20,17,15,.55);border:1px solid rgba(246,236,212,.35);backdrop-filter:blur(6px)}
.hud .btn:hover{background:rgba(60,48,30,.8)}
body.imm .nav{position:fixed;top:50%;background:rgba(20,17,15,.55);border:1px solid rgba(246,236,212,.3);backdrop-filter:blur(6px);width:50px;height:50px;z-index:5}
body.imm .nav.l{left:16px}body.imm .nav.r{right:16px}
body.imm .dots{position:fixed;left:0;right:0;bottom:14px;margin:0;z-index:5}
body.imm .dots i{background:rgba(246,236,212,.35)}body.imm .dots i.on{background:#ffd36b}
.sheet{position:fixed;left:50%;bottom:44px;transform:translate(-50%,24px);width:min(560px,calc(100vw - 24px));max-height:46vh;overflow:auto;background:rgba(20,17,15,.84);backdrop-filter:blur(14px);border:1px solid rgba(246,236,212,.25);border-radius:18px;padding:16px 18px;color:#f3e9d2;opacity:0;pointer-events:none;transition:opacity .45s ease .35s,transform .45s ease .35s;z-index:6;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.sheet h2{font:400 1.45rem/1.2 var(--head);margin:2px 0 4px;color:#fff4d6}
.sheet .mute,.hint .mute{color:#cdbf9f}
.sheet .chip{border-color:rgba(246,236,212,.25)}
.sheet .chip.r1{border-color:var(--bronze)}.sheet .chip.r2{border-color:var(--silver)}.sheet .chip.r3{border-color:var(--gold)}
.sheet .btn.ghost{color:#f3e9d2;border-color:rgba(246,236,212,.35)}
.sheet .x{position:absolute;right:10px;top:8px;background:none;border:0;color:#cdbf9f;font-size:1.5rem;cursor:pointer}
.hint{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);width:max-content;max-width:min(520px,calc(100vw - 24px));text-align:center;background:rgba(20,17,15,.6);backdrop-filter:blur(8px);border:1px solid rgba(246,236,212,.2);border-radius:18px;padding:8px 18px;z-index:4;transition:opacity .4s}
.hint.off{opacity:0;pointer-events:none}
.peg{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:.9rem;color:#e6d6ae}
.peg .pn{background:#1a1410;border:1.5px solid #e6c070;color:#ffe3a0;border-radius:999px;padding:1px 9px;font:700 .85rem Georgia,serif}
.peg img{width:30px;height:30px;border-radius:6px;object-fit:cover}
.peg a{margin-left:auto;color:#e6c070;font-size:.8rem}
.mia{cursor:pointer;outline:none}
.mia .mfig{transform-box:fill-box;transform-origin:50% 100%;animation:mbreath 5.5s ease-in-out infinite}
@keyframes mbreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
.mia:hover .mfig,.mia:focus-visible .mfig{filter:drop-shadow(0 0 6px rgba(255,226,160,.8))}
.mav{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid rgba(246,236,212,.55);background:#2a211b;flex:none}
.hint.mia-h{display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;color:#f6ecd4;font-size:.95rem;line-height:1.4;padding:10px 18px 10px 12px}
.hint.mia-h .mute{display:block;font-size:.8rem;margin-top:2px}
.miab{display:flex;gap:14px;align-items:flex-start;margin:4px 0 12px}
.miab .mav{width:62px;height:62px}
.miab .mname{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#cdbf9f}
.miab .msay{font:400 1.12rem/1.45 var(--head);color:#fff4d6;margin-top:2px}
.mtask{background:rgba(246,236,212,.07);border:1px solid rgba(246,236,212,.18);border-radius:12px;padding:10px 12px;margin:0 0 10px;color:#f3e9d2}
.mtask textarea{width:100%;box-sizing:border-box;min-height:64px;margin-top:8px;border-radius:8px;border:1px solid rgba(246,236,212,.25);background:rgba(10,8,6,.5);color:#f3e9d2;padding:8px;font:inherit}
@media (prefers-reduced-motion:reduce){.mia .mfig{animation:none}.par svg{animation:none}.cam.go{transition:none}.fadein{animation:none}}
</style>
</head>
<body class="classic">
<div class="wrap" id="app"></div>
<script src="../wordbank/words.js"></script>
<script src="../wordbank/all_lessons.js" onerror="void 0"></script>

<script>
(function(){
var WB = window.WORDBANK || {lessons:[],words:{}}, KEY = 'wb_v1', CAP = 8, DAY = 86400000;
var S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){}
S.done = S.done || {}; S.words = S.words || {};
document.body.className = S.skin === 'challenge' || S.skin === 'dungeon' ? 'challenge' : 'classic';

/* ---------- objects: simple line icons on a 24x24 grid ---------- */
var ICONS = [
 '<circle cx="8" cy="9" r="4"/><path d="M11 12l9 9M16 17l2-2M19 20l2-2"/>',
 '<path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/>',

 '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
 '<path d="M9 3h6M10 3v2h4V3M8 5h8l1 4v7l-1 3H8l-1-3V9zM9 9h6M9 14h6M12 19v2"/>',
 '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 '<path d="M20 4c-8 0-12 5-13 12l-3 4M20 4c0 7-5 11-12 12M9 15l5-5"/>',
 '<path d="M10 10h4v11h-4zM12 4c2 2 2 4 0 5-2-1-2-3 0-5M8 21h8"/>',
 '<path d="M3 13l12-6 2 4-12 6zM15 7l2-1 2 4-2 1M9 17l-2 4M12 15l3 6"/>',
 '<circle cx="12" cy="5" r="2"/><path d="M12 7v14M7 11h10M5 15c0 4 3 6 7 6s7-2 7-6"/>',
 '<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19l9-9"/>',
 '<path d="M7 4h10a2 2 0 012 2v12a2 2 0 01-2 2H7M7 4a2 2 0 00-2 2v1h2M7 20a2 2 0 01-2-2v-1h4M9 9h7M9 13h7"/>',
 '<circle cx="12" cy="15" r="5"/><path d="M8 3l4 7 4-7M12 12v6"/>',
 '<path d="M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4"/>',
 '<path d="M4 18l-1-10 5 4 4-7 4 7 5-4-1 10zM4 21h16"/>',
 '<path d="M6 4h12v6a6 6 0 01-12 0zM6 6H3a3 3 0 003 4M18 6h3a3 3 0 01-3 4M12 16v4M8 21h8"/>',
 '<path d="M9 21l1-13h4l1 13zM9 8l1-3h4l1 3M12 2v3M3 21h18"/>',
 '<path d="M12 3l6 7-6 8-6-8zM12 3v15M6 10h12M12 18c-2 2 0 3-2 4"/>',
 '<path d="M3 20l6-11 4 6 3-4 5 9zM3 20h18"/>',
 '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 '<path d="M12 3v14M12 4l7 11H12M12 8l-5 7h5M4 19h16l-2 2H6z"/>'
];
var ROOMS = [
 {name:'The Study',     wall:'#dcc8a6', wallD:'#b79f78', wain:'#6b4a32', wainD:'#533724', trim:'#f3e6cb', gold:'#d9b25f', fl:['#9a7650','#8c6a47','#a58259'], rug:'#8e2f35', rug2:'#d9b25f', glow:'#ffd68a', niche:'#2e2117', prop:'books'},
 {name:'The Library',   wall:'#3f6c5b', wallD:'#2c5143', wain:'#2c2018', wainD:'#1d140f', trim:'#d3ad55', gold:'#e0bb62', fl:['#5d4731','#523f2b','#684f37'], rug:'#7c2f33', rug2:'#e0bb62', glow:'#ffe0a0', niche:'#10201a', prop:'globe'},
 {name:'The Gallery',   wall:'#a3b3c6', wallD:'#7f91a8', wain:'#ece7dc', wainD:'#d7d1c3', trim:'#ffffff', gold:'#c9a95a', fl:['#d0c9ba','#c4bcac','#dad3c4'], rug:'#2f4a6b', rug2:'#e6d7ad', glow:'#fff0c8', niche:'#1f2b3a', prop:'bust'},
 {name:'The Courtyard', wall:'#dba97f', wallD:'#b98760', wain:'#8a5a3a', wainD:'#6e4529', trim:'#f5e1c0', gold:'#e6bd6a', fl:['#a89270','#9b8563','#b49f7d'], rug:'#3f6b52', rug2:'#f0d9a0', glow:'#ffd9a0', niche:'#3b2517', prop:'urn'}
];
var IMGS = ['img/room1_study.webp','img/room2_library.webp','img/room3_gallery.webp','img/room4_courtyard.webp','img/room5_observatory.webp','img/room6_conservatory.webp'];
var NAMES = ['The Study','The Library','The Gallery','The Courtyard','The Observatory','The Conservatory'];
var imgOk = {}, EDIT = /[?&]edit=1/.test(location.search), editSlot = 0;
var CUSTOM = (function(){ var c = window.ROOM_SLOTS || {}; try { var l = JSON.parse(localStorage.getItem('jr_slots') || '{}'); for (var k in l) c[k] = l[k]; } catch(e){} return c; })();
var ORDER = [[0,'L'],[0,'R'],[1,'L'],[1,'R'],[2,'L'],[2,'R'],[3,'L'],[3,'R']];
var U = [.15,.38,.62,.85], SL = 0.3256, OBJY = 106;

function hash(s){ var h = 7; for (var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* global position of a niche's object. wall local box is 430 x 260; left wall rises toward the corner, right wall falls away */
function slotPos(side, u){
  var lx = 430 * u;
  return side === 'L' ? {x: 70 + lx, y: 210 - SL*lx + OBJY} : {x: 500 + lx, y: 70 + SL*lx + OBJY};
}
function posFor(ri, slot){
  var c = CUSTOM[ri % IMGS.length];
  if (imgOk[ri % IMGS.length] && c && c[slot]) return {x: c[slot][0], y: c[slot][1]};
  var o = ORDER[slot]; return slotPos(o[1], U[o[0]]);
}
function wallMatrix(side){ return side === 'L' ? 'matrix(1,' + (-SL) + ',0,1,70,210)' : 'matrix(1,' + SL + ',0,1,500,70)'; }

/* ---------- data ---------- */
var regIds = {}; WB.lessons.forEach(function(l){ regIds[l.id] = 1; });
S.log = S.log || {};
var ALL = window.WBALL || {};
var logged = Object.keys(S.done).filter(function(id){ return !regIds[id]; }).map(function(id){ var a = ALL[id]; return {id: id, title: (S.log[id] && S.log[id].title) || (a && a[0]) || id.replace(/[_-]+/g, ' '), level: (a && a[1]) || '', words: [], rec: true, talk: !!(S.log[id] && S.log[id].talk)}; });
var lessons = WB.lessons.filter(function(l){ return S.done[l.id]; }).concat(logged).sort(function(a,b){ return S.done[a.id] - S.done[b.id]; });
var READ = [6,4,2,0,1,3,5,7]; // slot indexes in left-to-right reading order
var items = []; // {lesson, room, slot, icon}
var usedByRoom = {};
lessons.forEach(function(l, k){
  var room = Math.floor(k / CAP), slot = READ[k % CAP], used = usedByRoom[room] = usedByRoom[room] || {};
  var ic = hash(l.id) % ICONS.length; while (used[ic]) ic = (ic + 1) % ICONS.length; used[ic] = 1;
  items.push({lesson:l, room:room, slot:slot, icon:ic, n:k + 1});
});
var roomCount = Math.max(1, Math.ceil(lessons.length / CAP) + (lessons.length && lessons.length % CAP === 0 ? 1 : 0));
var cur = Math.max(0, roomCount - 1), sel = null;

function stats(l){
  var n = l.words.length, sum = 0, due = 0, now = Date.now();
  l.words.forEach(function(w){ var r = S.words[w]; var b = r ? r.box : 0; sum += b; if (!r || r.due <= now) due++; });
  return {avg: n ? sum / n : 0, due: due, n: n};
}
function ringColor(a){ return a >= 3.5 ? 'var(--gold)' : a >= 1.5 ? 'var(--silver)' : 'var(--bronze)'; }

/* ---------- drawing ---------- */
function wallArt(side, T, filled, ri){
  var g = '<g transform="' + wallMatrix(side) + '">';
  var id = side + ri;
  g += '<rect width="430" height="260" fill="' + T.wall + '"/>';
  g += '<rect width="430" height="260" fill="url(#pat' + ri + ')"/>';
  g += '<rect width="430" height="260" fill="url(#lit' + side + ')"/>';
  // wainscot panelling
  g += '<rect y="172" width="430" height="88" fill="' + T.wain + '"/>';
  for (var k = 0; k < 6; k++) { var px = 12 + k*70; g += '<rect x="' + px + '" y="190" width="58" height="54" rx="2" fill="' + T.wainD + '" opacity=".55"/><rect x="' + (px+3) + '" y="193" width="52" height="48" rx="1" fill="none" stroke="#fff" stroke-opacity=".10"/>'; }
  g += '<rect y="168" width="430" height="7" fill="' + T.trim + '"/><rect y="175" width="430" height="5" fill="#000" opacity=".25"/>';
  g += '<rect y="246" width="430" height="14" fill="' + T.trim + '"/><rect y="246" width="430" height="3" fill="#000" opacity=".2"/>';
  // crown moulding
  g += '<rect width="430" height="16" fill="' + T.trim + '"/><rect y="16" width="430" height="6" fill="#000" opacity=".28"/><rect y="12" width="430" height="2" fill="' + T.gold + '" opacity=".8"/>';
  // niches
  ORDER.forEach(function(o, slot){
    if (o[1] !== side) return;
    var cx = 430 * U[o[0]], w = 74, top = 34, bot = 164, it = filled[slot];
    var arch = 'M' + (cx - w/2) + ',' + bot + ' V' + (top + w/2) + ' a' + (w/2) + ',' + (w/2) + ' 0 0 1 ' + w + ',0 V' + bot + ' Z';
    g += '<path d="' + arch + '" fill="' + T.trim + '" transform="translate(0,0) scale(1)" opacity=".9" stroke="' + T.gold + '" stroke-width="2.5" stroke-opacity=".9" style="paint-order:stroke" transform-origin="' + cx + ' ' + bot + '"/>';
    g += '<path d="' + arch + '" fill="url(#nb' + ri + ')" transform="translate(' + cx + ',' + bot + ') scale(.9,.94) translate(' + (-cx) + ',' + (-bot) + ')"/>';
    if (it) g += '<ellipse cx="' + cx + '" cy="' + (bot - 20) + '" rx="26" ry="60" fill="' + T.glow + '" opacity=".16"/>';
    g += '<rect x="' + (cx - w/2 - 5) + '" y="' + (bot - 2) + '" width="' + (w + 10) + '" height="9" rx="2" fill="' + T.trim + '"/><rect x="' + (cx - w/2 - 5) + '" y="' + (bot + 6) + '" width="' + (w + 10) + '" height="3" fill="#000" opacity=".3"/>';
  });
  // corner shade
  g += '<rect x="' + (side === 'L' ? 390 : 0) + '" width="40" height="260" fill="url(#ao' + side + ')"/>';
  return g + '</g>';
}
function propArt(kind, T, x, y){
  var s = '';
  if (kind === 'books') {
    s += '<ellipse cx="' + x + '" cy="' + (y+4) + '" rx="46" ry="12" fill="#000" opacity=".3"/>';
    [['#7a2e2e',0,0,70],['#2f5d7a',4,-14,62],['#b0802c',-2,-28,56]].forEach(function(b){ s += '<rect x="' + (x-35+b[1]) + '" y="' + (y-12+b[2]) + '" width="' + b[3] + '" height="14" rx="2" fill="' + b[0] + '"/><rect x="' + (x-35+b[1]) + '" y="' + (y-12+b[2]) + '" width="' + b[3] + '" height="3" fill="#fff" opacity=".25"/>'; });
  } else if (kind === 'globe') {
    s += '<ellipse cx="' + x + '" cy="' + (y+4) + '" rx="36" ry="10" fill="#000" opacity=".3"/><path d="M' + (x-22) + ',' + (y+2) + 'h44l-8-16h-28z" fill="#3a2a1c"/><circle cx="' + x + '" cy="' + (y-42) + '" r="30" fill="#2d5d7f"/><path d="M' + (x-30) + ',' + (y-42) + 'h60M' + x + ',' + (y-72) + 'v60M' + (x-18) + ',' + (y-62) + 'q-10,20 0,40M' + (x+18) + ',' + (y-62) + 'q10,20 0,40" stroke="#e8d7a0" stroke-width="1.4" fill="none" opacity=".75"/><circle cx="' + (x-10) + '" cy="' + (y-52) + '" r="10" fill="#fff" opacity=".12"/>';
  } else if (kind === 'bust') {

var MIA_REPLY = ['Lovely. Now say it once more, a little slower. It sounds better each time.', 'Good. That is exactly how words move from your head to your mouth.', 'Well said. Tell your teacher about it in your next lesson.', 'I liked that. Keep it, and use it again tomorrow.'];
function cleanTitle(t){ return String(t).replace(/^Mia — /, '').replace(/^Lesson \d+ · /, ''); }
var lastTask = '';
function miaTask(){
  function one(){
    var pool = lessons.filter(function(l){ return !l.rec && l.words.filter(function(w){ return /^[A-Za-z']{4,}$/.test(w); }).length >= 2; }), recs = lessons.filter(function(l){ return l.rec && !l.talk; }), talks = lessons.filter(function(l){ return l.talk; });
    var opts = [];
    if (pool.length) { var l = pool[Math.floor(Math.random() * pool.length)], ws = l.words.filter(function(w){ return /^[A-Za-z']{4,}$/.test(w); }).sort(function(){ return Math.random() - .5; }), v = {title: cleanTitle(l.title), w1: ws[0], w2: ws[1]};
      ['Say one true sentence about your life using “{w1}”.', 'Say two sentences using “{w1}” and “{w2}”.', 'Tell me about “{title}” in your own words.', 'Explain “{w1}” to me without using the word itself.'].forEach(function(t){ opts.push(fmt(t, v)); }); }
    if (recs.length) { var r = recs[Math.floor(Math.random() * recs.length)]; opts.push(fmt('Tell me one thing you remember from “{title}”.', {title: cleanTitle(r.title)}), fmt('If a friend asked what “{title}” was about, what would you say?', {title: cleanTitle(r.title)})); }
    if (talks.length) { var tk = talks[Math.floor(Math.random() * talks.length)]; opts.push(fmt('What did you say about “{title}”? Say it again, a little clearer and a little longer.', {title: cleanTitle(tk.title)})); }
    opts.push('Tell me about your day in three sentences.', 'Tell me about something you did this week.');
    return opts[Math.floor(Math.random() * opts.length)];
  }

function miaSheet(task, done){
  var m = MIA_NOW || (MIA_NOW = miaLine()), st = m.st, face = done ? 'laugh' : (task ? 'smile' : m.face), say = done ? choose('reply', MIA_REPLY) : task ? choose('lead', ['Here is something to try.', 'Try this one.', 'Take your time with this.']) : m.text;
  var h = '<button class="x" id="closesheet" aria-label="Close">×</button><div class="miab"><img class="mav" src="' + MIA_FACE[face] + '" alt="Mia"><div><div class="mname">Mia</div><div class="msay">' + esc(say) + '</div></div></div>';
  if (task && !done) h += '<div class="mtask">' + esc(task) + '<textarea id="mtext" placeholder="Say it out loud first, then write it here if you like."></textarea></div><div class="row"><button class="btn" id="mdone">I have said it</button><button class="btn ghost" id="mother">Another one</button></div>';

}
function bindMia(){
  var sheet = document.getElementById('sheet'), cl = document.getElementById('closesheet');
  if (cl) cl.onclick = function(e){ e.stopPropagation(); sel = null; applySel(); };
  function show(task, done){ sheet.innerHTML = miaSheet(task, done); bindMia(); }
  var t = document.getElementById('mtask'), o = document.getElementById('mother'), d = document.getElementById('mdone');
  if (t) t.onclick = function(){ show(miaTask(), false); };
  if (o) o.onclick = function(){ var tx = document.getElementById('mtext'); if (tx) tx.value = ''; show(miaTask(), false); };
  if (d) d.onclick = function(){ show(null, true); };

var PEGS = null, PEGBASE = '../../major-system-palace/';
try { fetch(PEGBASE + 'data/numbers.json').then(function(r){ return r.ok ? r.json() : null; }).then(function(j){ if (j && j.numbers) { PEGS = {}; j.numbers.forEach(function(x){ PEGS[x.n] = x; }); if (typeof applySel === 'function' && sel !== null && sel !== 'mia') applySel(); } }).catch(function(){}); } catch(e){}
function pegHtml(n){
  var g = PEGS && PEGS[n];
  return '<div class="peg"><span class="pn">' + n + '</span>' + (g ? '<img src="' + PEGBASE + esc(g.image) + '" alt="" onerror="this.style.display=\'none\'"><span>' + esc(g.word) + '</span>' : '<span>Spot ' + n + '</span>') + '<a href="' + PEGBASE + '#/n/' + n + '" target="_blank" rel="noopener">See it in the palace</a></div>';
}
/* ---------- immersive full-screen scene ---------- */
var camT = null;
function sheetHtml(it){
  if (!it) return '';
  var l = it.lesson, st = stats(l);
  if (l.rec) return '<button class="x" id="closesheet" aria-label="Close">\u00d7</button><div class="mute">' + (l.talk ? 'A conversation you had' : 'A lesson you have done') + '</div><h2>' + esc(l.title) + '</h2>' + pegHtml(it.n) + (l.talk ? '' : '<div class="row" style="margin-top:10px"><a class="btn" href="../' + encodeURIComponent(l.id) + '.html">Open the lesson</a></div>');
  return '<button class="x" id="closesheet" aria-label="Close">×</button><div class="mute">' + esc(l.level) + '</div><h2>' + esc(l.title) + '</h2>' + pegHtml(it.n) +
    '<div class="chips">' + l.words.map(function(w){ var r = S.words[w], b = r ? r.box : 0; return '<span class="chip r' + (b >= 5 ? 3 : b >= 3 ? 2 : b >= 1 ? 1 : 0) + '">' + esc(w) + '</span>'; }).join('') + '</div>' +
    (st.due ? '<p class="mute" style="margin:0 0 10px">' + st.due + ' of ' + st.n + ' words are ready to review. Practise them to bring this object back to full brightness.</p>' : '<p class="mute" style="margin:0 0 10px">All the words from this lesson are fresh.</p>') +
    '<div class="row"><a class="btn" href="../wordbank/index.html?lesson=' + encodeURIComponent(l.id) + '&practise=1">Practise these words</a><a class="btn ghost" href="../' + encodeURIComponent(l.id) + '.html">Open the lesson</a></div>';
}
function applySel(){
  var cam = document.getElementById('cam'), scene = document.getElementById('scene'), sheet = document.getElementById('sheet'), hint = document.getElementById('hint');
  if (!cam) return;
  var isMia = sel === 'mia';
  var it = sel !== null && !isMia ? items.filter(function(x){ return x.room === cur && x.slot === sel; })[0] : null;
  Array.prototype.forEach.call(document.querySelectorAll('.slot'), function(g){ g.classList.toggle('sel', !!it && +g.getAttribute('data-slot') === sel); });
  cam.classList.add('go');
  if (it || isMia) {
    var pt = isMia ? {x: MIA.x, y: MIA.y - MIA.h * .55} : posFor(cur, sel), W = cam.offsetWidth, H = cam.offsetHeight, vw = innerWidth, vh = innerHeight, k = isMia ? 1.7 : 2.1;
    var px = pt.x / 1000 * W, py = pt.y / 640 * H, sl = scene.scrollLeft, st = scene.scrollTop;
    var tx = vw / 2 - px * k + sl, ty = vh * (vw < 700 ? .3 : .4) - py * k + st;
    tx = Math.min(sl, Math.max(vw - W * k + sl, tx)); ty = Math.min(st, Math.max(vh - H * k + st, ty));
    cam.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')';
    if (isMia) { lss('jr_mia_met', '1'); sheet.innerHTML = miaSheet(); } else sheet.innerHTML = sheetHtml(it);
    sheet.classList.add('on'); hint.classList.add('off');
    if (isMia) bindMia(); else { var cl = document.getElementById('closesheet'); if (cl) cl.onclick = function(e){ e.stopPropagation(); sel = null; applySel(); }; }
  } else {
    cam.style.transform = 'none';
    sheet.classList.remove('on'); hint.classList.remove('off');
  }
}
function renderImm(){

  var Hc = Math.max(vh, vw / AR), Wc = Hc * AR;
  var old = document.getElementById('scene'), same = old && old.getAttribute('data-room') === String(cur);
  var keepL = same ? old.scrollLeft : null, keepT = same ? old.scrollTop : null;
  var inRoom = items.filter(function(it){ return it.room === cur; }).length;
  var sub = lessons.length ? 'Room ' + (cur + 1) + ' of ' + roomCount + ' · ' + esc(NAMES[cur % NAMES.length]) + ' · ' + inRoom + ' of ' + CAP + ' objects' : 'Each lesson you do adds an object to your room';
  var hintTxt = !lessons.length ? 'Your room is empty. Open a lesson from your teacher’s link, or paste a lesson link into My Words, and its first object appears here.'
    : (cur === roomCount - 1 && inRoom < CAP ? 'Tap an object to step closer. ' + (CAP - inRoom) + ' more lessons fill this room and open the next one.' : 'Tap an object to step closer.');
  var h = '<div class="scene' + (same ? '' : ' fadein') + '" id="scene" data-room="' + cur + '"><div class="cam" id="cam" style="width:' + Wc + 'px;height:' + Hc + 'px"><div class="par" id="par">' + roomSvg(cur) + '</div></div></div><div class="vig"></div>' +
    '<div class="hud"><div><h1>My Room</h1><div class="sub">' + sub + '</div></div><a class="btn" href="../wordbank/index.html">My Words</a></div>' +
    '<button class="nav l" id="prev" aria-label="Previous room"' + (cur === 0 ? ' disabled' : '') + '>‹</button>' +
    '<button class="nav r" id="next" aria-label="Next room"' + (cur >= roomCount - 1 ? ' disabled' : '') + '>›</button>';
  h += '<div class="dots">';
  for (var i = 0; i < roomCount; i++) {
    var n = items.filter(function(it){ return it.room === i; }).length;
    h += '<i class="' + (i === cur ? 'on ' : '') + (n >= CAP ? 'full' : '') + '" data-r="' + i + '" title="Room ' + (i + 1) + '"></i>';
  }
  var ml = MIA_NOW = MIA_NOW || miaLine();
  h += '</div><div class="hint mia-h" id="hint"><img class="mav" src="' + MIA_FACE[ml.face] + '" alt="Mia"><div>' + esc(ml.text) + '<span class="mute">Tap an object to step closer, or tap me.</span></div></div><div class="sheet" id="sheet"></div>';

var rzT; window.addEventListener('resize', function(){ clearTimeout(rzT); rzT = setTimeout(function(){ if (!EDIT) { sel = null; renderImm(); } }, 200); });

function render(){ if (EDIT) renderClassic(); else renderImm(); }

  for (var i = 0; i < CAP; i++) h += '<button class="btn' + (i === editSlot ? '' : ' ghost') + '" data-es="' + i + '">' + (i+1) + '</button>';
