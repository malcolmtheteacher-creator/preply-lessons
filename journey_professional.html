  if (pick) {
    var p = prog(pick), started = p && p.n > 0;
    nx.innerHTML = '<div class="nextbox"><div><small>' + (started ? 'Pick up where you left off' : 'A good place to start') + '</small><h3>' + esc(pick.name) + '</h3><p>' + esc(pick.desc) + '</p></div><a class="go" href="' + esc(pick.href) + '">' + (started ? 'Continue' : 'Start here') + ' →</a></div>';
  } else nx.innerHTML = '';
  var res = document.getElementById('res');
  if (!list.length) { res.innerHTML = '<div class="none">Nothing here yet for that combination. Try another level or choose “Show me everything”.</div>'; return; }
  var h = '', last = '';
  list.forEach(function(c){
    if (c.level !== last) { if (last) h += '</div>'; last = c.level; h += '<div class="lvl">' + esc(c.level) + '<small>' + esc(c.chapter) + '</small></div><div class="grid">'; }
    h += cardHtml(c);
  });
  res.innerHTML = h + '</div>';
}
draw();
})();
</script>
</body>
</html>
