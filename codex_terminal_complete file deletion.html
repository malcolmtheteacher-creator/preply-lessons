  <style>
    body {
      background-color: #0d0d0d;
      color: #ff3333;
      font-family: 'JetBrains Mono', monospace;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      animation: flicker 0.3s infinite alternate;
    }
    
    @keyframes flicker {
      0% { opacity: 1; }
      95% { opacity: 1; }
      96% { opacity: 0.92; }
      97% { opacity: 1; }
      98% { opacity: 0.94; }
      99% { opacity: 1; }
      100% { opacity: 0.96; }
    }
    
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255, 51, 51, 0.03) 2px,
        rgba(255, 51, 51, 0.03) 4px
      );
      z-index: 999;
      pointer-events: none;
    }
    
    #loginScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0d0d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    
    #loginScreen input {
      font-size: 1.2em;
      padding: 10px;
      background: black;
      border: 1px solid red;
      color: red;
      width: 300px;
      text-align: center;
    }
    
    #terminal {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      white-space: pre-wrap;
      display: none;
    }
    
    #inputContainer {
      display: none;
      padding: 10px;
      background: #0d0d0d;
      border-top: 1px solid #ff3333;
    }
    
    #input {
      background: transparent;
      border: none;
      color: #ff3333;
      font-family: inherit;
      font-size: 1em;
      width: 100%;
      outline: none;
    }
    
    .typing {
      overflow: hidden;
      border-right: 2px solid #ff3333;
      animation: blink 1s infinite;
    }
    
    @keyframes blink {
      0%, 50% { border-color: #ff3333; }
      51%, 100% { border-color: transparent; }
    }
    
    .glitch {
      animation: glitch 0.5s ease-in-out;
    }
    
    @keyframes glitch {
      0% { transform: translate(0); filter: hue-rotate(0deg); }
      10% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
      20% { transform: translate(-1px, -1px); filter: hue-rotate(0deg); }
      30% { transform: translate(2px, 1px); filter: hue-rotate(180deg); }
      40% { transform: translate(1px, -1px); filter: hue-rotate(270deg); }
      50% { transform: translate(-1px, 1px); filter: hue-rotate(0deg); }
      60% { transform: translate(2px, -2px); filter: hue-rotate(90deg); }
      70% { transform: translate(-2px, -1px); filter: hue-rotate(180deg); }
      80% { transform: translate(1px, 2px); filter: hue-rotate(270deg); }
      90% { transform: translate(-1px, -2px); filter: hue-rotate(0deg); }
      100% { transform: translate(0); filter: hue-rotate(0deg); }
    }
    
    .terminal-glitch {
      animation: glitch 0.5s ease-in-out;
    }
  </style>
</head>

      const el = document.documentElement;

      else if (el.msRequestFullscreen) el.msRequestFullscreen();

    // Audio system for mobile compatibility
    let audioEnabled = false;
    
    function enableAudio() {
      if (!audioEnabled) {
        try {
          const testContext = new (window.AudioContext || window.webkitAudioContext)();
          if (testContext) {
            audioEnabled = true;
            testContext.close();
          }
        } catch (e) {
          audioEnabled = false;
        }
      }
    }

    function playSound(type) {
      if (!audioEnabled) return;
      
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        if (type === 'keypress') {
          oscillator.frequency.value = 800 + Math.random() * 200;
          oscillator.type = 'square';
          gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.1);
        } else if (type === 'error') {
          oscillator.frequency.value = 200;
          oscillator.type = 'sawtooth';
          gainNode.gain.setValueAtTime(0.08, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.3);
        } else if (type === 'startup') {
          oscillator.frequency.value = 600;
          oscillator.type = 'sine';
          gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.2);
        }
        
        setTimeout(() => {
          try {
            audioContext.close();
          } catch (e) {}
        }, 500);
        
      } catch (e) {
        audioEnabled = false;
      }
    }

    function searchThrallData(searchTerm) {
      const term = searchTerm.toLowerCase().trim();
      const results = [];
      
      // Direct match
      if (thrallData[term]) {
        results.push({
          term: term,
          content: thrallData[term],
          type: "direct"
        });
      }
      
      // Partial matches
      Object.keys(thrallData).forEach(key => {
        if (key.includes(term) && key !== term) {
          results.push({
            term: key,
            content: thrallData[key],
            type: "partial"
          });
        }
      });
      
      // Content matches
      Object.keys(thrallData).forEach(key => {
        if (thrallData[key].toLowerCase().includes(term) && !results.find(r => r.term === key)) {
          results.push({
            term: key,
            content: thrallData[key],
            type: "content"
          });
        }
      });
      
      return results.slice(0, 5); // Limit to top 5 results
    }

    function getTimestamp() {
      const now = new Date();
      const date = now.toLocaleDateString('en-GB', { 
        year: 'numeric', 
        month: '2-digit', 
        day: '2-digit' 
      });
      const time = now.toLocaleTimeString('en-GB', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: false 
      });
      return `${date} ${time}`;
    }

    function formatNoteWithTimestamp(content, type) {
      const timestamp = getTimestamp();
      return {
        content: content,
        timestamp: timestamp,
        type: type,
        created: new Date().toISOString()
      };
    }

    // Simple notes storage with localStorage

      const stored = localStorage.getItem('codex_notes');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          return {
            field: parsed.field || [],
            log: parsed.log || parsed.dream || [], // Support old "dream" data
            codex: parsed.codex || defaultCodex,
            paracosm: parsed.paracosm || [],
            major: parsed.major || []
          };
        } catch (e) {
          console.error('Error parsing stored notes:', e);
          return getDefaultNotes();
        }
      }
      return getDefaultNotes();
    }

            div.textContent = text.slice(0, i + 1);
            i++;
            // Add some typing variation and occasional pauses
            const delay = Math.random() < 0.1 ? 100 + Math.random() * 200 : 20 + Math.random() * 40;
            setTimeout(typeWriter, delay);
          } else {
            div.classList.remove('typing');
          }
        };
        terminal.appendChild(div);
        typeWriter();
      } else {
        div.textContent = text;
        terminal.appendChild(div);
      }
      
      terminal.scrollTop = terminal.scrollHeight;
    }

    function newPrompt() {
      input.value = "";
    }

    function showHelp() {
      appendOutput(`:: MAP ::\nCommands:\n- field.new → Create new field note\n- field.list → View all field notes\n- field.edit [number] → Edit field note\n- field.delete [number] → Delete field note\n- log.new → Create log entry\n- log.list → View all log entries\n- log.edit [number] → Edit log entry\n- log.delete [number] → Delete log entry\n- paracosm.new → Add to mindmap/worldbuilding\n- paracosm.list → View paracosm entries\n- paracosm.delete [number] → Delete paracosm entry\n- major.add [number] → Add major system mnemonic\n- major.list → View all mnemonics\n- major.find [number] → Find specific mnemonic\n- major.delete [number] → Delete major mnemonic\n- search [term] → Search local Thrall Project data\n- research [term] → Detailed local research extraction\n- web [term] → Live internet search with links\n- sources [term] → Academic sources and references\n- wiki [term] → Wikipedia research with link\n- scholar [term] → Google Scholar academic search\n- codex → View rites\n- export.json → Download notes as JSON\n- export.opml → Download notes as OPML\n- export.noteplan → Download as NotePlan markdown\n- clear → Clear all stored data\n- status → Show storage info\n- cls → Clear screen\n- map → Show this menu`);
      newPrompt();
    }

    let isMultiLine = false;
    let currentBuffer = [];
    let currentMode = null;
    let editingIndex = -1;

    function runCommand(cmd) {
      if (isMultiLine) {
        if (cmd.toLowerCase() === "save") {
          if (currentMode === "field") {
            const noteContent = currentBuffer.join(" ");
            const noteObj = formatNoteWithTimestamp(noteContent, "field");
            notes.field.push(noteObj);
            appendOutput(`Field note saved. [${noteObj.timestamp}]`);
          } else if (currentMode === "log") {
            const logContent = currentBuffer.join(" ");
            const logObj = formatNoteWithTimestamp(logContent, "log");
            notes.log.push(logObj);
            appendOutput(`Log entry saved. [${logObj.timestamp}]`);
          } else if (currentMode === "paracosm") {
            const paracosmContent = currentBuffer.join(" ");
            const paracosmObj = formatNoteWithTimestamp(paracosmContent, "paracosm");
            notes.paracosm.push(paracosmObj);
            appendOutput(`Paracosm entry saved. [${paracosmObj.timestamp}]`);
          } else if (currentMode === "log-edit") {
            const logContent = currentBuffer.join(" ");
            const originalEntry = notes.log[editingIndex];
            const editedObj = {
              content: logContent,
              timestamp: originalEntry.timestamp,
              type: "log",
              created: originalEntry.created,
              edited: new Date().toISOString(),
              editTimestamp: getTimestamp()
            };
            notes.log[editingIndex] = editedObj;
            appendOutput(`Log entry ${editingIndex + 1} updated. [${editedObj.editTimestamp}]`);
            editingIndex = -1;
          } else if (currentMode === "field-edit") {
            const fieldContent = currentBuffer.join(" ");
            const originalEntry = notes.field[editingIndex];
            const editedObj = {
              content: fieldContent,
              timestamp: originalEntry.timestamp,
              type: "field",
              created: originalEntry.created,
              edited: new Date().toISOString(),
              editTimestamp: getTimestamp()
            };
            notes.field[editingIndex] = editedObj;
            appendOutput(`Field note ${editingIndex + 1} updated. [${editedObj.editTimestamp}]`);
            editingIndex = -1;
          }
          saveToStorage(); // Save to localStorage after adding new note
          isMultiLine = false;
          currentBuffer = [];
          currentMode = null;
          editingIndex = -1;
        } else {
          currentBuffer.push(cmd);
        }
        newPrompt();
      } else if (cmd.startsWith("major.delete ")) {
        const entryNumber = parseInt(cmd.split(" ")[1]);
        
        if (isNaN(entryNumber) || entryNumber < 1 || entryNumber > notes.major.length) {
          appendOutput(`Invalid entry number. Use 1-${notes.major.length}`);
          newPrompt();
          return;
        }
        
        const entryIndex = entryNumber - 1;
        const deletedEntry = notes.major[entryIndex];
        const deletedContent = typeof deletedEntry === 'object' ? deletedEntry.content : deletedEntry;
        
        notes.major.splice(entryIndex, 1);
        saveToStorage();
        appendOutput(`Major mnemonic ${entryNumber} deleted: "${deletedContent.substring(0, 50)}${deletedContent.length > 50 ? '...' : ''}"`);
        newPrompt();
      } else if (cmd.startsWith("paracosm.delete ")) {
        const entryNumber = parseInt(cmd.split(" ")[1]);
        
        if (isNaN(entryNumber) || entryNumber < 1 || entryNumber > notes.paracosm.length) {
          appendOutput(`Invalid entry number. Use 1-${notes.paracosm.length}`);
          newPrompt();
          return;
        }
        
        const entryIndex = entryNumber - 1;
        const deletedEntry = notes.paracosm[entryIndex];
        const deletedContent = typeof deletedEntry === 'object' ? deletedEntry.content : deletedEntry;
        
        notes.paracosm.splice(entryIndex, 1);
        saveToStorage();
        appendOutput(`Paracosm entry ${entryNumber} deleted: "${deletedContent.substring(0, 50)}${deletedContent.length > 50 ? '...' : ''}"`);
        newPrompt();
      } else if (cmd.startsWith("field.edit ")) {
        const entryNumber = parseInt(cmd.split(" ")[1]);
        
        if (isNaN(entryNumber) || entryNumber < 1 || entryNumber > notes.field.length) {
          appendOutput(`Invalid entry number. Use 1-${notes.field.length}`);
          newPrompt();
          return;
        }
        
        const entryIndex = entryNumber - 1;
        const existingEntry = notes.field[entryIndex];
        const existingContent = typeof existingEntry === 'object' ? existingEntry.content : existingEntry;
        
        appendOutput(`Editing field note ${entryNumber}:`);
        appendOutput(`Current: ${existingContent}`);
        appendOutput("Enter new content below. Type 'save' to update.");
        
        editingIndex = entryIndex;
        isMultiLine = true;
        currentMode = "field-edit";
      } else if (cmd.startsWith("field.delete ")) {
        const entryNumber = parseInt(cmd.split(" ")[1]);
        
        if (isNaN(entryNumber) || entryNumber < 1 || entryNumber > notes.field.length) {
          appendOutput(`Invalid entry number. Use 1-${notes.field.length}`);
          newPrompt();
          return;
        }
        
        const entryIndex = entryNumber - 1;
        const deletedEntry = notes.field[entryIndex];
        const deletedContent = typeof deletedEntry === 'object' ? deletedEntry.content : deletedEntry;
        
        notes.field.splice(entryIndex, 1);
        saveToStorage();
        appendOutput(`Field note ${entryNumber} deleted: "${deletedContent.substring(0, 50)}${deletedContent.length > 50 ? '...' : ''}"`);
        newPrompt();
        return; // Important: exit early when in multi-line mode
      } else if (cmd.startsWith("export.json")) {
        const data = JSON.stringify(notes, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'codex_notes.json';
        a.click();
        URL.revokeObjectURL(url);
        appendOutput("Notes exported to codex_notes.json");
        newPrompt();
      } else if (cmd.startsWith("export.noteplan")) {
        const baseDate = new Date().toISOString().split('T')[0];
        let masterContent = `# Codex Terminal Export - ${baseDate}\n\n`;
        
        // Field Notes
        notes.field.forEach((note, i) => {
          const content = typeof note === 'object' ? note.content : note;
          const timestamp = typeof note === 'object' ? note.timestamp : 'No timestamp';
          masterContent += `## Field Note ${i + 1}\n\nCreated: ${timestamp}\n\n${content}\n\n#field-notes #codex\n\n---\n\n`;
        });
        
        // Log Entries
        notes.log.forEach((log, i) => {
          const content = typeof log === 'object' ? log.content : log;
          const timestamp = typeof log === 'object' ? log.timestamp : 'No timestamp';
          masterContent += `## Log Entry ${i + 1}\n\nCreated: ${timestamp}\n\n${content}\n\n#log #codex\n\n---\n\n`;
        });
        
        // Paracosm
        notes.paracosm.forEach((entry, i) => {
          const content = typeof entry === 'object' ? entry.content : entry;
          const timestamp = typeof entry === 'object' ? entry.timestamp : 'No timestamp';
          masterContent += `## Paracosm Entry ${i + 1}\n\nCreated: ${timestamp}\n\n${content}\n\n#paracosm #mindmap #codex\n\n---\n\n`;
        });
        
        const blob = new Blob([masterContent], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `codex_export_${baseDate}.md`;
        a.click();
        URL.revokeObjectURL(url);
        appendOutput("Notes exported as NotePlan markdown");
        newPrompt();
      } else if (cmd.startsWith("export.opml")) {
        const now = new Date().toISOString();
        let opml = `<?xml version="1.0" encoding="UTF-8"?>
<opml version="2.0">
  <head>
    <title>Codex Terminal Notes</title>
    <dateCreated>${now}</dateCreated>
    <dateModified>${now}</dateModified>
    <ownerName>Codex Terminal</ownerName>
  </head>
  <body>
`;

        // Add sections
        ['field', 'log', 'paracosm', 'major'].forEach(type => {
          if (notes[type].length > 0) {
            const title = type.charAt(0).toUpperCase() + type.slice(1);
            opml += `    <outline text="${title}" type="folder">\n`;
            notes[type].forEach((entry, i) => {
              const content = typeof entry === 'object' ? entry.content : entry;
              const escapedContent = content.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
              opml += `      <outline text="${title} ${i + 1}" _note="${escapedContent}" />\n`;
            });
            opml += `    </outline>\n`;
          }
        });

        opml += `  </body>\n</opml>`;

        const blob = new Blob([opml], { type: 'text/x-opml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'codex_notes.opml';
        a.click();
        URL.revokeObjectURL(url);
        appendOutput("Notes exported to codex_notes.opml");
        newPrompt();
      } else if (cmd === "clear") {
        localStorage.removeItem('codex_notes');
        notes = getDefaultNotes();
        appendOutput("All stored data cleared.");
        newPrompt();
      } else if (cmd === "status") {
        const totalNotes = notes.field.length + notes.log.length + notes.paracosm.length + notes.major.length;
        const stored = localStorage.getItem('codex_notes');
        const storageSize = stored ? (stored.length / 1024).toFixed(2) : 0;
        appendOutput(`:: STORAGE STATUS ::\nField Notes: ${notes.field.length}\nLog Entries: ${notes.log.length}\nParacosm Entries: ${notes.paracosm.length}\nMajor System: ${notes.major.length}\nCodex Entries: ${notes.codex.length}\nTotal User Notes: ${totalNotes}\nStorage Used: ${storageSize} KB`);
        newPrompt();
      } else if (cmd.startsWith("web ")) {
        const searchTerm = cmd.substring(4);
        if (!searchTerm) {
          appendOutput("Usage: web [term]");
          newPrompt();
          return;
        }
        
        const links = generateWebLinks(searchTerm);
        const specialized = getSpecializedSources(searchTerm);
        
        appendOutput(`:: LIVE WEB RESEARCH: ${searchTerm.toUpperCase()} ::`);
        appendOutput(`\n--- GENERAL SOURCES ---`);
        appendOutput(`Google Search: ${links.google}`);
        appendOutput(`Wikipedia: ${links.wikipedia}`);
        appendOutput(`Archive.org: ${links.archive}`);
        
        appendOutput(`\n--- ACADEMIC SOURCES ---`);
        appendOutput(`Google Scholar: ${links.scholar}`);
        appendOutput(`JSTOR: ${links.jstor}`);
        appendOutput(`Academia.edu: ${links.academia}`);
        appendOutput(`WorldCat Library: ${links.worldcat}`);
        
        appendOutput(`\n--- TEXT COLLECTIONS ---`);
        appendOutput(`Sacred Texts: ${links.sacred_texts}`);
        appendOutput(`HathiTrust: ${links.hathitrust}`);
        appendOutput(`Project Gutenberg: ${links.gutenberg}`);
        
        if (specialized.length > 0) {
          appendOutput(`\n--- SPECIALIZED SOURCES ---`);
          specialized.forEach(source => {
            appendOutput(`${source.name}: ${source.url}`);
            appendOutput(`  ${source.desc}`);
          });
        }
        
        // Also show local results if available
        const localResults = searchThrallData(searchTerm);
        if (localResults.length > 0) {
          appendOutput(`\n--- LOCAL THRALL DATA ---`);
          appendOutput(`Found ${localResults.length} local entries. Use 'research ${searchTerm}' for details.`);
        }
        
        newPrompt();
      } else if (cmd.startsWith("sources ")) {
        const searchTerm = cmd.substring(8);
        if (!searchTerm) {
          appendOutput("Usage: sources [term]");
          newPrompt();
          return;
        }
        
        const links = generateWebLinks(searchTerm);
        appendOutput(`:: ACADEMIC SOURCES: ${searchTerm.toUpperCase()} ::`);
        appendOutput(`\nClick links to open in new tab:`);
        appendOutput(`\n📚 Google Scholar: ${links.scholar}`);
        appendOutput(`📖 JSTOR Academic: ${links.jstor}`);
        appendOutput(`🎓 Academia.edu: ${links.academia}`);
        appendOutput(`📑 WorldCat Libraries: ${links.worldcat}`);
        appendOutput(`📜 HathiTrust Digital: ${links.hathitrust}`);
        
        const specialized = getSpecializedSources(searchTerm);
        if (specialized.length > 0) {
          appendOutput(`\n🔍 Specialized Sources:`);
          specialized.forEach(source => {
            appendOutput(`   ${source.name}: ${source.url}`);
          });
        }
        
        newPrompt();
      } else if (cmd.startsWith("wiki ")) {
        const searchTerm = cmd.substring(5);
        if (!searchTerm) {
          appendOutput("Usage: wiki [term]");
          newPrompt();
          return;
        }
        
        const wikiUrl = `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(searchTerm)}`;
        appendOutput(`:: WIKIPEDIA RESEARCH: ${searchTerm.toUpperCase()} ::`);
        appendOutput(`\nDirect Wikipedia search:`);
        appendOutput(`🌐 ${wikiUrl}`);
        appendOutput(`\nNote: Click link to open in new tab for detailed research`);
        
        newPrompt();
      } else if (cmd.startsWith("scholar ")) {
        const searchTerm = cmd.substring(8);
        if (!searchTerm) {
          appendOutput("Usage: scholar [term]");
          newPrompt();
          return;
        }
        
        const scholarUrl = `https://scholar.google.com/scholar?q=${encodeURIComponent(searchTerm)}`;
        appendOutput(`:: GOOGLE SCHOLAR: ${searchTerm.toUpperCase()} ::`);
        appendOutput(`\nAcademic paper search:`);
        appendOutput(`🎓 ${scholarUrl}`);
        appendOutput(`\nSearches peer-reviewed papers, theses, books, abstracts and articles`);
        
        newPrompt();
        return;
      }

      if (cmd === "map") {
        showHelp();
      } else if (cmd === "field.new") {
        appendOutput("Enter your field note below. Type 'save' to store.");
        isMultiLine = true;
        currentMode = "field";
      } else if (cmd === "field.list") {
        if (notes.field.length === 0) {
          appendOutput("No field notes found.");
        } else {
          let output = ":: FIELD NOTES ::\n";
          notes.field.forEach((note, i) => {
            if (typeof note === 'object') {
              output += `${i + 1}. [${note.timestamp}] ${note.content}\n`;
            } else {
              output += `${i + 1}. ${note}\n`; // Fallback for old format
            }
          });
          appendOutput(output.trim());
        }
        newPrompt();
      } else if (cmd === "log.new") {
        appendOutput("Enter your log entry below. Type 'save' to store.");
        isMultiLine = true;
        currentMode = "log";
      } else if (cmd === "log.list") {
        if (notes.log.length === 0) {
          appendOutput("No log entries found.");
        } else {
          let output = ":: LOG ENTRIES ::\n";
          notes.log.forEach((entry, i) => {
            if (typeof entry === 'object') {
              const editInfo = entry.editTimestamp ? ` (edited ${entry.editTimestamp})` : '';
              output += `${i + 1}. [${entry.timestamp}] ${entry.content}${editInfo}\n`;
            } else {
              output += `${i + 1}. ${entry}\n`; // Fallback for old format
            }
          });
          appendOutput(output.trim());
        }
        newPrompt();
      } else if (cmd.startsWith("log.edit ")) {
        const entryNumber = parseInt(cmd.split(" ")[1]);
        
        if (isNaN(entryNumber) || entryNumber < 1 || entryNumber > notes.log.length) {
          appendOutput(`Invalid entry number. Use 1-${notes.log.length}`);
          newPrompt();
          return;
        }
        
        const entryIndex = entryNumber - 1;
        const existingEntry = notes.log[entryIndex];
        const existingContent = typeof existingEntry === 'object' ? existingEntry.content : existingEntry;
        
        appendOutput(`Editing log entry ${entryNumber}:`);
        appendOutput(`Current: ${existingContent}`);
        appendOutput("Enter new content below. Type 'save' to update.");
        
        editingIndex = entryIndex;
        isMultiLine = true;
        currentMode = "log-edit";
      } else if (cmd.startsWith("log.delete ")) {
        const entryNumber = parseInt(cmd.split(" ")[1]);
        
        if (isNaN(entryNumber) || entryNumber < 1 || entryNumber > notes.log.length) {
          appendOutput(`Invalid entry number. Use 1-${notes.log.length}`);
          newPrompt();
          return;
        }
        
        const entryIndex = entryNumber - 1;
        const deletedEntry = notes.log[entryIndex];
        const deletedContent = typeof deletedEntry === 'object' ? deletedEntry.content : deletedEntry;
        
        notes.log.splice(entryIndex, 1);
        saveToStorage();
        appendOutput(`Log entry ${entryNumber} deleted: "${deletedContent.substring(0, 50)}${deletedContent.length > 50 ? '...' : ''}"`);
        newPrompt();
      } else if (cmd === "paracosm.new") {
        appendOutput("Enter your paracosm/mindmap entry below. Type 'save' to store.");
        isMultiLine = true;
        currentMode = "paracosm";
      } else if (cmd === "paracosm.list") {
        if (notes.paracosm.length === 0) {
          appendOutput("No paracosm entries found.");
        } else {
          let output = ":: PARACOSM MINDMAP ::\n";
          notes.paracosm.forEach((entry, i) => {
            if (typeof entry === 'object') {
              output += `${i + 1}. [${entry.timestamp}] ${entry.content}\n`;
            } else {
              output += `${i + 1}. ${entry}\n`;
            }
          });
          appendOutput(output.trim());
        }
        newPrompt();
      } else if (cmd.startsWith("major.add ")) {
        const parts = cmd.split(" ");
        if (parts.length < 2) {
          appendOutput("Usage: major.add [number] [mnemonic description]");
          newPrompt();
          return;
        }
        const number = parts[1];
        const description = parts.slice(2).join(" ");
        
        if (!description) {
          appendOutput("Enter mnemonic description for number " + number);
          appendOutput("Usage: major.add " + number + " [your mnemonic]");
          newPrompt();
          return;
        }
        
        const majorObj = formatNoteWithTimestamp(`${number}: ${description}`, "major");
        majorObj.number = parseInt(number);
        notes.major.push(majorObj);
        saveToStorage();
        appendOutput(`Major system mnemonic saved: ${number} = ${description} [${majorObj.timestamp}]`);
        newPrompt();
      } else if (cmd === "major.list") {
        if (notes.major.length === 0) {
          appendOutput("No major system mnemonics found.");
        } else {
          let output = ":: MAJOR SYSTEM MNEMONICS ::\n";
          const sortedMajor = [...notes.major].sort((a, b) => {
            const numA = typeof a === 'object' ? a.number : parseInt(a.split(':')[0]);
            const numB = typeof b === 'object' ? b.number : parseInt(b.split(':')[0]);
            return numA - numB;
          });
          
          sortedMajor.forEach((entry, i) => {
            if (typeof entry === 'object') {
              output += `[${entry.timestamp}] ${entry.content}\n`;
            } else {
              output += `${entry}\n`;
            }
          });
          appendOutput(output.trim());
        }
        newPrompt();
      } else if (cmd.startsWith("major.find ")) {
        const searchNumber = cmd.split(" ")[1];
        const found = notes.major.filter(entry => {
          if (typeof entry === 'object') {
            return entry.number === parseInt(searchNumber) || entry.content.startsWith(searchNumber + ":");
          } else {
            return entry.startsWith(searchNumber + ":");
          }
        });
        
        if (found.length === 0) {
          appendOutput(`No mnemonic found for number: ${searchNumber}`);
        } else {
          appendOutput(":: SEARCH RESULTS ::");
          found.forEach(entry => {
            if (typeof entry === 'object') {
              appendOutput(`[${entry.timestamp}] ${entry.content}`);
            } else {
              appendOutput(entry);
            }
          });
        }
        newPrompt();
      } else if (cmd === "codex") {
        appendOutput(":: CODEX FILES ::");
        notes.codex.forEach((rite, i) => {
          appendOutput(`\n${rite}\n`);
        });
        newPrompt();
      } else if (cmd === "cls") {
        terminal.innerHTML = "";
        newPrompt();
      } else if (cmd.startsWith("search ")) {
        const searchTerm = cmd.substring(7);
        if (!searchTerm) {
          appendOutput("Usage: search [term]");
          newPrompt();
          return;
        }
        
        const results = searchThrallData(searchTerm);
        if (results.length === 0) {
          appendOutput(`No results found for: ${searchTerm}`);
        } else {
          appendOutput(`:: SEARCH RESULTS FOR: ${searchTerm.toUpperCase()} ::`);
          results.forEach((result, i) => {
            appendOutput(`\n${i + 1}. ${result.term.toUpperCase()}`);
            appendOutput(`${result.content.substring(0, 200)}${result.content.length > 200 ? '...' : ''}`);
          });
        }
        newPrompt();
      } else if (cmd.startsWith("research ")) {
        const searchTerm = cmd.substring(9);
        if (!searchTerm) {
          appendOutput("Usage: research [term]");
          newPrompt();
          return;
        }
        
        const results = searchThrallData(searchTerm);
        if (results.length === 0) {
          appendOutput(`No research data found for: ${searchTerm}`);
        } else {
          appendOutput(`:: THRALL PROJECT RESEARCH: ${searchTerm.toUpperCase()} ::`);
          results.forEach((result, i) => {
            appendOutput(`\n--- ${result.term.toUpperCase()} ---`);
            appendOutput(result.content);
            if (i < results.length - 1) appendOutput("");
          });
        }
        newPrompt();
      } else {
        playSound('error');
        appendOutput("Unknown command. Type 'map' for help.");
        newPrompt();
      }
    }

    function handler(e) {
      if (e.key === "Enter") {
        playSound('keypress');
        const cmd = input.value.trim();
        appendOutput("> " + cmd);
        runCommand(cmd);
      } else if (e.key.length === 1) {
        // Play subtle keypress sound for typing
        if (Math.random() < 0.2) playSound('keypress');
      }
    }

    input.addEventListener("keydown", handler);

    loginInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        if (loginInput.value === "blacktongue") {
          enableAudio(); // Enable audio after successful login
          loginScreen.style.display = "none";
          terminal.style.display = "block";
          inputContainer.style.display = "block";
          playSound('startup');
          appendOutput(":: CODEX TERMINAL ACTIVE ::\nType 'map' for commands.");
        } else {
          playSound('error');
          loginInput.value = "";
          loginInput.placeholder = "ACCESS DENIED";
        }
      }
    });
  </script>
</body>
</html>
