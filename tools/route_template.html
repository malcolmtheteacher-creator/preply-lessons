<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Malcolm Hyndman</title>
<style>
:root{--g:#1f3a30;--g2:#2c5242;--gold:#d4a437;--cream:#f8f5ee;--ink:#1d2a24;--mute:#5d6b63;--line:#e4dfd2;--card:#fff;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.5}
a{color:inherit}
.top{background:var(--g);padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
.top a{color:#e9efe9;text-decoration:none;font-size:.9rem;font-weight:600;padding:6px 14px;border-radius:999px}
.top a.on{background:var(--gold);color:var(--g)}
.top a:hover:not(.on){background:rgba(255,255,255,.12)}
.hero{position:relative;color:#fff;padding:64px 20px 56px;background:linear-gradient(120deg,#17302a,#2c5242 60%,#8a6a2a);background-size:cover;background-position:center}
.hero.pic{background-image:linear-gradient(90deg,rgba(23,48,42,.88) 0%,rgba(23,48,42,.55) 55%,rgba(23,48,42,.15) 100%),var(--hp)}
.wrap{max-width:1040px;margin:0 auto}
.kicker{color:var(--gold);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
h1{font-family:var(--serif);font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;margin:.3em 0 .35em;font-weight:400}
.hero p{max-width:560px;font-size:1.15rem;margin:0;opacity:.95}
.step{padding:34px 20px 6px}
.step h2{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin:0 0 4px}
.step .sub{color:var(--mute);margin:0 0 18px}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.goal{position:relative;border:0;border-radius:18px;overflow:hidden;height:170px;padding:0;text-align:left;cursor:pointer;color:#fff;font:inherit;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 6px 18px rgba(31,58,48,.15);transition:transform .12s,box-shadow .12s}
.goal:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(31,58,48,.22)}
.goal .im{position:absolute;inset:0;background-size:cover;background-position:center}
.goal .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(18,32,27,.82) 100%)}
.goal .tx{position:absolute;left:14px;right:14px;bottom:12px}
.goal b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:400;line-height:1.15}
.goal small{display:block;opacity:.88;font-size:.78rem;margin-top:3px;line-height:1.3}
.goal.on{outline:4px solid var(--gold);outline-offset:2px}
.goal.all{background:linear-gradient(150deg,#e9e3d3,#d9d1ba);color:var(--g)}
.goal.all .tx{bottom:auto;top:50%;transform:translateY(-50%);text-align:center;left:10px;right:10px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:2px solid var(--g);background:transparent;color:var(--g);border-radius:999px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.pill.on{background:var(--g);color:#fff}
.next{margin:26px 20px 0}
.nextbox{background:linear-gradient(120deg,var(--g),var(--g2));color:#fff;border-radius:20px;padding:20px 22px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 10px 28px rgba(31,58,48,.25)}
.nextbox small{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-size:.72rem}
.nextbox h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:2px 0 2px}
.nextbox p{margin:0;opacity:.9;max-width:560px}
.go{display:inline-block;background:var(--gold);color:var(--g);font-weight:800;text-decoration:none;padding:13px 24px;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mine{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:14px}.mine span{color:var(--mute)}.mine a{font-weight:700;text-decoration:none;color:var(--g);border:2px solid var(--g);border-radius:999px;padding:6px 14px;font-size:.9rem}.mine .l{display:flex;gap:8px;flex-wrap:wrap}
.res{padding:30px 20px 60px}
.lvl{font-family:var(--serif);font-size:1.35rem;margin:26px 0 12px;display:flex;align-items:baseline;gap:12px}
.lvl small{font-family:var(--sans);color:var(--mute);font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pc{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;text-decoration:none;overflow:hidden;transition:transform .12s,box-shadow .12s}
.pc:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(31,58,48,.14)}
.pc .band{height:7px;background:linear-gradient(90deg,var(--gold),#e9c872)}
.pc .in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .tg{align-self:flex-start;background:#f4ead0;color:#7a5a12;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.pc h4{margin:0;font-family:var(--serif);font-weight:400;font-size:1.25rem;line-height:1.2}
.pc p{margin:0;color:var(--mute);font-size:.93rem;flex:1}
.pc .ft{display:flex;justify-content:space-between;align-items:center;font-size:.84rem;color:var(--mute);margin-top:6px}
.pc .arrow{color:var(--g);font-weight:800}
.bar{height:6px;background:#ece7d8;border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3d8a6a,#6bbf94)}
.none{padding:30px;text-align:center;color:var(--mute)}
.foot{background:var(--g);color:#d7e0da;padding:34px 20px;text-align:center}
.foot a{color:var(--gold);font-weight:700;text-decoration:none;margin:0 10px}
@media(max-width:560px){.hero{padding:44px 16px 40px}.goal{height:140px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="top">
  <a href="journey_general.html">General English</a>
  <a href="journey_professional.html">Professional English</a>
  <a href="journey_academic.html">Academic English</a>
  <a href="explore.html">Explore by interest</a>
  <a href="wordbank/index.html">My Words</a>
  <a href="journey/index.html">My Room</a>
</nav>

<header class="hero" id="hero">
  <div class="wrap"><div class="kicker">Your path</div><h1>{{TITLE}}</h1><p id="line"></p></div>
</header>

<section class="step"><div class="wrap">
  <h2 id="q1"></h2>
  <p class="sub" id="sub1"></p>
  <div class="goals" id="goals"></div>
</div></section>

<section class="step" id="lvstep"><div class="wrap">
  <h2>Where is your English now?</h2>
  <p class="sub">Not sure? Start one step lower — it builds confidence quickly.</p>
  <div class="pills" id="pills"></div>
</div></section>

<div class="next"><div class="wrap" id="mine"></div></div>
<div class="next"><div class="wrap" id="next"></div></div>

<section class="res"><div class="wrap" id="res"></div></section>

<footer class="foot"><a href="malcolm_lesson_index.html">Search every lesson</a><a href="explore.html">Explore by interest</a><a href="wordbank/index.html">My Words</a><a href="journey/index.html">My Room</a></footer>

<script>
/*DATA*/
(function(){
var PAL = [['#2f6f8f','#1c4a63'],['#a8552f','#6e2f18'],['#7a4b8f','#4a2a5e'],['#3f7d5a','#1f4d37'],['#b08a2a','#6b5214'],['#8f3f55','#5a2236'],['#3f5f9a','#243a66']];
Array.prototype.forEach.call(document.querySelectorAll('.top a'), function(a){ if (a.getAttribute('href') === 'journey_' + R.route + '.html') a.className = 'on'; });
var st = {goal:'', level:''};
try { var s = JSON.parse(localStorage.getItem('pl_route_' + R.route) || '{}'); st.goal = s.goal || ''; st.level = s.level || ''; } catch(e){}
var done = {};
try { done = (JSON.parse(localStorage.getItem('wb_v1') || '{}').done) || {}; } catch(e){}
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function save(){ try { localStorage.setItem('pl_route_' + R.route, JSON.stringify(st)); } catch(e){} }
document.getElementById('line').textContent = R.line;
document.getElementById('q1').textContent = R.q1; document.getElementById('sub1').textContent = R.sub1;
if (R.nolevels) { var lv = document.getElementById('lvstep'); if (lv) lv.style.display = 'none'; }
var hero = document.getElementById('hero');
var hi = new Image(); hi.onload = function(){ hero.style.setProperty('--hp', 'url(journey/incoming/routes5/route_' + R.route + '_hero.png)'); hero.className += ' pic'; };
hi.src = 'journey/incoming/routes5/route_' + R.route + '_hero.png';

function goalsHtml(){
  var h = '<button class="goal all' + (!st.goal ? ' on' : '') + '" data-g=""><span class="tx"><b>Show me everything</b></span></button>';
  R.goals.forEach(function(g, gi){
    var c = PAL[gi % PAL.length];
    h += '<button class="goal' + (st.goal === g[0] ? ' on' : '') + '" data-g="' + g[0] + '" style="--c1:' + c[0] + ';--c2:' + c[1] + '"><span class="im" data-im="' + g[0] + '"></span><span class="sh"></span><span class="tx"><b>' + esc(g[1]) + '</b><small>' + esc(g[2]) + '</small></span></button>';
  });
  document.getElementById('goals').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('.goal .im'), function(el){
    var u = 'journey/incoming/routes5/route_' + R.route + '_' + el.dataset.im + '.png', im = new Image();
    im.onload = function(){ el.style.backgroundImage = 'url(' + u + ')'; }; im.src = u;
  });
  Array.prototype.forEach.call(document.querySelectorAll('.goal'), function(b){ b.onclick = function(){ st.goal = b.dataset.g; save(); draw(); }; });
}
function pillsHtml(){
  var h = '<button class="pill' + (!st.level ? ' on' : '') + '" data-l="">Any level</button>';
  R.levels.forEach(function(l){ h += '<button class="pill' + (st.level === l ? ' on' : '') + '" data-l="' + esc(l) + '">' + esc(l) + '</button>'; });
  var el = document.getElementById('pills'); el.innerHTML = h;
  Array.prototype.forEach.call(el.querySelectorAll('.pill'), function(b){ b.onclick = function(){ st.level = b.dataset.l; save(); draw(); }; });
}
function prog(c){
  if (!c.ids.length) return null;
  var n = c.ids.filter(function(i){ return done[i]; }).length;
  return {n: n, t: c.ids.length};
}
function cardHtml(c, i){
  var p = prog(c);
  return '<a class="pc" href="' + esc(c.href) + '"><div class="band"></div><div class="in">' + (c.tag ? '<span class="tg">' + esc(c.tag) + '</span>' : '') +
    '<h4>' + esc(c.name) + '</h4><p>' + esc(c.desc) + '</p>' +
    (p ? '<div class="bar"><i style="width:' + Math.round(p.n / p.t * 100) + '%"></i></div>' : '') +
    '<div class="ft"><span>' + esc(c.meta) + (p && p.n ? ' · ' + p.n + ' of ' + p.t + ' done' : '') + '</span><span class="arrow">Open →</span></div></div></a>';
}
function mineHtml(){
  var n = Object.keys(done).length;
  document.getElementById('mine').innerHTML = '<div class="mine"><span>' + (n ? '<b>' + n + '</b> lesson' + (n === 1 ? '' : 's') + ' in your room so far' : 'Every lesson you open adds words to My Words and an object to My Room') + '</span><div class="l"><a href="wordbank/index.html">My Words</a><a href="journey/index.html">My Room</a></div></div>';
}
function draw(){
  goalsHtml(); pillsHtml(); mineHtml();
  var list = R.cards.filter(function(c){ return (!st.goal || c.goal === st.goal) && (!st.level || c.level === st.level); });
  // where to start: first path at the chosen level (or the lowest available) that is not finished
  var pick = null;
  list.forEach(function(c){ var p = prog(c); if (!pick && (!p || p.n < p.t)) pick = c; });
  var nx = document.getElementById('next');
  if (pick) {
    var p = prog(pick), started = p && p.n > 0;
    nx.innerHTML = '<div class="nextbox"><div><small>' + (started ? 'Pick up where you left off' : 'A good place to start') + '</small><h3>' + esc(pick.name) + '</h3><p>' + esc(pick.desc) + '</p></div><a class="go" href="' + esc(pick.href) + '">' + (started ? 'Continue' : 'Start here') + ' →</a></div>';
  } else nx.innerHTML = '';
  var res = document.getElementById('res');
  if (!list.length) { res.innerHTML = '<div class="none">Nothing here yet for that combination. Try another level or choose “Show me everything”.</div>'; return; }
  var h = '', last = '';
  list.forEach(function(c){
    if (c.level !== last) { if (last) h += '</div>'; last = c.level; h += '<div class="lvl">' + esc(c.level) + '<small>' + esc(c.chapter) + '</small></div><div class="grid">'; }
    h += cardHtml(c);
  });
  res.innerHTML = h + '</div>';
}
draw();
})();
</script>
</body>
</html>
