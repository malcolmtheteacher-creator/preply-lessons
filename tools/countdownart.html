<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CountdownArt">
    <meta name="theme-color" content="#007AFF">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <title>CountdownArt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 16px;
            padding-bottom: 100px;
        }

        .header {
            margin-bottom: 16px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .header-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .header-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            background: #f0f0f0;
            color: #666;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-btn:active {
            transform: scale(0.95);
            background: #e0e0e0;
        }

        .quick-timer-btn {
            padding: 6px 12px;
            background: #FF9500;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .quick-timer-btn:active {
            transform: scale(0.95);
            background: #E68600;
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
        }

        .filter-btn {
            padding: 6px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #007AFF;
            color: white;
            border-color: #007AFF;
        }

        .timers-container {
            margin-top: 12px;
        }

        .timer-card {
            background: white;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .timer-title {
            font-size: 16px;
            font-weight: 500;
            flex: 1;
        }

        .timer-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: #f0f0f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:active {
            background: #e0e0e0;
        }

        .timer-date {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .display-mode-selector {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .display-mode-btn {
            padding: 4px 8px;
            background: #f5f5f5;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
            color: #666;
        }

        .display-mode-btn.active {
            background: #007AFF;
            color: white;
        }

        .sand-bar {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .sand-bar.past-timer {
            background: #f5f5f5;
        }

        .sand-fill {
            height: 100%;
            border-radius: 5px;
        }

        .timer-countdown {
            font-size: 13px;
            color: #666;
            text-align: right;
        }

        .timer-countdown.expired {
            color: #FF3B30;
        }

        .add-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 28px;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,122,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-button:active {
            transform: scale(0.95);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .btn-save {
            background: #007AFF;
            color: white;
        }

        .btn-delete {
            background: #FF3B30;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 14px;
        }

        .log-day {
            margin-bottom: 16px;
        }

        .log-day-header {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #e0e0e0;
        }

        .log-entry {
            background: white;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .log-entry:active {
            background: #f9f9f9;
        }

        .log-entry:has(.log-entry-input) {
            cursor: default;
        }

        .log-entry:has(.log-entry-input):active {
            background: white;
        }

        .log-entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-entry-title {
            font-size: 16px;
            font-weight: 500;
            flex: 1;
        }

        .log-entry-time {
            font-size: 13px;
            color: #666;
        }

        .log-entry-note-container {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f0f0f0;
        }

        .log-entry-note {
            font-size: 14px;
            color: #666;
            font-style: italic;
        }

        .log-entry-add-note {
            font-size: 14px;
            color: #999;
            font-style: italic;
        }

        .log-entry-input {
            width: 100%;
            padding: 8px;
            border: 2px solid #007AFF;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
            background: white;
        }

        .log-entry-input:focus {
            outline: none;
            border-color: #007AFF;
            background: #f8f9ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title-row">
            <h1>CountdownArt</h1>
            <div class="header-buttons">
                <button class="header-btn" id="exportButton" title="Export">↓</button>
                <button class="header-btn" id="importButton" title="Import">↑</button>
                <button class="quick-timer-btn" id="quickTimerButton">+ 30 min</button>
            </div>
        </div>
        <div class="filter-buttons">
            <button class="filter-btn" data-filter="past">Past</button>
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="future">Future</button>
            <button class="filter-btn" data-filter="log">Log</button>
        </div>
        <div class="filter-buttons" style="margin-top: 8px;">
            <button class="filter-btn" data-filter="hour">Next Hour</button>
            <button class="filter-btn" data-filter="day">Today</button>
            <button class="filter-btn" data-filter="week">This Week</button>
            <button class="filter-btn" data-filter="month">This Month</button>
        </div>
    </div>

    <input type="file" id="importFileInput" accept=".json" style="display: none;">

    <div class="timers-container" id="timersContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">⏱️</div>
                        <p>No timers in this period.<br>Try a different filter or add a new timer.</p>
                    </div>
                </div>

    <button class="add-button" id="addButton">+</button>

    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h2 class="modal-title">Delete Timer?</h2>
            <p id="deleteTimerName" style="margin: 16px 0; color: #666;"></p>
            <div class="form-buttons">
                <button type="button" class="btn btn-cancel" id="cancelDeleteButton">Cancel</button>
                <button type="button" class="btn btn-delete" id="confirmDeleteButton">Delete</button>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">New Timer</h2>
            <form id="timerForm">
                <div class="form-group">
                    <label class="form-label">Event Name</label>
                    <input type="text" class="form-input" id="eventName" required="">
                </div>
                <div class="form-group">
                    <label class="form-label">Date &amp; Time</label>
                    <input type="datetime-local" class="form-input" id="eventDate" required="">
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn btn-cancel" id="cancelButton">Cancel</button>
                    <button type="submit" class="btn btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let timers = [];
        let completions = [];
        let currentFilter = 'all';
        let editingId = null;
        let deletingId = null;
        let updateInterval;
        let shownCompletions = new Set(); // Track which timers we've auto-logged

        // Load timers from localStorage
        function loadTimers() {
            const stored = localStorage.getItem('countdownTimers');
            if (stored) {
                timers = JSON.parse(stored);
                // Add displayMode and created timestamp to old timers if missing
                timers = timers.map(t => ({
                    ...t,
                    displayMode: t.displayMode || 'auto',
                    created: t.created || Date.now()
                }));
            }
        }

        // Save timers to localStorage
        function saveTimers() {
            localStorage.setItem('countdownTimers', JSON.stringify(timers));
        }

        // Load completions from localStorage
        function loadCompletions() {
            const stored = localStorage.getItem('countdownCompletions');
            if (stored) {
                completions = JSON.parse(stored);
            }
        }

        // Save completions to localStorage
        function saveCompletions() {
            localStorage.setItem('countdownCompletions', JSON.stringify(completions));
        }

        // Format time remaining based on display mode
        function formatTimeRemaining(ms, displayMode = 'auto') {
            const isExpired = ms < 0;
            const absMs = Math.abs(ms);

            const seconds = Math.floor(absMs / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            const weeks = Math.floor(days / 7);
            const months = Math.floor(days / 30.44); // Average days per month
            const years = Math.floor(days / 365.25); // Account for leap years

            let timeString = '';
            
            switch(displayMode) {
                case 'seconds':
                    timeString = `${seconds.toLocaleString()} seconds`;
                    break;
                case 'minutes':
                    timeString = `${minutes.toLocaleString()} minutes`;
                    break;
                case 'hours':
                    timeString = `${hours.toLocaleString()} hours`;
                    break;
                case 'days':
                    timeString = `${days.toLocaleString()} days`;
                    break;
                case 'weeks':
                    timeString = `${weeks.toLocaleString()} weeks`;
                    break;
                case 'months':
                    timeString = `${months.toLocaleString()} months`;
                    break;
                case 'years':
                    timeString = `${years.toFixed(1)} years`;
                    break;
                case 'auto':
                default:
                    if (years > 0) {
                        const remainingMonths = months % 12;
                        timeString = remainingMonths > 0 ? `${years}y ${remainingMonths}mo` : `${years}y`;
                    } else if (months > 0) {
                        const remainingDays = days - (months * 30);
                        timeString = remainingDays > 0 ? `${months}mo ${remainingDays}d` : `${months}mo`;
                    } else if (days > 0) {
                        timeString = `${days}d ${hours % 24}h ${minutes % 60}m`;
                    } else if (hours > 0) {
                        timeString = `${hours}h ${minutes % 60}m ${seconds % 60}s`;
                    } else if (minutes > 0) {
                        timeString = `${minutes}m ${seconds % 60}s`;
                    } else {
                        timeString = `${seconds}s`;
                    }
            }

            return isExpired ? `${timeString} ago` : timeString;
        }

        // Calculate percentage for sand bar
        function calculatePercentage(timer) {
            const now = Date.now();
            const target = new Date(timer.date).getTime();
            const created = timer.created || now;
            const remaining = target - now;
            
            if (remaining <= 0) return 0;
            
            // Use the original duration as baseline
            const originalDuration = target - created;
            
            // Handle edge case where timer was created in the past or has no duration
            if (originalDuration <= 0) {
                // Fall back to reasonable baseline
                const dayInMs = 24 * 60 * 60 * 1000;
                return Math.min(100, (remaining / dayInMs) * 100);
            }
            
            const percentage = Math.min(100, (remaining / originalDuration) * 100);
            return percentage;
        }

        // Get color for past event based on age
        function getPastEventColor(ms) {
            const absMs = Math.abs(ms);
            const days = absMs / (24 * 60 * 60 * 1000);
            
            if (days < 1) {
                // Less than 1 day: bright orange
                return 'linear-gradient(90deg, #FF9500, #FF6B00)';
            } else if (days < 7) {
                // 1-7 days: orange to yellow
                return 'linear-gradient(90deg, #FFB84D, #FFA500)';
            } else if (days < 30) {
                // 1 week to 1 month: yellow to green
                return 'linear-gradient(90deg, #FFD700, #32CD32)';
            } else if (days < 365) {
                // 1 month to 1 year: green to blue
                return 'linear-gradient(90deg, #32CD32, #4169E1)';
            } else {
                // Over 1 year: blue to gray
                return 'linear-gradient(90deg, #4169E1, #808080)';
            }
        }

        // Filter timers based on selected filter
        function filterTimers() {
            const now = Date.now();
            
            // Check for newly completed timers and auto-log them
            timers.forEach(timer => {
                const targetTime = new Date(timer.date).getTime();
                const isNowPast = targetTime < now;
                
                // If timer just moved to past and not yet logged, auto-log it
                if (isNowPast && !shownCompletions.has(timer.id)) {
                    shownCompletions.add(timer.id);
                    // Auto-log without modal
                    completions.push({
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                        timerId: timer.id,
                        name: timer.name,
                        targetDate: timer.date,
                        completedAt: targetTime,
                        note: ''
                    });
                    saveCompletions();
                }
            });

            if (currentFilter === 'log') {
                return []; // Log view is handled separately
            }

            const hourFromNow = now + (60 * 60 * 1000);
            const endOfDay = new Date();
            endOfDay.setHours(23, 59, 59, 999);
            const endOfWeek = new Date();
            endOfWeek.setDate(endOfWeek.getDate() + (7 - endOfWeek.getDay()));
            endOfWeek.setHours(23, 59, 59, 999);
            const endOfMonth = new Date();
            endOfMonth.setMonth(endOfMonth.getMonth() + 1, 0);
            endOfMonth.setHours(23, 59, 59, 999);

            return timers.filter(timer => {
                const targetTime = new Date(timer.date).getTime();
                
                switch(currentFilter) {
                    case 'past':
                        return targetTime < now;
                    case 'future':
                        return targetTime >= now;
                    case 'hour':
                        return targetTime <= hourFromNow && targetTime >= now;
                    case 'day':
                        return targetTime <= endOfDay.getTime() && targetTime >= now;
                    case 'week':
                        return targetTime <= endOfWeek.getTime() && targetTime >= now;
                    case 'month':
                        return targetTime <= endOfMonth.getTime() && targetTime >= now;
                    default:
                        return true;
                }
            });
        }

        // Render timers
        function renderTimers() {
            // Skip rendering if in log view - it's static
            if (currentFilter === 'log') {
                return;
            }
            
            const container = document.getElementById('timersContainer');
            const filtered = filterTimers();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏱️</div>
                        <p>No timers in this period.<br>Try a different filter or add a new timer.</p>
                    </div>
                `;
                return;
            }

            // Sort timers
            if (currentFilter === 'past') {
                // Past: most recent first (reverse chronological)
                filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            } else {
                // Future/All: soonest first (chronological)
                filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
            }

            container.innerHTML = filtered.map(timer => {
                const now = Date.now();
                const targetTime = new Date(timer.date).getTime();
                const remaining = targetTime - now;
                const isExpired = remaining < 0;
                
                // For past timers, show full colored bar; for future, show draining bar
                let barWidth, barColor;
                if (isExpired) {
                    barWidth = 100;
                    barColor = getPastEventColor(remaining);
                } else {
                    barWidth = calculatePercentage(timer);
                    barColor = 'linear-gradient(90deg, #FF9500, #FF6B00)';
                }
                
                const displayMode = timer.displayMode || 'auto';

                return `
                    <div class="timer-card">
                        <div class="timer-header">
                            <div class="timer-title">${timer.name}</div>
                            <div class="timer-actions">
                                <button class="icon-btn edit-btn" data-id="${timer.id}">✏️</button>
                                <button class="icon-btn delete-btn" data-id="${timer.id}">🗑️</button>
                            </div>
                        </div>
                        <div class="timer-date">${new Date(timer.date).toLocaleString('en-US', { 
                            month: 'short', 
                            day: 'numeric', 
                            year: 'numeric',
                            hour: 'numeric',
                            minute: '2-digit'
                        })}</div>
                        <div class="display-mode-selector">
                            <button class="display-mode-btn ${displayMode === 'auto' ? 'active' : ''}" data-id="${timer.id}" data-mode="auto">Auto</button>
                            <button class="display-mode-btn ${displayMode === 'seconds' ? 'active' : ''}" data-id="${timer.id}" data-mode="seconds">Sec</button>
                            <button class="display-mode-btn ${displayMode === 'minutes' ? 'active' : ''}" data-id="${timer.id}" data-mode="minutes">Min</button>
                            <button class="display-mode-btn ${displayMode === 'hours' ? 'active' : ''}" data-id="${timer.id}" data-mode="hours">Hrs</button>
                            <button class="display-mode-btn ${displayMode === 'days' ? 'active' : ''}" data-id="${timer.id}" data-mode="days">Days</button>
                            <button class="display-mode-btn ${displayMode === 'weeks' ? 'active' : ''}" data-id="${timer.id}" data-mode="weeks">Wks</button>
                            <button class="display-mode-btn ${displayMode === 'months' ? 'active' : ''}" data-id="${timer.id}" data-mode="months">Mon</button>
                            <button class="display-mode-btn ${displayMode === 'years' ? 'active' : ''}" data-id="${timer.id}" data-mode="years">Yrs</button>
                        </div>
                        <div class="sand-bar ${isExpired ? 'past-timer' : ''}">
                            <div class="sand-fill" style="width: ${barWidth}%; background: ${barColor};"></div>
                        </div>
                        <div class="timer-countdown ${isExpired ? 'expired' : ''}">
                            ${formatTimeRemaining(remaining, displayMode)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render completion log
        function renderLog() {
            const container = document.getElementById('timersContainer');
            
            if (completions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>No completed timers logged yet.<br>Timers automatically log when they complete.</p>
                    </div>
                `;
                return;
            }

            // Group completions by date
            const grouped = {};
            completions.forEach(completion => {
                const date = new Date(completion.completedAt).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
                if (!grouped[date]) {
                    grouped[date] = [];
                }
                grouped[date].push(completion);
            });

            // Sort dates (most recent first)
            const sortedDates = Object.keys(grouped).sort((a, b) => {
                return new Date(b) - new Date(a);
            });

            container.innerHTML = sortedDates.map(date => {
                const dayCompletions = grouped[date];
                return `
                    <div class="log-day">
                        <div class="log-day-header">${date} (${dayCompletions.length})</div>
                        ${dayCompletions.map(completion => `
                            <div class="log-entry" data-completion-id="${completion.id}">
                                <div class="log-entry-header">
                                    <div class="log-entry-title">${completion.name}</div>
                                    <div class="log-entry-time">${new Date(completion.completedAt).toLocaleTimeString('en-US', {
                                        hour: 'numeric',
                                        minute: '2-digit'
                                    })}</div>
                                </div>
                                <div class="log-entry-note-container">
                                    ${completion.note ? 
                                        `<div class="log-entry-note">${completion.note}</div>` : 
                                        `<div class="log-entry-add-note">+ Add note</div>`
                                    }
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }).join('');
        }

        // Add/Edit timer
        document.getElementById('timerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('eventName').value;
            const date = document.getElementById('eventDate').value;

            if (editingId) {
                // Edit existing - keep original created time
                const timer = timers.find(t => t.id === editingId);
                if (timer) {
                    timer.name = name;
                    timer.date = date;
                }
                editingId = null;
            } else {
                // Add new
                timers.push({
                    id: Date.now().toString(),
                    name,
                    date,
                    displayMode: 'auto',
                    created: Date.now()
                });
            }

            saveTimers();
            closeModal();
            renderTimers();
        });

        // Quick 30-minute timer
        function createQuickTimer() {
            const now = new Date();
            const thirtyMinutesLater = new Date(now.getTime() + 30 * 60 * 1000);
            
            // Format datetime for display
            const timeString = thirtyMinutesLater.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit' 
            });
            
            // Format date in local timezone for datetime-local input
            const year = thirtyMinutesLater.getFullYear();
            const month = String(thirtyMinutesLater.getMonth() + 1).padStart(2, '0');
            const day = String(thirtyMinutesLater.getDate()).padStart(2, '0');
            const hours = String(thirtyMinutesLater.getHours()).padStart(2, '0');
            const minutes = String(thirtyMinutesLater.getMinutes()).padStart(2, '0');
            const localDateTime = `${year}-${month}-${day}T${hours}:${minutes}`;
            
            timers.push({
                id: Date.now().toString(),
                name: `30 min (${timeString})`,
                date: localDateTime,
                displayMode: 'auto',
                created: Date.now()
            });

            saveTimers();
            renderTimers();
        }

        // Export timers to JSON file
        function exportTimers() {
            const exportData = {
                timers: timers,
                completions: completions,
                exportDate: new Date().toISOString()
            };
            const dataStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const timestamp = new Date().toISOString().slice(0, 10);
            const filename = `countdownart-${timestamp}.json`;
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Import timers from JSON file
        function importTimers(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // Handle both old format (array) and new format (object)
                    let importedTimers, importedCompletions = [];
                    if (Array.isArray(importedData)) {
                        // Old format - just timers
                        importedTimers = importedData;
                    } else {
                        // New format - object with timers and completions
                        importedTimers = importedData.timers || [];
                        importedCompletions = importedData.completions || [];
                    }
                    
                    if (!Array.isArray(importedTimers)) {
                        alert('Invalid file format');
                        return;
                    }
                    
                    // Merge with existing or replace
                    const confirmReplace = confirm(`Import ${importedTimers.length} timers${importedCompletions.length > 0 ? ' and ' + importedCompletions.length + ' completions' : ''}?\n\nOK = Replace all data\nCancel = Add to existing data`);
                    
                    if (confirmReplace) {
                        timers = importedTimers;
                        completions = importedCompletions;
                    } else {
                        // Add imported timers with new IDs to avoid conflicts
                        importedTimers.forEach(timer => {
                            timers.push({
                                ...timer,
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 9)
                            });
                        });
                        // Add imported completions
                        importedCompletions.forEach(completion => {
                            completions.push({
                                ...completion,
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 9)
                            });
                        });
                    }
                    
                    saveTimers();
                    saveCompletions();
                    renderTimers();
                    
                    let message = `Successfully imported ${importedTimers.length} timers`;
                    if (importedCompletions.length > 0) {
                        message += ` and ${importedCompletions.length} completions`;
                    }
                    alert(message + '!');
                } catch (error) {
                    alert('Error reading file: ' + error.message);
                }
            };
            reader.readAsText(file);
            
            // Reset file input
            event.target.value = '';
        }

        // Modal controls
        function openModal() {
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('timerForm').reset();
            document.getElementById('modalTitle').textContent = 'New Timer';
            editingId = null;
        }

        function openDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deletingId = null;
        }

        function showNoteInput(logEntry, completion) {
            const noteContainer = logEntry.querySelector('.log-entry-note-container');
            const currentNote = completion.note || '';
            
            // Don't replace if input already exists
            if (noteContainer.querySelector('.log-entry-input')) {
                return;
            }
            
            // Clear container
            noteContainer.innerHTML = '';
            
            // Create input properly
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'log-entry-input';
            input.value = currentNote;
            input.placeholder = 'Add a note...';
            
            // Add to DOM first, then focus
            noteContainer.appendChild(input);
            
            // Focus immediately
            input.focus();
            
            // Function to save and exit
            const saveAndExit = () => {
                const newNote = input.value.trim();
                completion.note = newNote;
                saveCompletions();
                
                // Replace input with display (don't re-render everything)
                noteContainer.innerHTML = newNote ? 
                    `<div class="log-entry-note">${newNote}</div>` : 
                    `<div class="log-entry-add-note">+ Add note</div>`;
            };
            
            // Save on blur
            input.addEventListener('blur', saveAndExit);
            
            // Save on Enter
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    saveAndExit();
                }
                // Cancel on Escape
                if (e.key === 'Escape') {
                    e.preventDefault();
                    // Restore without saving
                    noteContainer.innerHTML = currentNote ? 
                        `<div class="log-entry-note">${currentNote}</div>` : 
                        `<div class="log-entry-add-note">+ Add note</div>`;
                }
            });
        }

        document.getElementById('addButton').addEventListener('click', openModal);
        document.getElementById('quickTimerButton').addEventListener('click', createQuickTimer);
        document.getElementById('exportButton').addEventListener('click', exportTimers);
        document.getElementById('importButton').addEventListener('click', () => {
            document.getElementById('importFileInput').click();
        });
        document.getElementById('importFileInput').addEventListener('change', importTimers);
        document.getElementById('cancelButton').addEventListener('click', closeModal);
        
        document.getElementById('cancelDeleteButton').addEventListener('click', closeDeleteModal);
        document.getElementById('confirmDeleteButton').addEventListener('click', () => {
            if (deletingId) {
                timers = timers.filter(t => t.id !== deletingId);
                saveTimers();
                renderTimers();
                closeDeleteModal();
            }
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const newFilter = btn.dataset.filter;
                
                // If clicking a time-range filter (hour/day/week/month), clear past/all/future/log
                if (['hour', 'day', 'week', 'month'].includes(newFilter)) {
                    document.querySelectorAll('.filter-btn[data-filter="past"], .filter-btn[data-filter="all"], .filter-btn[data-filter="future"], .filter-btn[data-filter="log"]').forEach(b => b.classList.remove('active'));
                }
                // If clicking past/all/future/log, clear time-range filters
                else if (['past', 'all', 'future', 'log'].includes(newFilter)) {
                    document.querySelectorAll('.filter-btn[data-filter="hour"], .filter-btn[data-filter="day"], .filter-btn[data-filter="week"], .filter-btn[data-filter="month"]').forEach(b => b.classList.remove('active'));
                }
                
                // Clear all filter buttons and activate the clicked one
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentFilter = newFilter;
                
                // Explicitly render log when switching to it
                if (newFilter === 'log') {
                    renderLog();
                } else {
                    renderTimers();
                }
            });
        });

        // Event delegation for timer action buttons
        document.getElementById('timersContainer').addEventListener('click', (e) => {
            // Check if we're in log view and clicking on a log entry
            if (currentFilter === 'log') {
                // If clicking on an input, let it work normally
                if (e.target.classList.contains('log-entry-input')) {
                    return;
                }
                
                const logEntry = e.target.closest('.log-entry');
                if (logEntry) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    
                    const completionId = logEntry.dataset.completionId;
                    const completion = completions.find(c => c.id === completionId);
                    if (completion) {
                        showNoteInput(logEntry, completion);
                    }
                    return;
                }
            }

            // Delete button
            const deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn) {
                e.preventDefault();
                e.stopPropagation();
                const id = deleteBtn.dataset.id;
                const timer = timers.find(t => t.id === id);
                if (timer) {
                    deletingId = id;
                    document.getElementById('deleteTimerName').textContent = timer.name;
                    openDeleteModal();
                }
                return;
            }
            
            // Edit button
            const editBtn = e.target.closest('.edit-btn');
            if (editBtn) {
                e.preventDefault();
                e.stopPropagation();
                const id = editBtn.dataset.id;
                const timer = timers.find(t => t.id === id);
                if (timer) {
                    editingId = id;
                    document.getElementById('modalTitle').textContent = 'Edit Timer';
                    document.getElementById('eventName').value = timer.name;
                    document.getElementById('eventDate').value = timer.date;
                    openModal();
                }
                return;
            }
            
            // Display mode button
            const modeBtn = e.target.closest('.display-mode-btn');
            if (modeBtn) {
                e.preventDefault();
                e.stopPropagation();
                const id = modeBtn.dataset.id;
                const mode = modeBtn.dataset.mode;
                const timer = timers.find(t => t.id === id);
                if (timer) {
                    timer.displayMode = mode;
                    saveTimers();
                    renderTimers();
                }
            }
        });

        // Update timers every second
        function startUpdating() {
            updateInterval = setInterval(renderTimers, 1000);
        }

        function stopUpdating() {
            clearInterval(updateInterval);
        }

        // Visibility handling
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopUpdating();
            } else {
                renderTimers();
                startUpdating();
            }
        });

        // Initialize
        loadTimers();
        loadCompletions();
        renderTimers();
        startUpdating();

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed'));
        }
    </script>


</body></html>
