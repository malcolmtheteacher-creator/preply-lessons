    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #FDF6E3;
            color: #2D3436;
            min-height: 100vh;
            padding: 20px;
        }

        .app {
            max-width: 900px;
            margin: 0 auto;
            background: #FFFEF9;
            border: 3px solid #2D3436;
            border-radius: 12px;
            box-shadow: 6px 6px 0 #2D3436;
            overflow: hidden;
        }

        /* Header */
        header {
            background: #E74C3C;
            color: white;
            padding: 20px;
            border-bottom: 3px solid #2D3436;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            text-shadow: 2px 2px 0 #C0392B;
            margin: 0;
        }

        .project-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #projectSelect {
            padding: 8px 12px;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid #2D3436;
            border-radius: 6px;
            background: #F1C40F;
            color: #2D3436;
            cursor: pointer;
            min-width: 150px;
        }

        #projectSelect:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.3);
        }

        .project-btn {
            width: 36px;
            height: 36px;
            border: 2px solid #2D3436;
            border-radius: 6px;
            background: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .project-btn:hover {
            background: #F1C40F;
        }

        .main-power-bar {
            height: 40px;
            background: #DDD;
            border-radius: 8px;
            border: 2px solid #2D3436;
            overflow: hidden;
            position: relative;
        }

        .main-power-fill {
            height: 100%;
            background: linear-gradient(90deg, 
                #E74C3C 0%, 
                #F39C12 25%, 
                #F1C40F 50%, 
                #2ECC71 75%, 
                #27AE60 100%
            );
            transition: width 0.3s ease;
            border-radius: 6px;
        }

        .main-power-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: #2D3436;
            text-shadow: 1px 1px 0 white;
        }

        /* Task List */
        .task-list {
            padding: 20px;
            min-height: 300px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-style: italic;
        }

        .empty-state span {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        /* Task Item */
        .task-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 10px;
            margin: 8px 0;
            background: #FFFEF9;
            border: 2px solid #2D3436;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .task-item:hover {
            background: #FEF9E7;
        }

        .task-item.selected {
            background: #EBF5FB;
            border-color: #3498DB;
        }

        /* Drag Handle */
        .drag-handle {
            cursor: grab;
            color: #BDC3C7;
            font-size: 14px;
            padding: 0 4px;
            user-select: none;
            letter-spacing: -2px;
        }

        .drag-handle:hover {
            color: #3498DB;
        }

        .task-item:active .drag-handle {
            cursor: grabbing;
        }

        /* Collapse Toggle */
        .collapse-toggle {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            color: #7F8C8D;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .collapse-toggle:hover {
            background: #EBF5FB;
            color: #3498DB;
        }

        .collapse-toggle.invisible {
            visibility: hidden;
        }

        /* Drag States */
        .task-item.dragging {
            opacity: 0.5;
            background: #E3F2FD;
        }

        .task-item.drag-over {
            border-top: 3px solid #3498DB;
            margin-top: -3px;
        }

        .task-item.drag-over-child {
            background: #E8F8F5;
            border-color: #27AE60;
        }

        /* Nested children container */
        .task-children {
            margin-left: 25px;
            padding-left: 15px;
            border-left: 4px solid #3498DB;
        }

        /* Task wrapper includes task + its children */
        .task-wrapper {
            margin: 4px 0;
        }

        /* Task Text Input */
        .task-text {
            flex: 1 1 250px;
            min-width: 200px;
            padding: 10px 12px;
            font-size: 16px;
            border: 2px solid #BDC3C7;
            border-radius: 6px;
            background: white;
            color: #2D3436;
            transition: border-color 0.2s;
            font-family: inherit;
            resize: none;
            overflow: hidden;
            line-height: 1.4;
        }

        .task-text:focus {
            outline: none;
            border-color: #3498DB;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .task-text::placeholder {
            color: #AAA;
            font-style: italic;
        }

        .task-complete .task-text {
            text-decoration: line-through;
            color: #95A5A6;
            background: #F0F0F0;
        }

        /* Power Bar */
        .power-bar-container {
            width: 140px;
            flex-shrink: 0;
        }

        .power-bar {
            height: 30px;
            background: #ECEFF1;
            border-radius: 6px;
            border: 2px solid #2D3436;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .power-bar.computed {
            cursor: default;
            border-style: dashed;
        }

        .power-fill {
            height: 100%;
            background: linear-gradient(90deg, 
                #E74C3C 0%, 
                #F39C12 25%, 
                #F1C40F 50%, 
                #2ECC71 75%, 
                #27AE60 100%
            );
            transition: width 0.2s ease;
        }

        .power-text {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: bold;
            color: #2D3436;
            text-shadow: 1px 1px 0 white;
        }

        /* Task Buttons */
        .task-buttons {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .task-btn {
            width: 32px;
            height: 32px;
            border: 2px solid #2D3436;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add-child {
            background: #3498DB;
            color: white;
        }

        .btn-add-child:hover {
            background: #2980B9;
            transform: scale(1.1);
        }

        .btn-complete {
            background: #95A5A6;
            color: white;
        }

        .btn-complete:hover {
            background: #27AE60;
            transform: scale(1.1);
        }

        .btn-complete.completed {
            background: #27AE60;
        }

        .btn-complete.completed:hover {
            background: #95A5A6;
        }

        .btn-complete:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-complete:disabled:hover {
            background: #95A5A6;
            transform: none;
        }

        .btn-remove {
            background: #E74C3C;
            color: white;
        }

        .btn-remove:hover {
            background: #C0392B;
            transform: scale(1.1);
        }

        .btn-move {
            background: #9B59B6;
            color: white;
        }

        .btn-move:hover {
            background: #8E44AD;
            transform: scale(1.1);
        }

        /* Footer Controls */
        footer {
            background: #3498DB;
            padding: 15px 20px;
            border-top: 3px solid #2D3436;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .control-btn {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid #2D3436;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #F1C40F;
            color: #2D3436;
        }

        .btn-primary:hover {
            background: #F39C12;
            transform: translateY(-2px);
            box-shadow: 0 4px 0 #2D3436;
        }

        .btn-secondary {
            background: #FFFEF9;
            color: #2D3436;
        }

        .btn-secondary:hover {
            background: #FEF9E7;
            transform: translateY(-2px);
            box-shadow: 0 4px 0 #2D3436;
        }

        .btn-reset {
            background: #E74C3C;
            color: white;
        }

        .btn-reset:hover {
            background: #C0392B;
            transform: translateY(-2px);
            box-shadow: 0 4px 0 #2D3436;
        }

        .kbd {
            background: rgba(0,0,0,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
        }

        /* Keyboard Hints */
        .keyboard-hints {
            text-align: center;
            padding: 10px;
            background: #2C3E50;
            color: white;
            font-size: 12px;
        }

        .keyboard-hints span {
            margin: 0 15px;
        }

        .storage-indicator {
            position: fixed;
            bottom: 2px;
            right: 4px;
            font-size: 8px;
            color: #666;
            opacity: 0.5;
        }

        /* Comic Speech Bubble Celebration */
        .speech-bubble {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #FFFEF9;
            border: 4px solid #2D3436;
            border-radius: 20px;
            padding: 20px 30px;
            color: #2D3436;
            z-index: 9999;
            box-shadow: 8px 8px 0 #2D3436;
            max-width: 90vw;
            animation: bubblePop 0.4s ease forwards;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .speech-bubble .character-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .speech-bubble .bubble-text {
            text-align: left;
        }

        .speech-bubble .saying {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.3;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border: 15px solid transparent;
            border-top-color: #2D3436;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border: 12px solid transparent;
            border-top-color: #FFFEF9;
            z-index: 1;
        }

        .speech-bubble .character {
            font-size: 14px;
            color: #7F8C8D;
            margin-top: 8px;
            font-weight: normal;
            font-style: italic;
        }

        @keyframes bubblePop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        @keyframes bubbleFade {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .power-bar-container {
                width: 100px;
            }
            
            .task-text {
                min-width: 150px;
                flex: 1 1 100%;
            }
            
            .task-btn {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
            
            footer {
                flex-direction: column;
            }
            
            .control-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>

<body>
    <div class="app">
        <header>
            <div class="header-top">
                <h1>⚡ PowerUp</h1>
                <div class="project-selector">
                    <select id="projectSelect" onchange="switchProject(this.value)"><option value="My Project" selected="">My Project</option></select>
                    <button class="project-btn" onclick="moveGroupUp()" title="Move Group Up">▲</button>
                    <button class="project-btn" onclick="moveGroupDown()" title="Move Group Down">▼</button>
                    <button class="project-btn" onclick="newProject()" title="New Group">+</button>
                    <button class="project-btn" onclick="renameProject()" title="Rename Group">✏️</button>
                    <button class="project-btn" onclick="deleteProject()" title="Delete Group">🗑️</button>
                </div>
            </div>
            <div class="main-power-bar">
                <div class="main-power-fill" id="mainPowerFill" style="width: 0%"></div>
                <div class="main-power-text" id="mainPowerText">No tasks</div>
            </div>
        </header>

        <div class="task-list" id="taskList" ondragover="handleListDragOver(event)" ondrop="handleListDrop(event)">
                    <div class="empty-state">
                        <span>📋</span>
                        <p>No tasks yet. Click "Add Task" or press Enter to get started!</p>
                    </div>
                </div>

        <footer>
            <button class="control-btn btn-primary" onclick="addTask()">
                ➕ Add Task <span class="kbd">Enter</span>
            </button>
            <button class="control-btn btn-primary" onclick="addSiblingTask()">
                ➕ Add Sibling <span class="kbd">Alt+Enter</span>
            </button>
            <button class="control-btn btn-primary" onclick="addChildTask()">
                ↳ Add Child <span class="kbd">Shift+Enter</span>
            </button>
            <button class="control-btn btn-secondary" onclick="outdentTask()">
                ← Outdent <span class="kbd">Shift+Tab</span>
            </button>
            <button class="control-btn btn-secondary" onclick="moveTaskUp()">
                ▲ Up
            </button>
            <button class="control-btn btn-secondary" onclick="moveTaskDown()">
                ▼ Down
            </button>
            <button class="control-btn btn-reset" onclick="resetSelected()">
                🔄 Reset
            </button>
            <button class="control-btn btn-secondary" onclick="saveDataManual()">
                💾 Save
            </button>
            <button class="control-btn btn-secondary" onclick="loadData()">
                🔄 Reload
            </button>
            <button class="control-btn btn-secondary" onclick="exportJSON()">
                📤 Export
            </button>
            <button class="control-btn btn-secondary" onclick="document.getElementById(&#39;importFile&#39;).click()">
                📥 Import
            </button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
        </footer>

        <div class="keyboard-hints">
            <span><strong>Enter</strong> = Add Task</span>
            <span><strong>Alt+Enter</strong> = Add Sibling</span>
            <span><strong>Shift+Enter</strong> = Add Child</span>
            <span><strong>Shift+Tab</strong> = Outdent</span>
        </div>
        <div class="storage-indicator" id="storageIndicator">0.0%</div>
    </div>

        // Show celebration speech bubble
        function showCelebration(customMessage = null) {
            // Create speech bubble
            const bubble = document.createElement('div');
            bubble.className = 'speech-bubble';
            
            if (customMessage) {
                // Simple notification without character
                bubble.innerHTML = `
                    <div class="bubble-text">
                        <div class="saying">${customMessage}</div>
                    </div>
                `;
            } else {
                // Pick random Tintin saying
                const saying = tintinSayings[Math.floor(Math.random() * tintinSayings.length)];
                const characterImg = CHARACTER_IMAGES[saying.image];
                
                bubble.innerHTML = `
                    <img src="${characterImg}" class="character-img" alt="${saying.character}">
                    <div class="bubble-text">
                        <div class="saying">${saying.text}</div>
                        <div class="character">${saying.character}</div>
                    </div>
                `;
            }
            
            document.body.appendChild(bubble);
            
            // Remove after animation
            setTimeout(() => {
                bubble.style.animation = 'bubbleFade 0.3s ease forwards';
                setTimeout(() => {
                    bubble.remove();
                }, 300);
            }, customMessage ? 1500 : 2000);
        }

        // Get all project names from localStorage
        function getProjectList() {
            const list = localStorage.getItem('powerup-projects');
            if (list) {
                return JSON.parse(list);
            }
            return ['My Project']; // Default project
        }

        // Save project list to localStorage
        function saveProjectList(list) {
            localStorage.setItem('powerup-projects', JSON.stringify(list));
        }

        // Get storage key for a project
        function getProjectKey(projectName) {
            return 'powerup-data-' + projectName;
        }

        // Update the project dropdown
        function updateProjectDropdown() {
            const select = document.getElementById('projectSelect');
            const projects = getProjectList();
            
            select.innerHTML = projects.map(name => 
                `<option value="${name}" ${name === currentProject ? 'selected' : ''}>${name}</option>`
            ).join('');
        }

        // Switch to a different project
        function switchProject(projectName) {
            // Save current project first
            saveData();
            
            // Load new project
            currentProject = projectName;
            loadProjectData();
            updateProjectDropdown();
            
            // Remember this as the last opened project
            localStorage.setItem('powerup-last-project', currentProject);
        }

        // Create a new project
        function newProject() {
            const name = prompt('Enter new group name:');
            if (!name || !name.trim()) return;
            
            const trimmedName = name.trim();
            const projects = getProjectList();
            
            if (projects.includes(trimmedName)) {
                alert('A project with that name already exists!');
                return;
            }
            
            // Save current project
            saveData();
            
            // Add new project
            projects.push(trimmedName);
            saveProjectList(projects);
            
            // Switch to new project with empty tasks
            currentProject = trimmedName;
            tasks = [];
            taskIdCounter = 1;
            selectedTaskId = null;
            saveData();
            
            // Remember this as the last opened project
            localStorage.setItem('powerup-last-project', currentProject);
            
            updateProjectDropdown();
            render();
        }

        // Rename current project
        function renameProject() {
            const newName = prompt('Enter new name for group:', currentProject);
            if (!newName || !newName.trim() || newName.trim() === currentProject) return;
            
            const trimmedName = newName.trim();
            const projects = getProjectList();
            
            if (projects.includes(trimmedName)) {
                alert('A project with that name already exists!');
                return;
            }
            
            // Update project list
            const index = projects.indexOf(currentProject);
            projects[index] = trimmedName;
            saveProjectList(projects);
            
            // Move data to new key
            const oldKey = getProjectKey(currentProject);
            const newKey = getProjectKey(trimmedName);
            const data = localStorage.getItem(oldKey);
            if (data) {
                localStorage.setItem(newKey, data);
                localStorage.removeItem(oldKey);
            }
            
            currentProject = trimmedName;
            
            // Remember this as the last opened project
            localStorage.setItem('powerup-last-project', currentProject);
            
            updateProjectDropdown();
        }

        // Move current group up in the dropdown list
        function moveGroupUp() {
            const projects = getProjectList();
            const index = projects.indexOf(currentProject);
            
            if (projects.length < 2) {
                showCelebration('Only one group!');
                return;
            }
            
            if (index <= 0) {
                showCelebration('Already at top!');
                return;
            }
            
            // Swap with previous
            [projects[index - 1], projects[index]] = [projects[index], projects[index - 1]];
            saveProjectList(projects);
            updateProjectDropdown();
        }

        // Move current group down in the dropdown list
        function moveGroupDown() {
            const projects = getProjectList();
            const index = projects.indexOf(currentProject);
            
            if (projects.length < 2) {
                showCelebration('Only one group!');
                return;
            }
            
            if (index >= projects.length - 1) {
                showCelebration('Already at bottom!');
                return;
            }
            
            // Swap with next
            [projects[index], projects[index + 1]] = [projects[index + 1], projects[index]];
            saveProjectList(projects);
            updateProjectDropdown();
        }

        // Delete current project
        function deleteProject() {
            const projects = getProjectList();
            
            if (projects.length <= 1) {
                alert('Cannot delete the only group!');
                return;
            }
            
            if (!confirm(`Delete project "${currentProject}" and all its tasks?`)) {
                return;
            }
            
            // Remove from project list
            const index = projects.indexOf(currentProject);
            projects.splice(index, 1);
            saveProjectList(projects);
            
            // Remove data
            localStorage.removeItem(getProjectKey(currentProject));
            
            // Switch to first available project
            currentProject = projects[0];
            loadProjectData();
            updateProjectDropdown();
            
            // Remember this as the last opened project
            localStorage.setItem('powerup-last-project', currentProject);
        }

        // Move selected task up among its siblings
        function moveTaskUp() {
            if (!selectedTaskId) {
                alert('Please select a task first');
                return;
            }
            
            const task = findTask(selectedTaskId);
            if (!task) return;
            
            // Get siblings (tasks with same parent) in their current order
            const siblings = tasks.filter(t => t.parentId === task.parentId);
            const currentIndex = siblings.findIndex(t => t.id === selectedTaskId);
            
            if (currentIndex <= 0) {
                showCelebration('Already at top!');
                return;
            }
            
            // Find the sibling above
            const siblingAbove = siblings[currentIndex - 1];
            
            // Get their indices in main tasks array
            const taskIndex = tasks.indexOf(task);
            const siblingIndex = tasks.indexOf(siblingAbove);
            
            // Swap positions in the main tasks array
            tasks[taskIndex] = siblingAbove;
            tasks[siblingIndex] = task;
            
            render();
            saveData();
            
            // Re-select the task after render
            selectTask(selectedTaskId);
        }

        // Move selected task down among its siblings
        function moveTaskDown() {
            if (!selectedTaskId) {
                alert('Please select a task first');
                return;
            }
            
            const task = findTask(selectedTaskId);
            if (!task) return;
            
            // Get siblings (tasks with same parent) in their current order
            const siblings = tasks.filter(t => t.parentId === task.parentId);
            const currentIndex = siblings.findIndex(t => t.id === selectedTaskId);
            
            if (currentIndex >= siblings.length - 1) {
                showCelebration('Already at bottom!');
                return;
            }
            
            // Find the sibling below
            const siblingBelow = siblings[currentIndex + 1];
            
            // Get their indices in main tasks array
            const taskIndex = tasks.indexOf(task);
            const siblingIndex = tasks.indexOf(siblingBelow);
            
            // Swap positions in the main tasks array
            tasks[taskIndex] = siblingBelow;
            tasks[siblingIndex] = task;
            
            render();
            saveData();
            
            // Re-select the task after render
            selectTask(selectedTaskId);
        }

        // Load data for current project
        function loadProjectData() {
            const saved = localStorage.getItem(getProjectKey(currentProject));
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    tasks = data.tasks || [];
                    taskIdCounter = data.taskIdCounter || 1;
                } catch (e) {
                    tasks = [];
                    taskIdCounter = 1;
                }
            } else {
                tasks = [];
                taskIdCounter = 1;
            }
            selectedTaskId = null;
            render();
        }

        // Generate unique ID
        function generateId() {
            return 'task-' + (taskIdCounter++);
        }

        // Find a task by ID
        function findTask(taskId) {
            return tasks.find(t => t.id === taskId);
        }

        // Get effective power (own power if no children, average of children if has children)
        function getEffectivePower(taskId) {
            const children = tasks.filter(t => t.parentId === taskId);
            
            if (children.length === 0) {
                const task = findTask(taskId);
                return task ? task.power : 0;
            }
            
            // Calculate average of children's effective power (recursive)
            const totalPower = children.reduce((sum, child) => sum + getEffectivePower(child.id), 0);
            return Math.round(totalPower / children.length);
        }

        // Update parent power values up the chain (syncs stored power with calculated)
        function updateParentPowers(taskId) {
            if (!taskId) return;
            
            const task = findTask(taskId);
            if (!task) return;
            
            // Update this task's stored power to match its effective power
            const children = tasks.filter(t => t.parentId === taskId);
            if (children.length > 0) {
                task.power = getEffectivePower(taskId);
            }
            
            // Recurse up to parent
            if (task.parentId) {
                updateParentPowers(task.parentId);
            }
        }

        // Create a new task object
        function createTask(text = '', power = 50, parentId = null) {
            return {
                id: generateId(),
                text: text,
                power: power,
                parentId: parentId,
                collapsed: false
            };
        }

        // Add a new top-level task
        function addTask() {
            // If a task is selected, insert new task right after it (same level)
            if (selectedTaskId) {
                const selectedTask = findTask(selectedTaskId);
                if (selectedTask) {
                    // Create task at same level as selected (same parent)
                    const task = createTask('', 0, selectedTask.parentId);
                    
                    // Find position of selected task and insert after it
                    const selectedIndex = tasks.findIndex(t => t.id === selectedTaskId);
                    tasks.splice(selectedIndex + 1, 0, task);
                    
                    selectedTaskId = task.id;
                    render();
                    
                    // Focus the new task's input immediately
                    const input = document.getElementById('input-' + task.id);
                    if (input) {
                        input.focus();
                        input.click(); // Extra click for iPad
                    }
                    return;
                }
            }
            
            // No selection - add to bottom as root task
            const task = createTask('', 0, null);
            tasks.push(task);
            selectedTaskId = task.id;
            render();
            
            // Focus the new task's input immediately
            const input = document.getElementById('input-' + task.id);
            if (input) {
                input.focus();
                input.click(); // Extra click for iPad
            }
        }

        // Add a child task to selected task
        function addChildTask() {
            if (!selectedTaskId) {
                alert('Please select a task first (click on it)');
                return;
            }
            
            const task = createTask('', 0, selectedTaskId);
            tasks.push(task);
            const newTaskId = task.id;
            selectedTaskId = newTaskId;
            render();
            
            // Focus the new task's input immediately
            const input = document.getElementById('input-' + newTaskId);
            if (input) {
                input.focus();
                input.click(); // Extra click for iPad
            }
        }

        // Add a sibling task (same level as selected task)
        function addSiblingTask() {
            if (!selectedTaskId) {
                alert('Please select a task first (click on it)');
                return;
            }
            
            // Get the parent of the selected task (could be null for root tasks)
            const selectedTask = tasks.find(t => t.id === selectedTaskId);
            const parentId = selectedTask ? selectedTask.parentId : null;
            
            const task = createTask('', 0, parentId);
            
            // Insert right after the selected task
            const selectedIndex = tasks.findIndex(t => t.id === selectedTaskId);
            tasks.splice(selectedIndex + 1, 0, task);
            
            const newTaskId = task.id;
            selectedTaskId = newTaskId;
            render();
            
            // Focus the new task's input immediately
            const input = document.getElementById('input-' + newTaskId);
            if (input) {
                input.focus();
                input.click(); // Extra click for iPad
            }
        }

        // Add child to specific task (from + button)
        function addChildToTask(parentId) {
            selectedTaskId = parentId;
            addChildTask();
        }

        // Outdent task - move it up one level in hierarchy
        function outdentTask() {
            if (!selectedTaskId) {
                alert('Please select a task first (click on it)');
                return;
            }
            
            const task = findTask(selectedTaskId);
            if (!task) return;
            
            if (!task.parentId) {
                alert('This task is already at root level');
                return;
            }
            
            // Find the parent task
            const parent = findTask(task.parentId);
            
            // Set task's parent to grandparent (or null if parent is at root)
            task.parentId = parent ? parent.parentId : null;
            
            render();
            saveData();
        }

        // Reset selected task and all its children to 0%
        function resetSelected() {
            if (!selectedTaskId) {
                alert('Please select a task first (click on it)');
                return;
            }
            
            const task = findTask(selectedTaskId);
            if (!task) return;
            
            // Count tasks being reset
            let resetCount = 1;
            
            // Reset this task
            task.power = 0;
            task.completed = false;
            
            // Reset all descendants
            function resetDescendants(parentId) {
                tasks.forEach(t => {
                    if (t.parentId === parentId) {
                        t.power = 0;
                        t.completed = false;
                        resetCount++;
                        resetDescendants(t.id);
                    }
                });
            }
            resetDescendants(task.id);
            
            // Update parent powers up the chain
            updateParentPowers(task.parentId);
            
            render();
            saveData();
            
            showCelebration(`Reset ${resetCount} task${resetCount > 1 ? 's' : ''} to 0%!`);
        }

        // Remove a task and all its children
        function removeTask(taskId) {
            // Get all descendant IDs
            const idsToRemove = [taskId];
            function findDescendants(parentId) {
                tasks.forEach(t => {
                    if (t.parentId === parentId) {
                        idsToRemove.push(t.id);
                        findDescendants(t.id);
                    }
                });
            }
            findDescendants(taskId);
            
            // Remove all
            tasks = tasks.filter(t => !idsToRemove.includes(t.id));
            
            if (selectedTaskId === taskId || idsToRemove.includes(selectedTaskId)) {
                selectedTaskId = null;
            }
            
            render();
        }

        // Move task (and its children) to another project
        function moveTaskToProject(taskId) {
            const projects = getProjectList();
            const otherProjects = projects.filter(p => p !== currentProject);
            
            if (otherProjects.length === 0) {
                alert('No other projects to move to!\n\nCreate a new project first using the + button.');
                return;
            }
            
            // Build selection prompt
            const task = findTask(taskId);
            const taskName = task.text || '(unnamed task)';
            
            let message = `Move "${taskName}" to which project?\n\n`;
            otherProjects.forEach((p, i) => {
                message += `${i + 1}. ${p}\n`;
            });
            message += `\nEnter number (1-${otherProjects.length}):`;
            
            const choice = prompt(message);
            if (!choice) return;
            
            const index = parseInt(choice) - 1;
            if (isNaN(index) || index < 0 || index >= otherProjects.length) {
                alert('Invalid selection');
                return;
            }
            
            const targetProject = otherProjects[index];
            
            // Gather task and all descendants
            const tasksToMove = [task];
            function findDescendants(parentId) {
                tasks.forEach(t => {
                    if (t.parentId === parentId) {
                        tasksToMove.push(t);
                        findDescendants(t.id);
                    }
                });
            }
            findDescendants(taskId);
            
            // Remove from current project
            const idsToRemove = tasksToMove.map(t => t.id);
            tasks = tasks.filter(t => !idsToRemove.includes(t.id));
            
            if (selectedTaskId && idsToRemove.includes(selectedTaskId)) {
                selectedTaskId = null;
            }
            
            // Save current project
            saveData();
            
            // Load target project, add tasks, save
            const targetKey = getProjectKey(targetProject);
            let targetTasks = [];
            let targetCounter = 1;
            
            const targetData = localStorage.getItem(targetKey);
            if (targetData) {
                const parsed = JSON.parse(targetData);
                targetTasks = parsed.tasks || [];
                targetCounter = parsed.taskIdCounter || 1;
            }
            
            // Make the moved task a root task in new project (parentId = null)
            // but preserve internal hierarchy
            tasksToMove.forEach(t => {
                if (t.id === taskId) {
                    t.parentId = null; // Root in new project
                }
            });
            
            // Add to target
            targetTasks.push(...tasksToMove);
            
            // Update counter if needed
            tasksToMove.forEach(t => {
                const num = parseInt(t.id.replace('task-', ''));
                if (num >= targetCounter) {
                    targetCounter = num + 1;
                }
            });
            
            // Save target project
            localStorage.setItem(targetKey, JSON.stringify({
                tasks: targetTasks,
                taskIdCounter: targetCounter
            }));
            
            alert(`Moved "${taskName}" to "${targetProject}"!`);
            render();
        }

        // Update task text
        function updateTaskText(taskId, text) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.text = text;
            }
        }

        // Auto-grow textarea to fit content
        function autoGrow(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Auto-grow all textareas after render
        function autoGrowAll() {
            document.querySelectorAll('.task-text').forEach(textarea => {
                autoGrow(textarea);
            });
        }

        // Update task power
        function updateTaskPower(taskId, power) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                // Record ancestor states before change
                const ancestorsBefore = getAncestorPowers(taskId);
                
                const wasBelowComplete = task.power < 100;
                const newPower = Math.max(0, Math.min(100, power));
                task.power = newPower;
                
                // Celebrate when reaching 100!
                if (wasBelowComplete && task.power === 100) {
                    showCelebration();
                }
                
                // Check if any ancestor now reaches 100% (when power increased)
                if (newPower > (task.power || 0)) {
                    checkAncestorCompletion(taskId, ancestorsBefore);
                }
                
                render();
            }
        }

        // Select a task (don't re-render if already selected to keep focus)
        function selectTask(taskId) {
            if (selectedTaskId === taskId) {
                return; // Already selected, don't re-render
            }
            selectedTaskId = taskId;
            
            // Just update the visual selection without full re-render
            document.querySelectorAll('.task-item').forEach(el => {
                el.classList.remove('selected');
            });
            const taskEl = document.querySelector(`[data-id="${taskId}"]`);
            if (taskEl) {
                taskEl.classList.add('selected');
            }
        }

        // Get task depth (for hierarchy bars)
        function getTaskDepth(taskId) {
            let depth = 0;
            let task = tasks.find(t => t.id === taskId);
            while (task && task.parentId) {
                depth++;
                task = tasks.find(t => t.id === task.parentId);
            }
            return depth;
        }

        // Get children of a task
        function getChildren(parentId) {
            return tasks.filter(t => t.parentId === parentId);
        }

        // Get tasks in display order (respecting hierarchy)
        function getTasksInOrder() {
            const result = [];
            
            function addTaskAndChildren(parentId) {
                const children = tasks.filter(t => t.parentId === parentId);
                children.forEach(task => {
                    result.push(task);
                    addTaskAndChildren(task.id);
                });
            }
            
            // Start with root tasks (no parent)
            const rootTasks = tasks.filter(t => t.parentId === null);
            rootTasks.forEach(task => {
                result.push(task);
                addTaskAndChildren(task.id);
            });
            
            return result;
        }

        // Calculate average power of all tasks
        function calculateAveragePower() {
            // Only average root-level tasks (parentId === null)
            // Use getEffectivePower for accurate calculation (handles parent power from children)
            const rootTasks = tasks.filter(t => t.parentId === null);
            if (rootTasks.length === 0) return 0;
            const total = rootTasks.reduce((sum, t) => sum + getEffectivePower(t.id), 0);
            return Math.round(total / rootTasks.length);
        }

        // Handle power bar click with edge snapping
        function handlePowerBarClick(e, taskId) {
            const bar = e.currentTarget;
            const rect = bar.getBoundingClientRect();
            const x = e.clientX - rect.left;
            let percentage = Math.round((x / rect.width) * 100);
            
            // Edge snapping - snap to 0% or 100% when close to edges
            if (percentage <= 10) {
                percentage = 0;
            } else if (percentage >= 90) {
                percentage = 100;
            }
            
            updateTaskPower(taskId, percentage);
        }
        
        // Toggle task complete (100%) or reset (0%)
        function toggleComplete(taskId, event) {
            event.stopPropagation();
            const task = findTask(taskId);
            if (!task) return;
            
            // Record ancestor states before change
            const ancestorsBefore = getAncestorPowers(taskId);
            
            // Toggle between 0 and 100
            const wasComplete = task.power === 100;
            task.power = wasComplete ? 0 : 100;
            
            // Celebrate when completing!
            if (!wasComplete && task.power === 100) {
                showCelebration();
            }
            
            // Check if any ancestor now reaches 100% (when we completed this task)
            if (!wasComplete) {
                checkAncestorCompletion(taskId, ancestorsBefore);
            }
            
            render();
            saveData();
        }
        
        // Get effective power of all ancestors
        function getAncestorPowers(taskId) {
            const powers = {};
            const task = findTask(taskId);
            if (!task || !task.parentId) return powers;
            
            let parentId = task.parentId;
            while (parentId) {
                powers[parentId] = getEffectivePower(parentId);
                const parent = findTask(parentId);
                parentId = parent ? parent.parentId : null;
            }
            return powers;
        }
        
        // Check if any ancestor newly completed
        function checkAncestorCompletion(taskId, beforePowers) {
            const task = findTask(taskId);
            if (!task || !task.parentId) return;
            
            let parentId = task.parentId;
            while (parentId) {
                const before = beforePowers[parentId] || 0;
                const after = getEffectivePower(parentId);
                
                if (before < 100 && after === 100) {
                    // Parent just completed! Celebrate!
                    setTimeout(() => showCelebration(), 100);
                    return; // Only one celebration
                }
                
                const parent = findTask(parentId);
                parentId = parent ? parent.parentId : null;
            }
        }

        // Toggle collapse/expand for a task
        function toggleCollapse(taskId) {
            const task = findTask(taskId);
            if (!task) return;
            
            task.collapsed = !task.collapsed;
            render();
            saveData();
        }

        // Drag and Drop state
        let draggedTaskId = null;

        function handleDragStart(event, taskId) {
            draggedTaskId = taskId;
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', taskId);
            
            // Add dragging class after a tiny delay so it doesn't affect the drag image
            setTimeout(() => {
                const el = document.querySelector(`[data-id="${taskId}"]`);
                if (el) el.classList.add('dragging');
            }, 0);
        }

        // Handle dragover on the task list container (for root-level drops)
        function handleListDragOver(event) {
            // Only allow if it's external data (text), not a task being dragged
            if (!draggedTaskId) {
                event.preventDefault();
                event.dataTransfer.dropEffect = 'copy';
            }
        }

        // Handle drop on the task list container (creates root-level tasks)
        function handleListDrop(event) {
            // Only handle if this is external text, not a task
            if (draggedTaskId) return;
            
            const textData = event.dataTransfer.getData('text/plain');
            if (textData) {
                event.preventDefault();
                // Create root-level tasks (null parentId)
                createSubtasksFromText(null, textData);
            }
        }

        function handleDragOver(event, taskId) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            
            // Determine if dropping above (reorder) or onto (make child)
            const el = event.currentTarget;
            const rect = el.getBoundingClientRect();
            const midpoint = rect.top + rect.height / 2;
            
            // Remove previous states
            el.classList.remove('drag-over', 'drag-over-child');
            
            if (event.clientY < midpoint) {
                // Upper half - insert before
                el.classList.add('drag-over');
            } else {
                // Lower half - make child
                el.classList.add('drag-over-child');
            }
        }

        function handleDragEnter(event) {
            event.preventDefault();
        }

        function handleDragLeave(event) {
            const el = event.currentTarget;
            el.classList.remove('drag-over', 'drag-over-child');
        }

        function handleDrop(event, targetTaskId) {
            event.preventDefault();
            
            const el = event.currentTarget;
            const isDropAbove = el.classList.contains('drag-over');
            const isDropAsChild = el.classList.contains('drag-over-child');
            
            el.classList.remove('drag-over', 'drag-over-child');
            
            // Check if this is a text drop (comma-separated items)
            const textData = event.dataTransfer.getData('text/plain');
            if (textData && !draggedTaskId) {
                // This is external text being dropped - create subtasks!
                createSubtasksFromText(targetTaskId, textData);
                return;
            }
            
            if (!draggedTaskId || draggedTaskId === targetTaskId) return;
            
            const draggedTask = findTask(draggedTaskId);
            const targetTask = findTask(targetTaskId);
            
            if (!draggedTask || !targetTask) return;
            
            // Prevent dropping a parent onto its own descendant
            if (isDescendant(targetTaskId, draggedTaskId)) {
                return;
            }
            
            if (isDropAsChild) {
                // Make dragged task a child of target
                draggedTask.parentId = targetTaskId;
                // Expand the target so user can see the new child
                targetTask.collapsed = false;
            } else if (isDropAbove) {
                // Insert dragged task before target (same parent as target)
                draggedTask.parentId = targetTask.parentId;
                
                // Reorder: move dragged task to position just before target
                const siblings = tasks.filter(t => t.parentId === targetTask.parentId);
                const targetIndex = siblings.findIndex(t => t.id === targetTaskId);
                
                // Remove dragged task from array and reinsert at correct position
                const draggedIndex = tasks.findIndex(t => t.id === draggedTaskId);
                tasks.splice(draggedIndex, 1);
                
                // Find new target index (may have shifted)
                const newTargetIndex = tasks.findIndex(t => t.id === targetTaskId);
                tasks.splice(newTargetIndex, 0, draggedTask);
            }
            
            render();
            saveData();
        }

        // Create subtasks from comma-separated text
        function createSubtasksFromText(parentTaskId, text) {
            // Split by comma, semicolon, or newline
            const items = text.split(/[,;\n]+/)
                              .map(item => item.trim())
                              .filter(item => item.length > 0);
            
            if (items.length === 0) return;
            
            if (parentTaskId) {
                const parentTask = findTask(parentTaskId);
                if (parentTask) {
                    parentTask.collapsed = false; // Expand to show new children
                }
            }
            
            // Create a subtask for each item
            items.forEach(item => {
                const newTask = {
                    id: 'task-' + taskIdCounter++,
                    text: item,
                    power: 0,
                    completed: false,
                    parentId: parentTaskId,
                    collapsed: false
                };
                tasks.push(newTask);
            });
            
            // Update parent power if there is a parent
            if (parentTaskId) {
                updateParentPowers(parentTaskId);
            }
            
            render();
            saveData();
            
            // Show confirmation
            const taskWord = parentTaskId ? 'subtasks' : 'tasks';
            showCelebration(`Added ${items.length} ${taskWord}!`);
        }

        function handleDragEnd(event) {
            draggedTaskId = null;
            
            // Remove all drag classes
            document.querySelectorAll('.task-item').forEach(el => {
                el.classList.remove('dragging', 'drag-over', 'drag-over-child');
            });
        }

        // Check if potentialChild is a descendant of parentId
        function isDescendant(potentialChildId, parentId) {
            const children = tasks.filter(t => t.parentId === parentId);
            for (const child of children) {
                if (child.id === potentialChildId) return true;
                if (isDescendant(potentialChildId, child.id)) return true;
            }
            return false;
        }

        // Render a single task item (just the task row, not children)
        function renderTaskRow(task) {
            const isSelected = selectedTaskId === task.id;
            const hasChildren = tasks.some(t => t.parentId === task.id);
            const isCollapsed = task.collapsed || false;
            
            // Use effective power (aggregate of children if has children)
            const displayPower = hasChildren ? getEffectivePower(task.id) : task.power;
            const isComplete = displayPower === 100;
            
            return `
                <div class="task-item ${isSelected ? 'selected' : ''} ${isComplete ? 'task-complete' : ''}" 
                     data-id="${task.id}"
                     draggable="true"
                     ondragstart="handleDragStart(event, '${task.id}')"
                     ondragover="handleDragOver(event, '${task.id}')"
                     ondragenter="handleDragEnter(event)"
                     ondragleave="handleDragLeave(event)"
                     ondrop="handleDrop(event, '${task.id}')"
                     ondragend="handleDragEnd(event)"
                     onclick="selectTask('${task.id}')">
                    
                    <div class="drag-handle" title="Drag to reorder">⋮⋮</div>
                    
                    <button class="collapse-toggle ${hasChildren ? '' : 'invisible'}" 
                            onclick="event.stopPropagation(); toggleCollapse('${task.id}')"
                            title="${isCollapsed ? 'Expand' : 'Collapse'}">
                        ${isCollapsed ? '▶' : '▼'}
                    </button>
                    
                    <textarea 
                           class="task-text" 
                           id="input-${task.id}"
                           placeholder="Type task name here..."
                           oninput="updateTaskText('${task.id}', this.value); autoGrow(this)"
                           onclick="event.stopPropagation()"
                           autocomplete="off"
                           autocorrect="off"
                           rows="1"
                           spellcheck="false"></textarea>
                    
                    <div class="power-bar-container">
                        <div class="power-bar ${hasChildren ? 'computed' : ''}" 
                             onclick="event.stopPropagation(); ${hasChildren ? '' : `handlePowerBarClick(event, '${task.id}')`}"
                             title="${hasChildren ? 'Computed from subtasks' : 'Click to set completion'}">
                            <div class="power-fill" style="width: ${displayPower}%"></div>
                            <div class="power-text">${displayPower}%</div>
                        </div>
                    </div>
                    
                    <div class="task-buttons">
                        <button class="task-btn btn-complete ${isComplete ? 'completed' : ''}" 
                                onclick="event.stopPropagation(); ${hasChildren ? '' : `toggleComplete('${task.id}', event)`}"
                                ${hasChildren ? 'disabled' : ''}
                                title="${hasChildren ? 'Complete subtasks instead' : 'Toggle complete'}">✓</button>
                        <button class="task-btn btn-add-child" 
                                onclick="event.stopPropagation(); addChildToTask('${task.id}')"
                                title="Add child task">+</button>
                        <button class="task-btn btn-move" 
                                onclick="event.stopPropagation(); moveTaskToProject('${task.id}')"
                                title="Move to another project">📁</button>
                        <button class="task-btn btn-remove" 
                                onclick="event.stopPropagation(); removeTask('${task.id}')"
                                title="Remove task">−</button>
                    </div>
                </div>
            `;
        }

        // Render a task and all its children recursively
        function renderTaskWithChildren(task) {
            const children = tasks.filter(t => t.parentId === task.id);
            const isCollapsed = task.collapsed || false;
            
            let childrenHtml = '';
            if (children.length > 0 && !isCollapsed) {
                childrenHtml = `
                    <div class="task-children">
                        ${children.map(child => renderTaskWithChildren(child)).join('')}
                    </div>
                `;
            }
            
            return `
                <div class="task-wrapper">
                    ${renderTaskRow(task)}
                    ${childrenHtml}
                </div>
            `;
        }

        // Main render function
        function render() {
            const taskList = document.getElementById('taskList');
            
            // Get only root-level tasks (no parent)
            const rootTasks = tasks.filter(t => t.parentId === null);
            
            if (rootTasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <span>📋</span>
                        <p>No tasks yet. Click "Add Task" or press Enter to get started!</p>
                    </div>
                `;
            } else {
                // Render root tasks with their children recursively
                taskList.innerHTML = rootTasks.map(task => renderTaskWithChildren(task)).join('');
                
                // Set input values AFTER DOM is created
                tasks.forEach(task => {
                    const input = document.getElementById('input-' + task.id);
                    if (input) {
                        input.value = task.text;
                    }
                });
                
                // Auto-grow all textareas to fit content
                autoGrowAll();
            }
            
            // Update main power bar
            const avgPower = calculateAveragePower();
            document.getElementById('mainPowerFill').style.width = avgPower + '%';
            document.getElementById('mainPowerText').textContent = 
                tasks.length === 0 ? 'No tasks' : `Overall: ${avgPower}%`;
        }

        // Save to localStorage
        function saveData() {
            const data = {
                tasks: tasks,
                taskIdCounter: taskIdCounter,
                timestamp: Date.now()
            };
            localStorage.setItem(getProjectKey(currentProject), JSON.stringify(data));
            updateStorageIndicator();
        }
        
        // Manual save with confirmation
        function saveDataManual() {
            saveData();
            alert('✅ Saved successfully!');
        }

        // Update tiny storage indicator
        function updateStorageIndicator() {
            let total = 0;
            for (let key in localStorage) {
                if (localStorage.hasOwnProperty(key)) {
                    total += localStorage[key].length * 2; // UTF-16 = 2 bytes per char
                }
            }
            const maxBytes = 5 * 1024 * 1024; // 5MB typical limit
            const percent = ((total / maxBytes) * 100).toFixed(1);
            const el = document.getElementById('storageIndicator');
            if (el) el.textContent = percent + '%';
        }

        // Load from localStorage (manual reload)
        function loadData() {
            loadProjectData();
            alert('✅ Loaded successfully!');
        }

        // Export to JSON file
        async function exportJSON() {
            const data = {
                projectName: currentProject,
                tasks: tasks,
                taskIdCounter: taskIdCounter,
                exportedAt: new Date().toISOString()
            };
            
            const json = JSON.stringify(data, null, 2);
            const safeName = currentProject.replace(/[^a-z0-9]/gi, '-').toLowerCase();
            const defaultFilename = 'powerup-' + safeName + '-' + new Date().toISOString().slice(0,10) + '.json';
            
            // Try to use File System Access API (Chrome/Edge) for save picker
            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: defaultFilename,
                        types: [{
                            description: 'JSON Files',
                            accept: { 'application/json': ['.json'] }
                        }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(json);
                    await writable.close();
                    showCelebration('Exported successfully!');
                    return;
                } catch (err) {
                    // User cancelled or error - fall through to legacy method
                    if (err.name === 'AbortError') return; // User cancelled
                    console.log('Save picker failed, using fallback:', err);
                }
            }
            
            // Fallback for browsers without File System Access API
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = defaultFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Import from JSON file
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.tasks && Array.isArray(data.tasks)) {
                        // If file has a project name, offer to create/switch to it
                        if (data.projectName && data.projectName !== currentProject) {
                            const useProjectName = confirm(`Import into new project "${data.projectName}"?\n\nOK = Create/switch to "${data.projectName}"\nCancel = Import into current project "${currentProject}"`);
                            
                            if (useProjectName) {
                                const projects = getProjectList();
                                if (!projects.includes(data.projectName)) {
                                    projects.push(data.projectName);
                                    saveProjectList(projects);
                                }
                                currentProject = data.projectName;
                                updateProjectDropdown();
                                
                                // Remember this as the last opened project
                                localStorage.setItem('powerup-last-project', currentProject);
                            }
                        }
                        
                        tasks = data.tasks;
                        taskIdCounter = data.taskIdCounter || (tasks.length + 1);
                        selectedTaskId = null;
                        render();
                        saveData();
                        alert('✅ Imported ' + tasks.length + ' tasks into "' + currentProject + '"!');
                    } else {
                        alert('❌ Invalid file format');
                    }
                } catch (err) {
                    alert('❌ Error reading file: ' + err.message);
                }
            };
            reader.readAsText(file);
            
            // Reset file input so same file can be imported again
            event.target.value = '';
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Don't interfere with input typing
            if (e.target.classList.contains('task-text')) {
                if (e.key === 'Enter' && !e.shiftKey && !e.altKey) {
                    e.preventDefault();
                    addTask();
                } else if (e.key === 'Enter' && e.shiftKey) {
                    e.preventDefault();
                    addChildTask();
                } else if (e.key === 'Enter' && e.altKey) {
                    e.preventDefault();
                    addSiblingTask();
                } else if (e.key === 'Tab' && e.shiftKey) {
                    e.preventDefault();
                    outdentTask();
                }
                return;
            }
            
            // Global shortcuts
            if (e.key === 'Enter' && !e.shiftKey && !e.altKey) {
                e.preventDefault();
                addTask();
            } else if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                addChildTask();
            } else if (e.key === 'Enter' && e.altKey) {
                e.preventDefault();
                addSiblingTask();
            } else if (e.key === 'Tab' && e.shiftKey) {
                e.preventDefault();
                outdentTask();
            }
        });

        // Auto-load on startup
        window.addEventListener('load', function() {
            // Initialize project list if needed
            const projects = getProjectList();
            if (projects.length === 0) {
                saveProjectList(['My Project']);
            }
            
            // Restore last opened project, or use first one
            const lastProject = localStorage.getItem('powerup-last-project');
            if (lastProject && projects.includes(lastProject)) {
                currentProject = lastProject;
            } else {
                currentProject = projects[0];
            }
            
            // Load project data
            loadProjectData();
            
            // Update dropdown
            updateProjectDropdown();
            
            // Update storage indicator
            updateStorageIndicator();
        });

        // Initial render
        render();
    </script>


</body></html>
