<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The World of English</title>
<style>
body{margin:0;background:#f3ebdd;font-family:Georgia,'Times New Roman',serif;color:#2b2a26;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-weight:400;font-size:clamp(22px,4vw,38px);margin:20px 0 4px;text-align:center}
p.s{margin:0 0 10px;font-style:italic;opacity:.7;text-align:center;min-height:1.3em}
.bar{display:flex;gap:10px;margin:0 0 12px;align-items:center}
.bar button{background:#2d4a3e;color:#f3ebdd;border:0;border-radius:20px;padding:8px 18px;font:inherit;cursor:pointer}.bar button:hover{background:#3d6252}.bar button.off{opacity:.35;cursor:default}
.frame{padding:clamp(7px,1.2vw,13px);background:linear-gradient(135deg,#d9b864,#a67c2e 50%,#e6cb80);border-radius:26px;box-shadow:0 12px 44px rgba(60,40,10,.28);margin-bottom:28px}
.in{padding:clamp(4px,.7vw,8px);background:#f3ebdd;border-radius:20px;box-shadow:inset 0 0 0 2px #a67c2e}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(5px,1.1vw,12px);width:min(90vw,78vh,860px);padding:clamp(8px,1.4vw,16px);background:#2d4a3e;border-radius:15px;box-shadow:inset 0 0 0 3px #c9a24a}
.g.n{gap:clamp(8px,1.6vw,16px);padding:clamp(10px,1.6vw,18px)}
.blk{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px;background:#1f342b;border-radius:12px;box-shadow:0 0 0 2px #8a6d2b,0 4px 12px rgba(0,0,0,.35)}
.blk.main{background:#3a2f12;box-shadow:0 0 0 3px #e6cb80,0 0 18px rgba(230,203,128,.55)}
.blk.none{background:rgba(255,255,255,.04);box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.blk a,.blk .e{aspect-ratio:1}
a,.e{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background-size:cover;background-position:center;text-decoration:none;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .25s;cursor:pointer;display:block}
.g.n a,.g.n .e{border-radius:4px;box-shadow:none}
a:hover{transform:scale(1.03)}
a:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,14,0) 45%,rgba(10,16,14,.78))}
a b{position:absolute;left:10px;right:10px;bottom:9px;z-index:2;font-weight:400;font-size:clamp(14px,2.6vw,26px);line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.6)}
a small{display:block;font-style:italic;font-size:clamp(10px,1.5vw,15px);opacity:.92;margin-top:3px}
.g.n a b{left:3px;right:3px;bottom:2px;font-size:clamp(7px,1.05vw,11px);line-height:1.05}.g.n a small{display:none}
a.c{box-shadow:0 0 0 3px #c9a24a,0 6px 18px rgba(0,0,0,.35)}a.c b{text-align:center;bottom:50%;transform:translateY(50%);font-size:clamp(17px,3.3vw,32px)}
.g.n a.c{box-shadow:0 0 0 2px #c9a24a}.g.n a.c b{font-size:clamp(6px,.85vw,9px);line-height:1.05;left:2px;right:2px}
@keyframes pl{0%,100%{box-shadow:0 0 0 2px #c9a24a,0 0 0 0 rgba(230,203,128,.7)}50%{box-shadow:0 0 0 2px #e6cb80,0 0 14px 5px rgba(230,203,128,.65)}}
.bdg{position:absolute;z-index:3;right:6px;top:6px;background:#e6cb80;color:#2b2a26;border-radius:14px;padding:3px 9px;font:600 clamp(10px,1.4vw,14px)/1.2 system-ui,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.g.n .bdg{right:2px;top:2px;padding:1px 4px;font-size:clamp(7px,.9vw,10px);border-radius:8px}
.exp{animation:pl 1.8s ease-in-out infinite}
.plus{position:absolute;z-index:3;left:6px;top:6px;width:clamp(18px,2.4vw,26px);height:clamp(18px,2.4vw,26px);border-radius:50%;background:rgba(243,235,221,.92);color:#2d4a3e;font:700 clamp(13px,1.8vw,20px)/clamp(18px,2.4vw,26px) system-ui,sans-serif;text-align:center}
.g.n .plus{width:11px;height:11px;line-height:11px;font-size:10px;left:2px;top:2px}
.mir{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(22px,3.4vw,38px);height:clamp(22px,3.4vw,38px);border-radius:50%;color:#fff;font:700 clamp(14px,2.2vw,24px)/clamp(22px,3.4vw,38px) system-ui,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.55);pointer-events:none}
.g.n .mir{width:16px;height:16px;line-height:16px;font-size:12px;top:auto;bottom:2px;left:auto;right:2px;transform:none}
.hl{animation:hlp .9s ease-in-out infinite}@keyframes hlp{50%{transform:scale(1.06);filter:brightness(1.25)}}
.blk.hl{animation:none;filter:brightness(1.3)}
a b{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lv{position:absolute;z-index:3;right:6px;top:6px;background:rgba(243,235,221,.9);color:#2d4a3e;border-radius:10px;padding:1px 7px;font:600 clamp(9px,1.2vw,12px)/1.4 system-ui,sans-serif}
.g.n .lv{right:2px;top:2px;padding:0 3px;font-size:7px;border-radius:5px}
.crumbs{font-size:13px;opacity:.7;margin:0 8px 8px;text-align:center;max-width:min(90vw,860px)}
a.c:after{background:rgba(14,40,36,.5)}
.e{background:rgba(255,255,255,.06);box-shadow:none}
.g.out{animation:out .45s ease-in forwards}.g.inn{animation:inn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes out{to{transform:scale(1.5);opacity:0}}@keyframes inn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
</style>
<h1 id="t"></h1><p class="s" id="sub"></p>
<div class="crumbs" id="cb"></div><div class="bar"><button id="up">↑ Up a level</button><button id="mb">See all 64</button></div>
<div class="frame"><div class="in"><div class="g" id="g"></div></div></div>
<script>
var T=__TREE__,g=document.getElementById('g'),path=[T],big=false,POS=[0,1,2,3,5,6,7,8];
function cur(){return path[path.length-1]}
function sty(n,centre){var u=n.i||n._img;if(!u)return 'background:#2d4a3e';if(!n.i&&!centre&&n._pos!==undefined){var c=n._pos%3,r=Math.floor(n._pos/3);return 'background-image:url('+u+');background-size:300%;background-position:'+(c*50)+'% '+(r*50)+'%'}return 'background-image:url('+u+')'}
function cellHTML(n,centre,id,main){var bd='';if(centre){if(main){if(path.length>1)bd='<span class="bdg">↑ Up</span>';}}else if(n.k&&n.k.length)bd='<span class="plus">+</span>';return '<a'+(centre?' class="c'+(centre&&!main&&n.k&&n.k.length?' exp':'')+'"':'')+' data-id="'+id+'" style="'+sty(n,centre)+'">'+bd+(n.l?'<span class="lv">'+n.l+'</span>':'')+'<b>'+n.t+(n.s&&!centre?'<small>'+n.s+'</small>':'')+'</b></a>'}
function reg(){window.REG=[];}
var reg_=[];
function reg1(n,parentPath){reg_.push(n);return reg_.length-1}
function block(n,main){ /* 9 cells in 3x3 order, returns array of html */
  var out=[];for(var p=0;p<9;p++)out.push('');
  out[4]=cellHTML(n,true,reg1(n),main);
  POS.forEach(function(pos,j){var k=n.k[j];if(k&&!k.i){k._img=n.i||n._img;k._pos=pos;}out[pos]=k?cellHTML(k,false,reg1(k),false):'<div class="e"></div>';});
  return out;}
function render(anim){
  reg_=[];var n=cur(),h='';
  document.getElementById('t').textContent=n.t;document.getElementById('sub').textContent=n.s||(big?'Each box in the middle block is the centre of the block beside it: same colour, same box':'Tap a box marked + to go deeper, or the centre to go back up');
  document.getElementById('cb').textContent=path.map(function(x,i){return i?x.t:'World'}).join('  ›  ');
  document.getElementById('up').className=path.length>1?'':'off';
  document.getElementById('mb').textContent=big?'Back to 9':'See all 64';
  if(!big){g.className='g';h=block(n,true).join('');}
  else{g.className='g n';
    var B=[];for(var b=0;b<9;b++)B.push(null);
    B[4]=block(n,true);
    POS.forEach(function(pos,j){var k=n.k[j];B[pos]=k?block(k):null;});
    for(var b=0;b<9;b++)h+=B[b]?'<div class="blk'+(b===4?' main':'')+'">'+B[b].join('')+'</div>':'<div class="blk none"></div>';}
  g.innerHTML=h;
  if(big){var C=['#e0524d','#e8913a','#e6c63a','#5fb85a','#3fb4b0','#4a86d8','#8a63d2','#d85fa8'],AO=['↖','↑','↗','←','→','↙','↓','↘'],AI=['↘','↓','↙','→','←','↗','↑','↖'],ch=g.children,mn=ch[4];
    POS.forEach(function(pos,j){var mc=mn.children[pos],ob=ch[pos];if(!ob||ob.classList.contains('none')||!mc||mc.classList.contains('e'))return;var oc=ob.children[4];
      [mc,oc].forEach(function(el,q){el.style.boxShadow='0 0 0 3px '+C[j]+',0 3px 10px rgba(0,0,0,.45)';el.insertAdjacentHTML('beforeend','<span class="mir" style="background:'+C[j]+'">'+(q?AI[j]:AO[j])+'</span>');el.setAttribute('data-pr',j);});
      ob.style.boxShadow='0 0 0 3px '+C[j]+',0 4px 12px rgba(0,0,0,.35)';ob.setAttribute('data-ob',j);});}
  if(anim){g.classList.add('inn');}
}
function swap(f){g.classList.add('out');setTimeout(function(){f();render(1)},400)}
g.onclick=function(e){var a=e.target.closest('a');if(!a)return;var n=reg_[+a.getAttribute('data-id')];
  if(n===cur()){if(path.length>1)swap(function(){path.pop()});return;}
  if(n.k&&n.k.length){swap(function(){var P=cur().k.indexOf(n);if(P>=0)path.push(n);else{/* grandchild in 64 view */var par=null;cur().k.forEach(function(k){if(k.k.indexOf(n)>=0)par=k});if(par)path.push(par);path.push(n);}});return;}
  if(n.h)location.href=n.h;};
function hl(j,on){if(j===null)return;var ch=g.children,pos=POS[j];[ch[4].children[pos],ch[pos],ch[pos]&&ch[pos].children[4]].forEach(function(el){if(el)el.classList.toggle('hl',on)});}
g.onmouseover=function(e){var el=e.target.closest('[data-pr],[data-ob]');if(el&&big)hl(+(el.getAttribute('data-pr')||el.getAttribute('data-ob')),true)};
g.onmouseout=function(e){var el=e.target.closest('[data-pr],[data-ob]');if(el&&big)hl(+(el.getAttribute('data-pr')||el.getAttribute('data-ob')),false)};
document.getElementById('up').onclick=function(){if(path.length>1)swap(function(){path.pop()})};
document.getElementById('mb').onclick=function(){big=!big;swap(function(){})};
render(0);
</script>
