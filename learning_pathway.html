            box-sizing: border-box;

            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 0.95em;
            opacity: 0.9;
        }

        /* Main container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        /* Level tabs */
        .level-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            justify-content: center;
            border-bottom: 3px solid #f0f0f0;
            padding-bottom: 20px;
        }

        .level-tab {
            padding: 12px 24px;
            border: 2px solid transparent;
            background: none;
            color: #666;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        .level-tab:hover {
            color: #667eea;
            border-color: #667eea;
        }

        .level-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .tab-count {
            font-size: 0.85em;
            opacity: 0.8;
            display: block;
            margin-top: 4px;
        }

        /* Level content */
        .level-content {
            display: none;
        }

        .level-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .level-header {
            margin-bottom: 50px;
            text-align: center;
        }

        .level-header h2 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .level-header p {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Units grid */
        .units-container {
            position: relative;
            padding: 20px 0;
        }

        /* Timeline line */
        .timeline-line {
            position: absolute;
            left: 50px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .timeline-line {
                left: 30px;
            }
        }

        /* Unit card */
        .unit-card {
            margin-bottom: 40px;
            margin-left: 100px;
            position: relative;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
        }

        .unit-card:nth-child(1) { animation-delay: 0.1s; }
        .unit-card:nth-child(2) { animation-delay: 0.15s; }
        .unit-card:nth-child(3) { animation-delay: 0.2s; }
        .unit-card:nth-child(4) { animation-delay: 0.25s; }
        .unit-card:nth-child(5) { animation-delay: 0.3s; }
        .unit-card:nth-child(6) { animation-delay: 0.35s; }
        .unit-card:nth-child(7) { animation-delay: 0.4s; }
        .unit-card:nth-child(8) { animation-delay: 0.45s; }
        .unit-card:nth-child(9) { animation-delay: 0.5s; }
        .unit-card:nth-child(10) { animation-delay: 0.55s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Unit circle number */
        .unit-circle {
            position: absolute;
            left: -68px;
            top: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.3em;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .unit-main {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .unit-main:hover {
            border-color: #667eea;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.1);
        }

        .unit-header {
            margin-bottom: 20px;
        }

        .unit-title {
            font-size: 1.6em;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .unit-cando {
            font-style: italic;
            color: #666;
            font-size: 0.95em;
            margin-bottom: 20px;
            padding: 12px 0;
            border-top: 2px solid #f0f0f0;
            border-bottom: 2px solid #f0f0f0;
            padding: 12px 0;
        }

        /* Grammar lesson */
        .grammar-lesson {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .grammar-label {
            font-size: 0.85em;
            font-weight: 700;
            text-transform: uppercase;
            color: #667eea;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .grammar-link {
            display: inline-block;
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            text-decoration: none;
            padding: 12px 16px;
            background: white;
            border-radius: 6px;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
        }

        .grammar-link:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-color: transparent;
        }

        /* Topics grid */
        .topics-header {
            font-size: 0.95em;
            font-weight: 700;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            margin-top: 25px;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .topic-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            padding: 16px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .topic-card:hover {
            border-color: #667eea;
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.15);
            transform: translateY(-3px);
        }

        .topic-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            flex-grow: 1;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .category-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: fit-content;
        }

        /* Category colors */

            background: #d4edda;
            color: #155724;
        }

        .badge-travel {
            background: #d1ecf1;
            color: #0c5460;
        }

        .badge-life {
            background: #fff3cd;
            color: #856404;
        }

        .badge-health {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-entertainment {
            background: #e7d4f5;
            color: #4a235a;
        }

        .badge-work {
            background: #e8e8e8;
            color: #333;
        }

        .badge-people {
            background: #fce4ec;
            color: #880e4f;
        }

            background: #b2dfdb;
            color: #004d40;
        }

            font-size: 0.85em;
            color: #999;
            margin-top: 10px;
        }

        .expand-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .expand-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.3);
        }

        .expand-btn.collapse {
            background: #e0e0e0;
            color: #333;
        }

        .unit-footer {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            color: #999;
        }

        .lesson-count {
            font-weight: 600;
            color: #667eea;
        }

        .progress-text {
            font-size: 0.85em;
        }

            border-radius: 8px;
            padding: 30px;
            margin-top: 50px;
            border: 2px solid #e0e0e0;

            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speaking-toggle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        .speaking-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.3);
        }

        .speaking-content {
            display: none;
            margin-top: 25px;
        }

        .speaking-content.expanded {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .speaking-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .speaking-card:hover {
            border-color: #667eea;
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.15);
            transform: translateY(-3px);
        }

        .speaking-card h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .speaking-card p {
            color: #666;
            font-size: 0.85em;
            line-height: 1.5;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .header p {
                font-size: 1em;
            }

            .stats-bar {
                gap: 20px;
                flex-direction: column;
            }

            .level-tabs {
                justify-content: flex-start;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .level-tab {
                padding: 10px 16px;
                font-size: 0.95em;
                flex-shrink: 0;
            }

            .unit-card {
                margin-left: 0;
            }

            .unit-circle {
                position: static;
                margin-bottom: 15px;
                width: 50px;
                height: 50px;
                font-size: 1.1em;
            }

            .timeline-line {
                display: none;
            }

            .topics-grid {
                grid-template-columns: 1fr;
            }

            .unit-main {
                padding: 20px;
            }

            .unit-title {
                font-size: 1.3em;
            }

            .level-header h2 {
                font-size: 1.8em;
            }

            .speaking-content.expanded {
                grid-template-columns: 1fr;
            }

            .unit-footer {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }

        /* Loading state */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.1em;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        /* Icon styles */
        .icon {
            display: inline-block;
            margin-right: 8px;
        }

        /* Accessibility */
        button:focus,
        a:focus {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Print styles */
        @media print {
            .level-tabs,
            .speaking-toggle {
                display: none;
            }

            .level-content {
                display: block !important;
            }

            .unit-card {
                page-break-inside: avoid;
            }
        }

    </style>

        // State management
        let currentLevel = 'a2';
        let expandedUnits = {};
        let clickedLessons = new Set();

        // Initialize the page
        function init() {
            calculateStats();
            renderLevelTabs();
            renderLevelContent();
            setupEventListeners();
        }

        // Calculate statistics
        function calculateStats() {
            let totalTopics = 0;
            let totalGrammar = 0;
            let totalUnits = 0;
            let totalLevels = pathwayData.levels.length;

            pathwayData.levels.forEach(level => {
                totalGrammar += level.units.length;
                totalUnits += level.units.length;
                level.units.forEach(unit => {
                    totalTopics += unit.topics.length;
                });
            });

            document.getElementById('statTopics').textContent = totalTopics;
            document.getElementById('statGrammar').textContent = totalGrammar;
            document.getElementById('statUnits').textContent = totalUnits;
            document.getElementById('statLevels').textContent = totalLevels;
        }

        // Render level tabs
        function renderLevelTabs() {
            const container = document.getElementById('levelTabs');
            container.innerHTML = '';

            pathwayData.levels.forEach(level => {
                const tab = document.createElement('button');
                tab.className = `level-tab ${level.level === currentLevel ? 'active' : ''}`;
                tab.innerHTML = `
                    ${level.level.toUpperCase()}
                    <span class="tab-count">${level.units.length} units</span>
                `;
                tab.addEventListener('click', () => switchLevel(level.level));
                container.appendChild(tab);
            });
        }

        // Switch level
        function switchLevel(levelCode) {
            currentLevel = levelCode;
            renderLevelTabs();
            renderLevelContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Render level content
        function renderLevelContent() {
            const container = document.getElementById('levelContents');
            container.innerHTML = '';

            const level = pathwayData.levels.find(l => l.level === currentLevel);
            if (!level) return;

            const levelContent = document.createElement('div');
            levelContent.className = 'level-content active';

            // Level header
            const header = document.createElement('div');
            header.className = 'level-header';
            header.innerHTML = `
                <h2>${level.name}</h2>
                <p>${level.description}</p>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${(clickedLessons.size / (level.units.length * 5)) * 100}%"></div>
                </div>
            `;
            levelContent.appendChild(header);

            // Units container with timeline
            const unitsContainer = document.createElement('div');
            unitsContainer.className = 'units-container';
            unitsContainer.innerHTML = '<div class="timeline-line"></div>';

            level.units.forEach((unit, index) => {
                const unitCard = createUnitCard(level, unit, index);
                unitsContainer.appendChild(unitCard);
            });

            levelContent.appendChild(unitsContainer);

            // Speaking section
            const speakingSection = createSpeakingSection();
            levelContent.appendChild(speakingSection);

            container.appendChild(levelContent);
        }

        // Create unit card
        function createUnitCard(level, unit, index) {
            const card = document.createElement('div');
            card.className = 'unit-card';
            const unitId = `${level.level}-${unit.unit}`;
            const isExpanded = expandedUnits[unitId];

            let topicsHTML = '';
            const visibleTopics = isExpanded ? unit.topics : unit.topics.slice(0, 3);

            visibleTopics.forEach(topic => {
                topicsHTML += createTopicCardHTML(topic);
            });

            const hasMore = unit.topics.length > 3;

            card.innerHTML = `
                <div class="unit-circle">${unit.unit}</div>
                <div class="unit-main">
                    <div class="unit-header">
                        <div class="unit-title">Unit ${unit.unit}: ${unit.name}</div>
                        <div class="unit-cando"><em>${unit.canDo}</em></div>
                    </div>

                    <div class="grammar-lesson">
                        <div class="grammar-label">📚 Grammar Lesson</div>
                        <a href="${unit.grammar.file}" target="_blank" class="grammar-link">
                            ${unit.grammar.name}
                        </a>
                    </div>

                    <div class="topics-header">💬 Topic Lessons (${unit.topics.length} total)</div>
                    <div class="topics-grid">
                        ${topicsHTML}
                    </div>

                    ${hasMore ? `
                        <button class="expand-btn ${isExpanded ? 'collapse' : ''}" data-unit="${unitId}">
                            ${isExpanded ? 'Show Less' : `Show ${unit.topics.length - 3} More`}
                        </button>
                    ` : ''}

                    <div class="unit-footer">
                        <div class="lesson-count">✓ ${clickedLessons.size}/${unit.topics.length + 1} lessons completed</div>
                        <div class="progress-text">Keep going!</div>
                    </div>
                </div>
            `;

            // Add expand button listener
            const expandBtn = card.querySelector('.expand-btn');
            if (expandBtn) {
                expandBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    expandedUnits[unitId] = !expandedUnits[unitId];
                    renderLevelContent();
                });
            }

            // Track lesson clicks
            const topicLinks = card.querySelectorAll('.topic-card');
            topicLinks.forEach(link => {
                link.addEventListener('click', () => {
                    clickedLessons.add(link.dataset.lesson);
                    updateProgressBars();
                });
            });

            return card;
        }

        // Create topic card HTML
        function createTopicCardHTML(topic) {
            const categoryColors = {
                food: 'badge-food',
                travel: 'badge-travel',
                life: 'badge-life',
                health: 'badge-health',
                entertainment: 'badge-entertainment',
                work: 'badge-work',
                people: 'badge-people',
                world: 'badge-world'
            };

            const badgeClass = categoryColors[topic.cat] || 'badge-life';
            const categoryLabel = topic.cat.charAt(0).toUpperCase() + topic.cat.slice(1);

            return `
                <a href="${topic.file}" target="_blank" class="topic-card" data-lesson="${topic.file}">
                    <div class="topic-title">${topic.title}</div>
                    <span class="category-badge ${badgeClass}">${categoryLabel}</span>
                </a>
            `;
        }

        // Create speaking section
        function createSpeakingSection() {
            const section = document.createElement('div');
            section.className = 'speaking-section';
            section.innerHTML = `
                <h3>🎤 Speaking Skills Pathway</h3>
                <button class="speaking-toggle">Expand Speaking Skills</button>
                <div class="speaking-content">
                    <div class="speaking-card">
                        <h4>Pronunciation</h4>
                        <p>Master stress, intonation, and connected speech patterns</p>
                    </div>
                    <div class="speaking-card">
                        <h4>Fluency</h4>
                        <p>Develop natural speech rhythm and spontaneous expression</p>
                    </div>
                    <div class="speaking-card">
                        <h4>Accuracy</h4>
                        <p>Refine grammar and vocabulary in real-time conversation</p>
                    </div>
                    <div class="speaking-card">
                        <h4>Confidence</h4>
                        <p>Build self-assurance in diverse speaking situations</p>
                    </div>
                    <div class="speaking-card">
                        <h4>Interaction</h4>
                        <p>Navigate turn-taking, clarification, and social language</p>
                    </div>
                    <div class="speaking-card">
                        <h4>Presentation</h4>
                        <p>Deliver structured talks with compelling delivery</p>
                    </div>
                </div>
            `;

            const toggleBtn = section.querySelector('.speaking-toggle');
            const content = section.querySelector('.speaking-content');

            toggleBtn.addEventListener('click', () => {
                content.classList.toggle('expanded');
                toggleBtn.textContent = content.classList.contains('expanded')
                    ? 'Collapse Speaking Skills'
                    : 'Expand Speaking Skills';
            });

            return section;
        }

        // Update progress bars
        function updateProgressBars() {
            const level = pathwayData.levels.find(l => l.level === currentLevel);
            if (!level) return;

            const totalLessons = level.units.reduce((sum, unit) => sum + unit.topics.length + 1, 0);
            const progressPercentage = (clickedLessons.size / totalLessons) * 100;

            const progressFill = document.querySelector('.progress-fill');
            if (progressFill) {
                progressFill.style.width = `${progressPercentage}%`;
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('grammar-link') ||
                    e.target.classList.contains('topic-card')) {
                    clickedLessons.add(e.target.href);
                    updateProgressBars();
                }
            });
        }

        // Start the app
        document.addEventListener('DOMContentLoaded', init);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const levels = pathwayData.levels.map(l => l.level);
            const currentIndex = levels.indexOf(currentLevel);

            if (e.key === 'ArrowRight' && currentIndex < levels.length - 1) {
                switchLevel(levels[currentIndex + 1]);
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                switchLevel(levels[currentIndex - 1]);
            }
        });
    </script>

</body>
</html>
