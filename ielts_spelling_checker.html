<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Check - My Writing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;color:#fff;line-height:1.5}
.container{max-width:900px;margin:0 auto;padding:20px}
.header{text-align:center;padding:26px 0 20px;border-bottom:2px solid rgba(255,255,255,.1);margin-bottom:20px}
.header h1{font-size:2.2rem;background:linear-gradient(135deg,#00d9ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:rgba(255,255,255,.7);margin-top:6px}
.toplink{display:inline-block;margin-top:12px;color:#00d9ff;text-decoration:none;border:1px solid rgba(0,217,255,.4);border-radius:20px;padding:6px 16px;font-size:.95rem}
.toplink:hover{background:rgba(0,217,255,.12)}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;margin-bottom:20px}
.card h3{font-size:1.25rem;margin-bottom:10px;color:#00d9ff}
.card p.sub{color:rgba(255,255,255,.7);margin-bottom:12px}
textarea{width:100%;min-height:220px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font-size:1.1rem;padding:14px;font-family:inherit;line-height:1.6;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:#00d9ff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:none;border-radius:10px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer;color:#fff;background:rgba(255,255,255,.14);font-family:inherit}
.btn:hover{background:rgba(255,255,255,.22)}
.btn-primary{background:linear-gradient(135deg,#00b8e6,#00cc70);color:#06222b}
.btn-primary:hover{filter:brightness(1.1);background:linear-gradient(135deg,#00b8e6,#00cc70)}
.btn-small{padding:7px 14px;font-size:.9rem}
.summary{font-size:1.1rem;margin-bottom:14px}
.summary b{color:#ffcc00}
.res{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:rgba(0,0,0,.18);display:flex;gap:12px;align-items:flex-start}
.res input[type=checkbox]{width:20px;height:20px;margin-top:6px;accent-color:#00ff88;flex:none}
.res .body{flex:1;min-width:0}
.pair{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:1.35rem}
.wrongw{color:#ff8a8a;text-decoration:line-through;text-decoration-thickness:2px}
.arrow{color:rgba(255,255,255,.5)}
.rightw{color:#00ff88;font-weight:700;letter-spacing:.5px}
mark.l{background:rgba(255,204,0,.35);color:#fff;border-radius:3px;padding:0 1px}
mark.w{background:rgba(255,107,107,.35);color:#fff;border-radius:3px;padding:0 1px}
.times{font-size:.85rem;color:rgba(255,255,255,.55);background:rgba(255,255,255,.1);border-radius:10px;padding:1px 9px}
.tip{margin-top:6px;color:#ffe08a}
.mean{margin-top:4px;color:rgba(255,255,255,.7);font-size:.95rem}
.ctx{margin-top:6px;color:rgba(255,255,255,.75);font-size:.95rem;font-style:italic}
.unsure{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:rgba(255,255,255,.1);border-radius:16px;padding:4px 12px;font-size:.95rem}
.chip.m{background:rgba(0,255,136,.18);color:#00ff88}
.chip.l{background:rgba(255,204,0,.18);color:#ffcc00}
.chip.n{background:rgba(255,107,107,.18);color:#ff8a8a}
.good{font-size:1.15rem;color:#00ff88}
.hidden{display:none}
.quiz-box{text-align:center;padding:10px 0}
.quiz-box .gap{font-size:1.4rem;margin:14px 0;line-height:1.7}
.quiz-box input{width:100%;max-width:420px;font-size:1.5rem;text-align:center;padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;margin:10px 0;font-family:inherit}
.quiz-box input.ok{border-color:#00ff88}
.quiz-box input.no{border-color:#ff6b6b}
.fb{margin:10px 0;font-size:1.15rem}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#00d9ff,#00ff88);width:0}
.note{color:rgba(255,255,255,.55);font-size:.9rem;margin-top:10px}
.mywords-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.mywords-row .w{font-size:1.15rem}
.x{background:none;border:none;color:rgba(255,255,255,.45);cursor:pointer;font-size:1.2rem}
.x:hover{color:#ff8a8a}
@media(max-width:600px){.header h1{font-size:1.7rem}.card{padding:16px}.pair{font-size:1.15rem}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Spelling Check</h1>
    <p>Paste your writing. Find the words you need to work on. Practise them.</p>
    <a class="toplink" href="ielts_spelling_master.html">&larr; IELTS Spelling Master</a>
  </div>

  <div class="card">
    <h3>1. Paste your writing</h3>
    <p class="sub">An essay, a paragraph, or just a list of words.</p>
    <textarea id="txt" placeholder="Paste or type here..." spellcheck="false"></textarea>
    <div class="row">
      <button class="btn btn-primary" id="checkBtn" onclick="runCheck()">Check my spelling</button>
      <button class="btn" onclick="clearAll()">Clear</button>
      <button class="btn" onclick="tryExample()">Try an example</button>
    </div>
    <p class="note" id="status"></p>
  </div>

  <div class="card hidden" id="results">
    <h3>2. Words to work on</h3>
    <div id="resBody"></div>
    <div class="row" id="resButtons"></div>
  </div>

  <div class="card hidden" id="mywords">
    <h3>3. My practice words</h3>
    <div id="mwList"></div>
    <div class="row">
      <button class="btn btn-primary" onclick="startQuiz()">Practise my words</button>
      <button class="btn" onclick="copyLink()">Copy a link to this list</button>
      <button class="btn" onclick="clearMastered()">Remove mastered words</button>
    </div>
    <p class="note" id="linkMsg"></p>
  </div>

  <div class="card hidden" id="quiz">
    <h3>Practice</h3>
    <div class="bar"><i id="qbar"></i></div>
    <div class="quiz-box" id="qbox"></div>
  </div>
</div>

<script src="wordbank/ielts_words.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IW=window.IELTS_WORDS||[];
const IWmap={}, MISTAKES={}; IW.forEach((w,i)=>{IWmap[w.word]=w; w.i=i; MISTAKES[w.mistake]=w;});

/* ---------- dictionary ---------- */
let D=null, RANK=null;
const EXTRA="okay ok internet website websites email emails online offline smartphone smartphones ielts tv wifi app apps blog blogs youtube facebook instagram tiktok whatsapp google covid videos video photo photos selfie selfies".split(' ');
function loadDict(cb){
  if(D) return cb();
  $('status').textContent='Loading the dictionary (first time only)...';
  const s=document.createElement('script'); s.src='wordbank/spell_dict.js';
  s.onload=()=>{D=new Set(window.SPELL_DICT.split(' ')); EXTRA.forEach(w=>D.add(w));
    RANK=new Map(); window.SPELL_FREQ.split(' ').forEach((w,i)=>RANK.set(w,i)); $('status').textContent=''; cb();};
  s.onerror=()=>{$('status').textContent='The dictionary could not be loaded. Check your internet connection and try again.';};
  document.head.appendChild(s);
}
const SUF=[['s',''],['es',''],['ies','y'],['ed',''],['ed','e'],['ied','y'],['ing',''],['ing','e'],['er',''],['er','e'],['ers',''],['ers','e'],['est',''],['est','e'],['ier','y'],['iest','y'],['ly',''],['ily','y'],['bly','ble'],['ally',''],['ness',''],['iness','y'],['less',''],['ful','']];
const DBL=new Set(['ed','ing','er','ers','est']);
function inflected(w){
  if(D.has(w)) return true;
  for(const [s,r] of SUF){
    if(w.length>s.length+2 && w.endsWith(s)){
      const st=w.slice(0,-s.length);
      if(D.has(st+r)) return true;
      if(DBL.has(s)&&st.length>2&&st[st.length-1]===st[st.length-2]&&D.has(st.slice(0,-1))) return true;
    }
  }
  return false;
}
function ukToUs(w){
  const v=[w.replace(/our(s|ed|ing|ful|able)?$/,'or$1'),
    w.replace(/is(e|es|ed|ing|ation|ations|er|ers)$/,'iz$1'),
    w.replace(/ys(e|es|ed|ing)$/,'yz$1'),
    w.replace(/tre(s)?$/,'ter$1'),
    w.replace(/ll(ed|ing|er|ers)$/,'l$1'),
    w.replace(/ence$/,'ense'),
    w.replace(/ogue$/,'og'),
    w.replace(/(ae|oe)/,'e'),
    w.replace(/grey/,'gray')];
  return v.filter(x=>x!==w);
}
function isKnown(w){
  if(inflected(w)) return true;
  if(w.includes('-')) return w.split('-').every(p=>p.length<2||isKnown(p));
  return ukToUs(w).some(inflected);
}
const SKIPAFTER=new Set(['s','t','re','ve','ll','d','m']);
function tokenOK(t){ // t lowercased, may contain ' or -
  if(t.includes("'")||t.includes('’')){
    const parts=t.split(/['’]/);
    if(parts.length===2 && (SKIPAFTER.has(parts[1])||parts[1]==='nt')){
      let b=parts[0]; if(parts[1]==='t'&&b.endsWith('n')) b=b.slice(0,-1);
      return b.length<2||isKnown(b)||['can','won','ca','wo','sha','ain'].includes(b)||isKnown(b+'n');
    }
    return parts.every(p=>p.length<2||isKnown(p));
  }
  return isKnown(t);
}

/* ---------- suggestions ---------- */
const AL='abcdefghijklmnopqrstuvwxyz';
function edits1(w){ // Map candidate -> penalty (substitutions are less likely than missing/extra letters)
  const r=new Map(), n=w.length, put=(c,p)=>{ if(!r.has(c)||r.get(c)>p) r.set(c,p); };
  for(let i=0;i<n;i++) put(w.slice(0,i)+w.slice(i+1),500);
  for(let i=0;i<n-1;i++) put(w.slice(0,i)+w[i+1]+w[i]+w.slice(i+2),0);
  for(let i=0;i<n;i++) for(const c of AL) if(c!==w[i]) put(w.slice(0,i)+c+w.slice(i+1),1500);
  for(let i=0;i<=n;i++) for(const c of AL) put(w.slice(0,i)+c+w.slice(i),0);
  return r;
}
function rankOf(c,orig){
  let r;
  if(IWmap[c]) r=-1000+IWmap[c].i/100;
  else if(RANK.has(c)) r=RANK.get(c);
  else r=50000+(D.has(c)?0:1500);
  if(c[0]!==orig[0]) r+=4000;
  return r;
}
function suggest(w){
  if(w==='alot') return 'a lot';
  let best=null,br=1e9;
  const e1=edits1(w);
  for(const [c,pen] of e1){ if(c.length>1&&isKnown(c)){const r=rankOf(c,w)+pen; if(r<br){br=r;best=c;}} }
  if(best) return best;
  if(w.length<5) return null;
  const seen=new Set();
  for(const a of e1.keys()){ for(const c of edits1(a).keys()){ if(seen.has(c)||c.length<3) continue; seen.add(c);
      if(D.has(c)){const r=rankOf(c,w)+20000; if(r<br){br=r;best=c;}} } }
  return best;
}

/* ---------- explaining the mistake ---------- */
function diffParts(a,b){ // returns [prefixLen, suffixLen]
  let p=0; while(p<a.length&&p<b.length&&a[p]===b[p]) p++;
  let s=0; while(s<a.length-p&&s<b.length-p&&a[a.length-1-s]===b[b.length-1-s]) s++;
  return [p,s];
}
function hl(word,other,cls){
  const [p,s]=diffParts(word,other);
  let a=p,b=word.length-s;
  if(a>=b){a=Math.max(0,p-1);b=Math.min(word.length,p+1);}
  return esc(word.slice(0,a))+'<mark class="'+cls+'">'+esc(word.slice(a,b))+'</mark>'+esc(word.slice(b));
}
function explain(wrong,right){
  if(wrong===right) return '';
  if(right==='a lot') return '“a lot” is two separate words.';
  const n=wrong.length,m=right.length;
  const [p,s]=diffParts(wrong,right);
  if(n===m){
    for(let i=0;i<n-1;i++) if(wrong[i]===right[i+1]&&wrong[i+1]===right[i]&&wrong.slice(0,i)===right.slice(0,i)&&wrong.slice(i+2)===right.slice(i+2)){
      const pr=right.slice(i,i+2);
      if(pr==='ie'||pr==='ei') return 'I before E, except after C: it is spelled “'+pr+'”.';
      return 'Two letters are swapped: it is “'+pr+'”, not “'+wrong.slice(i,i+2)+'”.';
    }
    if(n-p-s===1) return 'Use “'+right[p]+'” here, not “'+wrong[p]+'”.';
  } else if(m===n+1){
    const c=right[p]; const dbl=right[p-1]===c||right[p+1]===c;
    return dbl?'It needs a double “'+c+c+'”.':'Don’t forget the letter “'+c+'”.';
  } else if(m===n-1){
    const c=wrong[p]; const dbl=wrong[p-1]===c||wrong[p+1]===c;
    return dbl?'Only one “'+c+'” here, not two.':'There is no “'+c+'” in this word.';
  }
  return 'Look carefully at the highlighted letters.';
}

/* ---------- reading the text ---------- */
function sentenceAround(text,idx){
  let a=idx; while(a>0&&!/[.!?\n]/.test(text[a-1])) a--;
  let b=idx; while(b<text.length&&!/[.!?\n]/.test(text[b])) b++;
  return [a,Math.min(text.length,b+(text[b]&&text[b]!=='\n'?1:0))];
}
function fixCase(orig,right){ return orig[0]!==orig[0].toLowerCase()?right[0].toUpperCase()+right.slice(1):right; }

let FOUND=[], UNSURE=[];
function runCheck(){
  const text=$('txt').value;
  if(!text.trim()){ $('status').textContent='Paste some writing first.'; return; }
  loadDict(()=>analyse(text));
}
function analyse(text){
  const re=/[A-Za-z]+(?:['’\-][A-Za-z]+)*/g; let m;
  const found={}, unsure={}, R=[]; let total=0;
  while((m=re.exec(text))){
    const tok=m[0]; if(tok.length<3) continue; total++;
    const low=tok.toLowerCase();
    const prev=text.slice(0,m.index).replace(/[\s"“'‘(\[]+$/,'');
    const sentStart=prev===''||/[.!?:\n]$/.test(prev)||/\n\s*$/.test(text.slice(0,m.index));
    if(tok.length>1&&tok===tok.toUpperCase()&&tok.length<=6) continue; // acronyms
    if(!sentStart&&tok[0]!==tok[0].toLowerCase()&&tok.slice(1)===tok.slice(1).toLowerCase()) continue; // names
    let right=null;
    if(MISTAKES[low]) right=MISTAKES[low].word;
    else if(tokenOK(low)) continue;
    else right=suggest(low.replace(/['’]/g,''));
    if(!right){ unsure[low]=(unsure[low]||0)+1; continue; }
    const key=right; R.push({idx:m.index,len:tok.length,orig:tok,right});
    const [a,b]=sentenceAround(text,m.index);
    const sent=text.slice(a,b).trim();
    const off=m.index-text.slice(a,b).search(/\S|$/);
    let f=found[key];
    if(!f){
      f={word:right,wrongs:{},count:0,tip:'',ctx:'',gap:''};
      const iw=IWmap[right];
      f.tip=(MISTAKES[low]&&MISTAKES[low].tip)||(iw&&iw.tip&&MISTAKES[low]?iw.tip:'')||explain(low,right);
      if(iw) f.meaning=iw.meaning;
      const wcount=sent.split(/\s+/).length;
      if(wcount>=4){
        const s0=text.slice(a,b); const rel=m.index-a; const lead=s0.length-s0.trimStart().length;
        const pre=s0.slice(lead,rel), post=s0.slice(rel+tok.length).trimEnd();
        f.ctx=esc(pre)+'<mark class="w">'+esc(tok)+'</mark>'+esc(post);
        f.a=a;f.b=b;f.idx=m.index;
      }
      f.first=low;
      found[key]=f;
    }
    f.wrongs[low]=(f.wrongs[low]||0)+1; f.count++;
  }
  Object.values(found).forEach(f=>{ if(f.a===undefined) return;
    let seg=text.slice(f.a,f.b);
    R.filter(r=>r.idx>=f.a&&r.idx<f.b).sort((x,y)=>y.idx-x.idx).forEach(r=>{
      const rep=r.idx===f.idx?'_____':fixCase(r.orig,r.right);
      seg=seg.slice(0,r.idx-f.a)+rep+seg.slice(r.idx-f.a+r.len); });
    f.gap=seg.trim(); });
  FOUND=Object.values(found).sort((a,b)=>b.count-a.count||a.word.localeCompare(b.word));
  UNSURE=Object.entries(unsure).sort((a,b)=>b[1]-a[1]);
  showResults(total);
}
function showResults(total){
  $('results').classList.remove('hidden');
  const body=$('resBody');
  const saved=load().words;
  let h='<p class="summary">I read <b>'+total+'</b> words and found <b>'+FOUND.length+'</b> to work on.</p>';
  if(!FOUND.length) h+='<p class="good">No spelling mistakes found. Well done!</p>';
  FOUND.forEach((f,i)=>{
    const wr=Object.keys(f.wrongs);
    const wrongHtml=wr.map(w=>'<span class="wrongw">'+hl(w,f.word,'w')+'</span>').join(' , ');
    h+='<div class="res"><input type="checkbox" id="c'+i+'" '+(saved[f.word]?'':'checked')+'>'
      +'<div class="body"><div class="pair">'+wrongHtml+'<span class="arrow">&rarr;</span><span class="rightw">'+hl(f.word,wr[0],'l')+'</span>'
      +(f.count>1?'<span class="times">&times;'+f.count+'</span>':'')
      +'<button class="btn btn-small" onclick="say(\''+f.word+'\')">&#128266;</button></div>'
      +(f.tip?'<div class="tip">&#128161; '+esc(f.tip)+'</div>':'')
      +(f.meaning?'<div class="mean">Meaning: '+esc(f.meaning)+'</div>':'')
      +(f.ctx?'<div class="ctx">“'+f.ctx+'”</div>':'')
      +(saved[f.word]?'<div class="mean">Already in your practice list.</div>':'')
      +'</div></div>';
  });
  if(UNSURE.length){
    h+='<p class="summary" style="margin-top:18px">Words I don’t recognise (names, or too far off to guess). Check these yourself:</p><div class="unsure">'
      +UNSURE.map(u=>'<span class="chip n">'+esc(u[0])+(u[1]>1?' ×'+u[1]:'')+'</span>').join('')+'</div>';
  }
  body.innerHTML=h;
  $('resButtons').innerHTML=FOUND.length?'<button class="btn btn-primary" onclick="addSelected(true)">Add ticked words &amp; practise</button><button class="btn" onclick="addSelected(false)">Just add them to my list</button>':'';
  $('results').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- saved list ---------- */
function load(){ try{const s=JSON.parse(localStorage.getItem('mySpellingWords')); if(s&&s.words) return s;}catch(e){} return {words:{}}; }
function save(s){ try{localStorage.setItem('mySpellingWords',JSON.stringify(s));}catch(e){} }
function addSelected(go){
  const s=load(); let n=0;
  FOUND.forEach((f,i)=>{
    if(!$('c'+i)||!$('c'+i).checked) return;
    const old=s.words[f.word];
    s.words[f.word]={wrong:f.first,gap:f.gap||(old&&old.gap)||'',fixed:f.fixed||(old&&old.fixed)||'',tip:f.tip,streak:0,right:old?old.right:0,wrongN:old?old.wrongN:0};
    n++;
  });
  save(s); renderMy();
  if(go) startQuiz(); else { $('mywords').scrollIntoView({behavior:'smooth'}); }
}
function renderMy(){
  const s=load(), ws=Object.keys(s.words);
  $('mywords').classList.toggle('hidden',!ws.length);
  $('mwList').innerHTML=ws.map(w=>{
    const e=s.words[w], st=e.streak>=3?'m':(e.right>0?'l':'n'), lab=e.streak>=3?'mastered':(e.right>0?'learning':'new');
    return '<div class="mywords-row"><span class="w">'+esc(w)+(e.wrong?' <span class="wrongw" style="font-size:.9rem">'+esc(e.wrong)+'</span>':'')+'</span><span><span class="chip '+st+'">'+lab+'</span> <button class="x" title="Remove" onclick="removeWord(\''+w+'\')">&times;</button></span></div>';
  }).join('');
}
function removeWord(w){ const s=load(); delete s.words[w]; save(s); renderMy(); }
function clearMastered(){ const s=load(); Object.keys(s.words).forEach(w=>{if(s.words[w].streak>=3) delete s.words[w];}); save(s); renderMy(); }
function copyLink(){
  const s=load(); const parts=Object.keys(s.words).map(w=>w+(s.words[w].wrong?':'+s.words[w].wrong:''));
  const url=location.origin+location.pathname+'?w='+encodeURIComponent(parts.join(','));
  const done=()=>{$('linkMsg').textContent='Link copied. Anyone who opens it gets this word list.';};
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(done,()=>{$('linkMsg').textContent=url;}); else $('linkMsg').textContent=url;
}
function fromLink(){
  const q=new URLSearchParams(location.search).get('w'); if(!q) return;
  const s=load(); let n=0;
  q.split(',').forEach(p=>{ const [w,wr]=p.split(':'); const k=(w||'').toLowerCase().replace(/[^a-z'-]/g,''); if(!k||s.words[k]) return;
    const iw=IWmap[k]; s.words[k]={wrong:(wr||'').toLowerCase().replace(/[^a-z'-]/g,''),gap:'',fixed:'',tip:iw?iw.tip:'',streak:0,right:0,wrongN:0}; n++; });
  if(n){ save(s); }
}

/* ---------- practice ---------- */
let Q=[],qi=0,qdone=0,qtotal=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function say(w){ try{const u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){} }
function startQuiz(){
  const s=load(); Q=shuffle(Object.keys(s.words).filter(w=>s.words[w].streak<3));
  $('quiz').classList.remove('hidden');
  if(!Q.length){ $('qbox').innerHTML='<p class="good">All your words are mastered. Brilliant!</p>'; $('qbar').style.width='100%'; $('quiz').scrollIntoView({behavior:'smooth'}); return; }
  qi=0;qdone=0;qtotal=Q.length; showQ(); $('quiz').scrollIntoView({behavior:'smooth'});
}
function showQ(){
  if(qi>=Q.length){ $('qbar').style.width='100%'; renderMy();
    $('qbox').innerHTML='<p class="good">Round finished. '+qdone+' of '+qtotal+' words done.</p><div class="row" style="justify-content:center"><button class="btn btn-primary" onclick="startQuiz()">Go again</button></div>'; return; }
  const w=Q[qi], e=load().words[w]; answered=false;
  $('qbar').style.width=Math.round(qdone/qtotal*100)+'%';
  let prompt;
  if(e.gap) prompt='<div class="gap">'+esc(e.gap).replace('_____','<b>_____</b>')+'</div>';
  else prompt='<div class="gap">Listen and spell the word.</div>';
  $('qbox').innerHTML=prompt+'<button class="btn" onclick="say(\''+w+'\')">&#128266; Listen</button><br>'
   +'<input id="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Type the word..." onkeydown="if(event.key===\'Enter\')checkQ()">'
   +'<div class="fb" id="fb"></div><div class="row" style="justify-content:center"><button class="btn btn-primary" id="qbtn" onclick="checkQ()">Check</button></div>';
  $('ans').focus(); say(w);
}
function checkQ(){
  const w=Q[qi];
  if(answered){ qi++; showQ(); return; }
  const v=$('ans').value.trim().toLowerCase(); if(!v) return;
  const s=load(), e=s.words[w]; const ok=v===w; answered=true;
  $('ans').classList.add(ok?'ok':'no'); $('ans').disabled=true;
  if(ok){ e.streak++; e.right++; qdone++; $('fb').innerHTML='<span class="good">Correct!</span>'+(e.streak>=3?' You have mastered this word.':' '+e.streak+' in a row.'); }
  else { e.streak=0; e.wrongN++; $('fb').innerHTML='<span style="color:#ff8a8a">Not quite.</span> The spelling is <span class="rightw">'+hl(w,v,'l')+'</span>'+(e.tip?'<div class="tip">&#128161; '+esc(e.tip)+'</div>':''); Q.push(w); qtotal++; }
  save(s); $('qbtn').textContent='Next'; renderMy();
}

/* ---------- misc ---------- */
function clearAll(){ $('txt').value=''; $('results').classList.add('hidden'); $('status').textContent=''; }
function tryExample(){
  $('txt').value="Nowadays, technology has become a very importent part of our society. I definately beleive that goverment should invest more in education. Firstly, young people recieve a lot of benifit from using computers at school. Furthermore, it is neccessary to protect the enviroment. However, some people thinks that new technology can embarass individuals. In conclusion, I would recomend that we seperate the advantages from the disadvantages. This occured in Britain last year.";
}
fromLink(); renderMy();
if(new URLSearchParams(location.search).get('w')){ $('quiz').classList.remove('hidden'); startQuiz(); }
</script>
