hi.src = 'journey/incoming/routes5/route_' + R.route + '_hero.png';

function goalsHtml(){
  var h = '<button class="goal all' + (!st.goal ? ' on' : '') + '" data-g=""><span class="tx"><b>Show me everything</b></span></button>';
  R.goals.forEach(function(g, gi){
    var c = PAL[gi % PAL.length];
    h += '<button class="goal' + (st.goal === g[0] ? ' on' : '') + '" data-g="' + g[0] + '" style="--c1:' + c[0] + ';--c2:' + c[1] + '"><span class="im" data-im="' + g[0] + '"></span><span class="sh"></span><span class="tx"><b>' + esc(g[1]) + '</b><small>' + esc(g[2]) + '</small></span></button>';
  });
  document.getElementById('goals').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('.goal .im'), function(el){
    var u = 'journey/incoming/routes5/route_' + R.route + '_' + el.dataset.im + '.png', im = new Image();
    im.onload = function(){ el.style.backgroundImage = 'url(' + u + ')'; }; im.src = u;
  });
  Array.prototype.forEach.call(document.querySelectorAll('.goal'), function(b){ b.onclick = function(){ st.goal = b.dataset.g; save(); draw(); }; });
}
function pillsHtml(){
  var h = '<button class="pill' + (!st.level ? ' on' : '') + '" data-l="">Any level</button>';
  R.levels.forEach(function(l){ h += '<button class="pill' + (st.level === l ? ' on' : '') + '" data-l="' + esc(l) + '">' + esc(l) + '</button>'; });
  var el = document.getElementById('pills'); el.innerHTML = h;
  Array.prototype.forEach.call(el.querySelectorAll('.pill'), function(b){ b.onclick = function(){ st.level = b.dataset.l; save(); draw(); }; });
}
function prog(c){
  if (!c.ids.length) return null;
  var n = c.ids.filter(function(i){ return done[i]; }).length;
  return {n: n, t: c.ids.length};
}
function cardHtml(c, i){
  var p = prog(c);
  return '<a class="pc" href="' + esc(c.href) + '"><div class="band"></div><div class="in">' + (c.tag ? '<span class="tg">' + esc(c.tag) + '</span>' : '') +
    '<h4>' + esc(c.name) + '</h4><p>' + esc(c.desc) + '</p>' +
    (p ? '<div class="bar"><i style="width:' + Math.round(p.n / p.t * 100) + '%"></i></div>' : '') +
    '<div class="ft"><span>' + esc(c.meta) + (p && p.n ? ' · ' + p.n + ' of ' + p.t + ' done' : '') + '</span><span class="arrow">Open →</span></div></div></a>';
}
function mineHtml(){
  var n = Object.keys(done).length;
  document.getElementById('mine').innerHTML = '<div class="mine"><span>' + (n ? '<b>' + n + '</b> lesson' + (n === 1 ? '' : 's') + ' in your room so far' : 'Every lesson you open adds words to My Words and an object to My Room') + '</span><div class="l"><a href="wordbank/index.html">My Words</a><a href="journey/index.html">My Room</a></div></div>';
}
function draw(){
  goalsHtml(); pillsHtml(); mineHtml();
  var list = R.cards.filter(function(c){ return (!st.goal || c.goal === st.goal) && (!st.level || c.level === st.level); });
  // where to start: first path at the chosen level (or the lowest available) that is not finished
  var pick = null;
  list.forEach(function(c){ var p = prog(c); if (!pick && (!p || p.n < p.t)) pick = c; });
  var nx = document.getElementById('next');
  if (pick) {
    var p = prog(pick), started = p && p.n > 0;
    nx.innerHTML = '<div class="nextbox"><div><small>' + (started ? 'Pick up where you left off' : 'A good place to start') + '</small><h3>' + esc(pick.name) + '</h3><p>' + esc(pick.desc) + '</p></div><a class="go" href="' + esc(pick.href) + '">' + (started ? 'Continue' : 'Start here') + ' →</a></div>';
  } else nx.innerHTML = '';
  var res = document.getElementById('res');
  if (!list.length) { res.innerHTML = '<div class="none">Nothing here yet for that combination. Try another level or choose “Show me everything”.</div>'; return; }
  var h = '', last = '';
  list.forEach(function(c){
    if (c.level !== last) { if (last) h += '</div>'; last = c.level; h += '<div class="lvl">' + esc(c.level) + '<small>' + esc(c.chapter) + '</small></div><div class="grid">'; }
    h += cardHtml(c);
  });
  res.innerHTML = h + '</div>';
}
draw();
})();
</script>
</body>
</html>
