<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The World of English</title>
<style>
body{margin:0;background:#f3ebdd;font-family:Georgia,'Times New Roman',serif;color:#2b2a26;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-weight:400;font-size:clamp(22px,4vw,38px);margin:22px 0 4px;text-align:center}
p.s{margin:0 0 16px;font-style:italic;opacity:.7;text-align:center}
.frame{padding:clamp(7px,1.2vw,13px);background:linear-gradient(135deg,#d9b864,#a67c2e 50%,#e6cb80);border-radius:26px;box-shadow:0 12px 44px rgba(60,40,10,.28);margin-bottom:28px}
.frame>.in{padding:clamp(4px,.7vw,8px);background:#f3ebdd;border-radius:20px;box-shadow:inset 0 0 0 2px #a67c2e}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1.2vw,14px);width:min(90vw,80vh,860px);padding:clamp(8px,1.4vw,16px);background:#2d4a3e;border-radius:15px;box-shadow:inset 0 0 0 3px #c9a24a}
a{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background-size:cover;background-position:center;text-decoration:none;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .25s}
a:hover{transform:scale(1.025)}
a:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,14,0) 45%,rgba(10,16,14,.78))}
a b{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;font-weight:400;font-size:clamp(14px,2.6vw,26px);line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.6)}
a small{display:block;font-style:italic;font-size:clamp(10px,1.5vw,15px);opacity:.92;margin-top:3px}
a.c{box-shadow:0 0 0 4px #c9a24a,0 6px 20px rgba(0,0,0,.35)}a.c b{text-align:center;bottom:50%;transform:translateY(50%);font-size:clamp(17px,3.4vw,34px)}
a.c:after{background:rgba(14,40,36,.52)}

.stage{perspective:1400px;position:relative}
.frame{transform-style:preserve-3d;transition:transform .15s ease-out}
.g.out{animation:out .55s ease-in forwards}.g.in{animation:inn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes out{to{transform:scale(2.6) rotateX(14deg);opacity:0}}
@keyframes inn{from{transform:rotateX(-70deg) scale(.55);opacity:0}to{transform:none;opacity:1}}
.crumb{margin:0 0 12px;font-size:15px;min-height:22px}.crumb button{background:none;border:0;font:inherit;color:#7a5a1c;text-decoration:underline;cursor:pointer;padding:0}
a.x{box-shadow:0 0 0 3px #c9a24a,0 4px 14px rgba(0,0,0,.3)}
a.s{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.blk{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px #c9a24a}
.blk a{border-radius:0;box-shadow:none}.blk a b{font-size:clamp(6px,.9vw,10px);line-height:1.05;left:4px;right:4px;bottom:3px}.blk a b small{display:none}.blk a.c b{font-size:clamp(8px,1.5vw,15px)}
.g.m a b{font-size:clamp(11px,2vw,20px)}
.mapbtn{margin:0 0 14px;background:#2d4a3e;color:#f3ebdd;border:0;border-radius:20px;padding:8px 18px;font:inherit;cursor:pointer}.mapbtn:hover{background:#3d6252}
</style>
<h1 id="t">The World of English</h1><p class="s" id="sub">Choose a corner of the world</p><div class="crumb" id="cr"></div><button class="mapbtn" id="mb">See the bigger picture</button>
<div class="stage"><div class="frame" id="fr"><div class="in"><div class="g" id="g"></div></div></div></div>
<script>
var R='journey/routes/route_professional_',
L={top:{t:'The World of English',s:'Choose a corner of the world',c:['English, taught through stories','journey/world/region_hub.jpg'],k:[
['Professional English','English for work','journey/world/region_professional.jpg','professional'],
['Academic English & exams','IELTS, Cambridge, scholarship','journey/world/region_academic.jpg'],
['General English','from first words to mastery','journey/world/region_general.jpg'],
['The Library','every lesson, 79 collections','journey/world/region_library.jpg'],null,
['Explore by interest','follow your curiosity','journey/world/region_explore.jpg'],
['The Palace of Subjects','every subject, shelf by shelf','journey/world/region_palace.jpg'],
['Comics & guides','stories in pictures','journey/world/region_comics.jpg'],
['My Words & My Room','your progress','journey/world/region_words.jpg']]},
professional:{par:'top',t:'Professional English',s:'English for work. What do you want to get better at?',c:['Professional English',R+'hero.jpg'],k:[
['Meetings & conversation','speak up, keep it moving',R+'meetings.jpg','journey_professional.html?goal=meetings'],
['Presenting & storytelling','hold a room',R+'presenting.jpg','journey_professional.html?goal=presenting'],
['Negotiating & deals','trade fairs, bargaining, closing',R+'negotiating.jpg','journey_professional.html?goal=negotiating'],
['Writing & grammar','emails, reports, grammar that works',R+'writing.jpg','journey_professional.html?goal=writing'],null,
['Career & skills','the Business Bootcamp',R+'career.jpg','journey_professional.html?goal=career'],
['Leading & influencing','framing, steering, a room',R+'leading.jpg','journey_professional.html?goal=leading'],
['Interviews','first answers to senior level',R+'interviews.jpg','journey_professional.html?goal=interviews'],
['See the whole pathway','every lesson in order',R+'hero.jpg','journey_professional.html']]}},
stack=[],g=document.getElementById('g'),fr=document.getElementById('fr');
function draw(id,anim){var d=L[id];document.getElementById('t').textContent=d.t;document.getElementById('sub').textContent=d.s;
 g.innerHTML=d.k.map(function(k,i){if(!k)return '<a class="c" style="background-image:url('+d.c[1]+')"><b>'+d.c[0]+'</b></a>';
  return '<a href="'+(k[3]||'#')+'" data-d="'+(L[k[3]]?k[3]:'')+'" style="background-image:url('+k[2]+')"><b>'+k[0]+'<small>'+k[1]+'</small></b></a>';}).join('');
 var c=document.getElementById('cr');c.innerHTML=stack.length?'<button id="bk">← back</button>':'';
 if(stack.length)document.getElementById('bk').onclick=function(){go(stack.pop(),1,1)};
 if(anim){g.classList.remove('in');void g.offsetWidth;g.classList.add('in');}}
function go(id,anim,back){big=false;g.classList.remove('m');document.getElementById('mb').textContent='See the bigger picture';g.classList.add('out');setTimeout(function(){g.classList.remove('out');cur=id;draw(id,1);},back?350:520);}
var cur='top',big=false;
function tile(k,c){if(c)return '<a class="c" style="background-image:url('+c[1]+')"><b>'+c[0]+'</b></a>';return '<a href="'+(k[3]||'#')+'" data-d="'+(L[k[3]]?k[3]:'')+'" style="background-image:url('+k[2]+')"><b>'+k[0]+'<small>'+k[1]+'</small></b></a>';}
function drawMap(){var P=L[cur].par||cur,d=L[P],h='';
 d.k.forEach(function(k){if(!k){h+=tile(null,d.c);return;}var kid=k[3]&&L[k[3]],open=kid&&(k[3]===cur||cur==='top');
  if(!open){h+=tile(k);return;}
  h+='<div class="blk">'+kid.k.map(function(q){return q?tile(q):tile(null,kid.c);}).join('')+'</div>';});
 document.getElementById('t').textContent=big?'The bigger picture':d.t;document.getElementById('sub').textContent='Every box, one level out';
 g.innerHTML=h;g.classList.add('m');g.classList.remove('in');void g.offsetWidth;g.classList.add('in');}
document.getElementById('mb').onclick=function(){big=!big;this.textContent=big?'Back to one picture':'See the bigger picture';if(big)drawMap();else{g.classList.remove('m');draw(cur,1);}};
g.onclick=function(e){var a=e.target.closest('a');if(!a)return;var d=a.getAttribute('data-d');
 if(a.classList.contains('c')){if(big){return;}if(stack.length)go(stack.pop(),1,1);return;}
 var inblk=a.closest('.blk');if(big&&d&&!inblk){e.preventDefault();var st0=cur;stack=cur==='top'?[]:['top'];stack.length||0;stack=[];if(d!=='top')stack.push('top');go(d,1);return;}
 if(d){e.preventDefault();g.querySelectorAll('a').forEach(function(x){x.style.transformOrigin='';});a.style.zIndex=5;stack.push(cur);go(d,1);}
 else if(a.getAttribute('href')==='#'){e.preventDefault();a.classList.add('s');setTimeout(function(){a.classList.remove('s')},400);}};
draw('top');
</script>
