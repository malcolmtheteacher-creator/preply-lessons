  if(lens==="grammar") return G.map(r=>({f:r.f,t:r.t,lv:r.lv,facet:r.cat,sub:r.focus,src:r.src}));
  if(lens==="skill")   return L.map(r=>({f:r.f,t:r.t,lv:r.lv,facet:(SKLABEL[r.sk]||"Other"),sub:"",src:""}));
  const out=[]; L.forEach(r=>(r.tp||[]).forEach(tp=>out.push({f:r.f,t:r.t,lv:r.lv,facet:cap(tp),sub:"",src:(SKLABEL[r.sk]||"")}))); return out;
}
function lvOk(r){return level==="All"||r.lv===level;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildLens(){const n=document.getElementById("lensNav");n.innerHTML="";LENSES.forEach(([k,lab])=>{const b=document.createElement("span");b.className="lens-btn"+(k===lens?" active":"");b.textContent=lab;b.onclick=()=>{lens=k;facet="All";build();};n.appendChild(b);});}
function buildLevels(){const lv=document.getElementById("levels");lv.innerHTML="";["All",...LEVELS].forEach(l=>{const c=document.createElement("span");c.className="chip"+(l===level?" active":"");c.textContent=l;c.onclick=()=>{level=l;build();};lv.appendChild(c);});}
function buildFacets(){
  const all=rows().filter(lvOk);
  const cc={};all.forEach(r=>cc[r.facet]=(cc[r.facet]||0)+1);
  const keys=Object.keys(cc).sort((a,b)=>cc[b]-cc[a]);
  const fl=document.getElementById("facetLabel");fl.textContent= lens==="grammar"?"Grammar area":lens==="skill"?"Skill / exam":"Topic";
  const fn=document.getElementById("facets");fn.innerHTML="";
  const a=document.createElement("span");a.className="chip"+(facet==="All"?" active":"");a.innerHTML='All<span class="ct">'+all.length+'</span>';a.onclick=()=>{facet="All";render();};fn.appendChild(a);
  keys.forEach(k=>{const c=document.createElement("span");c.className="chip"+(k===facet?" active":"");c.innerHTML=esc(k)+'<span class="ct">'+cc[k]+'</span>';c.onclick=()=>{facet=k;render();};fn.appendChild(c);});
}
function build(){buildLens();buildLevels();buildFacets();render();}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  let rs=rows().filter(r=>lvOk(r) && (facet==="All"||r.facet===facet) && (!q || r.t.toLowerCase().includes(q)||r.facet.toLowerCase().includes(q)||(r.sub||"").toLowerCase().includes(q)));
  const total=rs.length;
  // de-dup within a single facet group by filename
  const cnt=document.getElementById("count");
  cnt.innerHTML="Showing <strong>"+Math.min(total,CAP)+"</strong>"+(total>CAP?" of "+total:"")+" lesson"+(total===1?"":"s")+(facet!=="All"?" in "+esc(facet):"")+(level!=="All"?" at "+level:"");
  const res=document.getElementById("results");
  if(!total){res.innerHTML='<div class="empty">No lessons match. Try a broader term or clear the filters.</div>';return;}
  const groups={};rs.forEach(r=>{(groups[r.facet]=groups[r.facet]||[]).push(r);});
  const order=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  let shown=0,h="";
  for(const g of order){
    if(shown>=CAP)break;
    h+='<div class="cat-group"><div class="cat-head">'+esc(g)+'<span class="num">'+groups[g].length+'</span></div><div class="grid">';
    for(const d of groups[g]){ if(shown>=CAP)break; const lvc=d.lv||"NA",lvt=d.lv||"—";
      h+='<a class="lesson" href="'+d.f+'"><span class="lv '+lvc+'">'+lvt+'</span><span><span class="t">'+esc(d.t)+'</span>'+(d.sub?'<span class="sub">'+esc(d.sub)+'</span>':'')+(d.src?'<span class="src">'+esc(d.src)+'</span>':'')+'</span></a>';
      shown++; }
    h+='</div></div>';
  }
  if(total>CAP)h+='<div class="note">Showing the first '+CAP+' of '+total+' &mdash; pick a '+(lens==="topic"?"topic":lens==="skill"?"skill":"grammar area")+' or search to narrow down.</div>';
  res.innerHTML=h;
}
build();
</script></body></html>
