<style>
:root{--bg1:#0b1226;--bg2:#16224a;--ink:#e8edff;--mute:#9aa7d1;--card:rgba(17,25,54,.92);--gold:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1200px 800px at 50% 40%,var(--bg2),var(--bg1));color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:fixed;top:0;left:0;right:0;z-index:5;padding:10px 14px 8px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:linear-gradient(180deg,rgba(11,18,38,.95),rgba(11,18,38,.6) 80%,transparent);pointer-events:none}
header>*{pointer-events:auto}
h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px;white-space:nowrap}
h1 small{display:block;font-size:11.5px;font-weight:500;color:var(--mute);letter-spacing:0}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.search{position:relative}
.search input{width:190px;padding:9px 12px 9px 32px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:var(--ink);font-size:14px;outline:none;transition:border-color .2s,background .2s}
.search input:focus{border-color:#7aa2ff;background:rgba(255,255,255,.13)}
.search:before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.8}
#hits{font-size:12px;color:var(--mute);min-width:0}
button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);padding:8px 12px;border-radius:999px;cursor:pointer;transition:background .15s,transform .1s,border-color .15s;white-space:nowrap}
button:hover{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.3)}
button:active{transform:scale(.96)}
#random{background:linear-gradient(135deg,#f59e0b,#ef4444);border:none;color:#fff;box-shadow:0 4px 16px rgba(239,68,68,.35);font-size:14px;padding:9px 15px}
#random:hover{filter:brightness(1.1)}
svg{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg.grabbing{cursor:grabbing}
.link{fill:none;stroke-width:1.6;stroke-opacity:.45}
.node{cursor:pointer}
.node text{paint-order:stroke;stroke:var(--bg1);stroke-width:4px;stroke-linejoin:round;fill:var(--ink)}
.node .dot{transition:r .2s}
.node.leaf text{font-size:12.5px}
.node.leaf:hover text,.node.leaf.hl text{fill:#fff;font-weight:700}
.node.leaf:hover .dot{r:7}
.node.sub text{font-size:13.5px;font-weight:700}
.node.sub .cnt{font-size:10.5px;font-weight:700;stroke-width:0;fill:#0b1226}
.node.branch .bub{filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));transition:transform .2s}
.node.branch:hover .bub{transform:scale(1.08)}
.node.branch text.lab{font-size:14px;font-weight:800}
.node.branch text.emo{font-size:20px;stroke-width:0}
.node.root text{font-weight:850;stroke-width:0;fill:#fff}
.node.star text{fill:#ffe9a8}
.node.star .dot{filter:drop-shadow(0 0 6px #fbbf24)}
.node.top .bub{filter:drop-shadow(0 0 14px rgba(251,191,36,.85))}
.dim{opacity:.18}
.node.match text{fill:#fff;font-weight:800}
.node.match .dot,.node.match .bub{stroke:#fff;stroke-width:3}
.pulse .ring{animation:pulse 1.1s ease-out 3}
@keyframes pulse{0%{r:6;opacity:1;stroke-width:4}100%{r:42;opacity:0;stroke-width:1}}
.ring{fill:none;stroke:#fff;opacity:0}
#card{position:fixed;z-index:8;max-width:300px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(8px);font-size:13px;line-height:1.4;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
#card.show{opacity:1;transform:none}
#card.sheet{left:12px!important;right:12px;bottom:14px;top:auto!important;max-width:none;pointer-events:auto}
#card b{font-size:14.5px;display:block;margin-bottom:2px}
#card .town{color:var(--gold);font-weight:600;font-size:12px}
#card .src{color:var(--mute);font-size:11.5px;margin-top:6px}
#card a.go{display:none;margin-top:8px;padding:8px 12px;border-radius:999px;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;text-align:center}
#card.sheet a.go{display:block}
#card .x{display:none;position:absolute;right:8px;top:6px;background:none;border:none;font-size:18px;padding:4px 8px}
#card.sheet .x{display:block}
#toast{position:fixed;z-index:9;left:50%;bottom:18px;transform:translate(-50%,30px);opacity:0;transition:all .3s;background:linear-gradient(135deg,rgba(245,158,11,.97),rgba(239,68,68,.97));color:#fff;padding:11px 16px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:14px;width:max-content;max-width:calc(100vw - 24px);display:flex;gap:10px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast a{color:#fff;font-weight:800;background:rgba(0,0,0,.2);padding:6px 10px;border-radius:999px;text-decoration:none;white-space:nowrap}
#toast span{overflow:hidden;text-overflow:ellipsis}
.sm{display:none}
.zoom{position:fixed;right:12px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;padding:0;font-size:20px;border-radius:12px}
footer{position:fixed;left:12px;bottom:12px;z-index:4;font-size:11px;color:var(--mute);max-width:60%}
@media (max-width:700px){
 header{padding:8px 10px}
 h1{font-size:16px}
 .bar{margin-left:0;width:100%}
 .search{flex:1 1 100%}
 .search input{width:100%}
 button{padding:8px 10px;font-size:12.5px}
 #random{flex:1 0 auto}
 footer{display:none}
 .lg{display:none}.sm{display:inline}
 #toast{bottom:70px}
}
</style>

function render(dur=520){const vis=layout();const visSet=new Set(vis.map(n=>n.id));
 vis.forEach(n=>{if(!els.has(n.id)){makeNode(n);n.fadeIn=true;const p=n.p;n.x=p?p.x:0;n.y=p?p.y:0;n.a=p?p.a||n.ta:n.ta;n.r=p?p.r:0;}
  const sub=els.get(n.id).g;sub.classList.toggle('open',isOpen(n));});
 const leaving=[];els.forEach((o,id)=>{if(!visSet.has(id)){const n=all[id];leaving.push(n);let p=n.p;while(p&&!visSet.has(p.id))p=p.p;n.goal=p}});
 const from=new Map();vis.concat(leaving).forEach(n=>from.set(n.id,{x:n.x,y:n.y,a:n.a,r:n.r}));
 const t0=performance.now();if(anim)cancelAnimationFrame(anim);
 const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
 function frame(now){const k=dur?Math.min(1,(now-t0)/dur):1,e=ease(k);
  vis.forEach(n=>{const f=from.get(n.id);n.x=f.x+(n.tx-f.x)*e;n.y=f.y+(n.ty-f.y)*e;n.r=f.r+(n.tr-f.r)*e;let da=n.ta-f.a;n.a=f.a+da*e;});
  leaving.forEach(n=>{const f=from.get(n.id),G=n.goal;n.x=f.x+(G.tx-f.x)*e;n.y=f.y+(G.ty-f.y)*e;n.r=f.r+(G.tr-f.r)*e;n.a=f.a;const o=els.get(n.id);o.g.style.opacity=1-e;if(o.link)o.link.style.opacity=1-e});
  vis.concat(leaving).forEach(n=>{const o=els.get(n.id);o.g.setAttribute('transform',`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);orientLabel(n,n.a);
   if(o.link){const p=n.p;o.link.setAttribute('d',linkPath(p,n))}
   if(!leaving.includes(n)){const op=n.fadeIn&&k<1?e:'';o.g.style.opacity=op;if(o.link)o.link.style.opacity=op}});
  if(k<1)anim=requestAnimationFrame(frame);else{anim=null;leaving.forEach(n=>{const o=els.get(n.id);o.g.remove();if(o.link)o.link.remove();els.delete(n.id)});vis.forEach(n=>{n.fadeIn=false;const o=els.get(n.id);o.g.style.opacity='';if(o.link)o.link.style.opacity=''})}}
 anim=requestAnimationFrame(frame);applySearchClasses();}
// ---- view (pan/zoom) ----
let view={x:0,y:0,k:1};let vAnim=null;
function applyView(){vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`)}
function tweenView(to,dur=600){if(vAnim)cancelAnimationFrame(vAnim);const fr={...view},t0=performance.now();
 const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);view={x:fr.x+(to.x-fr.x)*e,y:fr.y+(to.y-fr.y)*e,k:fr.k+(to.k-fr.k)*e};applyView();if(k<1)vAnim=requestAnimationFrame(step);else vAnim=null};vAnim=requestAnimationFrame(step)}
function headerH(){return document.querySelector('header').getBoundingClientRect().height}
function fit(dur=600){const vis=visible();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 vis.forEach(n=>{let ex=n.tx,ey=n.ty;const pts=[[ex,ey]];if(n.kind==='leaf'||n.kind==='sub'){const L=(n.n.length+4)*7.2;pts.push([ex+L*Math.cos(n.ta),ey+L*Math.sin(n.ta)])}
  else{const s=n.kind==='root'?80:70;pts.push([ex-s,ey-40],[ex+s,ey+s])}
  pts.forEach(([a,b])=>{x0=Math.min(x0,a);y0=Math.min(y0,b);x1=Math.max(x1,a);y1=Math.max(y1,b)})});
 const W=innerWidth,H=innerHeight,top=headerH()+6,pad=16;const k=Math.min(1.3,(W-2*pad)/(x1-x0),(H-top-pad-10)/(y1-y0));
 const to={k,x:W/2-k*(x0+x1)/2,y:top+(H-top)/2-k*(y0+y1)/2};if(dur)tweenView(to,dur);else{view=to;applyView()}}
function zoomAt(f,cx,cy){const k=Math.max(.15,Math.min(5,view.k*f));const r=k/view.k;view.x=cx-(cx-view.x)*r;view.y=cy-(cy-view.y)*r;view.k=k;applyView()}
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0018),e.clientX,e.clientY)},{passive:false});
const ptrs=new Map();let drag=null,moved=false,pinch=null,lastPtrType='mouse';
svg.addEventListener('pointerdown',e=>{lastPtrType=e.pointerType;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=false}
 else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k};moved=true}});
addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinch.k*d/pinch.d/view.k,(a.x+b.x)/2,(a.y+b.y)/2);return}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!moved&&Math.hypot(dx,dy)>6){moved=true;svg.classList.add('grabbing');if(vAnim){cancelAnimationFrame(vAnim);vAnim=null}}
  if(moved){view.x=drag.vx+dx;view.y=drag.vy+dy;applyView()}}});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0){drag=null;svg.classList.remove('grabbing');setTimeout(()=>moved=false,0)}else if(ptrs.size===1){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,vx:view.x,vy:view.y}}};
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
// ---- interactions ----
let sheetFor=null;
function onNodeClick(ev,n){if(moved){ev.preventDefault();return}
 if(n.kind==='leaf'){if(lastPtrType!=='mouse'&&sheetFor!==n){ev.preventDefault();showCard(n,ev,true)}return}
 if(n.kind==='root'){return}
 if(isOpen(n)){expanded.delete(n.id);(function c(m){(m.c||[]).forEach(x=>{expanded.delete(x.id);c(x)})})(n)}else expanded.add(n.id);
 render();}
const card=document.getElementById('card'),cardBody=document.getElementById('cardBody'),cardGo=card.querySelector('a.go');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showCard(n,ev,sheet){cardBody.innerHTML=`<b>${n.s?'⭐ ':''}${esc(n.n)}</b><div class="town">📍 ${esc(n.t)}</div><div>${esc(n.d)}</div><div class="src">${n.g==='maps'?'Opens a Google Maps search':'Opens '+esc(new URL(n.u).hostname.replace(/^www\./,''))}${n.p&&n.p.kind!=='branch'?' · '+esc(n.p.n):''}</div>`;
 cardGo.href=n.u;card.classList.toggle('sheet',sheet);sheetFor=sheet?n:null;
 if(!sheet){const W=innerWidth;let x=ev.clientX+16,y=ev.clientY+16;if(x+310>W)x=ev.clientX-316;if(y+140>innerHeight)y=ev.clientY-150;card.style.left=x+'px';card.style.top=y+'px'}
 card.classList.add('show');if(sheet)toast.classList.remove('show')}
function hideCard(){card.classList.remove('show');sheetFor=null}
card.querySelector('.x').addEventListener('click',hideCard);
svg.addEventListener('click',e=>{if(!e.target.closest('.node')&&!moved)hideCard()});
document.getElementById('expand').onclick=()=>{all.forEach(n=>{if(n.c)expanded.add(n.id)});render();setTimeout(()=>fit(),540)};
document.getElementById('collapse').onclick=()=>{expanded.clear();expanded.add(ROOT.id);render();setTimeout(()=>fit(),540)};
document.getElementById('reset').onclick=()=>{q.value='';doSearch();defaults();hideCard();render();setTimeout(()=>fit(),540)};
document.getElementById('zin').onclick=()=>zoomAt(1.3,innerWidth/2,innerHeight/2);
document.getElementById('zout').onclick=()=>zoomAt(1/1.3,innerWidth/2,innerHeight/2);
// ---- search ----
const q=document.getElementById('q'),hits=document.getElementById('hits');let matches=[],mi=-1,st;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
all.forEach(n=>n.hay=norm([n.n,n.t||'',n.d||''].join(' ')));
function applySearchClasses(){const on=matches.length>0,ids=new Set(matches.map(m=>m.id)),keep=new Set();
 matches.forEach(m=>{let p=m;while(p){keep.add(p.id);p=p.p}});
 els.forEach((o,id)=>{o.g.classList.toggle('match',ids.has(id));o.g.classList.toggle('dim',on&&!keep.has(id));if(o.link)o.link.classList.toggle('dim',on&&!keep.has(id))})}
function doSearch(){const s=norm(q.value.trim());matches=[];mi=-1;
 if(s.length>=2){const terms=s.split(/\s+/);matches=all.filter(n=>n.depth>0&&terms.every(t=>n.hay.includes(t)));
  matches.forEach(m=>{let p=m.p;while(p){expanded.add(p.id);p=p.p}});hits.textContent=matches.length?`${matches.length} found · Enter = next`:'No matches';render();if(matches.length)setTimeout(()=>fit(),540)}
 else{hits.textContent='';applySearchClasses()}}
q.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(doSearch,250)});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&matches.length){mi=(mi+1)%matches.length;focusNode(matches[mi],1.4);q.blur()}if(e.key==='Escape'){q.value='';doSearch()}});
function focusNode(n,k){const top=headerH();const W=innerWidth,H=innerHeight;let cx=n.tx,cy=n.ty;
 if(n.kind==='leaf'){const L=Math.min(200,(n.n.length)*3.6);cx+=L*Math.cos(n.ta);cy+=L*Math.sin(n.ta)}
 k=k||Math.max(view.k,1.2);tweenView({k,x:W/2-k*cx,y:top+(H-top)/2-k*cy},700)}
// ---- random pick ----
const toast=document.getElementById('toast');let lastPick=null,toastT;
function randomPick(){let n;do{n=leaves[Math.floor(Math.random()*leaves.length)]}while(leaves.length>1&&n===lastPick);lastPick=n;
 let p=n.p;while(p){expanded.add(p.id);p=p.p}render();hideCard();
 setTimeout(()=>{const k=innerWidth<700?1.05:1.35;focusNode(n,k);setTimeout(()=>{const o=els.get(n.id);if(!o)return;o.g.classList.remove('pulse','hl');void o.g.getBBox();o.g.classList.add('pulse','hl');setTimeout(()=>o.g.classList.remove('pulse','hl'),3400)},650)},540);
 toast.innerHTML=`<span>🎲 <b>${esc(n.n)}</b> — ${esc(n.t)}</span><a href="${esc(n.u)}" target="_blank" rel="noopener">Open ↗</a>`;
 toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('show'),7000);window.__lastPick=n.id;return n}
document.getElementById('random').onclick=randomPick;
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>fit(0),150)});
render(0);fit(0);
window.__mm={all,leaves,els,view:()=>view,expanded};
</script>
